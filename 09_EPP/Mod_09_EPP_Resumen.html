<!-- =========================================================================
     VISTA: RESUMEN — MÓDULO 09_EPP
     ========================================================================= -->
<div id="module-09_epp-resumen" class="module-view">

  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
    <div class="flex items-center gap-3">
      <button onclick="showView('Menu')" aria-label="Volver al menú principal"
        class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors text-secondary border border-outline-variant shrink-0">
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">arrow_back</span>
      </button>
      <div>
        <h2 class="font-h2 text-h2 text-on-surface leading-tight">Entrega de EPP</h2>
        <p class="text-[11px] text-on-surface-variant">Cargos firmados y control de vida útil</p>
      </div>
    </div>
    <div class="flex items-center gap-2 w-full sm:w-auto">
      <span id="ui-result-count" class="text-[10px] font-bold text-on-surface-variant mr-auto sm:mr-1 hidden"></span>
      <div class="relative" id="epp-export-wrap">
        <button onclick="document.getElementById('epp-export-menu').classList.toggle('hidden')"
          class="flex items-center gap-1.5 px-3 h-9 border border-outline-variant text-[12px] font-bold text-primary rounded-lg hover:bg-surface-container transition-colors shadow-sm whitespace-nowrap">
          <span class="material-symbols-outlined text-[16px]" aria-hidden="true">download</span>Exportar
          <span class="material-symbols-outlined text-[13px] opacity-60" aria-hidden="true">expand_more</span>
        </button>
        <div id="epp-export-menu" class="hidden absolute right-0 top-full mt-1.5 w-44 bg-white rounded-xl border border-outline-variant shadow-xl z-50 overflow-hidden">
          <button onclick="PWA_SKILLS.exportFilteredToExcel(); document.getElementById('epp-export-menu').classList.add('hidden')"
            class="w-full flex items-center gap-2.5 px-4 py-3 text-[12px] font-semibold text-on-surface hover:bg-surface-container-low transition-colors">
            <span class="material-symbols-outlined text-[17px] text-green-600" aria-hidden="true">grid_on</span>Excel (.xlsx)
          </button>
          <button onclick="PWA_SKILLS.exportVisibleToCSV('EPP'); document.getElementById('epp-export-menu').classList.add('hidden')"
            class="w-full flex items-center gap-2.5 px-4 py-3 text-[12px] font-semibold text-on-surface hover:bg-surface-container-low transition-colors border-t border-outline-variant/30">
            <span class="material-symbols-outlined text-[17px] text-blue-600" aria-hidden="true">text_snippet</span>CSV (.csv)
          </button>
        </div>
      </div>
      <button onclick="changeInternalView('09_EPP', 'Edicion')"
        class="flex items-center gap-1.5 px-3 h-9 bg-primary text-on-primary rounded-lg text-[12px] font-bold hover:opacity-90 transition-all shadow-sm whitespace-nowrap">
        <span class="material-symbols-outlined text-[16px]" aria-hidden="true">add</span>Entregar
      </button>
    </div>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
    <button type="button" onclick="eppFiltrarReposicion('vencida')"
      class="bg-red-50 border border-red-200 rounded-2xl p-3 shadow-sm text-left hover:shadow-md transition-all">
      <p class="text-[9px] font-black text-red-700 uppercase tracking-widest mb-1">Reposición vencida</p>
      <p class="text-2xl font-black text-red-700" id="epp-kpi-vencidas">—</p>
    </button>
    <button type="button" onclick="eppFiltrarReposicion('por-vencer')"
      class="bg-amber-50 border border-amber-200 rounded-2xl p-3 shadow-sm text-left hover:shadow-md transition-all">
      <p class="text-[9px] font-black text-amber-700 uppercase tracking-widest mb-1">Repone en 30 días</p>
      <p class="text-2xl font-black text-amber-700" id="epp-kpi-porvencer">—</p>
    </button>
    <button type="button" onclick="eppFiltrarEstado('Pendiente de firma')"
      class="bg-orange-50 border border-orange-200 rounded-2xl p-3 shadow-sm text-left hover:shadow-md transition-all">
      <p class="text-[9px] font-black text-orange-700 uppercase tracking-widest mb-1">Sin firmar</p>
      <p class="text-2xl font-black text-orange-700" id="epp-kpi-sinfirma">—</p>
    </button>
    <div class="bg-surface-container-lowest rounded-2xl border border-outline-variant p-3 shadow-sm">
      <p class="text-[9px] font-black text-on-surface-variant uppercase tracking-widest mb-1">Ítems entregados</p>
      <p class="text-2xl font-black text-on-surface" id="epp-kpi-items">—</p>
    </div>
  </div>

  <div id="epp-alerta" class="hidden mb-4"></div>

  <div id="ui-search-bar-slot"></div>

  <div class="bg-white rounded-2xl border border-outline-variant shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse" id="epp-table">
        <thead>
          <tr class="bg-surface-container-low text-on-surface-variant text-[11px] font-black uppercase tracking-wider">
            <th class="px-3 py-2.5">Trabajador / Área</th>
            <th class="px-3 py-2.5">Motivo</th>
            <th class="px-3 py-2.5">Entrega</th>
            <th class="px-3 py-2.5">Ítems</th>
            <th class="px-3 py-2.5">Reposición</th>
            <th class="px-3 py-2.5">Cargo</th>
            <th class="px-3 py-2.5 text-center" data-nosort>Gestión</th>
          </tr>
        </thead>
        <tbody id="epp-table-body" class="divide-y divide-outline-variant/40"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
/** Estado de la próxima reposición del cargo */
function eppReposicion(r) {
  if (!r.Proxima_Reposicion) return { clave:'sin-fecha', texto:'Sin control', dias:null };
  const f = new Date(r.Proxima_Reposicion + 'T00:00:00');
  if (isNaN(f)) return { clave:'sin-fecha', texto:'Sin control', dias:null };
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const dias = Math.round((f - hoy) / 86400000);
  if (dias < 0)   return { clave:'vencida',    texto:'Vencida hace ' + Math.abs(dias) + ' d', dias:dias };
  if (dias <= 30) return { clave:'por-vencer', texto:'En ' + dias + ' d', dias:dias };
  return { clave:'vigente', texto:'Al día', dias:dias };
}

function eppReposicionBadge(v) {
  const m = {
    'vencida':    { cls:'bg-red-100 text-red-800 border-red-200',            ico:'event_busy' },
    'por-vencer': { cls:'bg-amber-100 text-amber-800 border-amber-200',      ico:'schedule' },
    'vigente':    { cls:'bg-emerald-100 text-emerald-800 border-emerald-200',ico:'verified' },
    'sin-fecha':  { cls:'bg-surface-variant text-secondary border-outline-variant', ico:'help' }
  };
  const c = m[v.clave];
  return '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-black border whitespace-nowrap ' + c.cls + '">' +
         '<span class="material-symbols-outlined text-[11px]" aria-hidden="true">' + c.ico + '</span>' + v.texto + '</span>';
}

/** El cargo sin firma no prueba nada: se marca de forma explícita */
function eppCargoBadge(r) {
  const firmado = !!(r.Firma_Trabajador || r.Foto_Cargo);
  if (r.Estado === 'Pendiente de firma' || !firmado) {
    return '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-black bg-orange-100 text-orange-800 whitespace-nowrap">' +
           '<span class="material-symbols-outlined text-[11px]" aria-hidden="true">draw</span>Sin firma</span>';
  }
  return '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 whitespace-nowrap">' +
         '<span class="material-symbols-outlined text-[11px]" aria-hidden="true">task_alt</span>Firmado</span>';
}

function eppRenderTabla(data) {
  const tbody = document.querySelector('#main-container #epp-table-body');
  if (!tbody) return;

  const conRep = data.map(r => ({ r: r, v: eppReposicion(r) }));
  const vencidas  = conRep.filter(x => x.v.clave === 'vencida');
  const porVencer = conRep.filter(x => x.v.clave === 'por-vencer');
  const sinFirma  = data.filter(r => r.Estado === 'Pendiente de firma' || !(r.Firma_Trabajador || r.Foto_Cargo));
  const items     = data.reduce((a, r) => a + (parseInt(r.Total_Items) || 0), 0);

  const set = (id, v) => { const e = document.querySelector('#main-container #' + id); if (e) e.textContent = v; };
  set('epp-kpi-vencidas',  vencidas.length);
  set('epp-kpi-porvencer', porVencer.length);
  set('epp-kpi-sinfirma',  sinFirma.length);
  set('epp-kpi-items',     items || '—');

  const alerta = document.querySelector('#main-container #epp-alerta');
  if (alerta) {
    if (vencidas.length) {
      alerta.className = 'mb-4';
      alerta.innerHTML =
        '<div class="flex items-start gap-2.5 p-3 rounded-xl border border-red-200 bg-red-50">' +
        '<span class="material-symbols-outlined text-[19px] text-red-700 shrink-0" aria-hidden="true">gpp_maybe</span>' +
        '<div class="min-w-0 flex-1">' +
        '<p class="text-[12px] font-bold text-red-800">' + vencidas.length + ' cargo(s) con reposición vencida</p>' +
        '<p class="text-[10px] text-red-700 mt-0.5">Hay personal usando equipo que ya cumplió su vida útil.</p></div>' +
        '<button type="button" onclick="eppFiltrarReposicion(\'vencida\')" class="text-[10px] font-black underline text-red-800 shrink-0">Ver</button></div>';
    } else {
      alerta.className = 'hidden mb-4';
      alerta.innerHTML = '';
    }
  }

  if (!data.length) {
    PWA_SKILLS.showEmptyState('epp-table-body', {
      icon: 'health_and_safety',
      title: 'Sin entregas registradas',
      message: 'Registra la primera entrega para llevar el control de cargos firmados y vida útil.',
      actionLabel: 'Registrar entrega', actionIcon: 'add',
      onAction: "changeInternalView('09_EPP','Edicion')"
    });
    const c = document.querySelector('#main-container #ui-result-count');
    if (c) { c.textContent = '0 registros'; c.classList.remove('hidden'); }
    return;
  }

  // Orden por urgencia de reposición
  const peso = { 'vencida':0, 'por-vencer':1, 'vigente':2, 'sin-fecha':3 };
  conRep.sort((a, b) => {
    const d = peso[a.v.clave] - peso[b.v.clave];
    if (d !== 0) return d;
    return (a.v.dias == null ? 9e9 : a.v.dias) - (b.v.dias == null ? 9e9 : b.v.dias);
  });

  PWA_SKILLS.finishLoading('epp-table-body');
  tbody.innerHTML = conRep.map(({ r, v }) => `
    <tr class="hover:bg-surface-container-low/50 transition-colors cursor-pointer"
        onclick="changeInternalView('09_EPP','Detalle','${r.UUID}')">
      <td class="px-3 py-2">
        <div class="font-bold text-[11px] text-on-surface">${r.Nombre_Trabajador || '—'}</div>
        <div class="text-[10px] text-secondary">${r.Area || ''}${r.Puesto ? ' · ' + r.Puesto : ''}</div>
      </td>
      <td class="px-3 py-2"><span class="text-[11px] font-semibold text-on-surface">${r.Tipo_Entrega || '—'}</span></td>
      <td class="px-3 py-2"><span class="text-[11px] text-on-surface tabular-nums">${r.Fecha_Entrega || '—'}</span></td>
      <td class="px-3 py-2">
        <span class="inline-flex items-center gap-1 text-[11px] font-bold text-on-surface">
          <span class="material-symbols-outlined text-[13px] text-secondary" aria-hidden="true">inventory_2</span>${r.Total_Items || 0}
        </span>
      </td>
      <td class="px-3 py-2">${eppReposicionBadge(v)}</td>
      <td class="px-3 py-2">${eppCargoBadge(r)}</td>
      <td class="px-3 py-2 text-center" onclick="event.stopPropagation()">
        <div class="flex items-center justify-center gap-1">
          <button onclick="changeInternalView('09_EPP','Detalle','${r.UUID}')" aria-label="Ver el cargo de ${r.Nombre_Trabajador || 'este trabajador'}"
            class="w-7 h-7 flex items-center justify-center rounded-lg text-primary hover:bg-primary/10 transition-colors">
            <span class="material-symbols-outlined text-[15px]" aria-hidden="true">visibility</span>
          </button>
          <button onclick="changeInternalView('09_EPP','Edicion','${r.UUID}')" aria-label="Editar el cargo de ${r.Nombre_Trabajador || 'este trabajador'}"
            class="w-7 h-7 flex items-center justify-center rounded-lg text-secondary hover:bg-surface-variant transition-colors">
            <span class="material-symbols-outlined text-[15px]" aria-hidden="true">edit</span>
          </button>
        </div>
      </td>
    </tr>`).join('');

  PWA_SKILLS.initSortableTable('epp-table-body');
  PWA_SKILLS.enhanceTable('epp-table-body');
  PWA_SKILLS.updateResultCount('epp-table-body', 'ui-result-count');
  const c = document.querySelector('#main-container #ui-result-count');
  if (c) c.classList.remove('hidden');
}

function eppFiltrarReposicion(clave) {
  eppRenderTabla((window._eppData || []).filter(r => eppReposicion(r).clave === clave));
  const t = { 'vencida':'con reposición vencida', 'por-vencer':'que reponen en 30 días' };
  PWA_SKILLS.toast('Mostrando cargos ' + (t[clave] || clave) + '.', 'info', 3000);
}

function eppFiltrarEstado(estado) {
  eppRenderTabla((window._eppData || []).filter(r =>
    r.Estado === estado || !(r.Firma_Trabajador || r.Foto_Cargo)));
  PWA_SKILLS.toast('Mostrando cargos sin firma de conformidad.', 'info', 3000);
}

function loadResumen_09_EPP() {
  PWA_SKILLS.renderSkeleton('epp-table-body', 6);

  if (!window._eppExportListener) {
    window._eppExportListener = true;
    document.addEventListener('click', function(e) {
      const wrap = document.getElementById('epp-export-wrap');
      if (wrap && !wrap.contains(e.target)) {
        const menu = document.getElementById('epp-export-menu');
        if (menu) menu.classList.add('hidden');
      }
    });
  }

  DataService.read('09_EPP')
    .then(res => {
      const filas = (res && res.status === 'OK' && Array.isArray(res.payload)) ? res.payload : [];
      // Alcance por rol: un trabajador no debe recibir registros ajenos.
      // El filtro del navegador es comodidad; la restricción real la
      // aplica RLS en la base de datos.
      const visibles = (typeof PERMISOS !== 'undefined')
        ? PERMISOS.filtrarDatos('09_EPP\Mod_09_EPP_Resumen.html', filas) : filas;
      window._eppData = visibles;
      localStorage.setItem('refdata_09_EPP', JSON.stringify(visibles));
      eppRenderTabla(visibles);
    })
    .catch(() => {
      let cache = [];
      try { cache = JSON.parse(localStorage.getItem('refdata_09_EPP')) || []; } catch (e) {}
      window._eppData = cache;
      if (cache.length) {
        eppRenderTabla(cache);
        PWA_SKILLS.toast('Sin conexión: mostrando los últimos datos sincronizados.', 'warning', 4000);
      } else {
        PWA_SKILLS.showEmptyState('epp-table-body', {
          icon: 'cloud_off',
          title: 'Sin conexión',
          message: 'No se pudieron cargar las entregas y no hay copia local disponible.',
          actionLabel: 'Reintentar', actionIcon: 'refresh',
          onAction: "loadResumen_09_EPP()"
        });
      }
    });
}
</script>
