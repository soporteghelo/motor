<script>
/**
 * =========================================================================
 * SUBCONFIG — 09_EPP
 * =========================================================================
 * Entrega y control de Equipos de Protección Personal.
 *
 * POR QUÉ ESTE MÓDULO
 * Entregar EPP es fácil; demostrar que se entregó y que sigue siendo apto es
 * lo difícil. Este módulo responde dos preguntas que en papel se pierden:
 *   1. ¿Quién firmó el cargo?  (sin firma no hay evidencia de entrega)
 *   2. ¿Qué equipo ya cumplió su vida útil y sigue en uso?
 *
 * Un arnés vencido en servicio es un accidente esperando ocurrir, y nadie lo
 * detecta revisando cuadernos. Aquí la fecha de reposición se calcula sola a
 * partir de la vida útil de cada ítem.
 * =========================================================================
 */

    "Nombre_Trabajador": { type: "Text", required: true,  isFilter: true,  label: "Nombre del trabajador" },
    "Area":              { type: "Enum", required: true,  isFilter: true,  label: "Área",

    "Firma_Trabajador_Path": { type: "Hidden", required: false },

    "Foto_Cargo_Path":   { type: "Hidden", required: false },

    "Registrado_Por":    { type: "Text",   required: false, isFilter: false, label: "Registrado por" },
    "Fecha_Registro":    { type: "Hidden", required: false }

   * Vida útil sugerida por tipo de equipo, en meses.
   * Al elegir el equipo, la fila propone su vida útil habitual; el usuario

    "Respirador / mascarilla":  "3",
    "Guantes":                  "3",
    "Botines de seguridad":     "12",
    "Arnés de cuerpo completo": "24",
