<script>
/**
 * =========================================================================
 * SUBCONFIG — 09_EPP
 * =========================================================================
 * Entrega y control de Equipos de Protección Personal.
 *
 * POR QUÉ ESTE MÓDULO
 * Entregar EPP es fácil; demostrar que se entregó y que sigue siendo apto es
 * lo difícil. Este módulo responde dos preguntas que en papel se pierden:
 *   1. ¿Quién firmó el cargo?  (sin firma no hay evidencia de entrega)
 *   2. ¿Qué equipo ya cumplió su vida útil y sigue en uso?
 *
 * Un arnés vencido en servicio es un accidente esperando ocurrir, y nadie lo
 * detecta revisando cuadernos. Aquí la fecha de reposición se calcula sola a
 * partir de la vida útil de cada ítem.
 * =========================================================================
 */

var SUBCONFIG_09_EPP = {

  Config_Modular: {
    NombreInterno:          "09_EPP",
    // Miniatura de la tarjeta móvil: columna con la imagen (vacío = solo icono) e icono por defecto
    Card_Image:             "Foto_Cargo",
    Card_Icon:              "shield",
    Titulo:                 "Entrega de EPP",
    DRIVE_FOLDER_NAME:      "09_EPP_DB",
    GOOGLE_DOC_TEMPLATE_ID: "",              // se vincula desde Configuración → PDF
    EMAIL_TEMPLATE_ID:      "",
    PARENT_TABLE:           "MAIN",
    CHILD_TABLE:            "ITEMS",
    RELATIONAL_KEY:         "PARENT_UUID",

    // Cada fila es un equipo entregado. La fecha de reposición es 'display':
    // se calcula desde la vida útil, no se escribe a mano.
    Relational_Fields: [
      { name: "Equipo",     label: "Equipo", type: "select", fullWidth: true, colSpan: "md:col-span-3",
        options: [
          "Casco de seguridad", "Lentes de seguridad", "Careta facial",
          "Protector auditivo", "Respirador / mascarilla", "Guantes",
          "Botines de seguridad", "Arnés de cuerpo completo", "Línea de vida",
          "Chaleco reflectivo", "Ropa de trabajo", "Traje impermeable",
          "Guantes dieléctricos", "Botas dieléctricas"
        ] },
      { name: "Marca",      label: "Marca / modelo", type: "text", fullWidth: true, colSpan: "md:col-span-2" },
      { name: "Talla",      label: "Talla",    type: "text",   colSpan: "md:col-span-1" },
      { name: "Cantidad",   label: "Cant.",    type: "number", min: 1, max: 999, step: 1, colSpan: "md:col-span-1" },
      { name: "Vida_Util",  label: "Vida útil", type: "select", colSpan: "md:col-span-2",
        options: [
          { value: "3",  label: "3 meses" },  { value: "6",  label: "6 meses" },
          { value: "12", label: "12 meses" }, { value: "24", label: "24 meses" },
          { value: "36", label: "36 meses" }, { value: "0",  label: "Hasta desgaste" }
        ] },
      { name: "Fecha_Reposicion", label: "Reponer el", type: "display", colSpan: "md:col-span-2" }
    ],

    // Matriz de permisos por rol. El SuperAdmin (proveedor) no figura:
    // PERMISOS.matriz() le concede todo por jerarquía.
    // alcance: todos | responsable | propios  →  qué registros ve el rol
    AdminRole:       { canCreate: true , canRead: true , canUpdate: true , canDelete: true , alcance: "todos" },
    SupervisorRole:  { canCreate: true , canRead: true , canUpdate: true , canDelete: false, alcance: "responsable" },
    TrabajadorRole:  { canCreate: false, canRead: true , canUpdate: false, canDelete: false, alcance: "propios" }
  },

  Variables: {
    "UUID":              { type: "Hidden_UUID", required: true, isFilter: false },

    // ── A quién se entrega ──
    "Trabajador_DNI":    { type: "REF",  required: false, isFilter: false, label: "Trabajador",
                           relationalDataOrigin: "01_Usuarios" },
    "Nombre_Trabajador": { type: "Text", required: true,  isFilter: true,  label: "Nombre del trabajador" },
    "Area":              { type: "Enum", required: true,  isFilter: true,  label: "Área",
                           acceptedValues: [
                             "Operaciones", "Mantenimiento", "Almacén", "Logística",
                             "Producción", "Administración", "Obra / Campo", "Laboratorio"
                           ], allowOtherValues: true },
    "Puesto":            { type: "Text", required: false, isFilter: false, label: "Puesto" },

    // ── Qué tipo de entrega ──
    "Tipo_Entrega":      { type: "Enum", required: true, isFilter: true, label: "Motivo de la entrega",
                           acceptedValues: [
                             "Dotación inicial",
                             "Reposición por vida útil",
                             "Reposición por desgaste",
                             "Reposición por daño",
                             "Reposición por pérdida",
                             "Cambio de puesto"
                           ], allowOtherValues: false },
    "Fecha_Entrega":     { type: "Date", required: true,  isFilter: true,  label: "Fecha de entrega" },
    "Entregado_Por":     { type: "REF",  required: false, isFilter: false, label: "Entregado por",
                           relationalDataOrigin: "01_Usuarios",
                           slice: { column: "Rol", value: "Supervisor" } },

    "Estado":            { type: "Enum", required: true, isFilter: true, label: "Estado",
                           acceptedValues: ["Entregado", "Pendiente de firma", "Devuelto", "Anulado"],
                           allowOtherValues: false },
    "Observaciones":     { type: "Text", required: false, isFilter: false, label: "Observaciones" },

    // Calculados desde los ítems: permiten filtrar sin recorrer la tabla hija
    "Total_Items":       { type: "Text", required: false, isFilter: false, label: "Ítems entregados" },
    "Proxima_Reposicion":{ type: "Date", required: false, isFilter: true,  label: "Próxima reposición" },

    // ── Evidencia (Skill 11: cada archivo lleva su _ID y _Path) ──
    "Firma_Trabajador":      { type: "Signature", required: false, isFilter: false, label: "Firma de conformidad" },
    "Firma_Trabajador_ID":   { type: "Hidden", required: false },
    "Firma_Trabajador_Path": { type: "Hidden", required: false },

    "Foto_Cargo":        { type: "Image_Collection", required: false, isFilter: false, label: "Cargo escaneado" },
    "Foto_Cargo_ID":     { type: "Hidden", required: false },
    "Foto_Cargo_Path":   { type: "Hidden", required: false },

    "Registrado_Por":    { type: "Text",   required: false, isFilter: false, label: "Registrado por" },
    "Fecha_Registro":    { type: "Hidden", required: false }
  },

  Vistas: {
    Subtitulo: "Entrega y reposición de equipos",
    Resumen: {
      etiquetaCrear: "Registrar entrega", ordenPor: "Fecha_Entrega",
      columnas: [
        { campo: "Nombre_Trabajador", sub: "Area", etiqueta: "Trabajador / Área" },
        { campo: "Tipo_Entrega", etiqueta: "Motivo" },
        { campo: "Fecha_Entrega", etiqueta: "Entrega" },
        { campo: "Total_Items", etiqueta: "Ítems", numero: true },
        { campo: "Proxima_Reposicion", etiqueta: "Reposición", render: "reposicion" },
        { campo: "Estado", tipo: "badge" }
      ],
      vacio: { icono: "shield", titulo: "Sin entregas registradas",
               mensaje: "El cargo de EPP firmado es la prueba de que el equipo se entregó.",
               accion: "Registrar entrega" }
    },
    Edicion: {
      tituloNuevo: "Registrar Entrega de EPP", tituloEditar: "Editar Entrega de EPP",
      secciones: [
        { titulo: "A quién se entrega", icono: "person",
          campos: ["Trabajador_DNI", "Nombre_Trabajador", "Area", "Puesto"] },
        { titulo: "Entrega", icono: "shield",
          campos: ["Tipo_Entrega", "Fecha_Entrega", "Entregado_Por", "Estado", "Proxima_Reposicion", "Observaciones"] },
        { titulo: "Cargo firmado", icono: "draw",
          campos: ["Firma_Trabajador", "Foto_Cargo"] }
      ]
    },
    Detalle: {
      titulo: "Nombre_Trabajador", subtitulo: ["Area", "Fecha_Entrega"],
      secciones: [
        { titulo: "Trabajador",
          campos: ["Nombre_Trabajador", "Trabajador_DNI", "Area", "Puesto"] },
        { titulo: "Entrega",
          campos: ["Tipo_Entrega", "Fecha_Entrega", "Entregado_Por", "Estado", "Total_Items", "Proxima_Reposicion"] },
        { titulo: "Observaciones", campos: ["Observaciones"] }
      ]
    },
    Hijos: { titulo: "Equipos entregados", icono: "inventory_2",
             vacio: "Agrega cada equipo entregado con su talla y vida útil.",
             vacioDetalle: "Esta entrega no detalla los equipos." },
    Badges: {
      Estado: { "Entregado":          { tono: "ok",   icono: "check_circle" },
                "Pendiente de firma": { tono: "warn", icono: "draw" },
                "Devuelto":           { tono: "info", icono: "undo" },
                "Anulado":            { tono: "mute", icono: "block" } }
    }
  },

  /**
   * Vida útil sugerida por tipo de equipo, en meses.
   * Al elegir el equipo, la fila propone su vida útil habitual; el usuario
   * puede cambiarla. Editar esta tabla adapta el módulo a las fichas técnicas
   * de cada empresa sin tocar ninguna vista.
   */
  VidaUtilSugerida: {
    "Casco de seguridad":       "36",
    "Lentes de seguridad":      "12",
    "Careta facial":            "24",
    "Protector auditivo":       "6",
    "Respirador / mascarilla":  "3",
    "Guantes":                  "3",
    "Botines de seguridad":     "12",
    "Arnés de cuerpo completo": "24",
    "Línea de vida":            "24",
    "Chaleco reflectivo":       "12",
    "Ropa de trabajo":          "12",
    "Traje impermeable":        "12",
    "Guantes dieléctricos":     "6",
    "Botas dieléctricas":       "12"
  }
};

window.MOTOR_HOOKS = window.MOTOR_HOOKS || {};

MOTOR_HOOKS["09_EPP"] = {
  /** Un EPP vencido es un trabajador sin protección real */
  reposicion: function (r) {
    if (!r.Proxima_Reposicion) return { tono: "mute", texto: "—", clave: "sin-fecha" };
    const f = new Date(r.Proxima_Reposicion);
    if (isNaN(f)) return { tono: "mute", texto: "—", clave: "sin-fecha" };
    const dias = Math.round((f - new Date(PWA_SKILLS.getPeruTime(false))) / 86400000);
    if (dias < 0)   return { tono: "bad",  texto: "Vencida hace " + Math.abs(dias) + " d", clave: "vencida" };
    if (dias <= 30) return { tono: "warn", texto: "En " + dias + " d", clave: "por-vencer" };
    return { tono: "ok", texto: "Vigente", clave: "vigente" };
  },
  columnas: {
    reposicion: function (r) {
      const v = this.reposicion(r);
      return '<div class="text-[11px] font-semibold" style="color:var(--st-' + v.tono + '-fg)">' + esc(v.texto) + "</div>" +
             (r.Proxima_Reposicion ? '<div class="text-[10px] text-secondary tabular-nums">' + esc(r.Proxima_Reposicion) + "</div>" : "");
    }
  },
  resumen: function () {
    MOTOR_RENDER.kpis("09_EPP", [
      { tono: "bad",  etiqueta: "Reposición vencida", cond: { Proxima_Reposicion: { lt: "@hoy" } } },
      { tono: "warn", etiqueta: "Por vencer", cond: { Proxima_Reposicion: { gte: "@hoy", lte: "@hoy+30" } } },
      { tono: "info", etiqueta: "Sin firma", cond: { Estado: { eq: "Pendiente de firma" } } },
      { tono: "mute", etiqueta: "Ítems entregados", metrica: "sum", campo: "Total_Items",
        formato: n => n == null ? "—" : String(Math.round(parseFloat(n) || 0)) }
    ]);
  },
  edicion: function (ctx) {
    if (!ctx.nuevo) return;
    const e = ctx.root.querySelector("#m09-epp-f-Estado");
    if (e && !e.value) e.value = "Entregado";
    const quien = ctx.root.querySelector("#m09-epp-f-Entregado_Por");
    if (quien && !quien.value) quien.value = (AppState.User || {}).Nombre || "";
  },
  /** El total y la próxima reposición salen del detalle, no se teclean */
  antesDeGuardar: function (ctx) {
    ctx.datos.Total_Items = String(ctx.hijos.length);
    if (!ctx.datos.Proxima_Reposicion) {
      const fechas = ctx.hijos.map(h => h.Fecha_Reposicion).filter(Boolean).sort();
      if (fechas.length) ctx.datos.Proxima_Reposicion = fechas[0];
    }
    return true;
  }
};
</script>
