<!-- =========================================================================
     VISTA: DETALLE — MÓDULO 09_EPP
     ========================================================================= -->
<div id="module-09_epp-detalle" class="module-view" style="display:none;">

  <header class="flex justify-between items-start w-full mb-6 gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <button onclick="changeInternalView('09_EPP','Resumen')" aria-label="Volver al listado"
        class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white transition-colors text-secondary border border-outline-variant shrink-0">
        <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
      </button>
      <div class="min-w-0">
        <h1 id="epp-det-titulo" class="text-lg font-black text-on-surface tracking-tight">Cargando…</h1>
        <div class="flex items-center gap-2 mt-1 flex-wrap" id="epp-det-badges"></div>
      </div>
    </div>
    <div class="flex flex-col gap-1.5 items-end shrink-0">
      <button onclick="changeInternalView('09_EPP','Edicion', window._eppDetalleUUID)"
        class="h-7 px-3 rounded-lg bg-primary text-on-primary text-[9px] font-bold shadow-sm hover:opacity-90 transition-all flex items-center justify-center gap-1.5 whitespace-nowrap">
        <span class="material-symbols-outlined text-[14px]" aria-hidden="true">edit</span>Editar
      </button>
      <button onclick="PDF_TEMPLATE.exportarRegistro('09_EPP', window._eppDetalleUUID, 'Cargo EPP ' + window._eppDetalleUUID)"
        class="h-7 px-3 rounded-lg border border-outline-variant bg-white text-[9px] font-bold text-on-surface hover:bg-slate-50 transition-all flex items-center justify-center gap-1.5 whitespace-nowrap">
        <span class="material-symbols-outlined text-[14px]" aria-hidden="true">picture_as_pdf</span>PDF
      </button>
    </div>
  </header>

  <div class="max-w-4xl mx-auto space-y-5">

    <!-- Estado de reposición: la pregunta que se consulta -->
    <div id="epp-det-reposicion" class="rounded-2xl border p-4"></div>

    <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-sm">
      <h2 class="text-[11px] font-black text-secondary uppercase tracking-widest mb-4 border-b border-outline-variant pb-2">Datos de la entrega</h2>
      <div class="grid grid-cols-2 gap-x-4 gap-y-4" id="epp-det-datos"></div>
    </div>

    <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-sm">
      <div class="flex items-center justify-between mb-4 border-b border-outline-variant pb-2 gap-2">
        <h2 class="text-[11px] font-black text-secondary uppercase tracking-widest">Equipos entregados</h2>
        <span class="text-[10px] font-bold text-on-surface-variant" id="epp-det-conteo"></span>
      </div>
      <div id="epp-det-items"></div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-sm">
        <h2 class="text-[11px] font-black text-secondary uppercase tracking-widest mb-4 border-b border-outline-variant pb-2">Firma de conformidad</h2>
        <div id="epp-det-firma" class="min-h-[6rem] bg-surface-container-low rounded-xl border border-dashed border-outline-variant flex items-center justify-center overflow-hidden"></div>
      </div>
      <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-sm">
        <h2 class="text-[11px] font-black text-secondary uppercase tracking-widest mb-4 border-b border-outline-variant pb-2">Cargo escaneado</h2>
        <div id="epp-det-fotos" class="min-h-[6rem] bg-surface-container-low rounded-xl border border-dashed border-outline-variant flex items-center justify-center overflow-hidden"></div>
      </div>
    </div>

  </div>
</div>

<script>
function eppDetCampo(etiqueta, valor, ancho) {
  return '<div class="' + (ancho || '') + '">' +
    '<p class="text-[10px] font-black text-secondary uppercase tracking-widest mb-1">' + etiqueta + '</p>' +
    '<p class="text-[13px] font-semibold text-on-surface">' + (valor || '—') + '</p></div>';
}

async function loadDetail_09_EPP(uuid) {
  window._eppDetalleUUID = uuid;
  const tit = document.querySelector('#main-container #epp-det-titulo');
  if (tit) tit.textContent = 'Cargando…';

  let datos = window._eppData || [];
  if (!datos.length) {
    try { datos = JSON.parse(localStorage.getItem('refdata_09_EPP')) || []; } catch (e) {}
  }
  let r = datos.find(x => String(x.UUID) === String(uuid));

  if (!r) {
    try {
      const res = await DataService.read('09_EPP');
      if (res && res.status === 'OK' && Array.isArray(res.payload)) {
        window._eppData = res.payload;
        r = res.payload.find(x => String(x.UUID) === String(uuid));
      }
    } catch (e) { /* se resuelve abajo */ }
  }

  if (!r) {
    if (tit) tit.textContent = 'Cargo no encontrado';
    PWA_SKILLS.toast('No se pudo cargar el cargo ' + uuid + '.', 'error', 4000);
    return;
  }

  if (tit) tit.textContent = r.Nombre_Trabajador || 'Cargo de EPP';

  const badges = document.querySelector('#main-container #epp-det-badges');
  if (badges) {
    badges.innerHTML =
      (typeof eppCargoBadge === 'function' ? eppCargoBadge(r) : '') +
      '<span class="text-[10px] text-secondary font-semibold">' + (r.Tipo_Entrega || '') +
      (r.Area ? ' · ' + r.Area : '') + '</span>';
  }

  // Panel de reposición
  const v = (typeof eppReposicion === 'function') ? eppReposicion(r) : { clave:'sin-fecha', texto:'—' };
  const panel = document.querySelector('#main-container #epp-det-reposicion');
  if (panel) {
    const conf = {
      'vencida':    { b:'border-red-200 bg-red-50',         t:'text-red-800',     i:'gpp_maybe', tit:'Reposición vencida',
                      sub:'Este equipo cumplió su vida útil y sigue asignado.' },
      'por-vencer': { b:'border-amber-200 bg-amber-50',     t:'text-amber-800',   i:'schedule',  tit:'Reposición próxima',
                      sub:'Programa el reemplazo antes de la fecha.' },
      'vigente':    { b:'border-emerald-200 bg-emerald-50', t:'text-emerald-800', i:'verified',  tit:'Vida útil vigente',
                      sub:'El equipo está dentro de su periodo de uso.' },
      'sin-fecha':  { b:'border-outline-variant bg-surface-container-low', t:'text-on-surface', i:'help', tit:'Sin control de vida útil',
                      sub:'Los equipos de este cargo no tienen vida útil definida.' }
    }[v.clave];
    panel.className = 'rounded-2xl border p-4 ' + conf.b;
    panel.innerHTML =
      '<div class="flex items-center gap-3">' +
      '<span class="material-symbols-outlined text-[26px] shrink-0 ' + conf.t + '" aria-hidden="true">' + conf.i + '</span>' +
      '<div class="min-w-0"><p class="text-[13px] font-black ' + conf.t + '">' + conf.tit + '</p>' +
      '<p class="text-[11px] mt-0.5 ' + conf.t + ' opacity-90">' + conf.sub +
      (r.Proxima_Reposicion ? ' · ' + r.Proxima_Reposicion : '') + '</p></div></div>';
  }

  const cont = document.querySelector('#main-container #epp-det-datos');
  if (cont) cont.innerHTML =
    eppDetCampo('Trabajador', r.Nombre_Trabajador) +
    eppDetCampo('DNI', r.Trabajador_DNI) +
    eppDetCampo('Área', r.Area) +
    eppDetCampo('Puesto', r.Puesto) +
    eppDetCampo('Motivo', r.Tipo_Entrega) +
    eppDetCampo('Fecha de entrega', r.Fecha_Entrega) +
    eppDetCampo('Entregado por', r.Entregado_Por) +
    eppDetCampo('Estado', r.Estado) +
    eppDetCampo('Observaciones', r.Observaciones, 'col-span-2');

  // Equipos: los vencidos primero
  const lista  = document.querySelector('#main-container #epp-det-items');
  const conteo = document.querySelector('#main-container #epp-det-conteo');
  const items = r._items || [];
  if (conteo) conteo.textContent = items.length ? items.length + ' equipo(s)' : '';

  if (lista) {
    if (!items.length) {
      lista.innerHTML = '<div class="ds-empty" role="status">' +
        '<span class="material-symbols-outlined ds-empty-icon" aria-hidden="true">inventory_2</span>' +
        '<h4>Sin equipos registrados</h4>' +
        '<p>Un cargo sin ítems no documenta qué se entregó.</p>' +
        '<button type="button" class="ds-empty-action" onclick="changeInternalView(\'09_EPP\',\'Edicion\',\'' + r.UUID + '\')">' +
        '<span class="material-symbols-outlined text-[16px]" aria-hidden="true">add</span>Agregar equipos</button></div>';
    } else {
      const hoy = new Date(); hoy.setHours(0,0,0,0);
      const orden = items.slice().sort((a, b) =>
        String(a.Fecha_Reposicion || '9999').localeCompare(String(b.Fecha_Reposicion || '9999')));

      lista.innerHTML = '<div class="space-y-2">' + orden.map(it => {
        let col = { bg:'#f5f2fb', fg:'#454652', bd:'#c6c5d4' }, etiqueta = it.Fecha_Reposicion || 'Sin control';
        if (it.Fecha_Reposicion) {
          const dias = Math.round((new Date(it.Fecha_Reposicion + 'T00:00:00') - hoy) / 86400000);
          col = dias < 0 ? { bg:'#fee2e2', fg:'#991b1b', bd:'#fecaca' }
              : dias <= 30 ? { bg:'#fef3c7', fg:'#92400e', bd:'#fde68a' }
              : { bg:'#d1fae5', fg:'#065f46', bd:'#a7f3d0' };
        }
        return '<div class="flex items-center gap-3 p-2.5 rounded-xl border border-outline-variant bg-surface-container-low">' +
          '<span class="material-symbols-outlined text-[18px] text-secondary shrink-0" aria-hidden="true">shield</span>' +
          '<div class="min-w-0 flex-1">' +
          '<p class="text-[12px] font-bold text-on-surface">' + (it.Equipo || '—') +
          (it.Cantidad ? ' <span class="font-normal text-secondary">×' + it.Cantidad + '</span>' : '') + '</p>' +
          '<p class="text-[10px] text-secondary">' + [it.Marca, it.Talla ? 'Talla ' + it.Talla : ''].filter(Boolean).join(' · ') + '</p>' +
          '</div>' +
          '<span class="text-[10px] font-black px-2 py-1 rounded-lg shrink-0 tabular-nums" ' +
          'style="background:' + col.bg + ';color:' + col.fg + ';border:1px solid ' + col.bd + '">' + etiqueta + '</span>' +
          '</div>';
      }).join('') + '</div>';
    }
  }

  PWA_SKILLS.renderDriveMedia(r.Firma_Trabajador || '', 'Firma_Trabajador', 'epp-det-firma');
  PWA_SKILLS.renderDriveMedia(r.Foto_Cargo || '',       'Foto_Cargo',       'epp-det-fotos');
}
</script>
