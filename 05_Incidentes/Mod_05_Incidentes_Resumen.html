<!-- =========================================================================
     VISTA: RESUMEN — MÓDULO 05_Incidentes
     ========================================================================= -->
<div id="module-05_incidentes-resumen" class="module-view">

  <!-- Cabecera -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
    <div class="flex items-center gap-3">
      <button onclick="showView('Menu')" aria-label="Volver al menú principal"
        class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors text-secondary border border-outline-variant shrink-0">
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">arrow_back</span>
      </button>
      <div>
        <h2 class="font-h2 text-h2 text-on-surface leading-tight">Incidentes y Accidentes</h2>
        <p class="text-[11px] text-on-surface-variant">Registro, investigación y cierre de eventos</p>
      </div>
    </div>
    <div class="flex items-center gap-2 w-full sm:w-auto">
      <span id="ui-result-count" class="text-[10px] font-bold text-on-surface-variant mr-auto sm:mr-1 hidden"></span>
      <div class="relative" id="inc-export-wrap">
        <button onclick="document.getElementById('inc-export-menu').classList.toggle('hidden')"
          class="flex items-center gap-1.5 px-3 h-9 border border-outline-variant text-[12px] font-bold text-primary rounded-lg hover:bg-surface-container transition-colors shadow-sm whitespace-nowrap">
          <span class="material-symbols-outlined text-[16px]" aria-hidden="true">download</span>Exportar
          <span class="material-symbols-outlined text-[13px] opacity-60" aria-hidden="true">expand_more</span>
        </button>
        <div id="inc-export-menu" class="hidden absolute right-0 top-full mt-1.5 w-44 bg-white rounded-xl border border-outline-variant shadow-xl z-50 overflow-hidden">
          <button onclick="PWA_SKILLS.exportFilteredToExcel(); document.getElementById('inc-export-menu').classList.add('hidden')"
            class="w-full flex items-center gap-2.5 px-4 py-3 text-[12px] font-semibold text-on-surface hover:bg-surface-container-low transition-colors">
            <span class="material-symbols-outlined text-[17px] text-green-600" aria-hidden="true">grid_on</span>Excel (.xlsx)
          </button>
          <button onclick="PWA_SKILLS.exportVisibleToCSV('Incidentes'); document.getElementById('inc-export-menu').classList.add('hidden')"
            class="w-full flex items-center gap-2.5 px-4 py-3 text-[12px] font-semibold text-on-surface hover:bg-surface-container-low transition-colors border-t border-outline-variant/30">
            <span class="material-symbols-outlined text-[17px] text-blue-600" aria-hidden="true">text_snippet</span>CSV (.csv)
          </button>
        </div>
      </div>
      <button onclick="changeInternalView('05_Incidentes', 'Edicion')"
        class="flex items-center gap-1.5 px-3 h-9 bg-primary text-on-primary rounded-lg text-[12px] font-bold hover:opacity-90 transition-all shadow-sm whitespace-nowrap">
        <span class="material-symbols-outlined text-[16px]" aria-hidden="true">add</span>Reportar
      </button>
    </div>
  </div>

  <!-- Indicadores: el orden refleja urgencia, no volumen -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
    <button type="button" onclick="incFiltrarPor('Estado','Reportado')"
      class="bg-amber-50 border border-amber-200 rounded-2xl p-3 shadow-sm text-left hover:shadow-md transition-all">
      <p class="text-[9px] font-black text-amber-700 uppercase tracking-widest mb-1">Sin investigar</p>
      <p class="text-2xl font-black text-amber-700" id="inc-kpi-reportados">—</p>
    </button>
    <button type="button" onclick="incFiltrarPor('Estado','Con acciones abiertas')"
      class="bg-blue-50 border border-blue-200 rounded-2xl p-3 shadow-sm text-left hover:shadow-md transition-all">
      <p class="text-[9px] font-black text-blue-700 uppercase tracking-widest mb-1">Acciones abiertas</p>
      <p class="text-2xl font-black text-blue-700" id="inc-kpi-abiertas">—</p>
    </button>
    <button type="button" onclick="incFiltrarPor('Gravedad','Grave')"
      class="bg-red-50 border border-red-200 rounded-2xl p-3 shadow-sm text-left hover:shadow-md transition-all">
      <p class="text-[9px] font-black text-red-700 uppercase tracking-widest mb-1">Graves</p>
      <p class="text-2xl font-black text-red-700" id="inc-kpi-graves">—</p>
    </button>
    <div class="bg-surface-container-lowest rounded-2xl border border-outline-variant p-3 shadow-sm">
      <p class="text-[9px] font-black text-on-surface-variant uppercase tracking-widest mb-1">Días sin accidentes</p>
      <p class="text-2xl font-black text-emerald-700" id="inc-kpi-dias">—</p>
    </div>
  </div>

  <!-- Barra de búsqueda y filtros (la inyecta el router) -->
  <div id="ui-search-bar-slot"></div>

  <!-- Tabla -->
  <div class="bg-white rounded-2xl border border-outline-variant shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse" id="incidentes-table">
        <thead>
          <tr class="bg-surface-container-low text-on-surface-variant text-[11px] font-black uppercase tracking-wider">
            <th class="px-3 py-2.5">ID / Fecha</th>
            <th class="px-3 py-2.5">Tipo</th>
            <th class="px-3 py-2.5">Gravedad</th>
            <th class="px-3 py-2.5">Afectado / Área</th>
            <th class="px-3 py-2.5">Estado</th>
            <th class="px-3 py-2.5">Acciones abiertas</th>
            <th class="px-3 py-2.5 text-center" data-nosort>Gestión</th>
          </tr>
        </thead>
        <tbody id="incidentes-table-body" class="divide-y divide-outline-variant/40"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
// ── Distintivos ────────────────────────────────────────────────────────────
function incGravedadBadge(g) {
  const m = {
    'Leve':   'bg-emerald-100 text-emerald-800 border-emerald-200',
    'Grave':  'bg-red-100 text-red-800 border-red-200',
    'Mortal': 'bg-gray-900 text-white border-gray-700'
  };
  return '<span class="inline-flex px-2 py-0.5 rounded-full text-[10px] font-black border whitespace-nowrap ' +
         (m[g] || 'bg-surface-variant text-secondary border-outline-variant') + '">' + (g || '—') + '</span>';
}
function incEstadoBadge(e) {
  // Icono + texto: el color nunca es el único indicador (regla color-not-only)
  const m = {
    'Reportado':             { cls:'bg-amber-100 text-amber-800',   ico:'flag' },
    'En investigación':      { cls:'bg-blue-100 text-blue-800',     ico:'search' },
    'Con acciones abiertas': { cls:'bg-orange-100 text-orange-800', ico:'pending_actions' },
    'Cerrado':               { cls:'bg-emerald-100 text-emerald-800',ico:'check_circle' }
  };
  const c = m[e] || { cls:'bg-surface-variant text-secondary', ico:'help' };
  return '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold whitespace-nowrap ' + c.cls + '">' +
         '<span class="material-symbols-outlined text-[11px]" aria-hidden="true">' + c.ico + '</span>' + (e || '—') + '</span>';
}
function incTipoBadge(t) {
  const corto = { 'Cuasi accidente':'Cuasi acc.', 'Incidente peligroso':'Incid. peligroso',
                  'Accidente sin tiempo perdido':'Acc. sin TP', 'Accidente con tiempo perdido':'Acc. con TP',
                  'Enfermedad ocupacional':'Enf. ocupacional' };
  return '<span class="text-[11px] font-semibold text-on-surface whitespace-nowrap">' + (corto[t] || t || '—') + '</span>';
}

// ── Pintado de la tabla ────────────────────────────────────────────────────
function incRenderTabla(data) {
  const tbody = document.querySelector('#main-container #incidentes-table-body');
  if (!tbody) return;

  const set = (id, v) => { const e = document.querySelector('#main-container #' + id); if (e) e.textContent = v; };
  set('inc-kpi-reportados', data.filter(r => r.Estado === 'Reportado').length);
  set('inc-kpi-abiertas',   data.filter(r => r.Estado === 'Con acciones abiertas').length);
  set('inc-kpi-graves',     data.filter(r => r.Gravedad === 'Grave' || r.Gravedad === 'Mortal').length);
  set('inc-kpi-dias',       incDiasSinAccidentes(data));

  if (!data.length) {
    PWA_SKILLS.showEmptyState('incidentes-table-body', {
      icon: 'health_and_safety',
      title: 'Sin eventos registrados',
      message: 'Cuando se reporte un incidente o accidente aparecerá aquí para su investigación.',
      actionLabel: 'Reportar evento', actionIcon: 'add',
      onAction: "changeInternalView('05_Incidentes','Edicion')"
    });
    const c = document.querySelector('#main-container #ui-result-count');
    if (c) { c.textContent = '0 registros'; c.classList.remove('hidden'); }
    return;
  }

  PWA_SKILLS.finishLoading('incidentes-table-body');
  tbody.innerHTML = data.map(r => {
    const abiertas = (r._accionesAbiertas != null) ? r._accionesAbiertas : 0;
    return `
    <tr class="hover:bg-surface-container-low/50 transition-colors cursor-pointer"
        onclick="changeInternalView('05_Incidentes','Detalle','${r.UUID}')">
      <td class="px-3 py-2">
        <div class="font-bold text-[11px] text-primary">${r.UUID || '—'}</div>
        <div class="text-[10px] text-secondary">${r.Fecha_Evento || '—'}</div>
      </td>
      <td class="px-3 py-2">${incTipoBadge(r.Tipo_Evento)}</td>
      <td class="px-3 py-2">${incGravedadBadge(r.Gravedad)}</td>
      <td class="px-3 py-2">
        <div class="text-[11px] font-semibold text-on-surface truncate max-w-[150px]">${r.Nombre_Trabajador || '—'}</div>
        <div class="text-[10px] text-secondary">${r.Area || '—'}</div>
      </td>
      <td class="px-3 py-2">${incEstadoBadge(r.Estado)}</td>
      <td class="px-3 py-2">
        ${abiertas > 0
          ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-black bg-orange-100 text-orange-800">
               <span class="material-symbols-outlined text-[11px]" aria-hidden="true">assignment_late</span>${abiertas}</span>`
          : '<span class="text-[10px] text-secondary">—</span>'}
      </td>
      <td class="px-3 py-2 text-center" onclick="event.stopPropagation()">
        <div class="flex items-center justify-center gap-1">
          <button onclick="changeInternalView('05_Incidentes','Detalle','${r.UUID}')" aria-label="Ver detalle del evento ${r.UUID}"
            class="w-7 h-7 flex items-center justify-center rounded-lg text-primary hover:bg-primary/10 transition-colors">
            <span class="material-symbols-outlined text-[15px]" aria-hidden="true">visibility</span>
          </button>
          <button onclick="changeInternalView('05_Incidentes','Edicion','${r.UUID}')" aria-label="Editar el evento ${r.UUID}"
            class="w-7 h-7 flex items-center justify-center rounded-lg text-secondary hover:bg-surface-variant transition-colors">
            <span class="material-symbols-outlined text-[15px]" aria-hidden="true">edit</span>
          </button>
        </div>
      </td>
    </tr>`;
  }).join('');

  PWA_SKILLS.initSortableTable('incidentes-table-body');
  PWA_SKILLS.enhanceTable('incidentes-table-body');
  PWA_SKILLS.updateResultCount('incidentes-table-body', 'ui-result-count');
  const c = document.querySelector('#main-container #ui-result-count');
  if (c) c.classList.remove('hidden');
}

/** Días transcurridos desde el último accidente con tiempo perdido */
function incDiasSinAccidentes(data) {
  const conTP = data
    .filter(r => r.Tipo_Evento === 'Accidente con tiempo perdido' && r.Fecha_Evento)
    .map(r => new Date(r.Fecha_Evento))
    .filter(d => !isNaN(d));
  if (!conTP.length) return '—';
  const ultimo = new Date(Math.max.apply(null, conTP));
  return Math.max(0, Math.floor((Date.now() - ultimo.getTime()) / 86400000));
}

/** Filtro rápido desde los indicadores */
function incFiltrarPor(campo, valor) {
  const todos = window._incData || [];
  incRenderTabla(todos.filter(r => {
    if (campo === 'Gravedad' && valor === 'Grave') return r.Gravedad === 'Grave' || r.Gravedad === 'Mortal';
    return r[campo] === valor;
  }));
  PWA_SKILLS.toast('Filtrado: ' + valor + '. Usa "Limpiar filtros" para ver todo.', 'info', 3000);
}

// ── Carga ──────────────────────────────────────────────────────────────────
function loadResumen_05_Incidentes() {
  // Esqueleto antes de pedir datos: nada de tabla vacía mientras carga
  PWA_SKILLS.renderSkeleton('incidentes-table-body', 6);

  if (!window._incExportListener) {
    window._incExportListener = true;
    document.addEventListener('click', function(e) {
      const wrap = document.getElementById('inc-export-wrap');
      if (wrap && !wrap.contains(e.target)) {
        const menu = document.getElementById('inc-export-menu');
        if (menu) menu.classList.add('hidden');
      }
    });
  }

  DataService.read('05_Incidentes')
    .then(res => {
      const filas = (res && res.status === 'OK' && Array.isArray(res.payload)) ? res.payload : [];
      // Alcance por rol: un trabajador no debe recibir registros ajenos.
      // El filtro del navegador es comodidad; la restricción real la
      // aplica RLS en la base de datos.
      const visibles = (typeof PERMISOS !== 'undefined')
        ? PERMISOS.filtrarDatos('05_Incidentes', filas) : filas;
      window._incData = visibles;
      localStorage.setItem('refdata_05_Incidentes', JSON.stringify(visibles));
      incRenderTabla(visibles);
    })
    .catch(() => {
      // Sin red se trabaja con lo último sincronizado
      let cache = [];
      try { cache = JSON.parse(localStorage.getItem('refdata_05_Incidentes')) || []; } catch (e) {}
      window._incData = cache;
      if (cache.length) {
        incRenderTabla(cache);
        PWA_SKILLS.toast('Sin conexión: mostrando los últimos datos sincronizados.', 'warning', 4000);
      } else {
        PWA_SKILLS.showEmptyState('incidentes-table-body', {
          icon: 'cloud_off',
          title: 'Sin conexión',
          message: 'No se pudieron cargar los eventos y no hay copia local disponible.',
          actionLabel: 'Reintentar', actionIcon: 'refresh',
          onAction: "loadResumen_05_Incidentes()"
        });
      }
    });
}
</script>
