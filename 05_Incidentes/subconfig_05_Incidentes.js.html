<script>
/**
 * =========================================================================
 * SUBCONFIG — 05_Incidentes

 *
 * POR QUÉ ESTE MÓDULO

 * responsable y plazo — que son las que cierran el ciclo.
 *
 * DISEÑO NEUTRO POR INDUSTRIA
 * Las listas evitan vocabulario de un solo sector: sirven igual en minería,
 * construcción, planta, logística o servicios. Se ajustan editando este
 * archivo, sin tocar las vistas.
 * =========================================================================
 */

var SUBCONFIG_05_INCIDENTES = {

  Config_Modular: {
    NombreInterno:          "05_Incidentes",
    // Miniatura de la tarjeta móvil: columna con la imagen (vacío = solo icono) e icono por defecto
    Card_Image:             "Evidencia_Fotos",
    Card_Icon:              "personal_injury",
    Titulo:                 "Incidentes y Accidentes",
    DRIVE_FOLDER_NAME:      "05_Incidentes_DB",
    GOOGLE_DOC_TEMPLATE_ID: "",              // se vincula desde Configuración → PDF
    EMAIL_TEMPLATE_ID:      "",
    PARENT_TABLE:           "MAIN",
    CHILD_TABLE:            "ACCIONES",      // acciones correctivas del hallazgo
    RELATIONAL_KEY:         "PARENT_UUID",

    // Filas dinámicas: el plan de acción que cierra la investigación

      { name: "Accion",       label: "Acción correctiva", type: "text", colSpan: "md:col-span-5" },
      { name: "Responsable",  label: "Responsable",       type: "text", colSpan: "md:col-span-3" },
      { name: "Fecha_Limite", label: "Fecha límite",      type: "date", colSpan: "md:col-span-2" },
      { name: "Estado_Accion",label: "Estado",            type: "text", colSpan: "md:col-span-2" }
    ],

    // Matriz de permisos por rol. El SuperAdmin (proveedor) no figura:
    // PERMISOS.matriz() le concede todo por jerarquía.
    // alcance: todos | responsable | propios  →  qué registros ve el rol
    AdminRole:       { canCreate: true , canRead: true , canUpdate: true , canDelete: true , alcance: "todos" },
    SupervisorRole:  { canCreate: true , canRead: true , canUpdate: true , canDelete: false, alcance: "responsable" },
    TrabajadorRole:  { canCreate: true , canRead: true , canUpdate: false, canDelete: false, alcance: "propios" }
  },

  Variables: {
    "UUID":              { type: "Hidden_UUID", required: true,  isFilter: false },

    // ── Qué pasó ──
    "Fecha_Evento":      { type: "Date", required: true,  isFilter: true,  label: "Fecha del evento" },
    "Hora_Evento":       { type: "Text", required: false, isFilter: false, label: "Hora" },
    "Tipo_Evento":       { type: "Enum", required: true,  isFilter: true,  label: "Tipo de evento",
                           acceptedValues: [
                             "Cuasi accidente",
                             "Incidente peligroso",
                             "Accidente sin tiempo perdido",
                             "Accidente con tiempo perdido",
                             "Enfermedad ocupacional"
                           ], allowOtherValues: false },
    "Gravedad":          { type: "Enum", required: true,  isFilter: true,  label: "Gravedad",
                           acceptedValues: ["Leve", "Grave", "Mortal"], allowOtherValues: false },
    // Distinción clásica de Flash Report: lo ocurrido vs. lo que pudo pasar.
    // Es lo que prioriza la investigación de un cuasi accidente frente a otro.
    "Severidad_Potencial": { type: "Enum", required: false, isFilter: true, label: "Severidad potencial (si hubiera sido peor)",
                           acceptedValues: ["Leve", "Grave", "Mortal"], allowOtherValues: false },
    "Area":              { type: "Enum", required: true,  isFilter: true,  label: "Área",
                           acceptedValues: [
                             "Operaciones", "Mantenimiento", "Almacén", "Logística",
                             "Producción", "Administración", "Obra / Campo", "Laboratorio"
                           ], allowOtherValues: true },
    "Lugar_Exacto":      { type: "Text", required: false, isFilter: false, label: "Lugar exacto" },
    "Descripcion":       { type: "Text", required: true,  isFilter: false, label: "Descripción de lo ocurrido" },

    // ── A quién ── (DNI siempre Text: preserva ceros a la izquierda)
    "Trabajador_DNI":    { type: "REF",  required: false, isFilter: false, label: "Trabajador afectado",
                           relationalDataOrigin: "01_Usuarios" },
    "Nombre_Trabajador": { type: "Text", required: false, isFilter: true,  label: "Nombre del afectado" },
    "Puesto":            { type: "Text", required: false, isFilter: false, label: "Puesto" },
    "Parte_Afectada":    { type: "Enum", required: false, isFilter: false, label: "Parte del cuerpo afectada",
                           acceptedValues: [
                             "No aplica", "Cabeza", "Ojos", "Rostro", "Cuello", "Tronco / espalda",
                             "Brazos", "Manos / dedos", "Piernas", "Pies", "Órganos internos", "Múltiples"
                           ], allowOtherValues: false },
    "Dias_Descanso":     { type: "Text", required: false, isFilter: false, label: "Días de descanso médico",
                         control: "number", min: 0, max: 999, step: 1 },
    "Testigos":          { type: "Text", required: false, isFilter: false, label: "Testigos" },
    "Tipo_Personal":     { type: "Enum", required: false, isFilter: true,  label: "Tipo de personal involucrado",
                           acceptedValues: ["Personal propio", "Contratista", "Visita / Tercero"],
                           allowOtherValues: false },

    // ── Respuesta inmediata (Flash Report: se reporta ANTES de cerrar la investigación) ──
    "Acciones_Inmediatas": { type: "Text", required: false, isFilter: false, label: "Acciones inmediatas tomadas" },
    "Equipo_Involucrado":  { type: "Text", required: false, isFilter: false, label: "Equipo / maquinaria involucrada" },
    "Costo_Estimado_Danos":{ type: "Text", required: false, isFilter: false, label: "Costo estimado de daños materiales (S/)",
                         control: "number", min: 0, step: 0.01 },
    "Requiere_Notificacion_Autoridad": { type: "Enum", required: false, isFilter: true,
                           label: "¿Requiere notificación a la autoridad?",
                           acceptedValues: ["Sí", "No", "Pendiente de evaluar"], allowOtherValues: false },
    "Notificados":        { type: "Text", required: false, isFilter: false, label: "Notificado a (nombres, cargos, hora)" },

    // ── Por qué pasó ── (el análisis que evita la repetición)
    "Causa_Inmediata":   { type: "Text", required: false, isFilter: false, label: "Causa inmediata" },
    "Causa_Basica":      { type: "Text", required: false, isFilter: false, label: "Causa básica" },
    "Categoria_Causa":   { type: "Enum", required: false, isFilter: true,  label: "Categoría de causa raíz",
                           acceptedValues: [
                             "Factor personal", "Factor del trabajo", "Método / procedimiento",
                             "Equipo / herramienta", "Entorno / condiciones", "Gestión / supervisión"
                           ], allowOtherValues: false },

    // ── Seguimiento ──
    "Estado":            { type: "Enum", required: true,  isFilter: true,  label: "Estado",
                           acceptedValues: ["Reportado", "En investigación", "Con acciones abiertas", "Cerrado"],
                           allowOtherValues: false },
    "Investigador_DNI":  { type: "REF",  required: false, isFilter: false, label: "Investigador responsable",
                           relationalDataOrigin: "01_Usuarios",
                           slice: { column: "Rol", value: "Supervisor" } },
    "Fecha_Cierre":      { type: "Date", required: false, isFilter: false, label: "Fecha de cierre" },

    // ── Evidencia (Skill 11: cada archivo lleva su _ID y _Path) ──
    "Evidencia_Fotos":   { type: "Image_Collection", required: false, isFilter: false, label: "Evidencia fotográfica" },
    "Evidencia_Fotos_ID":   { type: "Hidden", required: false },
    "Evidencia_Fotos_Path": { type: "Hidden", required: false },

    "Firma_Investigador":      { type: "Signature", required: false, isFilter: false, label: "Firma del investigador" },
    "Firma_Investigador_ID":   { type: "Hidden", required: false },
    "Firma_Investigador_Path": { type: "Hidden", required: false },

    "Reportado_Por":     { type: "Text", required: false, isFilter: false, label: "Reportado por" },
    "Fecha_Registro":    { type: "Hidden", required: false }
  },

  Vistas: {
    Subtitulo: "Registro, investigación y cierre",
    Resumen: {
      etiquetaCrear: "Reportar", ordenPor: "Fecha_Evento",
      columnas: [
        { campo: "Fecha_Evento", sub: "Hora_Evento", etiqueta: "Fecha / Hora" },
        { campo: "Tipo_Evento", etiqueta: "Tipo" },
        { campo: "Gravedad", tipo: "badge" },
        { campo: "Nombre_Trabajador", sub: "Area", etiqueta: "Afectado / Área" },
        { campo: "Estado", tipo: "badge" }
      ],
      vacio: { icono: "personal_injury", titulo: "Sin incidentes registrados",
               mensaje: "Que no haya registros no significa que no haya ocurrido nada: reportar es el primer control.",
               accion: "Reportar incidente" }
    },
    Edicion: {
      tituloNuevo: "Reportar Incidente", tituloEditar: "Editar Incidente",
      secciones: [
        { titulo: "Qué pasó y cuándo", icono: "event",
          campos: ["Fecha_Evento", "Hora_Evento", "Tipo_Evento", "Gravedad", "Severidad_Potencial", "Area", "Lugar_Exacto", "Descripcion"] },
        { titulo: "Persona afectada", icono: "person",
          campos: ["Trabajador_DNI", "Nombre_Trabajador", "Puesto", "Tipo_Personal", "Parte_Afectada", "Dias_Descanso", "Testigos"] },
        { titulo: "Respuesta inmediata", icono: "emergency",
          campos: ["Acciones_Inmediatas", "Equipo_Involucrado", "Costo_Estimado_Danos", "Requiere_Notificacion_Autoridad", "Notificados"] },
        { titulo: "Investigación", icono: "search",
          campos: ["Causa_Inmediata", "Causa_Basica", "Categoria_Causa", "Estado", "Investigador_DNI", "Fecha_Cierre"] },
        { titulo: "Evidencia", icono: "photo_camera",
          campos: ["Evidencia_Fotos", "Firma_Investigador"] }
      ]
    },
    Detalle: {
      titulo: "Tipo_Evento", subtitulo: ["Area", "Fecha_Evento"],
      secciones: [
        { titulo: "El evento",
          campos: ["Fecha_Evento", "Hora_Evento", "Tipo_Evento", "Gravedad", "Severidad_Potencial", "Area", "Lugar_Exacto"] },
        { titulo: "Descripción", campos: ["Descripcion"] },
        { titulo: "Persona afectada",
          campos: ["Nombre_Trabajador", "Trabajador_DNI", "Puesto", "Tipo_Personal", "Parte_Afectada", "Dias_Descanso", "Testigos"] },
        { titulo: "Respuesta y notificación",
          campos: ["Acciones_Inmediatas", "Equipo_Involucrado", "Costo_Estimado_Danos", "Requiere_Notificacion_Autoridad", "Notificados"] },
        { titulo: "Investigación",
          campos: ["Causa_Inmediata", "Causa_Basica", "Categoria_Causa", "Estado", "Investigador_DNI", "Fecha_Cierre"] }
      ]
    },
    Hijos: { titulo: "Acciones correctivas", icono: "task_alt",
             vacio: "Un incidente sin acciones correctivas se repite.",
             vacioDetalle: "Este incidente todavía no tiene acciones correctivas." },
    Badges: {
      Gravedad: { "Leve":  { tono: "warn", icono: "info" },
                  "Grave": { tono: "bad",  icono: "priority_high" },
                  "Mortal":{ tono: "crit", icono: "dangerous" } },
      Estado: { "Reportado":           { tono: "warn", icono: "flag" },
                "En investigación":    { tono: "info", icono: "search" },
                "Con acciones abiertas":{ tono: "warn", icono: "pending_actions" },
                "Cerrado":             { tono: "ok",   icono: "task_alt" } }
    }
  },
};

window.MOTOR_HOOKS = window.MOTOR_HOOKS || {};

MOTOR_HOOKS["05_Incidentes"] = {
  resumen: function () {
    MOTOR_RENDER.kpis("05_Incidentes", [
      { tono: "mute", etiqueta: "Este mes",
        cond: { Fecha_Evento: { gte: "@mes", lt: "@mes+1" } } },
      { tono: "warn", etiqueta: "Sin cerrar", cond: { Estado: { neq: "Cerrado" } } },
      { tono: "bad",  etiqueta: "Graves o mortales", cond: { Gravedad: { in: ["Grave", "Mortal"] } } },
      // Dias sin accidentes con tiempo perdido: el indicador que la gente mira.
      // Es la fecha MAS RECIENTE de ese tipo de evento, y la pide la base con
      // max(): depende justamente del registro mas antiguo que importa, que es
      // lo que una tabla paginada nunca tendria cargado.
      { tono: "ok", etiqueta: "Días sin acc. c/ tiempo perdido",
        metrica: "max", campo: "Fecha_Evento", filtrable: false,
        cond: { Tipo_Evento: { like: "tiempo perdido" } },
        formato: function (ultima) {
          if (!ultima) return "—";
          const f = new Date(ultima), hoy = new Date(PWA_SKILLS.getPeruTime(false));
          if (isNaN(f)) return "—";
          return String(Math.max(0, Math.round((hoy - f) / 86400000)));
        } }
    ]);
  },
  edicion: function (ctx) {
    if (!ctx.nuevo) return;
    const hora = ctx.root.querySelector("#m05-incidentes-f-Hora_Evento");
    if (hora && !hora.value) hora.value = PWA_SKILLS.getPeruTime(true).slice(11, 16);
    const estado = ctx.root.querySelector("#m05-incidentes-f-Estado");
    if (estado && !estado.value) estado.value = "Reportado";
    const quien = ctx.root.querySelector("#m05-incidentes-f-Reportado_Por");
    if (quien && !quien.value) quien.value = (AppState.User || {}).DNI || "";
  },
  /** Un evento mortal o con tiempo perdido no se cierra sin investigación */
  antesDeGuardar: function (ctx) {
    const d = ctx.datos;
    if ((d.Gravedad === "Mortal" || /tiempo perdido/i.test(d.Tipo_Evento || "")) &&
        d.Estado === "Cerrado" && !String(d.Causa_Basica || "").trim()) {
      PWA_SKILLS.toast("Un evento de esta gravedad no se cierra sin causa básica registrada.", "error", 5000);
      return false;
    }
    return true;
  }
};
</script>
