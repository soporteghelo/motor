<!-- =========================================================================
     VISTA: EDICIÓN — MÓDULO 10_Charlas
     Anotar la charla no debe tomar más que darla: todo viene prellenado.
     ========================================================================= -->
<div id="module-10_charlas-edicion" class="module-view" style="display:none;">

  <section class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 border-b border-outline-variant pb-4">
    <div class="flex items-center gap-4">
      <button onclick="changeInternalView('10_Charlas','Resumen')" aria-label="Volver al listado"
        class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors text-secondary">
        <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
      </button>
      <div>
        <h1 class="text-xl font-bold text-on-surface" id="chl-form-titulo">Registrar Charla</h1>
        <p class="text-[11px] text-secondary font-medium">Complete los campos obligatorios (*)</p>
      </div>
    </div>
    <div class="flex gap-2">
      <button onclick="chlGuardarBorrador()" class="h-9 px-4 rounded-lg border border-outline text-xs font-semibold text-secondary hover:bg-slate-50 transition-colors">
        Borrador
      </button>
      <button onclick="chlGuardar()" class="h-9 px-6 rounded-lg bg-primary text-on-primary text-xs font-bold shadow-md hover:opacity-90 transition-all flex items-center gap-2">
        <span class="material-symbols-outlined text-[18px]" aria-hidden="true">save</span>
        Guardar
      </button>
    </div>
  </section>

  <input type="hidden" id="chl-uuid" value="">
  <div class="max-w-4xl mx-auto space-y-6">

    <!-- 1. Tema -->
    <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-sm">
      <h2 class="text-sm font-bold text-primary flex items-center gap-2 mb-4">
        <span class="material-symbols-outlined text-lg" aria-hidden="true">campaign</span>Tema de la charla
      </h2>

      <!-- Temas de un toque: evita escribir lo mismo cada día -->
      <p class="text-[10px] font-black uppercase tracking-wider text-secondary mb-2">Sugerencias</p>
      <div class="flex flex-wrap gap-1.5 mb-4" id="chl-sugerencias"></div>

      <div class="grid grid-cols-2 gap-x-3 gap-y-4 md:gap-x-5 md:gap-y-5">
        <div class="col-span-2">
          <label class="block text-xs font-bold text-secondary mb-2" for="chl-tema">Tema *</label>
          <input type="text" id="chl-tema" placeholder="Escribe el tema o toca una sugerencia"
            class="w-full h-11 px-4 rounded-xl border border-outline-variant bg-surface-container-low text-sm focus:border-primary outline-none">
        </div>
        <div class="col-span-2">
          <label class="block text-xs font-bold text-secondary mb-2" for="chl-categoria">Categoría</label>
          <select id="chl-categoria" class="w-full h-11 px-4 rounded-xl border border-outline-variant bg-surface-container-low text-sm focus:border-primary outline-none">
            <option value="">Seleccione…</option>
            <option>Riesgos del día</option><option>Orden y limpieza</option>
            <option>Uso de EPP</option><option>Manejo manual de cargas</option>
            <option>Herramientas manuales</option><option>Riesgo eléctrico</option>
            <option>Trabajo en altura</option><option>Vehículos y tránsito</option>
            <option>Salud ocupacional</option><option>Emergencias</option>
            <option>Lecciones aprendidas</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 2. Cuándo y dónde -->
    <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-sm">
      <h2 class="text-sm font-bold text-secondary flex items-center gap-2 mb-5">
        <span class="material-symbols-outlined text-lg" aria-hidden="true">event</span>Cuándo y dónde
      </h2>
      <div class="grid grid-cols-2 gap-x-3 gap-y-4 md:gap-x-5 md:gap-y-5">
        <div>
          <label class="block text-xs font-bold text-secondary mb-2" for="chl-fecha">Fecha *</label>
          <input type="date" id="chl-fecha"
            class="w-full h-11 px-4 rounded-xl border border-outline-variant bg-surface-container-low text-sm focus:border-primary outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-secondary mb-2" for="chl-hora">Hora</label>
          <input type="time" id="chl-hora"
            class="w-full h-11 px-4 rounded-xl border border-outline-variant bg-surface-container-low text-sm focus:border-primary outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-secondary mb-2" for="chl-turno">Turno *</label>
          <select id="chl-turno" class="w-full h-11 px-4 rounded-xl border border-outline-variant bg-surface-container-low text-sm focus:border-primary outline-none">
            <option>Día</option><option>Tarde</option><option>Noche</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-secondary mb-2" for="chl-area">Área *</label>
          <select id="chl-area" class="w-full h-11 px-4 rounded-xl border border-outline-variant bg-surface-container-low text-sm focus:border-primary outline-none">
            <option value="">Seleccione…</option>
            <option>Operaciones</option><option>Mantenimiento</option><option>Almacén</option>
            <option>Logística</option><option>Producción</option><option>Administración</option>
            <option>Obra / Campo</option><option>Laboratorio</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-secondary mb-2" for="chl-lugar">Lugar</label>
          <input type="text" id="chl-lugar" class="w-full h-11 px-4 rounded-xl border border-outline-variant bg-surface-container-low text-sm focus:border-primary outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-secondary mb-2" for="chl-duracion">Duración (min)</label>
          <input type="number" min="1" id="chl-duracion" placeholder="5"
            class="w-full h-11 px-4 rounded-xl border border-outline-variant bg-surface-container-low text-sm focus:border-primary outline-none">
        </div>
        <div class="col-span-2">
          <label class="block text-xs font-bold text-secondary mb-2" for="chl-expositor-sel">Expositor</label>
          <select id="chl-expositor-sel" onchange="chlAutoExpositor()"
            class="w-full h-11 px-4 rounded-xl border border-outline-variant bg-surface-container-low text-sm focus:border-primary outline-none">
            <option value="">Cargando…</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 3. Asistentes -->
    <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-sm">
      <div class="flex justify-between items-center mb-4 gap-3 flex-wrap">
        <h2 class="text-sm font-bold text-primary flex items-center gap-2">
          <span class="material-symbols-outlined text-lg" aria-hidden="true">groups</span>Asistentes
          <span class="text-[10px] font-bold text-secondary" id="chl-conteo"></span>
        </h2>
        <div class="flex gap-2">
          <button onclick="chlAgregarVarios()"
            class="h-9 px-3 rounded-lg border border-outline-variant text-[10px] font-bold text-primary hover:bg-primary/5 transition-all flex items-center gap-1 uppercase whitespace-nowrap">
            <span class="material-symbols-outlined text-sm" aria-hidden="true">library_add</span>Agregar 5
          </button>
          <button onclick="chlAgregarAsistente()"
            class="h-9 px-3 rounded-lg bg-secondary text-on-secondary text-[10px] font-bold hover:opacity-90 transition-all flex items-center gap-1 uppercase whitespace-nowrap">
            <span class="material-symbols-outlined text-sm" aria-hidden="true">person_add</span>Agregar
          </button>
        </div>
      </div>
      <div id="chl-asistentes" class="space-y-3">
        <div class="text-center py-6 border border-dashed border-outline-variant rounded-xl text-secondary text-[11px]" id="chl-asistentes-vacio">
          Sin lista de asistencia la charla no queda documentada.
        </div>
      </div>
    </div>

    <!-- 4. Contenido y evidencia -->
    <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-sm">
      <h2 class="text-sm font-bold text-on-surface flex items-center gap-2 mb-5">
        <span class="material-symbols-outlined text-lg" aria-hidden="true">edit_note</span>Contenido y evidencia
      </h2>
      <div class="space-y-5">
        <div>
          <label class="block text-xs font-bold text-secondary mb-2" for="chl-puntos">Puntos tratados</label>
          <textarea id="chl-puntos" rows="3" placeholder="Qué se explicó y qué ejemplos se usaron"
            class="w-full p-4 rounded-xl border border-outline-variant bg-surface-container-low text-sm focus:border-primary outline-none resize-none"></textarea>
        </div>
        <div>
          <label class="block text-xs font-bold text-secondary mb-2" for="chl-compromisos">Compromisos asumidos</label>
          <input type="text" id="chl-compromisos" placeholder="Acuerdos concretos del equipo"
            class="w-full h-11 px-4 rounded-xl border border-outline-variant bg-surface-container-low text-sm focus:border-primary outline-none">
        </div>
        <div class="grid grid-cols-2 gap-x-3 gap-y-4 md:gap-x-5">
          <div>
            <label class="block text-xs font-bold text-secondary mb-2" for="chl-estado">Estado *</label>
            <select id="chl-estado" class="w-full h-11 px-4 rounded-xl border border-outline-variant bg-surface-container-low text-sm focus:border-primary outline-none">
              <option>Ejecutada</option><option>Programada</option><option>No realizada</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-secondary mb-3">Registro fotográfico</label>
          <div class="flex items-center gap-3 flex-wrap">
            <button type="button" onclick="document.getElementById('chl-file').click()" aria-label="Agregar foto de la charla"
              class="w-20 h-20 rounded-xl border-2 border-dashed border-outline-variant bg-surface flex flex-col items-center justify-center cursor-pointer hover:bg-surface-container transition-all text-secondary">
              <span class="material-symbols-outlined text-2xl" aria-hidden="true">add_a_photo</span>
              <span class="text-[9px] font-bold mt-0.5 uppercase">Foto</span>
            </button>
            <input type="file" id="chl-file" accept="image/*" multiple style="display:none;" onchange="chlSubirFotos(this)">
            <div id="chl-fotos-preview" class="flex gap-2 flex-wrap"></div>
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-secondary mb-2">Firma del expositor</label>
          <canvas id="chl-firma" class="w-full max-w-lg h-36 bg-surface-container-low rounded-xl border border-outline-variant cursor-crosshair"></canvas>
          <button onclick="PWA_SKILLS.clearSignature('chl-firma')" class="mt-2 text-[11px] font-bold text-secondary hover:text-error transition-colors uppercase flex items-center gap-1.5">
            <span class="material-symbols-outlined text-sm" aria-hidden="true">history</span>Limpiar firma
          </button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
/** Temas de un toque */
function chlPintarSugerencias() {
  const cont = document.querySelector('#main-container #chl-sugerencias');
  if (!cont) return;
  cont.innerHTML = (SUBCONFIG_10_CHARLAS.TemasSugeridos || []).map(t =>
    '<button type="button" onclick="chlUsarTema(this)" data-tema="' +
    t.replace(/"/g, '&quot;') + '" ' +
    'class="px-2.5 py-1.5 rounded-lg border border-outline-variant bg-surface-container-low text-[11px] font-semibold ' +
    'text-on-surface hover:border-primary hover:bg-primary/5 transition-colors min-h-[34px]">' + t + '</button>').join('');
}

function chlUsarTema(btn) {
  const t = btn.getAttribute('data-tema');
  const campo = document.getElementById('chl-tema');
  if (campo) { campo.value = t; campo.focus(); }
  PWA_SKILLS.toast('Tema seleccionado.', 'success', 1600);
}

function chlAutoExpositor() {
  const sel = document.getElementById('chl-expositor-sel');
  const opt = sel.options[sel.selectedIndex];
  window._chlExpositorNombre = (opt && opt.value) ? opt.textContent.trim() : '';
}

function chlAgregarAsistente(valores) {
  const vacio = document.querySelector('#main-container #chl-asistentes-vacio');
  if (vacio) vacio.remove();
  PWA_SKILLS.addDynamicRow('chl-asistentes', SUBCONFIG_10_CHARLAS.Config_Modular.Relational_Fields, valores);
  chlActualizarConteo();
}

/** Alta en bloque: una cuadrilla son 5-15 personas, no una */
function chlAgregarVarios() {
  for (let i = 0; i < 5; i++) chlAgregarAsistente();
  PWA_SKILLS.toast('5 filas agregadas.', 'info', 1800);
}

function chlActualizarConteo() {
  const n = document.querySelectorAll('#main-container #chl-asistentes [id^="row-"]').length;
  const e = document.querySelector('#main-container #chl-conteo');
  if (e) e.textContent = n ? '· ' + n + ' persona(s)' : '';
}

function chlSubirFotos(input) {
  const cont = document.getElementById('chl-fotos-preview');
  if (!cont || !input.files) return;
  window._chlFotos = window._chlFotos || [];
  Array.from(input.files).slice(0, 5).forEach(file => {
    PWA_SKILLS.compressImage(file, (AppState.Settings || {}).CalidadCompresion || 'Medio').then(dataUrl => {
      window._chlFotos.push(dataUrl);
      const d = document.createElement('div');
      d.className = 'w-20 h-20 rounded-xl border border-outline-variant overflow-hidden relative';
      d.innerHTML = '<img src="' + dataUrl + '" class="w-full h-full object-cover" alt="Registro de la charla">';
      cont.appendChild(d);
    });
  });
}

function chlRecolectar() {
  const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
  const campo = document.getElementById('chl-uuid');
  if (!campo.value) {
    campo.value = (typeof pseudoGenerateUUID === 'function') ? pseudoGenerateUUID() : String(Date.now());
  }

  const hijos = [];
  document.querySelectorAll('#main-container #chl-asistentes [id^="row-"]').forEach(fila => {
    const o = { PARENT_UUID: campo.value };
    fila.querySelectorAll('input[name], select[name]').forEach(el => { o[el.name] = el.value; });
    if (o.DNI || o.Nombre) hijos.push(o);   // se descartan las filas vacías del alta en bloque
  });

  const datos = {
    UUID:             campo.value,
    Tema:             val('chl-tema'),
    Categoria:        val('chl-categoria'),
    Fecha:            val('chl-fecha'),
    Hora:             val('chl-hora'),
    Turno:            val('chl-turno') || 'Día',
    Area:             val('chl-area'),
    Lugar:            val('chl-lugar'),
    Duracion_Min:     val('chl-duracion') || '5',
    Expositor_DNI:    val('chl-expositor-sel'),
    Expositor:        window._chlExpositorNombre || (AppState.User || {}).Nombre || '',
    Puntos_Tratados:  val('chl-puntos'),
    Compromisos:      val('chl-compromisos'),
    Estado:           val('chl-estado') || 'Ejecutada',
    Total_Asistentes: String(hijos.length),
    Registrado_Por:   (AppState.User || {}).Nombre || '',
    Fecha_Registro:   PWA_SKILLS.getPeruTime()
  };

  const firma = document.getElementById('chl-firma');
  if (firma) {
    const blanco = document.createElement('canvas');
    blanco.width = firma.width; blanco.height = firma.height;
    if (firma.toDataURL() !== blanco.toDataURL()) datos.Firma_Expositor = firma.toDataURL('image/png');
  }
  if (window._chlFotos && window._chlFotos.length) datos.Foto_Charla = window._chlFotos.join(',');

  return { datos: datos, hijos: hijos };
}

function chlGuardarBorrador() {
  const { datos, hijos } = chlRecolectar();
  localStorage.setItem('draft_10_Charlas', JSON.stringify({ datos: datos, hijos: hijos }));
  PWA_SKILLS.toast('Borrador guardado en este dispositivo.', 'success', 2800);
}

async function chlGuardar() {
  const { datos, hijos } = chlRecolectar();

  const faltan = [];
  if (!datos.Tema)  faltan.push(['chl-tema', 'el tema']);
  if (!datos.Fecha) faltan.push(['chl-fecha', 'la fecha']);
  if (!datos.Area)  faltan.push(['chl-area', 'el área']);

  if (faltan.length) {
    const [id, que] = faltan[0];
    const el = document.getElementById(id);
    if (el) { el.scrollIntoView({ block:'center', behavior:'smooth' }); if (el.focus) el.focus(); }
    PWA_SKILLS.toast('Falta ' + que + (faltan.length > 1 ? ' y ' + (faltan.length - 1) + ' campo(s) más.' : '.'), 'error', 4200);
    return;
  }

  if (datos.Estado === 'Ejecutada' && !hijos.length) {
    if (!confirm('No registraste asistentes. Sin lista de asistencia la charla no queda documentada. ¿Guardar igual?')) {
      return;
    }
  }

  try {
    await pushToQueue('10_Charlas', 'SYNC_OFFLINE_QUEUE', datos, hijos);
    localStorage.removeItem('draft_10_Charlas');
    window._chlFotos = [];
    PWA_SKILLS.toast('Charla registrada con ' + hijos.length + ' asistente(s).', 'success', 3400);
    changeInternalView('10_Charlas', 'Resumen');
  } catch (err) {
    console.error('Error al guardar la charla:', err);
    PWA_SKILLS.toast('No se pudo guardar. Vuelve a intentarlo.', 'error', 5000);
  }
}

async function loadEdicion_10_Charlas(uuid) {
  window._chlFotos = [];
  window._chlExpositorNombre = '';
  chlPintarSugerencias();
  await PWA_SKILLS.loadRelationalOptions('chl-expositor-sel', '01_Usuarios', 'Nombre_Completo', 'DNI');
  setTimeout(() => PWA_SKILLS.initSignaturePad('chl-firma'), 150);

  const campo  = document.getElementById('chl-uuid');
  const titulo = document.getElementById('chl-form-titulo');

  if (uuid && uuid !== 'CURRENT') {
    const r = (window._chlData || []).find(x => String(x.UUID) === String(uuid));
    if (r) {
      if (titulo) titulo.textContent = 'Editar Charla';
      campo.value = r.UUID;
      const set = (id, v) => { const e = document.getElementById(id); if (e) e.value = v || ''; };
      set('chl-tema', r.Tema);            set('chl-categoria', r.Categoria);
      set('chl-fecha', r.Fecha);          set('chl-hora', r.Hora);
      set('chl-turno', r.Turno);          set('chl-area', r.Area);
      set('chl-lugar', r.Lugar);          set('chl-duracion', r.Duracion_Min);
      set('chl-puntos', r.Puntos_Tratados); set('chl-compromisos', r.Compromisos);
      set('chl-estado', r.Estado);          set('chl-expositor-sel', r.Expositor_DNI);
      window._chlExpositorNombre = r.Expositor || '';

      // Los asistentes no vienen en el listado (READ_DB solo trae el padre):
      // sin pedirlos aparte, guardar sin querer los borraba.
      const cont = document.querySelector('#main-container #chl-asistentes');
      if (cont) cont.innerHTML = '';
      const asistentes = await DataService.readChildren('10_Charlas', r.UUID);
      asistentes.forEach(a => chlAgregarAsistente(a));
      chlActualizarConteo();
      return;
    }
  }

  if (titulo) titulo.textContent = 'Registrar Charla';
  campo.value = (typeof pseudoGenerateUUID === 'function') ? pseudoGenerateUUID() : String(Date.now());

  // Fecha y hora prellenadas: la charla se anota justo después de darla
  const f = document.getElementById('chl-fecha');
  if (f && !f.value) f.value = PWA_SKILLS.getPeruTime(false);
  const h = document.getElementById('chl-hora');
  if (h && !h.value) h.value = PWA_SKILLS.getPeruTime(true).slice(11, 16);
  const t = document.getElementById('chl-turno');
  if (t) {
    const hora = parseInt(PWA_SKILLS.getPeruTime(true).slice(11, 13), 10);
    t.value = hora < 13 ? 'Día' : hora < 20 ? 'Tarde' : 'Noche';
  }
  chlActualizarConteo();
}
</script>
