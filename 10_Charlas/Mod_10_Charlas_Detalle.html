<!-- =========================================================================
     VISTA: DETALLE — MÓDULO 10_Charlas
     ========================================================================= -->
<div id="module-10_charlas-detalle" class="module-view" style="display:none;">

  <header class="flex justify-between items-start w-full mb-6 gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <button onclick="changeInternalView('10_Charlas','Resumen')" aria-label="Volver al listado"
        class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white transition-colors text-secondary border border-outline-variant shrink-0">
        <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
      </button>
      <div class="min-w-0">
        <h1 id="chl-det-titulo" class="text-lg font-black text-on-surface tracking-tight">Cargando…</h1>
        <div class="flex items-center gap-2 mt-1 flex-wrap" id="chl-det-badges"></div>
      </div>
    </div>
    <div class="flex flex-col gap-1.5 items-end shrink-0">
      <button onclick="changeInternalView('10_Charlas','Edicion', window._chlDetalleUUID)"
        class="h-7 px-3 rounded-lg bg-primary text-on-primary text-[9px] font-bold shadow-sm hover:opacity-90 transition-all flex items-center justify-center gap-1.5 whitespace-nowrap">
        <span class="material-symbols-outlined text-[14px]" aria-hidden="true">edit</span>Editar
      </button>
      <button onclick="PDF_TEMPLATE.exportarRegistro('10_Charlas', window._chlDetalleUUID, 'Charla ' + window._chlDetalleUUID)"
        class="h-7 px-3 rounded-lg border border-outline-variant bg-white text-[9px] font-bold text-on-surface hover:bg-slate-50 transition-all flex items-center justify-center gap-1.5 whitespace-nowrap">
        <span class="material-symbols-outlined text-[14px]" aria-hidden="true">picture_as_pdf</span>PDF
      </button>
    </div>
  </header>

  <div class="max-w-4xl mx-auto space-y-5">

    <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-sm">
      <h2 class="text-[11px] font-black text-secondary uppercase tracking-widest mb-4 border-b border-outline-variant pb-2">Datos de la charla</h2>
      <div class="grid grid-cols-2 gap-x-4 gap-y-4" id="chl-det-datos"></div>
    </div>

    <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-sm" id="chl-det-contenido-wrap">
      <h2 class="text-[11px] font-black text-secondary uppercase tracking-widest mb-3 border-b border-outline-variant pb-2">Puntos tratados</h2>
      <p class="text-[13px] text-on-surface leading-relaxed mb-4" id="chl-det-puntos">—</p>
      <h2 class="text-[11px] font-black text-secondary uppercase tracking-widest mb-2">Compromisos</h2>
      <p class="text-[13px] text-on-surface leading-relaxed" id="chl-det-compromisos">—</p>
    </div>

    <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-sm">
      <div class="flex items-center justify-between mb-4 border-b border-outline-variant pb-2 gap-2">
        <h2 class="text-[11px] font-black text-secondary uppercase tracking-widest">Asistentes</h2>
        <span class="text-[10px] font-bold text-on-surface-variant" id="chl-det-conteo"></span>
      </div>
      <div id="chl-det-asistentes"></div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-sm">
        <h2 class="text-[11px] font-black text-secondary uppercase tracking-widest mb-4 border-b border-outline-variant pb-2">Registro fotográfico</h2>
        <div id="chl-det-fotos" class="min-h-[6rem] bg-surface-container-low rounded-xl border border-dashed border-outline-variant flex items-center justify-center overflow-hidden"></div>
      </div>
      <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-sm">
        <h2 class="text-[11px] font-black text-secondary uppercase tracking-widest mb-4 border-b border-outline-variant pb-2">Firma del expositor</h2>
        <div id="chl-det-firma" class="min-h-[6rem] bg-surface-container-low rounded-xl border border-dashed border-outline-variant flex items-center justify-center overflow-hidden"></div>
      </div>
    </div>

  </div>
</div>

<script>
function chlDetCampo(etiqueta, valor, ancho) {
  return '<div class="' + (ancho || '') + '">' +
    '<p class="text-[10px] font-black text-secondary uppercase tracking-widest mb-1">' + etiqueta + '</p>' +
    '<p class="text-[13px] font-semibold text-on-surface">' + (valor || '—') + '</p></div>';
}

async function loadDetail_10_Charlas(uuid) {
  window._chlDetalleUUID = uuid;
  const tit = document.querySelector('#main-container #chl-det-titulo');
  if (tit) tit.textContent = 'Cargando…';

  let datos = window._chlData || [];
  if (!datos.length) {
    try { datos = JSON.parse(localStorage.getItem('refdata_10_Charlas')) || []; } catch (e) {}
  }
  let r = datos.find(x => String(x.UUID) === String(uuid));

  if (!r) {
    try {
      const res = await DataService.read('10_Charlas');
      if (res && res.status === 'OK' && Array.isArray(res.payload)) {
        window._chlData = res.payload;
        r = res.payload.find(x => String(x.UUID) === String(uuid));
      }
    } catch (e) { /* se resuelve abajo */ }
  }

  if (!r) {
    if (tit) tit.textContent = 'Charla no encontrada';
    PWA_SKILLS.toast('No se pudo cargar la charla ' + uuid + '.', 'error', 4000);
    return;
  }

  if (tit) tit.textContent = r.Tema || 'Charla de 5 minutos';

  const badges = document.querySelector('#main-container #chl-det-badges');
  if (badges) {
    badges.innerHTML =
      (typeof chlTurnoBadge === 'function' ? chlTurnoBadge(r.Turno) : '') +
      '<span class="text-[10px] text-secondary font-semibold">' + (r.Area || '') +
      (r.Fecha ? ' · ' + r.Fecha : '') + '</span>';
  }

  const cont = document.querySelector('#main-container #chl-det-datos');
  if (cont) cont.innerHTML =
    chlDetCampo('Fecha', r.Fecha) +
    chlDetCampo('Hora', r.Hora) +
    chlDetCampo('Turno', r.Turno) +
    chlDetCampo('Área', r.Area) +
    chlDetCampo('Lugar', r.Lugar) +
    chlDetCampo('Duración', r.Duracion_Min ? r.Duracion_Min + ' min' : '—') +
    chlDetCampo('Expositor', r.Expositor) +
    chlDetCampo('Categoría', r.Categoria) +
    chlDetCampo('Estado', r.Estado);

  const puntos = document.querySelector('#main-container #chl-det-puntos');
  if (puntos) puntos.textContent = r.Puntos_Tratados || '—';
  const comp = document.querySelector('#main-container #chl-det-compromisos');
  if (comp) comp.textContent = r.Compromisos || '—';

  const lista  = document.querySelector('#main-container #chl-det-asistentes');
  const conteo = document.querySelector('#main-container #chl-det-conteo');
  const asistentes = r._asistentes || [];
  if (conteo) conteo.textContent = asistentes.length ? asistentes.length + ' persona(s)' : '';

  if (lista) {
    if (!asistentes.length) {
      lista.innerHTML = '<div class="ds-empty" role="status">' +
        '<span class="material-symbols-outlined ds-empty-icon" aria-hidden="true">group_off</span>' +
        '<h4>Sin lista de asistencia</h4>' +
        '<p>Sin asistentes la charla no queda documentada ante una fiscalización.</p>' +
        '<button type="button" class="ds-empty-action" onclick="changeInternalView(\'10_Charlas\',\'Edicion\',\'' + r.UUID + '\')">' +
        '<span class="material-symbols-outlined text-[16px]" aria-hidden="true">person_add</span>Agregar asistentes</button></div>';
    } else {
      lista.innerHTML = '<div class="grid grid-cols-1 sm:grid-cols-2 gap-2">' + asistentes.map(a =>
        '<div class="flex items-center gap-2.5 p-2 rounded-xl border border-outline-variant bg-surface-container-low">' +
        '<span class="w-7 h-7 rounded-lg bg-primary-fixed text-on-primary-fixed flex items-center justify-center text-[10px] font-black shrink-0">' +
        String(a.Nombre || '?').trim().charAt(0).toUpperCase() + '</span>' +
        '<div class="min-w-0 flex-1">' +
        '<p class="text-[12px] font-semibold text-on-surface truncate">' + (a.Nombre || '—') + '</p>' +
        '<p class="text-[10px] text-secondary">' + (a.DNI || '') + (a.Area_Asis ? ' · ' + a.Area_Asis : '') + '</p>' +
        '</div></div>').join('') + '</div>';
    }
  }

  PWA_SKILLS.renderDriveMedia(r.Foto_Charla || '',     'Foto_Charla',     'chl-det-fotos');
  PWA_SKILLS.renderDriveMedia(r.Firma_Expositor || '', 'Firma_Expositor', 'chl-det-firma');
}
</script>
