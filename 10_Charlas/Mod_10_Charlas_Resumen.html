<!-- =========================================================================
     VISTA: RESUMEN — MÓDULO 10_Charlas
     Lo importante no es el histórico sino la cobertura de HOY.
     ========================================================================= -->
<div id="module-10_charlas-resumen" class="module-view">

  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
    <div class="flex items-center gap-3">
      <button onclick="showView('Menu')" aria-label="Volver al menú principal"
        class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors text-secondary border border-outline-variant shrink-0">
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">arrow_back</span>
      </button>
      <div>
        <h2 class="font-h2 text-h2 text-on-surface leading-tight">Charlas de 5 Minutos</h2>
        <p class="text-[11px] text-on-surface-variant">Cobertura diaria por área y turno</p>
      </div>
    </div>
    <div class="flex items-center gap-2 w-full sm:w-auto">
      <span id="ui-result-count" class="text-[10px] font-bold text-on-surface-variant mr-auto sm:mr-1 hidden"></span>
      <div class="relative" id="chl-export-wrap">
        <button onclick="document.getElementById('chl-export-menu').classList.toggle('hidden')"
          class="flex items-center gap-1.5 px-3 h-9 border border-outline-variant text-[12px] font-bold text-primary rounded-lg hover:bg-surface-container transition-colors shadow-sm whitespace-nowrap">
          <span class="material-symbols-outlined text-[16px]" aria-hidden="true">download</span>Exportar
          <span class="material-symbols-outlined text-[13px] opacity-60" aria-hidden="true">expand_more</span>
        </button>
        <div id="chl-export-menu" class="hidden absolute right-0 top-full mt-1.5 w-44 bg-white rounded-xl border border-outline-variant shadow-xl z-50 overflow-hidden">
          <button onclick="PWA_SKILLS.exportFilteredToExcel(); document.getElementById('chl-export-menu').classList.add('hidden')"
            class="w-full flex items-center gap-2.5 px-4 py-3 text-[12px] font-semibold text-on-surface hover:bg-surface-container-low transition-colors">
            <span class="material-symbols-outlined text-[17px] text-green-600" aria-hidden="true">grid_on</span>Excel (.xlsx)
          </button>
          <button onclick="PWA_SKILLS.exportVisibleToCSV('Charlas'); document.getElementById('chl-export-menu').classList.add('hidden')"
            class="w-full flex items-center gap-2.5 px-4 py-3 text-[12px] font-semibold text-on-surface hover:bg-surface-container-low transition-colors border-t border-outline-variant/30">
            <span class="material-symbols-outlined text-[17px] text-blue-600" aria-hidden="true">text_snippet</span>CSV (.csv)
          </button>
        </div>
      </div>
      <button onclick="changeInternalView('10_Charlas', 'Edicion')"
        class="flex items-center gap-1.5 px-3 h-9 bg-primary text-on-primary rounded-lg text-[12px] font-bold hover:opacity-90 transition-all shadow-sm whitespace-nowrap">
        <span class="material-symbols-outlined text-[16px]" aria-hidden="true">add</span>Registrar
      </button>
    </div>
  </div>

  <!-- Tablero de cobertura de hoy: lo primero que mira un supervisor -->
  <div class="bg-white rounded-2xl border border-outline-variant p-4 shadow-sm mb-4">
    <div class="flex items-center justify-between mb-3 gap-2 flex-wrap">
      <h3 class="text-[11px] font-black text-on-surface uppercase tracking-wider flex items-center gap-1.5">
        <span class="material-symbols-outlined text-[15px] text-primary" aria-hidden="true">today</span>
        Cobertura de hoy
      </h3>
      <span class="text-[10px] font-bold text-on-surface-variant" id="chl-cobertura-resumen">—</span>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2" id="chl-cobertura"></div>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
    <button type="button" onclick="chlFiltrarHoy()"
      class="bg-emerald-50 border border-emerald-200 rounded-2xl p-3 shadow-sm text-left hover:shadow-md transition-all">
      <p class="text-[9px] font-black text-emerald-700 uppercase tracking-widest mb-1">Charlas de hoy</p>
      <p class="text-2xl font-black text-emerald-700" id="chl-kpi-hoy">—</p>
    </button>
    <div class="bg-red-50 border border-red-200 rounded-2xl p-3 shadow-sm">
      <p class="text-[9px] font-black text-red-700 uppercase tracking-widest mb-1">Áreas sin charla</p>
      <p class="text-2xl font-black text-red-700" id="chl-kpi-sincharla">—</p>
    </div>
    <div class="bg-surface-container-lowest rounded-2xl border border-outline-variant p-3 shadow-sm">
      <p class="text-[9px] font-black text-on-surface-variant uppercase tracking-widest mb-1">Este mes</p>
      <p class="text-2xl font-black text-on-surface" id="chl-kpi-mes">—</p>
    </div>
    <div class="bg-surface-container-lowest rounded-2xl border border-outline-variant p-3 shadow-sm">
      <p class="text-[9px] font-black text-on-surface-variant uppercase tracking-widest mb-1">Asistencias</p>
      <p class="text-2xl font-black text-on-surface" id="chl-kpi-asistencias">—</p>
    </div>
  </div>

  <div id="ui-search-bar-slot"></div>

  <div class="bg-white rounded-2xl border border-outline-variant shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse" id="charlas-table">
        <thead>
          <tr class="bg-surface-container-low text-on-surface-variant text-[11px] font-black uppercase tracking-wider">
            <th class="px-3 py-2.5">Tema</th>
            <th class="px-3 py-2.5">Fecha / Hora</th>
            <th class="px-3 py-2.5">Área</th>
            <th class="px-3 py-2.5">Turno</th>
            <th class="px-3 py-2.5">Expositor</th>
            <th class="px-3 py-2.5">Asistentes</th>
            <th class="px-3 py-2.5 text-center" data-nosort>Gestión</th>
          </tr>
        </thead>
        <tbody id="charlas-table-body" class="divide-y divide-outline-variant/40"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
function chlHoy() {
  // Fecha local en GMT-5, no UTC: a las 19:00 de Perú UTC ya es otro día
  return PWA_SKILLS.getPeruTime(false);
}

function chlTurnoBadge(t) {
  const m = { 'Día':'bg-amber-100 text-amber-800', 'Tarde':'bg-orange-100 text-orange-800', 'Noche':'bg-indigo-100 text-indigo-700' };
  const ico = { 'Día':'light_mode', 'Tarde':'wb_twilight', 'Noche':'dark_mode' };
  return '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold whitespace-nowrap ' +
         (m[t] || 'bg-surface-variant text-secondary') + '">' +
         '<span class="material-symbols-outlined text-[11px]" aria-hidden="true">' + (ico[t] || 'schedule') + '</span>' + (t || '—') + '</span>';
}

/**
 * Tablero de cobertura: una tarjeta por área que debe tener charla diaria.
 * Verde = dada hoy; roja = la cuadrilla empezó sin charla.
 */
function chlRenderCobertura(data) {
  const cont = document.querySelector('#main-container #chl-cobertura');
  if (!cont) return;
  const hoy = chlHoy();
  const areas = SUBCONFIG_10_CHARLAS.AreasConCobertura || [];
  const deHoy = data.filter(r => r.Fecha === hoy && r.Estado === 'Ejecutada');

  let cubiertas = 0;
  cont.innerHTML = areas.map(a => {
    const charlas = deHoy.filter(r => r.Area === a);
    const ok = charlas.length > 0;
    if (ok) cubiertas++;
    const turnos = [...new Set(charlas.map(c => c.Turno))].join(', ');
    return '<button type="button" onclick="chlFiltrarArea(\'' + a.replace(/'/g, "\\'") + '\')" ' +
      'class="text-left p-2.5 rounded-xl border transition-all hover:shadow-md ' +
      (ok ? 'bg-emerald-50 border-emerald-200' : 'bg-red-50 border-red-200') + '">' +
      '<div class="flex items-center gap-1.5 mb-1">' +
      '<span class="material-symbols-outlined text-[14px] ' + (ok ? 'text-emerald-700' : 'text-red-700') + '" aria-hidden="true">' +
      (ok ? 'check_circle' : 'cancel') + '</span>' +
      '<span class="text-[10px] font-black ' + (ok ? 'text-emerald-800' : 'text-red-800') + ' truncate">' + a + '</span></div>' +
      '<p class="text-[9px] ' + (ok ? 'text-emerald-700' : 'text-red-700') + '">' +
      (ok ? charlas.length + ' charla(s)' + (turnos ? ' · ' + turnos : '') : 'Sin charla hoy') + '</p></button>';
  }).join('');

  const res = document.querySelector('#main-container #chl-cobertura-resumen');
  if (res) {
    const pct = areas.length ? Math.round(cubiertas / areas.length * 100) : 0;
    res.textContent = cubiertas + ' de ' + areas.length + ' áreas · ' + pct + '%';
    res.className = 'text-[10px] font-bold ' + (pct === 100 ? 'text-emerald-700' : pct >= 60 ? 'text-amber-700' : 'text-red-700');
  }
  return areas.length - cubiertas;
}

function chlRenderTabla(data) {
  const tbody = document.querySelector('#main-container #charlas-table-body');
  if (!tbody) return;

  const hoy = chlHoy();
  const mesActual = hoy.slice(0, 7);
  const deHoy = data.filter(r => r.Fecha === hoy);
  const delMes = data.filter(r => String(r.Fecha || '').slice(0, 7) === mesActual);
  const asistencias = data.reduce((a, r) => a + (parseInt(r.Total_Asistentes) || 0), 0);

  const sinCharla = chlRenderCobertura(data);

  const set = (id, v) => { const e = document.querySelector('#main-container #' + id); if (e) e.textContent = v; };
  set('chl-kpi-hoy',         deHoy.length);
  set('chl-kpi-sincharla',   sinCharla != null ? sinCharla : '—');
  set('chl-kpi-mes',         delMes.length);
  set('chl-kpi-asistencias', asistencias || '—');

  if (!data.length) {
    PWA_SKILLS.showEmptyState('charlas-table-body', {
      icon: 'campaign',
      title: 'Sin charlas registradas',
      message: 'La charla de 5 minutos es el hábito más barato de sostener y el que más incidentes evita.',
      actionLabel: 'Registrar charla', actionIcon: 'add',
      onAction: "changeInternalView('10_Charlas','Edicion')"
    });
    const c = document.querySelector('#main-container #ui-result-count');
    if (c) { c.textContent = '0 registros'; c.classList.remove('hidden'); }
    return;
  }

  // Más recientes primero: es un registro diario, el histórico va detrás
  const orden = data.slice().sort((a, b) =>
    String(b.Fecha || '').localeCompare(String(a.Fecha || '')) ||
    String(b.Hora || '').localeCompare(String(a.Hora || '')));

  PWA_SKILLS.finishLoading('charlas-table-body');
  tbody.innerHTML = orden.map(r => {
    const esHoy = r.Fecha === hoy;
    return `
    <tr class="hover:bg-surface-container-low/50 transition-colors cursor-pointer"
        onclick="changeInternalView('10_Charlas','Detalle','${r.UUID}')">
      <td class="px-3 py-2">
        <div class="font-bold text-[11px] text-on-surface">${r.Tema || '—'}</div>
        <div class="text-[10px] text-secondary">${r.Categoria || ''}</div>
      </td>
      <td class="px-3 py-2">
        <div class="text-[11px] font-semibold text-on-surface tabular-nums">
          ${r.Fecha || '—'}${esHoy ? ' <span class="text-[9px] font-black text-emerald-700">HOY</span>' : ''}
        </div>
        <div class="text-[10px] text-secondary tabular-nums">${r.Hora || ''}</div>
      </td>
      <td class="px-3 py-2 text-[11px] text-on-surface-variant">${r.Area || '—'}</td>
      <td class="px-3 py-2">${chlTurnoBadge(r.Turno)}</td>
      <td class="px-3 py-2 text-[11px] text-on-surface-variant">${r.Expositor || '—'}</td>
      <td class="px-3 py-2">
        <span class="inline-flex items-center gap-1 text-[11px] font-bold text-on-surface">
          <span class="material-symbols-outlined text-[13px] text-secondary" aria-hidden="true">group</span>${r.Total_Asistentes || 0}
        </span>
      </td>
      <td class="px-3 py-2 text-center" onclick="event.stopPropagation()">
        <div class="flex items-center justify-center gap-1">
          <button onclick="changeInternalView('10_Charlas','Detalle','${r.UUID}')" aria-label="Ver la charla ${r.Tema || ''}"
            class="w-7 h-7 flex items-center justify-center rounded-lg text-primary hover:bg-primary/10 transition-colors">
            <span class="material-symbols-outlined text-[15px]" aria-hidden="true">visibility</span>
          </button>
          <button onclick="changeInternalView('10_Charlas','Edicion','${r.UUID}')" aria-label="Editar la charla ${r.Tema || ''}"
            class="w-7 h-7 flex items-center justify-center rounded-lg text-secondary hover:bg-surface-variant transition-colors">
            <span class="material-symbols-outlined text-[15px]" aria-hidden="true">edit</span>
          </button>
        </div>
      </td>
    </tr>`;
  }).join('');

  PWA_SKILLS.initSortableTable('charlas-table-body');
  PWA_SKILLS.enhanceTable('charlas-table-body');
  PWA_SKILLS.updateResultCount('charlas-table-body', 'ui-result-count');
  const c = document.querySelector('#main-container #ui-result-count');
  if (c) c.classList.remove('hidden');
}

function chlFiltrarHoy() {
  chlRenderTabla((window._chlData || []).filter(r => r.Fecha === chlHoy()));
  PWA_SKILLS.toast('Mostrando las charlas de hoy.', 'info', 3000);
}

function chlFiltrarArea(area) {
  chlRenderTabla((window._chlData || []).filter(r => r.Area === area));
  PWA_SKILLS.toast('Mostrando charlas del área ' + area + '.', 'info', 3000);
}

function loadResumen_10_Charlas() {
  PWA_SKILLS.renderSkeleton('charlas-table-body', 6);

  if (!window._chlExportListener) {
    window._chlExportListener = true;
    document.addEventListener('click', function(e) {
      const wrap = document.getElementById('chl-export-wrap');
      if (wrap && !wrap.contains(e.target)) {
        const menu = document.getElementById('chl-export-menu');
        if (menu) menu.classList.add('hidden');
      }
    });
  }

  DataService.read('10_Charlas')
    .then(res => {
      const filas = (res && res.status === 'OK' && Array.isArray(res.payload)) ? res.payload : [];
      // Alcance por rol: un trabajador no debe recibir registros ajenos.
      // El filtro del navegador es comodidad; la restricción real la
      // aplica RLS en la base de datos.
      const visibles = (typeof PERMISOS !== 'undefined')
        ? PERMISOS.filtrarDatos('10_Charlas\Mod_10_Charlas_Resumen.html', filas) : filas;
      window._chlData = visibles;
      localStorage.setItem('refdata_10_Charlas', JSON.stringify(visibles));
      chlRenderTabla(visibles);
    })
    .catch(() => {
      let cache = [];
      try { cache = JSON.parse(localStorage.getItem('refdata_10_Charlas')) || []; } catch (e) {}
      window._chlData = cache;
      if (cache.length) {
        chlRenderTabla(cache);
        PWA_SKILLS.toast('Sin conexión: mostrando los últimos datos sincronizados.', 'warning', 4000);
      } else {
        PWA_SKILLS.showEmptyState('charlas-table-body', {
          icon: 'cloud_off',
          title: 'Sin conexión',
          message: 'No se pudieron cargar las charlas y no hay copia local disponible.',
          actionLabel: 'Reintentar', actionIcon: 'refresh',
          onAction: "loadResumen_10_Charlas()"
        });
      }
    });
}
</script>
