<script>
/**
 * =========================================================================
 * SUBCONFIG — 06_Capacitaciones
 * =========================================================================
 * Registro de capacitaciones, charlas e inducciones con control de vigencia.
 *
 * POR QUÉ ESTE MÓDULO
 * Una capacitación sin fecha de vencimiento es papel mojado: lo que importa
 * operativamente no es haber capacitado, sino saber HOY quién tiene la
 * certificación caducada antes de que entre a trabajar. Por eso el módulo
 * gira alrededor de `Vigencia_Meses` → `Fecha_Vencimiento`, y la lista se
 * ordena por urgencia, no por fecha de registro.
 *
 * La tabla hija guarda la lista de asistentes con su nota: es la evidencia
 * que pide una fiscalización, y la que permite responder "¿este trabajador
 * está habilitado para esta tarea?".
 * =========================================================================
 */

var SUBCONFIG_06_CAPACITACIONES = {

  Config_Modular: {
    NombreInterno:          "06_Capacitaciones",
    // Miniatura de la tarjeta móvil: columna con la imagen (vacío = solo icono) e icono por defecto
    Card_Image:             "Registro_Firmas",
    Card_Icon:              "school",
    Titulo:                 "Capacitaciones",
    DRIVE_FOLDER_NAME:      "06_Capacitaciones_DB",
    GOOGLE_DOC_TEMPLATE_ID: "",              // se vincula desde Configuración → PDF
    EMAIL_TEMPLATE_ID:      "",
    PARENT_TABLE:           "MAIN",
    CHILD_TABLE:            "ASISTENTES",
    RELATIONAL_KEY:         "PARENT_UUID",

    // Filas dinámicas: la lista de asistencia con evaluación
    Relational_Fields: [
      { name: "DNI",       label: "DNI",       type: "text", colSpan: "md:col-span-2" },
      { name: "Nombre",    label: "Nombre",    type: "text", colSpan: "md:col-span-4" },
      { name: "Area_Asis", label: "Área",      type: "text", colSpan: "md:col-span-2" },
      { name: "Nota",      label: "Nota",      type: "number", min: 0, max: 20, step: 0.1, colSpan: "md:col-span-2" },
      { name: "Resultado", label: "Resultado", type: "text", colSpan: "md:col-span-2" }
    ],

    // Matriz de permisos por rol. El SuperAdmin (proveedor) no figura:
    // PERMISOS.matriz() le concede todo por jerarquía.
    // alcance: todos | responsable | propios  →  qué registros ve el rol
    AdminRole:       { canCreate: true , canRead: true , canUpdate: true , canDelete: true , alcance: "todos" },
    SupervisorRole:  { canCreate: true , canRead: true , canUpdate: true , canDelete: false, alcance: "responsable" },
    TrabajadorRole:  { canCreate: false, canRead: true , canUpdate: false, canDelete: false, alcance: "propios" }
  },

  Variables: {
    "UUID":               { type: "Hidden_UUID", required: true, isFilter: false },

    // ── Qué se dictó ──
    "Nombre_Capacitacion":{ type: "Text", required: true, isFilter: true, label: "Nombre de la capacitación" },
    "Tipo":               { type: "Enum", required: true, isFilter: true, label: "Tipo",
                            acceptedValues: [
                              "Inducción",
                              "Capacitación específica",
                              "Reentrenamiento",
                              "Charla de seguridad",
                              "Simulacro",
                              "Certificación externa"
                            ], allowOtherValues: false },
    "Tema":               { type: "Enum", required: true, isFilter: true, label: "Tema",
                            acceptedValues: [
                              "Inducción general",
                              "Trabajo en altura",
                              "Espacios confinados",
                              "Trabajos en caliente",
                              "Izaje y maniobras",
                              "Bloqueo y etiquetado (LOTO)",
                              "Materiales peligrosos",
                              "Riesgo eléctrico",
                              "Primeros auxilios",
                              "Lucha contra incendios",
                              "Manejo defensivo",
                              "Uso de EPP",
                              "Ergonomía",
                              "Respuesta a emergencias"
                            ], allowOtherValues: true },
    "Modalidad":          { type: "Enum", required: false, isFilter: true, label: "Modalidad",
                            acceptedValues: ["Presencial", "Virtual", "Mixta", "En el puesto"],
                            allowOtherValues: false },

    // ── Cuándo y quién ──
    "Fecha_Ejecucion":    { type: "Date", required: true,  isFilter: true,  label: "Fecha de ejecución" },
    "Duracion_Horas":     { type: "Text", required: false, isFilter: false, label: "Duración (horas)",
                         control: "number", min: 0, max: 999, step: 0.5 },
    "Instructor":         { type: "Text", required: false, isFilter: true,  label: "Instructor" },
    "Entidad":            { type: "Text", required: false, isFilter: false, label: "Entidad capacitadora" },
    "Lugar":              { type: "Text", required: false, isFilter: false, label: "Lugar" },

    // ── Vigencia: el corazón del módulo ──
    "Vigencia_Meses":     { type: "Enum", required: true,  isFilter: false, label: "Vigencia",
                            acceptedValues: ["No vence", "6", "12", "24", "36"], allowOtherValues: false },
    "Fecha_Vencimiento":  { type: "Date", required: false, isFilter: true,  label: "Vence el" },

    // ── Evaluación ──
    "Evaluacion":         { type: "Enum", required: false, isFilter: false, label: "¿Hubo evaluación?",
                            acceptedValues: ["Sí", "No"], allowOtherValues: false },
    "Nota_Minima":        { type: "Text", required: false, isFilter: false, label: "Nota mínima aprobatoria",
                         control: "number", min: 0, max: 20, step: 0.1 },

    "Estado":             { type: "Enum", required: true,  isFilter: true,  label: "Estado",
                            acceptedValues: ["Programada", "Ejecutada", "Cancelada"], allowOtherValues: false },
    "Observaciones":      { type: "Text", required: false, isFilter: false, label: "Observaciones" },

    // ── Evidencia (Skill 11: cada archivo lleva su _ID y _Path) ──
    "Registro_Firmas":      { type: "Image_Collection", required: false, isFilter: false, label: "Registro de asistencia firmado" },
    "Registro_Firmas_ID":   { type: "Hidden", required: false },
    "Registro_Firmas_Path": { type: "Hidden", required: false },

    "Material":           { type: "File", required: false, isFilter: false, label: "Material de la sesión" },
    "Material_ID":        { type: "Hidden", required: false },
    "Material_Path":      { type: "Hidden", required: false },

    "Registrado_Por":     { type: "Text",   required: false, isFilter: false, label: "Registrado por" },
    "Fecha_Registro":     { type: "Hidden", required: false }
  },

  Vistas: {
    Subtitulo: "Formación, vigencia y asistencia",
    Resumen: {
      etiquetaCrear: "Registrar", ordenPor: "Fecha_Ejecucion",
      columnas: [
        { campo: "Nombre_Capacitacion", sub: "Tema", etiqueta: "Capacitación" },
        { campo: "Tipo" },
        { campo: "Fecha_Ejecucion", etiqueta: "Ejecutada" },
        { campo: "Fecha_Vencimiento", etiqueta: "Vigencia", render: "vigencia" },
        { campo: "Instructor" },
        { campo: "Estado", tipo: "badge" }
      ],
      vacio: { icono: "school", titulo: "Sin capacitaciones registradas",
               mensaje: "La capacitación que no está registrada no existe ante una fiscalización.",
               accion: "Registrar capacitación" }
    },
    Edicion: {
      tituloNuevo: "Registrar Capacitación", tituloEditar: "Editar Capacitación",
      secciones: [
        { titulo: "Qué se dictó", icono: "school",
          campos: ["Nombre_Capacitacion", "Tipo", "Tema", "Modalidad"] },
        { titulo: "Cuándo y quién", icono: "event",
          campos: ["Fecha_Ejecucion", "Duracion_Horas", "Instructor", "Entidad", "Lugar"] },
        { titulo: "Vigencia y evaluación", icono: "verified",
          campos: ["Vigencia_Meses", "Fecha_Vencimiento", "Evaluacion", "Nota_Minima", "Estado", "Observaciones"] },
        { titulo: "Evidencia", icono: "photo_camera", campos: ["Registro_Firmas", "Material"] }
      ]
    },
    Detalle: {
      titulo: "Nombre_Capacitacion", subtitulo: ["Tema", "Fecha_Ejecucion"],
      secciones: [
        { titulo: "Datos de la capacitación",
          campos: ["Tipo", "Tema", "Modalidad", "Fecha_Ejecucion", "Duracion_Horas", "Instructor", "Entidad", "Lugar"] },
        { titulo: "Vigencia y evaluación",
          campos: ["Vigencia_Meses", "Fecha_Vencimiento", "Evaluacion", "Nota_Minima", "Estado"] },
        { titulo: "Observaciones", campos: ["Observaciones"] }
      ]
    },
    Hijos: { titulo: "Asistentes", icono: "groups",
             vacio: "Sin lista de asistencia la capacitación no queda documentada.",
             vacioDetalle: "Esta capacitación no registró asistentes." },
    Badges: {
      Estado: { "Programada": { tono: "info", icono: "schedule" },
                "Ejecutada":  { tono: "ok",   icono: "check_circle" },
                "Cancelada":  { tono: "bad",  icono: "cancel" } }
    }
  },
};

window.MOTOR_HOOKS = window.MOTOR_HOOKS || {};

MOTOR_HOOKS["06_Capacitaciones"] = {
  /** Vigencia = comparar el vencimiento con hoy; no es un campo guardado */
  estado: function (r) {
    if (!r.Fecha_Vencimiento) return { clave: "permanente", tono: "mute", texto: "Sin caducidad", dias: null };
    const venc = new Date(r.Fecha_Vencimiento);
    if (isNaN(venc)) return { clave: "permanente", tono: "mute", texto: "Sin caducidad", dias: null };
    const dias = Math.round((venc - new Date(PWA_SKILLS.getPeruTime(false))) / 86400000);
    if (dias < 0)  return { clave: "vencida",    tono: "bad",  texto: "Vencida hace " + Math.abs(dias) + " d", dias: dias };
    if (dias <= 30) return { clave: "por-vencer", tono: "warn", texto: "Vence en " + dias + " d", dias: dias };
    return { clave: "vigente", tono: "ok", texto: "Vigente", dias: dias };
  },
  columnas: {
    vigencia: function (r) {
      const v = this.estado(r);
      return '<div class="text-[11px] font-semibold" style="color:var(--st-' + v.tono + '-fg)">' + esc(v.texto) + "</div>" +
             (r.Fecha_Vencimiento ? '<div class="text-[10px] text-secondary tabular-nums">' + esc(r.Fecha_Vencimiento) + "</div>" : "");
    }
  },
  // Los mismos tres tramos que estado(), pero escritos como condiciones para
  // que los cuente la base. Una capacitacion SIN Fecha_Vencimiento no entra en
  // ninguno (es "Sin caducidad"): las desigualdades no se cumplen con un nulo.
  resumen: function () {
    MOTOR_RENDER.kpis("06_Capacitaciones", [
      { tono: "bad",  etiqueta: "Vencidas",   cond: { Fecha_Vencimiento: { lt: "@hoy" } } },
      { tono: "warn", etiqueta: "Por vencer", cond: { Fecha_Vencimiento: { gte: "@hoy", lte: "@hoy+30" } } },
      { tono: "ok",   etiqueta: "Vigentes",   cond: { Fecha_Vencimiento: { gt: "@hoy+30" } } },
      { tono: "mute", etiqueta: "Horas-hombre", metrica: "sum", campo: "Duracion_Horas",
        formato: h => h == null ? "—" : String(Math.round(parseFloat(h) || 0)) }
    ]);
  },
  /** El vencimiento se calcula solo con la fecha y los meses de vigencia */
  edicion: function (ctx) {
    const r = ctx.root;
    const fecha = r.querySelector("#m06-capacitaciones-f-Fecha_Ejecucion");
    const meses = r.querySelector("#m06-capacitaciones-f-Vigencia_Meses");
    const venc  = r.querySelector("#m06-capacitaciones-f-Fecha_Vencimiento");
    if (!fecha || !meses || !venc) return;
    const recalcular = () => {
      const n = parseInt(meses.value, 10);
      if (!fecha.value || !n) { if (meses.value === "No vence") venc.value = ""; return; }
      const f = new Date(fecha.value);
      if (isNaN(f)) return;
      f.setMonth(f.getMonth() + n);
      venc.value = f.toISOString().slice(0, 10);
    };
    if (!r.dataset.capCalc) {
      fecha.addEventListener("change", recalcular);
      meses.addEventListener("change", recalcular);
      r.dataset.capCalc = "1";
    }
    if (ctx.nuevo) {
      const estado = r.querySelector("#m06-capacitaciones-f-Estado");
      if (estado && !estado.value) estado.value = "Ejecutada";
    }
  }
};
</script>
