<!-- =========================================================================
     VISTA: DETALLE — MÓDULO 06_Capacitaciones
     ========================================================================= -->
<div id="module-06_capacitaciones-detalle" class="module-view" style="display:none;">

  <header class="flex justify-between items-start w-full mb-6 gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <button onclick="changeInternalView('06_Capacitaciones','Resumen')" aria-label="Volver al listado"
        class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white transition-colors text-secondary border border-outline-variant shrink-0">
        <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
      </button>
      <div class="min-w-0">
        <h1 id="cap-det-titulo" class="text-lg font-black text-on-surface tracking-tight">Cargando…</h1>
        <div class="flex items-center gap-2 mt-1 flex-wrap" id="cap-det-badges"></div>
      </div>
    </div>
    <div class="flex flex-col gap-1.5 items-end shrink-0">
      <button onclick="changeInternalView('06_Capacitaciones','Edicion', window._capDetalleUUID)"
        class="h-7 px-3 rounded-lg bg-primary text-on-primary text-[9px] font-bold shadow-sm hover:opacity-90 transition-all flex items-center justify-center gap-1.5 whitespace-nowrap">
        <span class="material-symbols-outlined text-[14px]" aria-hidden="true">edit</span>Editar
      </button>
      <button onclick="PDF_TEMPLATE.exportarRegistro('06_Capacitaciones', window._capDetalleUUID, 'Constancia ' + window._capDetalleUUID)"
        class="h-7 px-3 rounded-lg border border-outline-variant bg-white text-[9px] font-bold text-on-surface hover:bg-slate-50 transition-all flex items-center justify-center gap-1.5 whitespace-nowrap">
        <span class="material-symbols-outlined text-[14px]" aria-hidden="true">picture_as_pdf</span>PDF
      </button>
    </div>
  </header>

  <div class="max-w-4xl mx-auto space-y-5">

    <!-- Estado de vigencia destacado: es el dato que se consulta -->
    <div id="cap-det-vigencia" class="rounded-2xl border p-4"></div>

    <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-sm">
      <h2 class="text-[11px] font-black text-secondary uppercase tracking-widest mb-4 border-b border-outline-variant pb-2">Datos de la sesión</h2>
      <div class="grid grid-cols-2 gap-x-4 gap-y-4" id="cap-det-datos"></div>
    </div>

    <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-sm">
      <div class="flex items-center justify-between mb-4 border-b border-outline-variant pb-2 gap-2">
        <h2 class="text-[11px] font-black text-secondary uppercase tracking-widest">Asistentes</h2>
        <span class="text-[10px] font-bold text-on-surface-variant" id="cap-det-conteo"></span>
      </div>
      <div id="cap-det-asistentes"></div>
    </div>

    <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-sm">
      <h2 class="text-[11px] font-black text-secondary uppercase tracking-widest mb-4 border-b border-outline-variant pb-2">Registro de asistencia firmado</h2>
      <div id="cap-det-fotos" class="min-h-[7rem] bg-surface-container-low rounded-xl border border-dashed border-outline-variant flex items-center justify-center overflow-hidden"></div>
    </div>

    <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-sm" id="cap-det-obs-wrap">
      <h2 class="text-[11px] font-black text-secondary uppercase tracking-widest mb-3 border-b border-outline-variant pb-2">Observaciones</h2>
      <p class="text-[13px] text-on-surface leading-relaxed" id="cap-det-obs">—</p>
    </div>

  </div>
</div>

<script>
function capDetCampo(etiqueta, valor, ancho) {
  return '<div class="' + (ancho || '') + '">' +
    '<p class="text-[10px] font-black text-secondary uppercase tracking-widest mb-1">' + etiqueta + '</p>' +
    '<p class="text-[13px] font-semibold text-on-surface">' + (valor || '—') + '</p></div>';
}

async function loadDetail_06_Capacitaciones(uuid) {
  window._capDetalleUUID = uuid;
  const tit = document.querySelector('#main-container #cap-det-titulo');
  if (tit) tit.textContent = 'Cargando…';

  let datos = window._capData || [];
  if (!datos.length) {
    try { datos = JSON.parse(localStorage.getItem('refdata_06_Capacitaciones')) || []; } catch (e) {}
  }
  let r = datos.find(x => String(x.UUID) === String(uuid));

  if (!r) {
    try {
      const res = await DataService.read('06_Capacitaciones');
      if (res && res.status === 'OK' && Array.isArray(res.payload)) {
        window._capData = res.payload;
        r = res.payload.find(x => String(x.UUID) === String(uuid));
      }
    } catch (e) { /* se resuelve abajo */ }
  }

  if (!r) {
    if (tit) tit.textContent = 'Capacitación no encontrada';
    PWA_SKILLS.toast('No se pudo cargar la capacitación ' + uuid + '.', 'error', 4000);
    return;
  }

  if (tit) tit.textContent = r.Nombre_Capacitacion || 'Capacitación';

  const badges = document.querySelector('#main-container #cap-det-badges');
  if (badges) {
    badges.innerHTML =
      (typeof capTipoBadge === 'function' ? capTipoBadge(r.Tipo) : '') +
      '<span class="text-[10px] text-secondary font-semibold">' + (r.Tema || '') + '</span>';
  }

  // Panel de vigencia: verde / ámbar / rojo con el mismo criterio del listado
  const v = (typeof capVigencia === 'function') ? capVigencia(r) : { clave:'permanente', texto:'—', dias:null };
  const panel = document.querySelector('#main-container #cap-det-vigencia');
  if (panel) {
    const conf = {
      'vencida':    { borde:'border-red-200 bg-red-50',        txt:'text-red-800',     ico:'event_busy',    titulo:'Capacitación vencida' },
      'por-vencer': { borde:'border-amber-200 bg-amber-50',    txt:'text-amber-800',   ico:'schedule',      titulo:'Próxima a vencer' },
      'vigente':    { borde:'border-emerald-200 bg-emerald-50',txt:'text-emerald-800', ico:'verified',      titulo:'Vigente' },
      'permanente': { borde:'border-outline-variant bg-surface-container-low', txt:'text-on-surface', ico:'all_inclusive', titulo:'Sin caducidad' }
    }[v.clave];
    panel.className = 'rounded-2xl border p-4 ' + conf.borde;
    panel.innerHTML =
      '<div class="flex items-center gap-3">' +
      '<span class="material-symbols-outlined text-[26px] ' + conf.txt + ' shrink-0" aria-hidden="true">' + conf.ico + '</span>' +
      '<div class="min-w-0"><p class="text-[13px] font-black ' + conf.txt + '">' + conf.titulo + '</p>' +
      '<p class="text-[11px] ' + conf.txt + ' opacity-90">' +
      (r.Fecha_Vencimiento ? 'Vence el ' + r.Fecha_Vencimiento + ' · ' + v.texto : 'Esta capacitación no requiere renovación') +
      '</p></div></div>';
  }

  const cont = document.querySelector('#main-container #cap-det-datos');
  if (cont) cont.innerHTML =
    capDetCampo('Fecha de ejecución', r.Fecha_Ejecucion) +
    capDetCampo('Duración', r.Duracion_Horas ? r.Duracion_Horas + ' horas' : '—') +
    capDetCampo('Modalidad', r.Modalidad) +
    capDetCampo('Estado', r.Estado) +
    capDetCampo('Instructor', r.Instructor) +
    capDetCampo('Entidad capacitadora', r.Entidad) +
    capDetCampo('Lugar', r.Lugar) +
    capDetCampo('Evaluación', r.Evaluacion === 'Sí'
      ? 'Sí (mínimo ' + (r.Nota_Minima || '—') + ')' : 'No');

  // Lista de asistentes
  const lista = document.querySelector('#main-container #cap-det-asistentes');
  const conteo = document.querySelector('#main-container #cap-det-conteo');
  const asistentes = r._asistentes || [];
  if (conteo) conteo.textContent = asistentes.length ? asistentes.length + ' persona(s)' : '';

  if (lista) {
    if (!asistentes.length) {
      lista.innerHTML = '<div class="ds-empty" role="status">' +
        '<span class="material-symbols-outlined ds-empty-icon" aria-hidden="true">group_off</span>' +
        '<h4>Sin lista de asistencia</h4>' +
        '<p>Sin asistentes registrados esta capacitación no sirve como evidencia ante una fiscalización.</p>' +
        '<button type="button" class="ds-empty-action" onclick="changeInternalView(\'06_Capacitaciones\',\'Edicion\',\'' + r.UUID + '\')">' +
        '<span class="material-symbols-outlined text-[16px]" aria-hidden="true">person_add</span>Agregar asistentes</button></div>';
    } else {
      lista.innerHTML = '<div class="space-y-2">' + asistentes.map(a => {
        const aprobado = String(a.Resultado || '').toLowerCase().indexOf('aprob') === 0;
        return '<div class="flex items-center gap-3 p-2.5 rounded-xl border border-outline-variant bg-surface-container-low">' +
          '<span class="w-8 h-8 rounded-lg bg-primary-fixed text-on-primary-fixed flex items-center justify-center text-[11px] font-black shrink-0">' +
          String(a.Nombre || '?').trim().charAt(0).toUpperCase() + '</span>' +
          '<div class="min-w-0 flex-1">' +
          '<p class="text-[12px] font-semibold text-on-surface truncate">' + (a.Nombre || '—') + '</p>' +
          '<p class="text-[10px] text-secondary">' + (a.DNI || '') + (a.Area_Asis ? ' · ' + a.Area_Asis : '') + '</p></div>' +
          (a.Nota ? '<span class="text-[11px] font-black text-on-surface shrink-0">' + a.Nota + '</span>' : '') +
          (a.Resultado ? '<span class="text-[9px] font-black px-2 py-0.5 rounded-full shrink-0 ' +
            (aprobado ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800') + '">' + a.Resultado + '</span>' : '') +
          '</div>';
      }).join('') + '</div>';
    }
  }

  const obs = document.querySelector('#main-container #cap-det-obs');
  if (obs) obs.textContent = r.Observaciones || '—';

  PWA_SKILLS.renderDriveMedia(r.Registro_Firmas || '', 'Registro_Firmas', 'cap-det-fotos');
}
</script>
