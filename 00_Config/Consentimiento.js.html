<script>
/**
 * =========================================================================
 * CONSENTIMIENTO DE USO DE FIRMA DIGITAL — primera vez que se entra
 * =========================================================================
 * ARCHIVO: Consentimiento.js.html
 *
 * QUÉ HACE
 * La primera vez que una persona entra a la app, y solo esa vez, se le
 * muestra un asistente de tres pasos que no se puede saltar:
 *
 *   1. VERIFICAR SUS DATOS   nombre, DNI, correo, área, puesto, empresa.
 *                            Son editables: si algo está mal, lo corrige ahí
 *                            mismo y se guarda en su ficha de 01_Usuarios.
 *   2. SELFIE DE VERIFICACIÓN  con FACE_CAPTURE (cámara frontal, detección
 *                            de rostro y disparo automático). Deja constancia
 *                            de que quien firma es una persona presente.
 *   3. LEER Y FIRMAR          el texto de autorización + casilla de
 *                            aceptación + firma dibujada en pantalla.
 *
 * Al terminar se arma un PDF A4 con todo (datos, texto legal, firma, selfie,
 * folio, fecha y dispositivo) y se guarda como <EMPRESA>/<DNI>.pdf:
 *   · Apps Script → Drive:    01_Usuarios/00_Usabilidad/<EMPRESA>/<DNI>.pdf
 *   · Supabase    → Storage:  documentos/<empresa_id>/consentimientos/<DNI>.pdf
 * y en la ficha se sellan Consentimiento_Fecha / _Folio / _Path. Con la fecha
 * puesta, el asistente no vuelve a aparecer jamás para esa persona.
 *
 * POR QUÉ ASÍ
 * La app hace firmar actas, PETAR, entregas de EPP y asistencias con una
 * firma dibujada en pantalla. Sin una autorización previa y fechada, esa
 * firma no tiene respaldo documentario frente a una fiscalización. El texto
 * y el diseño del PDF vienen de PLATAFORMA_ELEARNING (src/lib/consentText.ts
 * y src/templates/consentimiento.html), para que ambas plataformas usen la
 * misma autorización.
 *
 * ALCANCE DE LA SELFIE
 * FACE_CAPTURE comprueba que hay un rostro humano bien encuadrado: NO
 * compara contra la foto de perfil. Es prueba de presencia, no identificación
 * biométrica (eso exigiría descargar modelos de reconocimiento facial).
 * =========================================================================
 */

const CONSENTIMIENTO = {

  // html2pdf (html2canvas + jsPDF en un archivo). 900 KB: se carga solo
  // cuando hay que firmar —una vez en la vida de cada cuenta—, nunca al
  // abrir la app. Versión fija + SRI, como exige la CSP del proyecto.
  CDN: 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js',
  SRI: 'sha384-Yv5O+t3uE3hunW8uyrbpPW3iw6/5/Y7HitWJBLgqfMoA36NogMmy+8wWZMpn3HWc',

  TITULO: 'Autorización de Uso de Firma Digital y Datos Biométricos',

  PARRAFOS: [
    'Autorizo de manera libre, expresa e informada a que esta aplicación capture y utilice mi firma digital (dibujada en pantalla) y una fotografía de verificación facial (selfie), con el fin de validar mi identidad en los registros de Seguridad y Salud en el Trabajo: inspecciones, reportes de actos y condiciones, incidentes, capacitaciones, matrices IPERC, permisos de trabajo (PETAR), entrega de equipos de protección personal y charlas de cinco minutos.',
    'Esta autorización tiene carácter permanente y rige para todos los usos posteriores de mi firma digital y mi fotografía dentro de la aplicación —incluidos los módulos que se incorporen en el futuro— sin necesidad de solicitar un nuevo consentimiento en cada documento, mientras mantenga vínculo con la empresa o hasta que decida revocarla por escrito ante el administrador del sistema.',
    'Declaro haber sido informado(a) de que mi firma, mi fotografía y los datos de verificación (fecha, hora y dispositivo utilizado) se almacenarán de forma segura en los sistemas de la empresa y se usarán exclusivamente para fines de control documentario y de Seguridad y Salud en el Trabajo (SST).',
    'Declaro asimismo que los datos personales mostrados en esta constancia han sido verificados por mí y son correctos, y me comprometo a informar al administrador cualquier cambio posterior.',
    'Entiendo que esta autorización es un requisito indispensable para registrar información en la aplicación.'
  ],

  CASILLA: 'He leído y acepto los términos anteriores, y autorizo el uso de mi firma digital y mi fotografía conforme a lo descrito.',

  _ocupado: false,
  _selfie: null,
  _captura: null,

  // =======================================================================
  // 1 · ¿HACE FALTA PEDIRLO?
  // =======================================================================
  /**
   * Busca en la ficha del usuario en sesión si ya firmó.
   * Ante la duda (sin red, sin datos) NO se pide: bloquear la app por una
   * lectura fallida dejaría a la gente sin poder registrar en campo.
   * @returns {Promise<boolean>}
   */
  async pendiente() {
    const yo = (typeof AppState !== 'undefined' && AppState.User) || {};
    if (!yo.DNI) return false;
    // El SuperAdmin es el proveedor del servicio, no personal de una empresa
    if (typeof PERMISOS !== 'undefined' && PERMISOS.esSuperAdmin()) return false;
    // Firmado en este dispositivo: respuesta inmediata, sin consultar
    if (localStorage.getItem('pwa_consent_' + yo.DNI)) return false;

    const ficha = await this._miFicha();
    if (!ficha) return false;                       // no se pudo leer: no se bloquea
    if (ficha.Consentimiento_Fecha) {
      localStorage.setItem('pwa_consent_' + yo.DNI, String(ficha.Consentimiento_Fecha));
      return false;
    }
    return true;
  },

  /** Ficha completa del usuario en sesión (la del directorio, no la sesión). */
  async _miFicha() {
    const yo = (typeof AppState !== 'undefined' && AppState.User) || {};
    let filas = null;
    try {
      const r = await DataService.read('01_Usuarios');
      if (r && r.status === 'OK' && Array.isArray(r.payload)) filas = r.payload;
    } catch (e) { filas = null; }
    if (!filas) {
      try { filas = JSON.parse(localStorage.getItem('refdata_01_Usuarios') || 'null'); } catch (e) { filas = null; }
    }
    if (!Array.isArray(filas)) return null;
    return filas.find(u => String(u.DNI) === String(yo.DNI)) || null;
  },

  /** Lo llama el router tras entrar al Menú. No molesta si ya está firmado. */
  async revisarAlIniciar() {
    try {
      if (document.getElementById('consent-wizard')) return;
      if (await this.pendiente()) this.abrir();
    } catch (e) { console.warn('Consentimiento: no se pudo verificar.', e); }
  },

  // =======================================================================
  // 2 · ASISTENTE
  // =======================================================================
  async abrir() {
    const ficha = (await this._miFicha()) || {};
    const yo = (typeof AppState !== 'undefined' && AppState.User) || {};
    this._datos = {
      UUID:   ficha.UUID || '',
      DNI:    ficha.DNI || yo.DNI || '',
      Nombre: ficha.Nombre_Completo || yo.Nombre || '',
      Email:  ficha.Email || yo.Email || '',
      Area:   ficha.Area || '',
      Puesto: ficha.Puesto || '',
      Empresa: ficha.Empresa || yo.EmpresaNombre || '',
      Rol:    ficha.Rol || yo.Rol || ''
    };
    this._selfie = null;
    this._paso = 1;

    const prev = document.getElementById('consent-wizard');
    if (prev) prev.remove();

    const wrap = document.createElement('div');
    wrap.id = 'consent-wizard';
    // Sin botón de cerrar y sin cierre por Escape: es un requisito de acceso,
    // no un aviso. La única salida es firmar o cerrar sesión.
    wrap.className = 'fixed inset-0 z-[10000] flex items-end sm:items-center justify-center p-0 sm:p-4';
    wrap.setAttribute('role', 'dialog');
    wrap.setAttribute('aria-modal', 'true');
    wrap.setAttribute('aria-label', this.TITULO);
    wrap.innerHTML = `
      <div class="absolute inset-0" style="background:#0e1730;opacity:.92;"></div>
      <div class="relative w-full sm:max-w-2xl bg-white rounded-t-3xl sm:rounded-3xl border border-outline-variant shadow-2xl max-h-[94vh] flex flex-col overflow-hidden">

        <div class="px-5 pt-5 pb-3 border-b border-outline-variant" style="background:linear-gradient(145deg,#0e1730 0%,#162138 60%,#1e2c4a 100%);">
          <div class="flex items-center gap-2 mb-1.5">
            <span class="material-symbols-outlined text-[18px]" style="color:#ffd53f;" aria-hidden="true">verified_user</span>
            <h2 class="text-[13px] font-black text-white leading-tight">Autorización de firma digital</h2>
          </div>
          <p class="text-[11px] text-white/70 leading-snug">Solo esta vez. Verifica tus datos y autoriza el uso de tu firma para los registros de seguridad.</p>
          <div class="flex items-center gap-1.5 mt-3" id="consent-pasos"></div>
        </div>

        <div id="consent-cuerpo" class="flex-1 overflow-y-auto p-5"></div>

        <div class="p-4 border-t border-outline-variant flex items-center gap-2 bg-surface-container-lowest">
          <button type="button" id="consent-atras" class="h-11 px-4 rounded-xl border border-outline-variant text-xs font-bold text-on-surface hover:bg-surface-container transition-colors" style="display:none;">Atrás</button>
          <button type="button" id="consent-salir" class="h-11 px-3 rounded-xl text-[11px] font-bold text-secondary hover:text-error transition-colors">Cerrar sesión</button>
          <button type="button" id="consent-siguiente" class="flex-1 h-11 px-4 rounded-xl bg-primary text-on-primary text-xs font-black hover:opacity-90 transition-all flex items-center justify-center gap-1.5">
            Continuar<span class="material-symbols-outlined text-[17px]" aria-hidden="true">arrow_forward</span>
          </button>
        </div>
      </div>`;

    document.body.appendChild(wrap);
    document.getElementById('consent-salir').addEventListener('click', () => {
      if (confirm('Para usar la aplicación necesitas autorizar el uso de tu firma. ¿Cerrar sesión?')) {
        if (typeof FACE_CAPTURE !== 'undefined') FACE_CAPTURE.detenerTodas();
        AppState.clearSession(false);
      }
    });
    document.getElementById('consent-atras').addEventListener('click', () => this._ir(this._paso - 1));
    document.getElementById('consent-siguiente').addEventListener('click', () => this._avanzar());
    this._ir(1);
  },

  _ir(paso) {
    if (paso < 1 || paso > 3) return;
    // Al salir del paso 2 se apaga la cámara: no se deja encendida de fondo
    if (this._paso === 2 && paso !== 2 && typeof FACE_CAPTURE !== 'undefined') FACE_CAPTURE.detenerTodas();
    this._paso = paso;

    const cuerpo = document.getElementById('consent-cuerpo');
    const atras  = document.getElementById('consent-atras');
    const sig    = document.getElementById('consent-siguiente');
    if (!cuerpo) return;

    document.getElementById('consent-pasos').innerHTML = [1, 2, 3].map(n => `
      <div class="flex-1 h-1.5 rounded-full" style="background:${n <= paso ? '#ffd53f' : 'rgba(255,255,255,.22)'};"></div>`).join('');

    atras.style.display = paso === 1 ? 'none' : '';
    sig.innerHTML = paso === 3
      ? 'Firmar y continuar<span class="material-symbols-outlined text-[17px]" aria-hidden="true">draw</span>'
      : 'Continuar<span class="material-symbols-outlined text-[17px]" aria-hidden="true">arrow_forward</span>';

    if (paso === 1) cuerpo.innerHTML = this._paso1();
    if (paso === 2) { cuerpo.innerHTML = this._paso2(); this._montarCamara(); }
    if (paso === 3) { cuerpo.innerHTML = this._paso3(); this._montarFirma(); }
    cuerpo.scrollTop = 0;
  },

  // ── Paso 1: verificar datos ────────────────────────────────────────────
  _paso1() {
    const d = this._datos;
    const campo = (id, etiqueta, valor, opts) => {
      opts = opts || {};
      return `
      <div${opts.ancho ? ' class="col-span-2"' : ''}>
        <label for="${esc(id)}" class="block text-[10px] font-black text-secondary uppercase tracking-widest mb-1.5">${esc(etiqueta)}${opts.bloqueado ? '' : ''}</label>
        <input id="${esc(id)}" type="${esc(opts.tipo || 'text')}" value="${esc(valor || '')}" ${opts.bloqueado ? 'readonly' : ''}
               class="w-full h-11 px-3 rounded-xl border border-outline-variant text-sm ${opts.bloqueado ? 'bg-surface-container-low font-black text-on-surface-variant' : 'bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary'} outline-none">
        ${opts.nota ? `<p class="text-[10px] text-on-surface-variant mt-1">${esc(opts.nota)}</p>` : ''}
      </div>`;
    };
    return `
      <h3 class="text-sm font-black text-on-surface mb-1">1. Verifica tus datos</h3>
      <p class="text-[11px] text-on-surface-variant mb-4 leading-snug">
        Estos datos aparecerán en todos los documentos que firmes. Corrige lo que esté mal antes de continuar.
      </p>
      <div class="grid grid-cols-2 gap-3">
        ${campo('consent-nombre', 'Nombres y apellidos', d.Nombre, { ancho: true })}
        ${campo('consent-dni', 'DNI / usuario', d.DNI, { bloqueado: true, nota: 'Si tu DNI está mal, avisa al administrador: no se puede cambiar aquí.' })}
        ${campo('consent-empresa', 'Empresa', d.Empresa, { bloqueado: true })}
        ${campo('consent-area', 'Área', d.Area)}
        ${campo('consent-puesto', 'Puesto / cargo', d.Puesto)}
        ${campo('consent-email', 'Correo', d.Email, { tipo: 'email', ancho: true, nota: 'Si lo cambias, también cambia el correo con el que podrías recuperar tu cuenta.' })}
      </div>`;
  },

  // ── Paso 2: selfie ─────────────────────────────────────────────────────
  _paso2() {
    return `
      <h3 class="text-sm font-black text-on-surface mb-1">2. Foto de verificación</h3>
      <p class="text-[11px] text-on-surface-variant mb-4 leading-snug">
        Colócate de frente, con buena luz. La foto se toma sola cuando tu rostro esté bien encuadrado.
        Quedará en tu constancia como prueba de que firmaste tú.
      </p>
      <div id="consent-camara"></div>`;
  },

  _montarCamara() {
    const self = this;
    if (typeof FACE_CAPTURE === 'undefined') {
      document.getElementById('consent-camara').innerHTML =
        '<p class="text-[12px] text-error font-bold">No se pudo cargar la captura facial.</p>';
      return;
    }
    this._captura = FACE_CAPTURE.montar('consent-camara', {
      etiqueta: 'Verificación facial',
      // valorInicial: si volvió atrás desde el paso 3, se le muestra la foto
      // que ya tomó en vez de encender la cámara otra vez.
      valorInicial: this._selfie || null,
      onCaptura: function(dataUrl) { self._selfie = dataUrl; }
    });
  },

  // ── Paso 3: texto + casilla + firma ────────────────────────────────────
  _paso3() {
    return `
      <h3 class="text-sm font-black text-on-surface mb-1">3. Lee y firma</h3>
      <div class="rounded-xl border border-outline-variant bg-surface-container-lowest p-3 max-h-56 overflow-y-auto mb-3">
        <p class="text-[11px] font-black text-on-surface uppercase tracking-wide mb-2">${esc(this.TITULO)}</p>
        ${this.PARRAFOS.map(p => `<p class="text-[11px] leading-relaxed text-on-surface-variant mb-2 text-justify">${esc(p)}</p>`).join('')}
      </div>

      <label class="flex items-start gap-2.5 p-3 rounded-xl border border-outline-variant bg-surface-container-low cursor-pointer mb-4">
        <input type="checkbox" id="consent-acepto" class="w-5 h-5 mt-0.5 rounded border-outline-variant shrink-0">
        <span class="text-[11px] font-bold text-on-surface leading-snug">${esc(this.CASILLA)}</span>
      </label>

      <div class="flex items-center justify-between mb-1.5">
        <label class="text-[10px] font-black text-secondary uppercase tracking-widest">Tu firma <span class="text-error">*</span></label>
        <button type="button" onclick="PWA_SKILLS.clearSignature('consent-firma')"
          class="text-[10px] font-bold text-secondary hover:text-error transition-colors flex items-center gap-1">
          <span class="material-symbols-outlined text-[14px]" aria-hidden="true">ink_eraser</span>Borrar
        </button>
      </div>
      <canvas id="consent-firma" class="w-full rounded-xl border-2 border-dashed border-outline-variant bg-white touch-none" height="170"></canvas>
      <p class="text-[10px] text-on-surface-variant mt-1.5">Dibuja tu firma con el dedo o el mouse, como la harías en papel.</p>`;
  },

  _montarFirma() {
    // initSignaturePad ya ajusta el canvas a su tamaño real en pantalla
    if (typeof PWA_SKILLS !== 'undefined') PWA_SKILLS.initSignaturePad('consent-firma');
  },

  // =======================================================================
  // 3 · VALIDACIÓN Y AVANCE
  // =======================================================================
  async _avanzar() {
    if (this._ocupado) return;

    if (this._paso === 1) {
      const leer = id => (document.getElementById(id) || {}).value || '';
      const nombre = leer('consent-nombre').trim();
      const email  = leer('consent-email').trim();
      if (nombre.length < 3) { PWA_SKILLS.toast('Escribe tus nombres y apellidos completos.', 'warning'); return; }
      if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { PWA_SKILLS.toast('El correo no tiene un formato válido.', 'warning'); return; }
      this._datos.Nombre = nombre;
      this._datos.Email  = email;
      this._datos.Area   = leer('consent-area').trim();
      this._datos.Puesto = leer('consent-puesto').trim();
      this._ir(2);
      return;
    }

    if (this._paso === 2) {
      if (!this._selfie) { PWA_SKILLS.toast('Falta tu foto de verificación. Encuádrate en el óvalo o usa "Tomar foto".', 'warning', 5000); return; }
      this._ir(3);
      return;
    }

    // Paso 3: firmar de verdad
    const acepto = document.getElementById('consent-acepto');
    if (!acepto || !acepto.checked) { PWA_SKILLS.toast('Debes marcar la casilla de aceptación para continuar.', 'warning', 4500); return; }

    const canvas = document.getElementById('consent-firma');
    const vacio = document.createElement('canvas');
    vacio.width = canvas.width; vacio.height = canvas.height;
    if (canvas.toDataURL() === vacio.toDataURL()) { PWA_SKILLS.toast('Dibuja tu firma antes de continuar.', 'warning', 4000); return; }

    await this._finalizar(canvas.toDataURL('image/png'));
  },

  // =======================================================================
  // 4 · PDF + GUARDADO
  // =======================================================================
  async _finalizar(firmaDataUrl) {
    const sig = document.getElementById('consent-siguiente');
    this._ocupado = true;
    sig.disabled = true;
    const ponerEstado = txt => { sig.innerHTML = '<span class="material-symbols-outlined text-[17px] animate-spin" aria-hidden="true">progress_activity</span>' + esc(txt); };
    ponerEstado('Preparando…');

    try {
      const folio = 'CONS-' + this._datos.DNI + '-' + Date.now().toString(36).toUpperCase();
      const fecha = PWA_SKILLS.getPeruTime(true);

      ponerEstado('Generando constancia…');
      const blob = await this._generarPDF({
        datos: this._datos, firma: firmaDataUrl, selfie: this._selfie, folio, fecha
      });

      ponerEstado('Guardando…');
      const guardado = await DataService.saveConsent({
        blob,
        dni: this._datos.DNI,
        empresa: this._datos.Empresa || 'Sin empresa',
        folio
      });
      if (!guardado || guardado.status !== 'OK') {
        throw new Error((guardado && guardado.msg) || 'No se pudo guardar la constancia.');
      }

      ponerEstado('Registrando…');
      await this._sellarFicha(folio, fecha, guardado.ruta || '');

      localStorage.setItem('pwa_consent_' + this._datos.DNI, fecha);
      if (typeof FACE_CAPTURE !== 'undefined') FACE_CAPTURE.detenerTodas();

      // Se le entrega su copia: es un documento suyo, no solo del archivo
      this._descargar(blob, this._datos.DNI + '.pdf');

      const wiz = document.getElementById('consent-wizard');
      if (wiz) wiz.remove();
      PWA_SKILLS.toast('Autorización registrada. Ya puedes usar la aplicación.', 'success', 5000);

    } catch (err) {
      console.error('Consentimiento:', err);
      PWA_SKILLS.toast(err.message || 'No se pudo completar la autorización. Revisa tu conexión e inténtalo de nuevo.', 'error', 7000);
      sig.innerHTML = 'Reintentar<span class="material-symbols-outlined text-[17px]" aria-hidden="true">refresh</span>';
    } finally {
      this._ocupado = false;
      sig.disabled = false;
    }
  },

  /** Marca la ficha para no volver a pedirlo, y de paso guarda las correcciones. */
  async _sellarFicha(folio, fecha, ruta) {
    const d = this._datos;
    const fila = {
      UUID: d.UUID, DNI: d.DNI,
      Nombre_Completo: d.Nombre, Email: d.Email,
      Area: d.Area, Puesto: d.Puesto,
      Consentimiento_Fecha: fecha,
      Consentimiento_Folio: folio,
      Consentimiento_Path: ruta
    };
    // Por la cola normal: si la red se corta justo aquí, sube después y la
    // persona no se queda atrapada repitiendo el asistente (el candado local
    // ya quedó puesto en localStorage).
    if (typeof pushToQueue === 'function') await pushToQueue('01_Usuarios', 'SYNC_OFFLINE_QUEUE', fila);
    else await DataService.update('01_Usuarios', fila);
    localStorage.removeItem('refdata_01_Usuarios');
    if (AppState.User && d.Nombre) AppState.updateSession({ Nombre: d.Nombre, Email: d.Email });
  },

  _descargar(blob, nombre) {
    try {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = nombre;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    } catch (e) { /* la copia local es un extra, no bloquea nada */ }
  },

  // =======================================================================
  // 5 · PLANTILLA DEL PDF
  // =======================================================================
  /**
   * El generador de PDF lo carga PDF_TEMPLATE.cargarGenerador(), que prueba
   * primero la copia local de /vendor y solo después el CDN.
   *
   * Antes esto cargaba el CDN directamente, y la CSP del proyecto
   * (`script-src 'self' … https://cdn.jsdelivr.net`) no permite cdnjs: en
   * dist/ y dentro del APK el script quedaba bloqueado y nadie podía firmar
   * su constancia. Un solo cargador, un solo sitio donde arreglarlo.
   */
  _cargarLibreria() {
    if (window.html2pdf) return Promise.resolve(true);
    if (typeof PDF_TEMPLATE !== 'undefined' && PDF_TEMPLATE.cargarGenerador) {
      return PDF_TEMPLATE.cargarGenerador();
    }
    if (this._libPromesa) return this._libPromesa;
    const self = this;
    this._libPromesa = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = self.CDN;
      s.integrity = self.SRI;
      s.crossOrigin = 'anonymous';
      s.referrerPolicy = 'no-referrer';
      s.onload = () => resolve(!!window.html2pdf);
      s.onerror = () => reject(new Error('No se pudo cargar el generador de PDF. Revisa tu conexión.'));
      document.head.appendChild(s);
    });
    return this._libPromesa;
  },

  async _generarPDF(c) {
    await this._cargarLibreria();
    if (!window.html2pdf) throw new Error('No se pudo cargar el generador de PDF.');

    const host = document.createElement('div');
    // Fuera de la vista pero renderizado: html2canvas necesita medidas reales
    host.style.cssText = 'position:fixed;left:-10000px;top:0;width:210mm;background:#fff;z-index:-1;';
    host.innerHTML = this._html(c);
    document.body.appendChild(host);

    try {
      return await window.html2pdf().set({
        margin: 0,
        filename: c.datos.DNI + '.pdf',
        image: { type: 'jpeg', quality: 0.95 },
        html2canvas: { scale: 2, useCORS: true, logging: false, backgroundColor: '#ffffff' },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      }).from(host.firstElementChild).outputPdf('blob');
    } finally {
      host.remove();
    }
  },

  /** Dispositivo en una línea legible, para el pie de la constancia. */
  _dispositivo() {
    const ua = navigator.userAgent || '';
    let nav = 'Navegador';
    if (/Edg\//i.test(ua)) nav = 'Edge';
    else if (/OPR\//i.test(ua)) nav = 'Opera';
    else if (/Chrome\//i.test(ua)) nav = 'Chrome';
    else if (/Firefox\//i.test(ua)) nav = 'Firefox';
    else if (/Safari\//i.test(ua)) nav = 'Safari';
    let so = '';
    if (/Windows/i.test(ua)) so = 'Windows';
    else if (/Android/i.test(ua)) so = 'Android';
    else if (/iPhone|iPad|iPod/i.test(ua)) so = 'iOS';
    else if (/Mac OS/i.test(ua)) so = 'Mac';
    else if (/Linux/i.test(ua)) so = 'Linux';
    return [nav, so].filter(Boolean).join(' / ');
  },

  /**

        <td style="padding:4px 8px;color:#0f172a;font-weight:700;">${dato(valor)}</td>
      </tr>`;

    return `
<div style="width:210mm;min-height:295mm;position:relative;overflow:hidden;background:#ffffff;display:flex;flex-direction:column;font-family:Archivo,Arial,Helvetica,sans-serif;box-sizing:border-box;color:#1f2937;">

  <div style="position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#ffd53f 0%,#162138 40%,#1e2c4a 70%,#ffd53f 100%);"></div>
  <div style="position:absolute;right:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#ffd53f 0%,#162138 40%,#1e2c4a 70%,#ffd53f 100%);"></div>

  <div style="background:linear-gradient(135deg,#0e1730 0%,#162138 55%,#1e2c4a 100%);padding:7mm 14mm;">
    <div style="font-size:13pt;font-weight:800;letter-spacing:.3px;color:#ffffff;line-height:1.2;">CONSTANCIA DE AUTORIZACIÓN DE FIRMA DIGITAL</div>
    <div style="font-size:7.5pt;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#ffd53f;margin-top:3px;">Sistema de gestión de Seguridad y Salud en el Trabajo</div>
  </div>
  <div style="height:2.5px;background:linear-gradient(90deg,transparent,#ffd53f 20%,#ffe788 50%,#ffd53f 80%,transparent);"></div>

  <div style="flex:1;display:flex;flex-direction:column;padding:7mm 15mm 4mm;">

    <div style="font-size:7.5pt;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#162138;border-bottom:1.5px solid #ffd53f;padding-bottom:2px;margin-bottom:2.5mm;">Datos del trabajador</div>
    <table style="width:100%;border-collapse:collapse;font-size:9pt;margin-bottom:5mm;"><tbody>
      ${fila('Nombres y apellidos', String(d.Nombre || '').toUpperCase(), false)}
      ${fila('DNI / C.E. N°', d.DNI, true)}
      ${fila('Puesto / cargo', d.Puesto, false)}
      ${fila('Área', d.Area, true)}
      ${fila('Empresa', d.Empresa, false)}
      ${fila('Perfil en la aplicación', d.Rol, true)}
    </tbody></table>

    <div style="font-size:7.5pt;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#162138;border-bottom:1.5px solid #ffd53f;padding-bottom:2px;margin-bottom:2.5mm;">Declaración y autorización</div>
    ${parrafos}

    <div style="margin:3mm 0 5mm;padding:3mm 4mm;border:1px solid #ffd53f;background:#fffbea;border-radius:4px;">
      <p style="font-size:8.5pt;line-height:1.5;margin:0;color:#4a3a10;font-weight:700;">&#9745; ${esc(this.CASILLA)}</p>
    </div>

    <div style="display:flex;gap:9mm;margin-top:auto;align-items:flex-end;">
      <div style="flex:1;text-align:center;">
        <div style="font-size:7.5pt;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#162138;margin-bottom:2mm;">Firma del trabajador</div>
        <img src="${esc(c.firma || vacio)}" style="max-width:290px;max-height:88px;display:block;margin:0 auto 2px;">
        <div style="border-top:1.4px solid #162138;padding-top:4px;margin-top:2px;">
          <div style="font-size:8.5pt;font-weight:700;color:#0f172a;">${dato(String(d.Nombre || '').toUpperCase())}</div>
          <div style="font-size:7.5pt;color:#6b7280;">DNI: ${dato(d.DNI)}</div>
        </div>
      </div>
      <div style="width:50mm;text-align:center;flex-shrink:0;">
        <div style="width:122px;height:152px;border-radius:50% 50% 50% 50% / 42% 42% 58% 58%;border:4px solid #ffd53f;overflow:hidden;background:#eef2fa;margin:0 auto 6px;">
          <img src="${esc(c.selfie || vacio)}" style="width:100%;height:100%;object-fit:cover;">
        </div>
        <div style="font-size:6.5pt;font-weight:800;color:#162138;letter-spacing:.5px;text-transform:uppercase;">Verificación facial</div>
        <div style="font-size:6pt;color:#9ca3af;margin-top:1px;">${esc(c.fecha)}</div>
      </div>
    </div>

    <div style="text-align:center;font-size:8pt;color:#374151;margin-top:5mm;font-weight:600;">Firmado el ${esc(c.fecha)} (hora de Perú, GMT-5)</div>
  </div>

  <div style="background:linear-gradient(135deg,#0e1730 0%,#162138 100%);padding:6px 12mm;flex-shrink:0;text-align:center;position:relative;">
    <div style="position:absolute;top:0;left:0;right:0;height:2px;background:#ffd53f;"></div>
    <span style="font-size:6.2pt;color:rgba(255,255,255,.68);letter-spacing:.4px;text-transform:uppercase;font-weight:500;line-height:1.6;">
      Folio de verificación: ${esc(c.folio)}<br>
      Dispositivo: ${esc(this._dispositivo())} &middot; Documento generado por el sistema, válido sin sello ni firma manuscrita
    </span>
  </div>
</div>`;
  }
};
</script>
