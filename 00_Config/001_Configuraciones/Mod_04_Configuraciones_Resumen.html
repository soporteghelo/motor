<!-- =========================================================================
     VISTA: RESUMEN
     MODULO: 04_Configuraciones
     ========================================================================= -->
<div id="module-04_configuraciones-resumen" class="module-view" style="display:none;">

  <!-- Header -->
  <header class="flex justify-between items-center w-full mb-8">
    <div>
      <h1 class="text-2xl font-black text-primary tracking-tight">Configuraciones</h1>
      <p class="text-xs text-secondary font-medium mt-0.5">Ajustes globales de la aplicación</p>
    </div>
    <button onclick="changeInternalView('04_Configuraciones', 'Edicion')" class="h-9 px-5 rounded-xl bg-primary text-on-primary text-xs font-bold shadow-md hover:opacity-90 transition-all flex items-center gap-2">
      <span class="material-symbols-outlined text-[18px]">edit</span>
      Editar Configuración
    </button>
  </header>

  <div class="max-w-4xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6" id="config-resumen-grid">
    <!-- Se rellena por loadResumen_04_Configuraciones() -->
    <div class="lg:col-span-3 text-center py-12 text-secondary text-sm animate-pulse">Cargando configuración...</div>
  </div>

</div>

<script>
function loadResumen_04_Configuraciones() {
  const s = getAppSettings();
  const grid = document.getElementById('config-resumen-grid');
  if (!grid) return;

  const demoUsers = (() => {
    try { return JSON.parse(localStorage.getItem('pwa_demo_users') || '[]'); } catch(e) { return []; }
  })();

  const statusBadge = (val) => val === 'Activo'
    ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">Activo</span>`
    : `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-red-100 text-red-800">Inactivo</span>`;

  const row = (label, value) => `
    <div class="flex justify-between items-center py-2 border-b border-outline-variant/40 last:border-0">
      <span class="text-[11px] text-secondary font-medium">${label}</span>
      <span class="text-[11px] font-bold text-on-surface truncate max-w-[55%] text-right">${value || '—'}</span>
    </div>`;

  grid.innerHTML = `
    <!-- General -->
    <div class="bg-white rounded-2xl border border-outline-variant shadow-sm overflow-hidden">
      <div class="px-5 py-3 bg-surface-container-low border-b border-outline-variant flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-lg">info</span>
        <h2 class="text-xs font-black text-on-surface uppercase tracking-wider">General</h2>
      </div>
      <div class="px-5 py-3">
        ${row('Nombre App', s.App_Nombre)}
        ${row('Empresa', s.App_Empresa)}
        ${row('Versión', s.App_Version)}
        ${row('Logo URL', s.App_Logo_URL ? '✓ Configurado' : 'No configurado')}
      </div>
    </div>

    <!-- Apariencia -->
    <div class="bg-white rounded-2xl border border-outline-variant shadow-sm overflow-hidden">
      <div class="px-5 py-3 bg-surface-container-low border-b border-outline-variant flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-lg">palette</span>
        <h2 class="text-xs font-black text-on-surface uppercase tracking-wider">Apariencia</h2>
      </div>
      <div class="px-5 py-3">
        <div class="flex justify-between items-center py-2 border-b border-outline-variant/40">
          <span class="text-[11px] text-secondary font-medium">Color Primario</span>
          <div class="flex items-center gap-2">
            <div class="w-5 h-5 rounded-full border border-outline-variant" style="background:${s.Color_Primario}"></div>
            <span class="text-[11px] font-bold text-on-surface font-mono">${s.Color_Primario}</span>
          </div>
        </div>
        ${row('Calidad Compresión', s.Calidad_Compresion)}
      </div>
    </div>

    <!-- Sincronización y Seguridad -->
    <div class="bg-white rounded-2xl border border-outline-variant shadow-sm overflow-hidden">
      <div class="px-5 py-3 bg-surface-container-low border-b border-outline-variant flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-lg">sync</span>
        <h2 class="text-xs font-black text-on-surface uppercase tracking-wider">Sync &amp; Seguridad</h2>
      </div>
      <div class="px-5 py-3">
        ${row('Intervalo Sync', `${s.Sync_Intervalo} min`)}
        ${row('Lote Máximo', `${s.Max_Batch_Size} registros`)}
        ${row('Sesión Timeout', `${parseInt(s.Session_Timeout)/60} h`)}
      </div>
    </div>

    <!-- Módulos -->
    <div class="bg-white rounded-2xl border border-outline-variant shadow-sm overflow-hidden">
      <div class="px-5 py-3 bg-surface-container-low border-b border-outline-variant flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-lg">apps</span>
        <h2 class="text-xs font-black text-on-surface uppercase tracking-wider">Módulos Activos</h2>
      </div>
      <div class="px-5 py-3">
        <div class="flex justify-between items-center py-2 border-b border-outline-variant/40">
          <span class="text-[11px] text-secondary font-medium">Inspecciones</span>
          ${statusBadge(s.Modulo_Inspecciones)}
        </div>
        <div class="flex justify-between items-center py-2 border-b border-outline-variant/40">
          <span class="text-[11px] text-secondary font-medium">Reportes</span>
          ${statusBadge(s.Modulo_Reportes)}
        </div>
        <div class="flex justify-between items-center py-2">
          <span class="text-[11px] text-secondary font-medium">Usuarios</span>
          ${statusBadge(s.Modulo_Usuarios)}
        </div>
      </div>
    </div>

    <!-- Usuario Demo -->
    <div class="lg:col-span-2 bg-white rounded-2xl border border-outline-variant shadow-sm overflow-hidden">
      <div class="px-5 py-3 bg-primary/5 border-b border-primary/20 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-primary text-lg">key</span>
          <h2 class="text-xs font-black text-primary uppercase tracking-wider">Usuarios de Prueba (Demo)</h2>
        </div>
        <button onclick="changeInternalView('04_Configuraciones', 'Detalle', 'demo-users')" class="text-[10px] font-bold text-primary hover:underline">Gestionar →</button>
      </div>
      <div class="px-5 py-4">
        ${demoUsers.length === 0
          ? `<p class="text-xs text-secondary text-center py-4">No hay usuarios demo. Reinicialice la app.</p>`
          : demoUsers.map(u => `
            <div class="flex items-center justify-between p-3 rounded-xl bg-surface-container-low border border-outline-variant mb-2 last:mb-0">
              <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-full bg-primary flex items-center justify-center text-on-primary font-black text-sm">
                  ${u.Nombre_Completo.charAt(0)}
                </div>
                <div>
                  <p class="text-sm font-bold text-on-surface">${u.Nombre_Completo}</p>
                  <p class="text-[10px] text-secondary">DNI/Usuario: <span class="font-black font-mono text-primary">${u.DNI}</span> &nbsp;·&nbsp; Contraseña: <span class="font-black font-mono text-primary">admin123</span></p>
                </div>
              </div>
              <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-primary-container text-on-primary-container">${u.Rol}</span>
            </div>`).join('')
        }
        <div class="mt-4 p-3 rounded-xl bg-amber-50 border border-amber-200">
          <p class="text-[10px] text-amber-800 font-medium">
            <span class="font-black">Nota:</span> Estos usuarios solo funcionan en modo local/demo cuando no hay conexión al servidor de Google Apps Script.
          </p>
        </div>
      </div>
    </div>
  `;
}
</script>
