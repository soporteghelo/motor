<!-- =========================================================================
     VISTA: DETALLE (DIAGNÓSTICO DEL SISTEMA)
     MODULO: 04_Configuraciones
     ========================================================================= -->
<div id="module-04_configuraciones-detalle" class="module-view" style="display:none;">

  <!-- Header -->
  <header class="flex items-center gap-4 w-full mb-4 sm:mb-8">
    <button onclick="changeInternalView('04_Configuraciones', 'Resumen')" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 transition-colors text-secondary border border-outline-variant">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <div>
      <h1 class="text-2xl font-black text-primary tracking-tight">Diagnóstico del Sistema</h1>
      <p class="text-xs text-secondary font-medium">Estado del almacenamiento local y caché</p>
    </div>
  </header>

  <div class="max-w-3xl mx-auto space-y-4 sm:space-y-6" id="cfg-detalle-content">
    <div class="text-center py-12 text-secondary text-sm animate-pulse">Analizando sistema...</div>
  </div>

</div>

<script>
async function loadDetail_04_Configuraciones(context) {
  const container = document.getElementById('cfg-detalle-content');
  if (!container) return;

  // LocalStorage stats
  let lsUsed = 0, lsKeys = 0;
  try {
    for (let k in localStorage) {
      if (localStorage.hasOwnProperty(k)) {
        lsKeys++;
        lsUsed += ((localStorage[k].length + k.length) * 2);
      }
    }
  } catch(e) {}
  const lsKB = (lsUsed / 1024).toFixed(1);

  // IndexedDB queue count
  let queueCount = 0;
  try {
    const db = await new Promise((resolve, reject) => {
      const req = indexedDB.open('PWA_OFFLINE_DB');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    if (db.objectStoreNames.contains('sync_queue')) {
      queueCount = await new Promise(resolve => {
        const tx = db.transaction('sync_queue', 'readonly');
        const store = tx.objectStore('sync_queue');
        const countReq = store.count();
        countReq.onsuccess = () => resolve(countReq.result);
        countReq.onerror = () => resolve(0);
      });
      db.close();
    }
  } catch(e) {}

  // Session info
  const sessionExpiry = localStorage.getItem('pwa_session_expiry');
  const sessionLeft = sessionExpiry
    ? Math.max(0, Math.round((parseInt(sessionExpiry) - Date.now()) / 60000))
    : 0;

  const demoUsers = (() => {
    try { return JSON.parse(localStorage.getItem('pwa_demo_users') || '[]'); } catch(e) { return []; }
  })();

  container.innerHTML = `
    <!-- Storage Cards -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-white rounded-2xl border border-outline-variant p-4 sm:p-5 shadow-sm text-center">
        <div class="text-2xl font-black text-primary mb-1">${esc(lsKB)} KB</div>
        <div class="text-[10px] text-secondary font-bold uppercase">localStorage</div>
      </div>
      <div class="bg-white rounded-2xl border border-outline-variant p-4 sm:p-5 shadow-sm text-center">
        <div class="text-2xl font-black ${esc(queueCount > 0 ? 'text-amber-600' : 'text-emerald-600')} mb-1">${esc(queueCount)}</div>
        <div class="text-[10px] text-secondary font-bold uppercase">Cola Offline</div>
      </div>
      <div class="bg-white rounded-2xl border border-outline-variant p-4 sm:p-5 shadow-sm text-center">
        <div class="text-2xl font-black text-primary mb-1">${esc(lsKeys)}</div>
        <div class="text-[10px] text-secondary font-bold uppercase">Claves LS</div>
      </div>
      <div class="bg-white rounded-2xl border border-outline-variant p-4 sm:p-5 shadow-sm text-center">
        <div class="text-2xl font-black ${esc(sessionLeft > 30 ? 'text-emerald-600' : 'text-amber-600')} mb-1">${esc(sessionLeft)} min</div>
        <div class="text-[10px] text-secondary font-bold uppercase">Sesión restante</div>
      </div>
    </div>

    <!-- Demo Users Management -->
    <div class="bg-white rounded-2xl border border-outline-variant shadow-sm overflow-hidden">
      <div class="px-4 py-3 sm:px-6 sm:py-4 border-b border-outline-variant bg-surface-container-low flex justify-between items-center">
        <h2 class="text-sm font-bold text-on-surface flex items-center gap-2">
          <span class="material-symbols-outlined text-primary">manage_accounts</span>
          Usuarios Demo
        </h2>
        <button onclick="resetDemoUsers()" class="h-7 px-3 rounded-lg border border-outline-variant text-[10px] font-bold text-secondary hover:bg-red-50 hover:text-error hover:border-red-200 transition-all flex items-center gap-1">
          <span class="material-symbols-outlined text-sm">refresh</span>
          Reiniciar
        </button>
      </div>
      <div class="p-5">
        ${demoUsers.length === 0
          ? `<div class="text-center py-6">
               <p class="text-sm text-secondary mb-3">No hay usuarios demo almacenados.</p>
               <button onclick="resetDemoUsers()" class="h-8 px-4 rounded-lg bg-primary text-on-primary text-xs font-bold">Crear Usuario Demo</button>
             </div>`
          : `<table class="w-full text-left">
               <thead><tr class="text-[9px] font-black text-secondary uppercase border-b border-outline-variant">
                 <th class="pb-2">Usuario / DNI</th><th class="pb-2">Nombre</th><th class="pb-2">Rol</th><th class="pb-2">Estado</th>
               </tr></thead>
               <tbody class="divide-y divide-outline-variant/40">
               ${demoUsers.map(u => `
                 <tr>
                   <td class="py-2 font-black font-mono text-primary text-sm">${esc(u.DNI)}</td>
                   <td class="py-2 text-xs text-on-surface">${esc(u.Nombre_Completo)}</td>
                   <td class="py-2"><span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-primary-container text-on-primary-container">${esc(u.Rol)}</span></td>
                   <td class="py-2"><span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">${esc(u.Status)}</span></td>
                 </tr>`).join('')}
               </tbody>
             </table>
             <div class="mt-4 p-3 rounded-xl bg-surface-container-low border border-outline-variant text-center">
               <p class="text-[11px] text-secondary">Contraseña demo: <span class="font-black font-mono text-primary">admin123</span></p>
             </div>`
        }
      </div>
    </div>

    <!-- Cache Actions -->
    <div class="bg-white rounded-2xl border border-outline-variant p-4 sm:p-6 shadow-sm">
      <h2 class="text-sm font-bold text-on-surface mb-5 flex items-center gap-2">
        <span class="material-symbols-outlined text-primary">cleaning_services</span>
        Acciones de Mantenimiento
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <button onclick="clearModuleCache()" class="h-10 px-4 rounded-xl border border-outline-variant text-xs font-bold text-secondary hover:bg-surface-container transition-all flex items-center gap-2">
          <span class="material-symbols-outlined text-sm">delete_sweep</span>
          Limpiar Caché de Módulos
        </button>
        <button onclick="clearOfflineQueue()" class="h-10 px-4 rounded-xl border border-amber-200 text-xs font-bold text-amber-700 hover:bg-amber-50 transition-all flex items-center gap-2">
          <span class="material-symbols-outlined text-sm">clear_all</span>
          Vaciar Cola Offline
        </button>
        <button onclick="exportDiagnosticReport()" class="h-10 px-4 rounded-xl border border-outline-variant text-xs font-bold text-primary hover:bg-primary/5 transition-all flex items-center gap-2">
          <span class="material-symbols-outlined text-sm">download</span>
          Exportar Diagnóstico
        </button>
        <button onclick="fullSystemReset()" class="h-10 px-4 rounded-xl border border-red-200 text-xs font-bold text-error hover:bg-red-50 transition-all flex items-center gap-2">
          <span class="material-symbols-outlined text-sm">warning</span>
          Reset Completo (peligroso)
        </button>
      </div>
    </div>

    <!-- localStorage Keys -->
    <div class="bg-white rounded-2xl border border-outline-variant shadow-sm overflow-hidden">
      <div class="px-4 py-3 sm:px-6 sm:py-4 border-b border-outline-variant bg-surface-container-low">
        <h2 class="text-sm font-bold text-on-surface">Claves en localStorage</h2>
      </div>
      <div class="p-5 max-h-64 overflow-y-auto">
        <div class="space-y-1.5">
          ${Object.keys(localStorage).map(k => {
            const v = localStorage[k];
            const size = ((k.length + v.length) * 2 / 1024).toFixed(2);
            return `<div class="flex justify-between items-center text-[11px] py-1 border-b border-outline-variant/30">
              <span class="font-mono text-secondary truncate max-w-[70%]">${esc(k)}</span>
              <span class="text-[10px] font-bold text-on-surface-variant">${esc(size)} KB</span>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>
  `;
}

async function resetDemoUsers() {
  if (!confirm('¿Reiniciar el usuario demo admin? Se reemplazará el actual.')) return;
  localStorage.removeItem('pwa_demo_users');
  await seedDemoUsers();
  alert('Usuario demo recreado. DNI: admin / Contraseña: admin123');
  loadDetail_04_Configuraciones('demo-users');
}

function clearModuleCache() {
  const cacheKeys = Object.keys(localStorage).filter(k => k.startsWith('refdata_'));
  cacheKeys.forEach(k => localStorage.removeItem(k));
  alert(`${cacheKeys.length} cachés de módulo eliminados.`);
  loadDetail_04_Configuraciones();
}

async function clearOfflineQueue() {
  if (!confirm('¿Vaciar la cola offline? Los registros pendientes de sincronizar se perderán.')) return;
  try {
    const db = await new Promise((resolve, reject) => {
      const req = indexedDB.open('PWA_OFFLINE_DB');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    if (db.objectStoreNames.contains('sync_queue')) {
      const tx = db.transaction('sync_queue', 'readwrite');
      tx.objectStore('sync_queue').clear();
    }
    db.close();
    alert('Cola offline vaciada.');
    loadDetail_04_Configuraciones();
  } catch(e) {
    alert('Error al vaciar la cola: ' + e.message);
  }
}

function exportDiagnosticReport() {
  const report = {
    timestamp: new Date().toISOString(),
    localStorage: Object.keys(localStorage).reduce((acc, k) => {
      acc[k] = localStorage[k].substring(0, 200) + (localStorage[k].length > 200 ? '...' : '');
      return acc;
    }, {}),
    appState: typeof AppState !== 'undefined' ? {
      APP_NAME: AppState.APP_NAME,
      VERSION: AppState.VERSION,
      currentView: AppState.currentView,
      userDNI: AppState.User?.DNI
    } : 'no disponible'
  };
  const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `diagnostico_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function fullSystemReset() {
  if (!confirm('⚠️ ADVERTENCIA: Esto eliminará TODA la configuración, sesión y caché local. ¿Continuar?')) return;
  if (!confirm('Confirme de nuevo: ¿Está completamente seguro?')) return;
  localStorage.clear();
  indexedDB.deleteDatabase('PWA_OFFLINE_DB');
  alert('Reset completo. La página se recargará.');
  location.reload();
}
</script>
