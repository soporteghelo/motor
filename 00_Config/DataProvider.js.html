<script>
// =========================================================================
// DATA PROVIDER — Capa de abstracción de base de datos
// =========================================================================
// ARCHIVO: DataProvider.js.html
//
// CÓMO USAR:
//   Todos los módulos llaman a DataService (nunca a google.script.run directamente).
//   Para cambiar de proveedor:
//     AppState.DB_PROVIDER = 'sheets';    ← Google Sheets via Apps Script (default)
//     AppState.DB_PROVIDER = 'supabase';  ← Supabase REST API
//
// MIGRACIÓN A SUPABASE:
//   1. node tools/gen_supabase.js  (genera supabase_01_schema.sql .. 04_seed.sql)
//   2. Pega esos SQL y tools/supabase_05_login.sql en el editor de Supabase, en orden
//   3. Configura AppState.Supabase.URL y ANON_KEY en Global_Config.js.html
//   4. Cambia AppState.DB_PROVIDER a 'supabase' en Global_Config.js.html
//   5. Ejecuta node generate_preview.js y despliega
// =========================================================================


// ── SheetsProvider ── Envuelve google.script.run en Promises
const SheetsProvider = {
  _call(payload) {
    return new Promise((resolve, reject) => {
      if (typeof google === 'undefined' || !google.script) {
        reject(new Error('Google Apps Script no disponible.'));
        return;
      }
      // authSessionGuard() del backend valida este token contra la columna DNI
      // de la tabla de usuarios. Sin enviarlo, TODA acción distinta de
      // LOGIN_AUTH se rechaza con INVALID_TOKEN.
      const conSesion = Object.assign({
        userToken: (typeof AppState !== 'undefined' && AppState.User) ? AppState.User.DNI : null
      }, payload);

      google.script.run
        .withSuccessHandler(res => {
          let parsed;
          try { parsed = typeof res === 'string' ? JSON.parse(res) : res; }
          catch (e) { resolve({ status: 'ERROR', msg: 'Respuesta inválida del servidor.' }); return; }

          // Respuestas de sesión: se avisa en vez de fallar en silencio
          if (parsed && parsed.status === 'FORCE_LOGOUT') {
            if (typeof PWA_SKILLS !== 'undefined') PWA_SKILLS.toast('Acceso revocado. Vuelve a iniciar sesión.', 'error', 5000);
            if (typeof AppState !== 'undefined') setTimeout(() => AppState.clearSession(), 1200);
          } else if (parsed && parsed.status === 'INVALID_TOKEN') {
            console.warn('[Sesión] El servidor no reconoce el token:', parsed.msg);
          }
          resolve(parsed);
        })
        .withFailureHandler(err => reject(err))
        .serverRouter(JSON.stringify(conSesion));
    });
  },

  auth(dni, hash) {
    return this._call({ action: 'LOGIN_AUTH', userDNI: dni, userPassHash: hash });
  },
  read(module) {
    return this._call({ action: 'READ_DB', moduleName: module });
  },
  readDelta(module, lastSync) {
    return this._call({ action: 'READ_DELTA', moduleName: module, lastSyncDate: lastSync });
  },
  create(module, data) {
    return this.syncQueue(module, [{ action: 'INSERT', payload: data, childPayload: [] }]);
  },
  update(module, data) {
    return this.syncQueue(module, [{ action: 'UPDATE', payload: data, childPayload: [] }]);
  },
  delete(module, uuid) {
    return this.syncQueue(module, [{ action: 'DELETE', payload: { UUID: uuid }, childPayload: [] }]);
  },
  syncQueue(module, items) {
    // El backend requiere el subconfig para mapear columnas. Se busca en el scope global.
    const subKey = 'SUBCONFIG_' + module.toUpperCase().replace(/-/g, '_');
    const subconfig = (typeof window !== 'undefined' && window[subKey]) || null;

    return this._call({
      action: 'SYNC_OFFLINE_QUEUE',
      moduleName: module,
      ...(subconfig ? { subconfig } : {}),
      dataArray: items.map(i => ({ ...i.payload, _action: i.action })),
      childDataArray: items.flatMap(i => i.childPayload || [])
    });
  }
};


// ── SupabaseProvider ── Llamadas directas a Supabase PostgREST API
//
// CLAVE DE TRADUCCIÓN DE NOMBRES
// Los subconfigs usan claves PascalCase ("Fecha_Emision", "Auditor_DNI")
// porque así nacieron pensados para columnas de Sheets. Las tablas reales
// de Postgres (ver tools/supabase_01_schema.sql) son snake_case en
// minúscula. La correspondencia es, en casi todos los casos, un simple
// `.toLowerCase()` de la clave del subconfig — así que en vez de mantener
// un diccionario a mano por módulo, _aColumnas()/_aFrontend() lo derivan
// del propio subconfig (Variables / Relational_Fields) en cada llamada.
// Es la única fuente de verdad: si mañana se agrega un campo al formulario,
// el mapeo lo recoge solo.
//
// "01_Usuarios" es la excepción: su tabla no es un volcado 1:1 del
// subconfig, sino un perfil reducido enlazado a Supabase Auth (ver
// supabase_01_schema.sql). Se maneja aparte en _usuarioAFrontend/_guardarUsuario.
const SupabaseProvider = {
  get _url()  { return (AppState.Supabase || {}).URL      || ''; },
  get _key()  { return (AppState.Supabase || {}).ANON_KEY || ''; },

  _headers(extra = {}) {
    return {
      'Content-Type': 'application/json',
      'apikey': this._key,
      'Authorization': `Bearer ${(AppState.User && AppState.User.SupabaseJWT) || this._key}`,
      ...extra
    };
  },

  // '02_Reportes' → 'reportes'  (el esquema generado siempre usa snake_case)
  _table(module) {
    return String(module).replace(/^\d+_/, '').toLowerCase();
  },

  _subconfig(modulo) {
    const key = 'SUBCONFIG_' + String(modulo).toUpperCase().replace(/[^A-Z0-9_]/g, '');
    return (typeof window !== 'undefined' && window[key]) || null;
  },

  /** Nombre real de la tabla hija: '<tabla_padre>_<child_table_en_minuscula>' */
  _childTable(modulo) {
    const cfg = this._subconfig(modulo);
    const child = cfg && cfg.Config_Modular && cfg.Config_Modular.CHILD_TABLE;
    return child ? `${this._table(modulo)}_${String(child).toLowerCase()}` : null;
  },

  /** Fila de Postgres (columnas snake_case) → objeto con las claves PascalCase del subconfig */
  _aFrontend(modulo, fila) {
    const cfg = this._subconfig(modulo);
    if (!cfg || !cfg.Variables || !fila) return fila;
    const out = {};
    Object.keys(cfg.Variables).forEach(campo => {
      const col = campo.toLowerCase();
      if (fila[col] !== undefined) out[campo] = fila[col];
    });
    ['empresa_id', 'creado_por_dni', 'creado_en'].forEach(c => { if (fila[c] !== undefined) out[c] = fila[c]; });
    return out;
  },

  /** Objeto con claves PascalCase del subconfig → fila para Postgres (snake_case) */
  _aColumnas(modulo, datos) {
    const cfg = this._subconfig(modulo);
    if (!cfg || !cfg.Variables) return datos;
    const out = {};
    Object.keys(datos).forEach(campo => {
      const def = cfg.Variables[campo];
      if (!def) return;
      let valor = datos[campo];
      // Postgres rechaza '' para columnas date/timestamp (campos Date opcionales
      // dejados en blanco): sin esto, el registro entero fallaba al guardar.
      if (def.type === 'Date' && valor === '') valor = null;
      out[campo.toLowerCase()] = valor;
    });
    return out;
  },

  /** Fila hija (Postgres) → objeto con los `name` declarados en Relational_Fields */
  _hijoAFrontend(modulo, fila) {
    const campos = this._relationalFields(modulo);
    const out = {};
    campos.forEach(c => { const col = c.name.toLowerCase(); if (fila[col] !== undefined) out[c.name] = fila[col]; });
    return out;
  },

  /** Objeto de fila hija (PARENT_UUID + campos del subconfig) → fila para Postgres */
  _hijoAColumnas(modulo, datos) {
    const campos = this._relationalFields(modulo);
    const tipos = {}; campos.forEach(c => { tipos[c.name] = c.type; });
    const out = {};
    Object.keys(datos).forEach(campo => {
      if (campo !== 'PARENT_UUID' && !(campo in tipos)) return;
      let valor = datos[campo];
      // Mismo caso que _aColumnas: '' no es una fecha válida para Postgres.
      if (tipos[campo] === 'date' && valor === '') valor = null;
      out[campo.toLowerCase()] = valor;
    });
    return out;
  },

  _relationalFields(modulo) {
    const cfg = this._subconfig(modulo);
    return (cfg && cfg.Config_Modular && cfg.Config_Modular.Relational_Fields) || [];
  },

  async _fetch(path, options = {}, _reintentado) {
    const url = `${this._url}/rest/v1${path}`;
    try {
      const res = await fetch(url, {
        ...options,
        headers: { ...this._headers(), ...(options.headers || {}) }
      });
      // El JWT de sesión dura 1 hora; si expiró, se intenta renovar UNA vez
      // con el refresh_token antes de rendirse (evita cerrar sesión sola en
      // medio de un turno de campo).
      if (res.status === 401 && !_reintentado && await this._refrescarSesion()) {
        return this._fetch(path, options, true);
      }
      const body = res.status !== 204 ? await res.json().catch(() => null) : null;
      if (!res.ok) {
        const msg = (body && (body.message || body.hint || body.details)) || `HTTP ${res.status}`;
        return { status: 'ERROR', msg };
      }
      return { status: 'OK', _raw: body };
    } catch (e) {
      return { status: 'ERROR', msg: 'Error de red: ' + e.message };
    }
  },

  /** Intenta renovar el JWT de Supabase Auth. true si lo consiguió. */
  async _refrescarSesion() {
    const rt = (AppState.User || {}).SupabaseRefreshToken;
    if (!rt) return false;
    try {
      const res = await fetch(`${this._url}/auth/v1/token?grant_type=refresh_token`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: this._key },
        body: JSON.stringify({ refresh_token: rt })
      });
      if (!res.ok) return false;
      const body = await res.json();
      AppState.User.SupabaseJWT = body.access_token;
      AppState.User.SupabaseRefreshToken = body.refresh_token;
      localStorage.setItem('pwa_supabase_jwt', body.access_token);
      localStorage.setItem('pwa_supabase_refresh', body.refresh_token);
      return true;
    } catch (e) { return false; }
  },

  // ── Archivos: Supabase Storage sustituye a Google Drive ────────────────
  //
  // RUTA:  <empresa_id>/<modulo>/<uuid>/<campo>_<n>.<ext>
  // La empresa va primero porque las políticas del bucket aíslan por carpeta.
  //
  // Buckets:  evidencias (privado) · documentos (privado) · publico
  _bucketDe(tipo) {
    const t = String(tipo || '').toLowerCase();
    if (t === 'logo' || t === 'publico') return 'publico';
    if (t === 'pdf'  || t === 'file')    return 'documentos';
    return 'evidencias';                 // fotos y firmas
  },

  /** dataURL (cámara/firma) → Blob, sin librerías */
  _aBlob(dataUrl) {
    const [cab, b64] = String(dataUrl).split(',');
    const mime = (cab.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream';
    const bin  = atob(b64);
    const buf  = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    return new Blob([buf], { type: mime });
  },

  _extDe(mime) {
    return ({ 'image/jpeg':'jpg', 'image/png':'png', 'image/webp':'webp',
              'application/pdf':'pdf' })[mime] || 'bin';
  },

  /**
   * Sube un archivo y devuelve su ruta (no la URL): las URLs firmadas
   * caducan, la ruta no. Se guarda la ruta en la columna del registro.
   * @param {File|Blob|string} archivo  File, Blob o dataURL
   * @returns {Promise<{ruta:string, bucket:string}>}
   */
  async subirArchivo(modulo, uuid, campo, archivo, indice) {
    const empresa = (AppState.User || {}).EmpresaId || 'sin-empresa';
    const blob    = (typeof archivo === 'string') ? this._aBlob(archivo) : archivo;
    const bucket  = this._bucketDe(blob.type === 'application/pdf' ? 'pdf' : 'imagen');
    const ext     = (archivo && archivo.name && archivo.name.indexOf('.') !== -1)
      ? archivo.name.split('.').pop().toLowerCase()
      : this._extDe(blob.type);

    const ruta = [empresa, modulo, uuid, campo + '_' + (indice || 0) + '.' + ext].join('/');

    const res = await fetch(`${this._url}/storage/v1/object/${bucket}/${ruta}`, {
      method: 'POST',
      headers: {
        'apikey': this._key,
        'Authorization': `Bearer ${AppState.User?.SupabaseJWT || this._key}`,
        'Content-Type': blob.type || 'application/octet-stream',
        'x-upsert': 'true'
      },
      body: blob
    });

    if (!res.ok) {
      let msg = 'HTTP ' + res.status;
      try { const j = await res.json(); msg = j.message || j.error || msg; } catch (e) {}
      throw new Error('No se pudo subir ' + campo + ': ' + msg);
    }
    return { ruta, bucket };
  },

  /**
   * Sube todos los campos de archivo de un registro y sustituye su valor por
   * la ruta almacenada. Es el equivalente a processFilesForItem() de Apps
   * Script, pero del lado del cliente.
   */
  async subirArchivosDe(modulo, datos) {
    const clave = 'SUBCONFIG_' + String(modulo).toUpperCase().replace(/[^A-Z0-9_]/g, '');
    const cfg = window[clave];
    if (!cfg || !cfg.Variables) return datos;

    const salida = Object.assign({}, datos);
    const tiposArchivo = ['Image', 'Image_Collection', 'Signature', 'File'];

    for (const campo in cfg.Variables) {
      const def = cfg.Variables[campo] || {};
      if (tiposArchivo.indexOf(def.type) === -1) continue;
      const valor = salida[campo];
      if (!valor) continue;

      // Un campo puede traer varias imágenes separadas por coma
      const partes = String(valor).split(',').map(v => v.trim()).filter(Boolean);
      const rutas = [];
      for (let i = 0; i < partes.length; i++) {
        // Si ya es una ruta guardada (no un dataURL), se respeta
        if (partes[i].indexOf('data:') !== 0 && partes[i].indexOf('http') !== 0) {
          rutas.push(partes[i]); continue;
        }
        if (partes[i].indexOf('http') === 0) { rutas.push(partes[i]); continue; }
        const r = await this.subirArchivo(modulo, salida.UUID, campo, partes[i], i);
        rutas.push(r.ruta);
      }
      salida[campo]            = rutas.join(',');
      salida[campo + '_Path']  = rutas.join(',');
      salida[campo + '_ID']    = rutas[0] || '';
    }
    return salida;
  },

  /**
   * URL temporal para mostrar un archivo privado. Las vistas de Detalle la
   * usan en lugar de la URL de Drive.
   * @param {number} segundos  validez del enlace (1 hora por defecto)
   */
  async urlFirmada(ruta, bucket, segundos) {
    if (!ruta) return '';
    const b = bucket || 'evidencias';
    // Storage no cuelga de /rest/v1, así que se compone la ruta a mano
    try {
      const res = await fetch(`${this._url}/storage/v1/object/sign/${b}/${ruta}`, {
        method: 'POST',
        headers: this._headers(),
        body: JSON.stringify({ expiresIn: segundos || 3600 })
      });
      if (!res.ok) return '';
      const j = await res.json();
      return this._url + '/storage/v1' + j.signedURL;
    } catch (e) { return ''; }
  },

  /**
   * Login por DNI contra Supabase Auth.
   * Supabase identifica usuarios por email, no por DNI, así que primero se
   * resuelve el email vía la función `login_email_de_dni` (SECURITY DEFINER,
   * ver tools/supabase_05_login.sql) y luego se hace el login real — con la
   * contraseña TAL CUAL la escribió el usuario, no un hash: Supabase la
   * recibe por HTTPS y la hashea con bcrypt en su servidor, que es la
   * práctica estándar (ver handleLogin() en App_Routing.js.html).
   */
  async auth(dni, password) {
    let email;
    try {
      const rpc = await fetch(`${this._url}/rest/v1/rpc/login_email_de_dni`, {
        method: 'POST', headers: this._headers(), body: JSON.stringify({ p_dni: dni })
      });
      email = rpc.ok ? await rpc.json() : null;
    } catch (e) {
      return { status: 'ERROR', msg: 'Sin conexión con el servidor.' };
    }
    if (!email) return { status: 'ERROR', msg: 'Usuario no encontrado.' };

    let tokenBody;
    try {
      const tokenRes = await fetch(`${this._url}/auth/v1/token?grant_type=password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: this._key },
        body: JSON.stringify({ email, password })
      });
      tokenBody = await tokenRes.json().catch(() => ({}));
      if (!tokenRes.ok) {
        return { status: 'ERROR', msg: tokenBody.error_description || tokenBody.msg || 'Contraseña incorrecta.' };
      }
    } catch (e) {
      return { status: 'ERROR', msg: 'Sin conexión con el servidor.' };
    }

    // Con el JWT recién emitido, RLS ya reconoce a este usuario (id = auth.uid())
    const cabecerasSesion = { apikey: this._key, Authorization: `Bearer ${tokenBody.access_token}` };
    const perfilRes = await fetch(`${this._url}/rest/v1/usuarios?dni=eq.${encodeURIComponent(dni)}&select=*`, { headers: cabecerasSesion });
    const perfiles = await perfilRes.json().catch(() => []);
    const perfil = Array.isArray(perfiles) ? perfiles[0] : null;
    if (!perfil) return { status: 'ERROR', msg: 'Perfil de usuario no encontrado.' };

    const estado = String(perfil.status || '').toLowerCase();
    if (estado === 'cesado' || estado === 'inactivo') {
      return { status: 'CESADO', msg: 'Acceso revocado. Contacte al administrador.' };
    }

    let empresaNombre = '';
    if (perfil.empresa_id) {
      const eRes = await fetch(`${this._url}/rest/v1/empresas?id=eq.${perfil.empresa_id}&select=nombre`, { headers: cabecerasSesion });
      const eBody = await eRes.json().catch(() => []);
      empresaNombre = (eBody && eBody[0] && eBody[0].nombre) || '';
    }

    return {
      status: 'OK',
      userData: {
        UUID: perfil.id, DNI: perfil.dni, Nombre_Completo: perfil.nombre, Email: perfil.email,
        Rol: perfil.rol, Status: perfil.status,
        EmpresaId: perfil.empresa_id || null, EmpresaNombre: empresaNombre,
        SupabaseJWT: tokenBody.access_token, SupabaseRefreshToken: tokenBody.refresh_token
      }
    };
  },

  _usuarioAFrontend(fila) {
    return {
      UUID: fila.id, DNI: fila.dni, Nombre_Completo: fila.nombre, Email: fila.email,
      Rol: fila.rol, Status: fila.status, Area: fila.area, Puesto: fila.puesto,
      empresa_id: fila.empresa_id
    };
  },

  /**
   * "01_Usuarios" no admite alta desde el cliente: crear una cuenta real
   * requiere la Admin API de Supabase Auth (service_role), que nunca debe
   * exponerse al navegador. Por ahora el alta se hace con tools/seed_demo_data.js
   * o manualmente; aquí solo se permite editar el perfil de alguien que ya existe.
   */
  async _guardarUsuario(datos) {
    const existeRes = await this._fetch(`/usuarios?dni=eq.${encodeURIComponent(datos.DNI)}&select=id`);
    const fila = (existeRes.status === 'OK' && existeRes._raw && existeRes._raw[0]) || null;
    if (!fila) {
      return { status: 'ERROR', msg: 'Crear usuarios nuevos todavía no está disponible desde la app: requiere un endpoint con privilegios de servidor. Pide a soporte que dé de alta la cuenta.' };
    }
    const cambios = {};
    if (datos.Nombre_Completo !== undefined) cambios.nombre = datos.Nombre_Completo;
    if (datos.Email    !== undefined) cambios.email  = datos.Email;
    if (datos.Rol      !== undefined) cambios.rol    = String(datos.Rol).toLowerCase();
    if (datos.Status   !== undefined) cambios.status = datos.Status;
    if (datos.Area     !== undefined) cambios.area   = datos.Area;
    if (datos.Puesto   !== undefined) cambios.puesto = datos.Puesto;
    if (!Object.keys(cambios).length) return { status: 'OK', uuid: fila.id };

    const r = await this._fetch(`/usuarios?id=eq.${fila.id}`, {
      method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: JSON.stringify(cambios)
    });
    return r.status === 'OK' ? { status: 'OK', uuid: fila.id } : r;
  },

  async read(module) {
    if (module === '01_Usuarios') {
      const r = await this._fetch('/usuarios?select=*&order=creado_en.desc');
      if (r.status !== 'OK') return r;
      return { status: 'OK', payload: (r._raw || []).map(f => this._usuarioAFrontend(f)) };
    }
    // Orden por 'creado_en': es la única columna de fecha presente en TODAS
    // las tablas (a diferencia de Fecha_Emision/Fecha_Peru/etc., que varían
    // por módulo). No se leen tablas hijas aquí: tal como en Code.gs/READ_DB,
    // el listado trae solo la fila principal.
    const r = await this._fetch(`/${this._table(module)}?select=*&order=creado_en.desc`);
    if (r.status !== 'OK') return r;
    const filas = (r._raw || []).map(f => this._aFrontend(module, f));
    return { status: 'OK', payload: filas, msg: filas.length + ' registros' };
  },

  async readDelta(module, lastSync) {
    if (module === '01_Usuarios') return this.read(module);
    const ts = encodeURIComponent(lastSync);
    const r = await this._fetch(`/${this._table(module)}?creado_en=gte.${ts}&select=*&order=creado_en.asc`);
    if (r.status !== 'OK') return r;
    return { status: 'OK', payload: (r._raw || []).map(f => this._aFrontend(module, f)) };
  },

  /**
   * Filas hijas de un registro puntual. READ_DB/read() nunca las trae (por
   * diseño: el listado solo pinta la fila principal), así que el formulario
   * de Edición debe pedirlas aparte antes de reconstruir sus filas
   * dinámicas — si no, _guardar() las borra al re-sincronizar (ver abajo).
   */
  async leerHijos(modulo, parentUuid) {
    const childTable = this._childTable(modulo);
    if (!childTable || !parentUuid) return [];
    const r = await this._fetch(`/${childTable}?parent_uuid=eq.${encodeURIComponent(parentUuid)}&select=*`);
    if (r.status !== 'OK') return [];
    return (r._raw || []).map(f => this._hijoAFrontend(modulo, f));
  },

  /**
   * Guarda un registro (alta o edición: mismo camino, como en Sheets) y
   * reemplaza sus filas hijas. "Reemplazar" y no "acumular" es intencional:
   * el formulario manda el set completo de filas dinámicas vigentes — pero
   * eso solo es cierto si el formulario las cargó primero con leerHijos()
   * al editar. Si el llamador manda un array vacío porque nunca las pidió,
   * esto las borra de verdad. Toda vista de Edición con tabla hija DEBE
   * llamar a DataService.readChildren() antes de reconstruir sus filas.
   */
  async _guardar(modulo, datosCrudos, hijosCrudos) {
    if (modulo === '01_Usuarios') return this._guardarUsuario(datosCrudos);

    let datos;
    try {
      datos = await this.subirArchivosDe(modulo, datosCrudos);
    } catch (e) {
      return { status: 'ERROR', msg: e.message };
    }

    const empresaId = (AppState.User || {}).EmpresaId || null;
    const dniAutor  = (AppState.User || {}).DNI || '';

    const fila = this._aColumnas(modulo, datos);
    fila.empresa_id     = empresaId;
    fila.creado_por_dni = dniAutor;

    // Upsert por UUID: una re-sincronización del mismo registro actualiza en
    // vez de fallar por clave duplicada. OJO: como es un upsert, Postgres
    // evalúa la política RLS de UPDATE si el UUID ya existe — un rol con
    // canCreate:true pero canUpdate:false (ej. Trabajador en 02_Reportes)
    // recibirá 403 si se reintenta el mismo UUID ya guardado (offline
    // retry tras perder la respuesta de éxito). Es un caso extremo poco
    // frecuente; se prefiere sobre la alternativa (ignore-duplicates), que
    // impediría que Admin/Supervisor editen registros existentes.
    const r = await this._fetch(`/${this._table(modulo)}?on_conflict=uuid`, {
      method: 'POST',
      headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify([fila])
    });
    if (r.status !== 'OK') return r;

    const childTable = this._childTable(modulo);
    if (childTable && Array.isArray(hijosCrudos)) {
      await this._fetch(`/${childTable}?parent_uuid=eq.${encodeURIComponent(datos.UUID)}`, { method: 'DELETE' });
      if (hijosCrudos.length) {
        const filasHijas = hijosCrudos.map(h => {
          const fh = this._hijoAColumnas(modulo, h);
          fh.empresa_id  = empresaId;
          fh.parent_uuid = datos.UUID;
          return fh;
        });
        const cr = await this._fetch(`/${childTable}`, {
          method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify(filasHijas)
        });
        if (cr.status !== 'OK') return { status: 'PARTIAL', msg: 'Registro guardado; fallaron los detalles: ' + cr.msg };
      }
    }
    return { status: 'OK', uuid: datos.UUID };
  },

  create(module, data)  { return this._guardar(module, data, []); },
  update(module, data)  { return this._guardar(module, data, []); },

  async delete(module, uuid) {
    if (!uuid) return { status: 'ERROR', msg: 'UUID requerido para eliminar.' };
    const childTable = this._childTable(module);
    if (childTable) await this._fetch(`/${childTable}?parent_uuid=eq.${encodeURIComponent(uuid)}`, { method: 'DELETE' });
    const r = await this._fetch(`/${this._table(module)}?uuid=eq.${encodeURIComponent(uuid)}`, { method: 'DELETE' });
    return r.status === 'OK' ? { status: 'OK' } : r;
  },

  /** Punto de entrada real de guardado: lo usa Offline_Engine tras cada flush de la cola. */
  async syncQueue(module, items) {
    let success = 0, errors = 0;
    const mensajes = [];
    for (const item of items) {
      const r = await this._guardar(module, item.payload, item.childPayload || []);
      if (r.status === 'OK') success++;
      else { errors++; mensajes.push(r.msg); }
    }
    return {
      status: errors === 0 ? 'OK' : (success > 0 ? 'PARTIAL' : 'ERROR'),
      processed: items.length,
      success, errors,
      msg: mensajes.join('; ')
    };
  }
};


// ── DataService ── Singleton que auto-selecciona el proveedor activo
const DataService = {
  get provider() {
    const cfg = AppState.Supabase || {};
    if (AppState.DB_PROVIDER === 'supabase' && cfg.URL && cfg.ANON_KEY) {
      return SupabaseProvider;
    }
    return SheetsProvider;
  },
  auth:       (dni, hash)        => DataService.provider.auth(dni, hash),
  read:       (module)           => DataService.provider.read(module),
  readDelta:  (module, lastSync) => DataService.provider.readDelta(module, lastSync),
  create:     (module, data)     => DataService.provider.create(module, data),
  update:     (module, data)     => DataService.provider.update(module, data),
  delete:     (module, uuid)     => DataService.provider.delete(module, uuid),
  syncQueue:  (module, items)    => DataService.provider.syncQueue(module, items),
  // Sheets no tiene equivalente (Code.gs no expone "leer hijos de un padre");
  // en ese proveedor se resuelve vacío en vez de romper la vista de Edición.
  readChildren: (module, uuid)   => DataService.provider.leerHijos
    ? DataService.provider.leerHijos(module, uuid) : Promise.resolve([]),
};
</script>
