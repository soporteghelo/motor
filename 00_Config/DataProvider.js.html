<script>
// =========================================================================
// DATA PROVIDER — Capa de abstracción de base de datos
// =========================================================================
// ARCHIVO: DataProvider.js.html
//
// CÓMO USAR:
//   Todos los módulos llaman a DataService (nunca a google.script.run ni a
//   fetch directamente). Los dos proveedores exponen la MISMA interfaz:
//     auth · read · readDelta · readChildren · syncQueue · delete ·
//     resolveMedia · createUser · changePassword · saveCompanyConfig ·
//     logout · verificarConexion
//
// CAMBIAR DE BASE DE DATOS (un solo valor):
//   Global_Config.js.html → DB_PROVIDER: 'supabase' | 'appscript'
//   o en Vercel → variable DB_PROVIDER (+ APPS_SCRIPT_URL para Apps Script)
//
// SUPABASE:   npm run sql → pega tools/supabase_01..07 en el editor SQL;
//             SUPABASE_URL / SUPABASE_ANON_KEY en Vercel.
// APPS SCRIPT: npm run appscript → pega 00_Config/Code.gs en Apps Script,
//             ejecuta _CrearProyecto, implementa como aplicación web y pon
//             la URL /exec en APPS_SCRIPT_URL.
// =========================================================================


/**
 * Separa los valores de un campo de archivo. Varios archivos se guardan
 * unidos por coma, pero un dataURL LLEVA una coma ("data:image/png;base64,…"):
 * un split(',') ingenuo partía cada foto/firma en dos trozos inválidos y
 * el guardado fallaba. Un dataURL base64 no contiene más comas, así que se
 * reconoce entero y el resto se separa normal.
 */
function partirListaMedia(valor) {
  return (String(valor || '').match(/data:[^,]*,[^,]*|[^,]+/g) || [])
    .map(s => s.trim()).filter(Boolean);
}


/**
 * FILTRO_LOCAL - El MISMO lenguaje de condiciones, evaluado en memoria.
 *
 * Existe para que una condicion se escriba UNA vez y valga en los tres sitios
 * donde hay que decidir si una fila cuenta:
 *   1. Supabase  -> se traduce a PostgREST (SupabaseProvider._condicionesPG)
 *   2. Sheets    -> se traduce a filtro en Code.gs (filtrarFilas_)
 *   3. Navegador -> se evalua aqui (01_Usuarios y modo sin conexion)
 *
 * Si los tres divergen, el mismo KPI da tres numeros distintos segun donde se
 * calcule. Por eso el lenguaje es pobre a proposito:
 *
 *   cond = { Estado: { neq: 'Cerrado' }, Plazo: { lt: '@hoy' } }
 *
 * Operadores: eq neq lt lte gt gte like in nulo
 * Comodines:  '@hoy', '@hoy-30', '@hoy+7'  (fecha de Peru, GMT-5)
 */
const FILTRO_LOCAL = {
  /** Subconfig de un modulo por su NombreInterno. */
  _subconfig(modulo) {
    const key = 'SUBCONFIG_' + String(modulo).toUpperCase().replace(/[^A-Z0-9_]/g, '');
    return (typeof window !== 'undefined' && window[key]) || null;
  },

  /** Tipo de columna generado por tools/gen_supabase.js (misma regla que alli). */
  tipoColumna(campo, tipo) {
    const n = String(campo).toLowerCase(), t = String(tipo || 'text').toLowerCase();
    if (t === 'hidden_uuid' || n === 'uuid') return 'text';
    if (t === 'date' || n.indexOf('fecha') === 0) return 'date';
    if (t === 'number')  return 'numeric';
    if (t === 'boolean') return 'boolean';
    return 'text';
  },

  /**
   * Campos donde busca el termino libre: solo columnas de texto. Un ilike
   * sobre una columna date o numeric es un error de tipo en Postgres (42883),
   * no un filtro que no encuentra nada. Se excluyen archivos y contrasenas.
   */
  camposBuscables(modulo) {
    const cfg = this._subconfig(modulo);
    const vars = (cfg && cfg.Variables) || {};
    const fuera = ['Image', 'Image_Collection', 'Signature', 'File', 'Face_Photo', 'Password'];
    return Object.keys(vars).filter(c => {
      const d = vars[c] || {};
      if (fuera.indexOf(d.type) !== -1) return false;
      return this.tipoColumna(c, d.type) === 'text';
    });
  },

  /** Ahora en Peru (GMT-5) como objeto Date desplazado. */
  _ahoraPeru() { return new Date(Date.now() - 5 * 3600 * 1000); },

  /** Fecha de hoy en Peru (GMT-5) como YYYY-MM-DD. */
  hoy() { return this._ahoraPeru().toISOString().slice(0, 10); },

  /**
   * Comodines de fecha y hora, resueltos en el navegador ANTES de salir hacia
   * la base: asi el servidor solo ve literales y el numero del KPI no depende
   * de la zona horaria del servidor, que no es la de Peru.
   *
   *   '@hoy'  '@hoy-30'  '@hoy+7'    fecha (YYYY-MM-DD)
   *   '@mes'  '@mes-1'   '@mes+1'    primer dia de ese mes
   *   '@hora'                        hora actual (HH:MM)
   *
   * Cualquier otro valor pasa igual.
   */
  resolverComodin(v) {
    if (typeof v !== 'string' || v.charAt(0) !== '@') return v;
    if (v === '@hora') return this._ahoraPeru().toISOString().slice(11, 16);
    let m = v.match(/^@hoy([+-]\d+)?$/);
    if (m) {
      const dias = m[1] ? parseInt(m[1], 10) : 0;
      return new Date(this._ahoraPeru().getTime() + dias * 86400000).toISOString().slice(0, 10);
    }
    m = v.match(/^@mes([+-]\d+)?$/);
    if (m) {
      const d = this._ahoraPeru();
      const meses = m[1] ? parseInt(m[1], 10) : 0;
      return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + meses, 1))
        .toISOString().slice(0, 10);
    }
    return v;
  },

  /** Compara segun el tipo real: las fechas y los numeros no se comparan como texto. */
  _cmp(valor, otro, tipo) {
    if (tipo === 'date') {
      const a = Date.parse(valor), b = Date.parse(otro);
      return (isNaN(a) || isNaN(b)) ? null : (a < b ? -1 : a > b ? 1 : 0);
    }
    if (tipo === 'numeric') {
      const a = parseFloat(valor), b = parseFloat(otro);
      return (isNaN(a) || isNaN(b)) ? null : (a < b ? -1 : a > b ? 1 : 0);
    }
    const a = String(valor == null ? '' : valor), b = String(otro == null ? '' : otro);
    return a < b ? -1 : a > b ? 1 : 0;
  },

  /** true si la fila cumple TODAS las condiciones de opts. */
  coincide(modulo, fila, opts) {
    opts = opts || {};
    if (!fila) return false;
    const cfg = this._subconfig(modulo);
    const vars = (cfg && cfg.Variables) || {};
    const tipoDe = (campo) => this.tipoColumna(campo, (vars[campo] || {}).type);

    const filtros = opts.filtros || {};
    for (const campo in filtros) {
      const v = filtros[campo];
      if (v === '' || v == null) continue;
      const valor = fila[campo];
      const def = vars[campo] || {};
      if (tipoDe(campo) === 'text' && def.type !== 'Enum') {
        if (String(valor == null ? '' : valor).toLowerCase().indexOf(String(v).toLowerCase()) === -1) return false;
      } else if (String(valor == null ? '' : valor) !== String(v)) return false;
    }

    const q = String(opts.busqueda == null ? '' : opts.busqueda).trim().toLowerCase();
    if (q) {
      const campos = this.camposBuscables(modulo);
      const hay = campos.some(c => String(fila[c] == null ? '' : fila[c]).toLowerCase().indexOf(q) !== -1);
      if (!hay) return false;
    }

    const cond = opts.cond || {};
    for (const campo in cond) {
      const regla = cond[campo];
      if (regla == null) continue;
      // Alternativas: basta con que la fila cumpla UNA de las condiciones.
      if (campo === '$o') {
        const alts = [].concat(regla);
        if (alts.length && !alts.some(alt => this.coincide(modulo, fila, { cond: alt }))) return false;
        continue;
      }
      const valor = fila[campo];
      const tipo = tipoDe(campo);
      if (typeof regla !== 'object' || Array.isArray(regla)) {
        if (String(valor == null ? '' : valor) !== String(this.resolverComodin(regla))) return false;
        continue;
      }
      for (const op in regla) {
        const esperado = this.resolverComodin(regla[op]);
        if (op === 'nulo') {
          const vacio = valor == null || valor === '';
          if (esperado ? !vacio : vacio) return false;
        } else if (op === 'like') {
          if (String(valor == null ? '' : valor).toLowerCase().indexOf(String(esperado).toLowerCase()) === -1) return false;
        } else if (op === 'in') {
          if ([].concat(esperado).map(String).indexOf(String(valor == null ? '' : valor)) === -1) return false;
        } else if (op === 'eq' || op === 'neq') {
          const igual = String(valor == null ? '' : valor) === String(esperado);
          if (op === 'eq' ? !igual : igual) return false;
        } else if (['lt', 'lte', 'gt', 'gte'].indexOf(op) !== -1) {
          // Un valor vacio no cumple ninguna desigualdad: una inspeccion SIN
          // plazo no esta vencida. Compararla como '' < fecha la daria por
          // vencida y el KPI inventaria incumplimientos.
          if (valor == null || valor === '') return false;
          const c = this._cmp(valor, esperado, tipo);
          if (c === null) return false;
          if (op === 'lt'  && !(c <  0)) return false;
          if (op === 'lte' && !(c <= 0)) return false;
          if (op === 'gt'  && !(c >  0)) return false;
          if (op === 'gte' && !(c >= 0)) return false;
        }
      }
    }
    return true;
  },

  /** Filas que cumplen opts. */
  aplicar(modulo, filas, opts) {
    return (filas || []).filter(r => this.coincide(modulo, r, opts));
  },

  /** Cuantas filas cumplen opts (sobre lo que haya en memoria). */
  contar(modulo, filas, opts) {
    let n = 0;
    (filas || []).forEach(r => { if (this.coincide(modulo, r, opts)) n++; });
    return n;
  },

  /**
   * Mismo agregado que motor_agregado(), pero en memoria. Lo usa 01_Usuarios
   * y el modo sin conexion. Devuelve texto, como la funcion de Postgres, para
   * que quien llama no tenga que distinguir de donde salio el numero.
   * @param {{metrica?:string, campo?:string, cond?:Object}} opts
   * @returns {string|null}
   */
  agregar(modulo, filas, opts) {
    opts = opts || {};
    const metrica = opts.metrica || 'count';
    const sel = this.aplicar(modulo, filas, { cond: opts.cond });
    if (metrica === 'count') return String(sel.length);
    const campo = opts.campo;
    if (!campo) return null;
    const vals = sel.map(r => r[campo]).filter(v => v != null && v !== '');
    if (!vals.length) return null;
    if (metrica === 'max' || metrica === 'min') {
      const tipo = this.tipoColumna(campo, ((this._subconfig(modulo) || {}).Variables || {})[campo] &&
                                            ((this._subconfig(modulo) || {}).Variables || {})[campo].type);
      const orden = vals.slice().sort((a, b) => this._cmp(a, b, tipo));
      return String(metrica === 'max' ? orden[orden.length - 1] : orden[0]);
    }
    const nums = vals.map(v => parseFloat(v)).filter(v => !isNaN(v));
    if (!nums.length) return null;
    const suma = nums.reduce((a, b) => a + b, 0);
    return String(metrica === 'avg' ? (suma / nums.length) : suma);
  }
};


// ── AppsScriptProvider ── Google Sheets + Drive vía Apps Script (00_Config/Code.gs)
//
// Dos transportes, mismo contrato (serverRouter):
//   · app servida por Apps Script  → google.script.run.serverRouter(JSON)
//   · app en Vercel u otro dominio → fetch POST a la URL /exec (AppsScript.URL)
//     con Content-Type text/plain: así no hay "preflight" CORS, que Apps Script
//     no responde.
// El backend aplica las mismas reglas de rol que el RLS de Supabase, guarda
// los archivos en Drive (DATA/<módulo>/<fecha>) y los entrega como dataURL
// solo a quien puede ver el registro: los archivos nunca se hacen públicos.
const AppsScriptProvider = {
  nombre: 'appscript',
  etiqueta: 'Google Sheets + Drive (Apps Script)',

  get _url() { return String((AppState.AppsScript || {}).URL || '').trim(); },
  get _enGas() { return typeof google !== 'undefined' && !!(google.script && google.script.run); },
  get destino() { return this._enGas ? 'google.script.run (app servida por Apps Script)' : (this._url || '(falta APPS_SCRIPT_URL)'); },

  async _call(payload) {
    const cuerpo = Object.assign({
      userToken: (typeof AppState !== 'undefined' && AppState.User) ? AppState.User.Token : null
    }, payload);
    let parsed;
    try {
      let crudo;
      if (this._enGas) {
        crudo = await new Promise((resolve, reject) => {
          google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).serverRouter(JSON.stringify(cuerpo));
        });
      } else {
        if (!this._url) return { status: 'ERROR', msg: 'Falta la URL de Apps Script (APPS_SCRIPT_URL / AppsScript.URL).' };
        const res = await fetch(this._url, {
          method: 'POST', redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(cuerpo)
        });
        crudo = await res.text();
        if (!res.ok) return { status: 'ERROR', msg: 'Apps Script respondió HTTP ' + res.status, transitorio: res.status >= 500 };
      }
      parsed = (typeof crudo === 'string') ? JSON.parse(crudo) : crudo;
    } catch (e) {
      // Red caída, URL errónea o una implementación que exige cuenta de Google
      // (responde HTML de inicio de sesión en vez de JSON)
      return { status: 'ERROR', msg: 'Sin conexión con Apps Script: ' + (e && e.message || e), transitorio: true };
    }
    if (parsed && parsed.status === 'FORCE_LOGOUT') {
      if (typeof PWA_SKILLS !== 'undefined') PWA_SKILLS.toast('Acceso revocado. Vuelve a iniciar sesión.', 'error', 5000);
      if (typeof AppState !== 'undefined') setTimeout(() => AppState.clearSession(), 1200);
    } else if (parsed && parsed.status === 'INVALID_TOKEN') {
      parsed.transitorio = true;   // la cola espera a que el usuario vuelva a entrar
      console.warn('[Sesión] Apps Script no reconoce el token:', parsed.msg);
    }
    return parsed || { status: 'ERROR', msg: 'Respuesta vacía de Apps Script.' };
  },

  // ── Sesión ──
  // La contraseña viaja tal cual (HTTPS) y el servidor la deriva con sal.
  auth(dni, password) { return this._call({ action: 'LOGIN_AUTH', userDNI: dni, password }); },
  async cerrarSesion() { try { await this._call({ action: 'LOGOUT' }); } catch (e) {} },

  // ── Lectura ──
  read(module) { return this._call({ action: 'READ_DB', moduleName: module }); },
  readDelta(module, lastSync) { return this._call({ action: 'READ_DELTA', moduleName: module, lastSyncDate: lastSync }); },

  /**
   * Pagina y filtra EN EL SERVIDOR (Code.gs / accConsultar_). Apps Script no
   * tiene indices: sigue leyendo la hoja completa, pero el filtrado y el
   * recorte ocurren alla, asi que por el canal de google.script.run viajan 50
   * filas en vez de 5000 -- que era lo que agotaba el tiempo de ejecucion.
   */
  consultar(module, opts) {
    opts = opts || {};
    return this._call({
      action: 'QUERY_DB', moduleName: module,
      filtros: opts.filtros || {}, busqueda: opts.busqueda || '', cond: opts.cond || {},
      pageSize: Math.max(1, Math.min(500, parseInt(opts.limite, 10) || 50)),
      desde: Math.max(0, parseInt(opts.desde, 10) || 0),
      orden: opts.orden || ''
    });
  },

  /** Cuenta sin traer filas: el payload es un numero. */
  contar(module, opts) {
    opts = opts || {};
    return this._call({
      action: 'COUNT_DB', moduleName: module,
      filtros: opts.filtros || {}, busqueda: opts.busqueda || '', cond: opts.cond || {}
    });
  },

  /** Agregado (count/sum/max/min/avg) calculado en Code.gs sobre la hoja entera. */
  async agregado(module, opts) {
    opts = opts || {};
    const r = await this._call({
      action: 'AGG_DB', moduleName: module,
      metrica: opts.metrica || 'count', campo: opts.campo || '', cond: opts.cond || {}
    });
    return r && r.status === 'OK' ? { status: 'OK', valor: r.valor } : r;
  },

  /**
   * Varios agregados en UNA peticion. Es la diferencia entre leer la hoja una
   * vez o una por KPI: Sheets no tiene indices y cada peticion la relee entera.
   */
  async agregadoLote(module, consultas) {
    const r = await this._call({
      action: 'AGG_BATCH', moduleName: module,
      consultas: (consultas || []).map(c => ({
        metrica: c.metrica || 'count', campo: c.campo || '', cond: c.cond || {}
      }))
    });
    if (!r || r.status !== 'OK' || !Array.isArray(r.valores)) return r || { status: 'ERROR', msg: 'Respuesta vacía.' };
    return { status: 'OK', valores: r.valores };
  },
  async leerHijos(module, parentUuid) {
    if (!parentUuid) return [];
    const r = await this._call({ action: 'READ_CHILDREN', moduleName: module, parentUuid });
    return (r && r.status === 'OK' && Array.isArray(r.payload)) ? r.payload : [];
  },

  // ── Escritura ──
  create(module, data) { return this._uno(module, data); },
  update(module, data) { return this._uno(module, data); },
  async _uno(module, data, hijos) {
    const r = await this.syncQueue(module, [{ localQueueId: 'directo', payload: data, childPayload: hijos }]);
    return r.status === 'OK' ? { status: 'OK', uuid: data && data.UUID } : { status: 'ERROR', msg: r.msg, transitorio: r.fallos && r.fallos[0] && r.fallos[0].transitorio };
  },
  delete(module, uuid) { return this._call({ action: 'DELETE_ROWS', moduleName: module, uuids: [uuid] }); },
  /** Punto de entrada de la cola offline: responde okIds / fallos por registro. */
  syncQueue(module, items) {
    return this._call({
      action: 'SYNC_OFFLINE_QUEUE', moduleName: module,
      items: items.map(it => ({ id: it.localQueueId, payload: it.payload, childPayload: it.childPayload }))
    });
  },

  // ── Archivos (Drive) ──
  _media: {},
  esRefDrive(v) { return /^drive:/i.test(v) || /drive\.google\.com\/(file\/d\/|open\?id=|uc\?)/i.test(v); },
  async resolverMedia(valores) {
    const lista = (valores || []).map(v => String(v || '').trim()).filter(Boolean);
    const pedir = lista.filter((v, i) => this.esRefDrive(v) && !(v in this._media) && lista.indexOf(v) === i);
    for (let i = 0; i < pedir.length; i += 8) {
      const lote = pedir.slice(i, i + 8);
      const r = await this._call({ action: 'GET_FILES', refs: lote });
      lote.forEach(ref => { const d = r && r.archivos && r.archivos[ref]; if (d) this._media[ref] = d; });
    }
    // Caché acotada: las fotos son pesadas
    const claves = Object.keys(this._media);
    if (claves.length > 60) claves.slice(0, claves.length - 60).forEach(k => { delete this._media[k]; });
    return lista.map(v => this.esRefDrive(v) ? (this._media[v] || '') : v);
  },

  // ── Cuentas y configuración ──
  crearUsuario(datos, password) {
    return this._call({ action: 'CREATE_USER', datos, password }).then(r =>
      r.status === 'OK' ? r : { status: 'ERROR', msg: r.msg || 'No se pudo crear la cuenta.' });
  },
  cambiarPassword(uuid, password) { return this._call({ action: 'CHANGE_PASSWORD', uuid, password }); },
  /**
   * Cambio de la propia contraseña. Code.gs (accCambiarPassword_) ya distingue
   * el caso "propio": no exige ser Admin y mantiene viva ESTA sesión mientras
   * cierra las demás abiertas con la clave anterior.
   */
  cambiarMiPassword(password) {
    const yo = (AppState.User || {});
    return this._call({ action: 'CHANGE_PASSWORD', uuid: yo.UUID || yo.DNI, password });
  },
  /**
   * Constancia de consentimiento → Drive:
   * 01_Usuarios/00_Usabilidad/<EMPRESA>/<DNI>.pdf
   * El PDF viaja en base64 porque google.script.run no acepta Blob.
   */
  async guardarConsentimiento({ blob, dni, empresa, folio }) {
    const base64 = await this._aBase64(blob);
    const r = await this._call({ action: 'SAVE_CONSENT', dni, empresa, folio, pdfBase64: base64 });
    return r.status === 'OK' ? { status: 'OK', ruta: r.ruta || r.fileId || '' } : r;
  },

  /** Blob → base64 sin cabecera: google.script.run no acepta Blob. */
  _aBase64(blob) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result).split(',')[1] || '');
      fr.onerror = () => reject(new Error('No se pudo leer el PDF generado.'));
      fr.readAsDataURL(blob);
    });
  },

  // ── Informe PDF del registro (Drive) ──
  // DATA/<modulo>/00_Informes/<uuid>.pdf — un archivo por registro, siempre
  // el mismo nombre: al editar el registro se sustituye, no se acumula.
  async guardarInforme({ blob, modulo, uuid }) {
    let base64;
    try { base64 = await this._aBase64(blob); }
    catch (e) { return { status: 'ERROR', msg: e.message }; }
    const r = await this._call({ action: 'SAVE_REPORT', moduleName: modulo, uuid, pdfBase64: base64 });
    return r.status === 'OK'
      ? { status: 'OK', ruta: r.ruta || '', enlace: r.enlace || '', donde: 'Drive' }
      : r;
  },

  eliminarInforme(modulo, uuid) {
    return this._call({ action: 'DELETE_REPORT', moduleName: modulo, uuid });
  },

  /**
   * ¿Hay informe archivado y con qué enlace?
   * `compartir: true` (el botón de WhatsApp) pide además un enlace que el
   * destinatario pueda abrir: Code.gs pone el archivo en "cualquiera con el
   * enlace, solo lectura" y lo anota en la auditoría. Sin esa opción el
   * enlace solo sirve a quien ya tiene acceso a la carpeta de Drive.
   */
  async infoInforme(modulo, uuid, opts) {
    const r = await this._call({
      action: 'GET_REPORT', moduleName: modulo, uuid, compartir: !!(opts && opts.compartir)
    });
    if (!r || r.status !== 'OK') return { existe: false, transitorio: !!(r && r.transitorio) };
    return { existe: !!r.existe, enlace: r.enlace || '', ruta: r.ruta || '',
             fecha: r.fecha || '', donde: 'Drive' };
  },

  async guardarConfigEmpresa(config) {
    const r = await this._call({ action: 'SAVE_CONFIG', config: config || {} });
    return r.status === 'OK' ? { status: 'OK', config: r.config } : r;
  },

  // ── Diagnóstico (Configuración → Base de datos) ──
  async verificarConexion() {
    const checks = [];
    const add = (grupo, nombre, estado, detalle) => checks.push({ grupo, nombre, estado, detalle: detalle || '' });
    if (!this._enGas && !this._url) {
      add('conexion', 'URL de Apps Script', 'error', 'falta APPS_SCRIPT_URL (Vercel) o AppsScript.URL (Global_Config.js.html)');
      return checks;
    }
    if (!this._enGas && !/^https:\/\/script\.google(usercontent)?\.com\//.test(this._url)) {
      add('conexion', 'URL de Apps Script', /^http:\/\/(localhost|127\.0\.0\.1)/.test(this._url) ? 'warn' : 'error',
          this._url + ' — debería ser https://script.google.com/macros/s/…/exec');
    }
    add('conexion', 'Transporte', 'ok', this.destino);
    const t0 = Date.now();

// porque así nacieron pensados para columnas de Sheets. Las tablas reales
// de Postgres (ver tools/supabase_01_schema.sql) son snake_case en
// minúscula. La correspondencia es, en casi todos los casos, un simple
// `.toLowerCase()` de la clave del subconfig — así que en vez de mantener
// un diccionario a mano por módulo, _aColumnas()/_aFrontend() lo derivan
// del propio subconfig (Variables / Relational_Fields) en cada llamada.
// Es la única fuente de verdad: si mañana se agrega un campo al formulario,
// el mapeo lo recoge solo.
//
// "01_Usuarios" es la excepción: su tabla no es un volcado 1:1 del
// subconfig, sino un perfil reducido enlazado a Supabase Auth (ver
// supabase_01_schema.sql). Se maneja aparte en _usuarioAFrontend/_guardarUsuario.
const SupabaseProvider = {
  nombre: 'supabase',

   * Cada fallo dice qué archivo SQL falta aplicar.

  async verificarConexion() {

        return { ok: res.ok, status: res.status, cuerpo, ms: Date.now() - t0,
                 msg: (cuerpo && (cuerpo.message || cuerpo.msg || cuerpo.error)) || ('HTTP ' + res.status) };

    } else {
      add('auth', 'Sesión de Supabase Auth', 'warn', 'sin sesión: las tablas se revisan como anónimo');

                      : (sin07.length ? 'falta actualizado_en en ' + sin07.join(', ') + ' — aplica supabase_07_produccion.sql'

        login.ok || /intentos/i.test(login.msg) ? 'login_email_de_dni disponible' : login.msg + ' — aplica supabase_05_login.sql');
    const rpc = await pedir('/rest/v1/rpc/reemplazar_hijos', { method: 'POST', body: JSON.stringify({ p_tabla: '__diagnostico', p_parent: 'x', p_filas: [] }) });
    const hayRpc = rpc.ok || /no permitida|permiso|permission/i.test(rpc.msg);
    add('esquema', 'Guardado atómico del detalle (07)', hayRpc ? 'ok' : 'warn',
        hayRpc ? 'reemplazar_hijos disponible' : 'falta reemplazar_hijos — aplica supabase_07_produccion.sql (mientras tanto se usa el método anterior)');

    const emp = (AppState.User || {}).EmpresaId || '';
    for (const b of ['evidencias', 'documentos']) {
      const r = await pedir('/storage/v1/object/list/' + b, { method: 'POST', body: JSON.stringify({ prefix: emp ? emp + '/' : '', limit: 1 }) });
      add('storage', 'Bucket ' + b, r.ok ? 'ok' : 'error', r.ok ? 'accesible' : r.msg + ' — aplica supabase_03_storage.sql');
    }

    try {
      const r = await fetch('/api/usuarios', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
      const b = await r.json().catch(() => ({}));
      if (r.status === 401) add('cuentas', 'Servicio de cuentas (/api/usuarios)', 'ok', 'desplegado y configurado');
      else if (r.status === 500) add('cuentas', 'Servicio de cuentas (/api/usuarios)', 'error', b.msg || 'faltan variables en Vercel (SUPABASE_SERVICE_ROLE_KEY)');
      else add('cuentas', 'Servicio de cuentas (/api/usuarios)', 'warn', 'HTTP ' + r.status + ' — solo existe en el despliegue de Vercel (crear cuentas no funcionará aquí)');
    } catch (e) { add('cuentas', 'Servicio de cuentas (/api/usuarios)', 'warn', 'no accesible: ' + e.message); }
    return checks;
  },

  _headers(extra = {}) {
    return {
      'Content-Type': 'application/json',
      'apikey': this._key,
      'Authorization': `Bearer ${(AppState.User && AppState.User.SupabaseJWT) || this._key}`,
      ...extra
    };
  },

  // '02_Reportes' → 'reportes'  (el esquema generado siempre usa snake_case)
  _table(module) {
    return String(module).replace(/^\d+_/, '').toLowerCase();
  },

  _subconfig(modulo) {
    const key = 'SUBCONFIG_' + String(modulo).toUpperCase().replace(/[^A-Z0-9_]/g, '');
    return (typeof window !== 'undefined' && window[key]) || null;
  },

  /** Nombre real de la tabla hija: '<tabla_padre>_<child_table_en_minuscula>' */
  _childTable(modulo) {
    const cfg = this._subconfig(modulo);
    const child = cfg && cfg.Config_Modular && cfg.Config_Modular.CHILD_TABLE;
    return child ? `${this._table(modulo)}_${String(child).toLowerCase()}` : null;
  },

  /** Fila de Postgres (columnas snake_case) → objeto con las claves PascalCase del subconfig */
  _aFrontend(modulo, fila) {
    const cfg = this._subconfig(modulo);
    if (!cfg || !cfg.Variables || !fila) return fila;
    const out = {};
    Object.keys(cfg.Variables).forEach(campo => {
      const col = campo.toLowerCase();
      if (fila[col] !== undefined) out[campo] = fila[col];
    });
    ['empresa_id', 'creado_por_dni', 'creado_en'].forEach(c => { if (fila[c] !== undefined) out[c] = fila[c]; });
    return out;
  },

  /** Objeto con claves PascalCase del subconfig → fila para Postgres (snake_case) */
  _aColumnas(modulo, datos) {
    const cfg = this._subconfig(modulo);
    if (!cfg || !cfg.Variables) return datos;
    const out = {};
    Object.keys(datos).forEach(campo => {
      const def = cfg.Variables[campo];
      if (!def) return;
      let valor = datos[campo];
      // Postgres rechaza '' para columnas date/timestamp (campos Date opcionales
      // dejados en blanco): sin esto, el registro entero fallaba al guardar.
      if (def.type === 'Date' && valor === '') valor = null;
      out[campo.toLowerCase()] = valor;
    });
    return out;
  },

  /** Fila hija (Postgres) → objeto con los `name` declarados en Relational_Fields */
  _hijoAFrontend(modulo, fila) {
    const campos = this._relationalFields(modulo);
    const out = {};
    campos.forEach(c => { const col = c.name.toLowerCase(); if (fila[col] !== undefined) out[c.name] = fila[col]; });
    return out;
  },

  /** Objeto de fila hija (PARENT_UUID + campos del subconfig) → fila para Postgres */
  _hijoAColumnas(modulo, datos) {
    const campos = this._relationalFields(modulo);
    const tipos = {}; campos.forEach(c => { tipos[c.name] = c.type; });
    const out = {};
    Object.keys(datos).forEach(campo => {
      if (campo !== 'PARENT_UUID' && !(campo in tipos)) return;
      let valor = datos[campo];
      // Mismo caso que _aColumnas: '' no es una fecha válida para Postgres.
      if (tipos[campo] === 'date' && valor === '') valor = null;
      out[campo.toLowerCase()] = valor;
    });
    return out;
  },

  _relationalFields(modulo) {
    const cfg = this._subconfig(modulo);
    return (cfg && cfg.Config_Modular && cfg.Config_Modular.Relational_Fields) || [];
  },

  async _fetch(path, options = {}, _reintentado) {
    const url = `${this._url}/rest/v1${path}`;
    try {
      const res = await fetch(url, {
        ...options,
        headers: { ...this._headers(), ...(options.headers || {}) }
      });
      // El JWT de sesión dura 1 hora; si expiró, se intenta renovar UNA vez
      // con el refresh_token antes de rendirse (evita cerrar sesión sola en
      // medio de un turno de campo).
      if (res.status === 401 && !_reintentado && await this._refrescarSesion()) {
        return this._fetch(path, options, true);
      }
      const body = res.status !== 204 ? await res.json().catch(() => null) : null;
      if (!res.ok) {
        const msg = (body && (body.message || body.hint || body.details)) || `HTTP ${res.status}`;
        return { status: 'ERROR', msg, httpStatus: res.status, transitorio: this._esTransitorio(res.status) };
      }
      // Content-Range: "0-49/3480" cuando se pidió Prefer: count=exact. Es el
      // ÚNICO sitio donde viaja el total real de la tabla: sin esto, una vista
      // paginada no puede distinguir "hay 50" de "hay 50 de 3480".
      let total = null;
      const cr = res.headers.get('content-range');
      if (cr) {
        const t = String(cr).split('/')[1];
        if (t && t !== '*') total = parseInt(t, 10);
      }
      return { status: 'OK', _raw: body, _total: total };
    } catch (e) {
      return { status: 'ERROR', msg: 'Error de red: ' + e.message, transitorio: true };
    }
  },

  /**
   * Errores que no dicen nada del registro y se resuelven solos: sesión
   * vencida (401, el usuario debe reentrar), timeout, límite de peticiones,
   * servidor caído. La cola offline no los cuenta como rechazo.
   */
  _esTransitorio(httpStatus) {
    return httpStatus === 401 || httpStatus === 408 || httpStatus === 429 || httpStatus >= 500;
  },

  /** Intenta renovar el JWT de Supabase Auth. true si lo consiguió. */
  async _refrescarSesion() {
    const rt = (AppState.User || {}).SupabaseRefreshToken;
    if (!rt) return false;
    try {
      const res = await fetch(`${this._url}/auth/v1/token?grant_type=refresh_token`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: this._key },
        body: JSON.stringify({ refresh_token: rt })
      });
      if (!res.ok) return false;
      const body = await res.json();
      AppState.User.SupabaseJWT = body.access_token;
      AppState.User.SupabaseRefreshToken = body.refresh_token;
      localStorage.setItem('pwa_supabase_jwt', body.access_token);
      localStorage.setItem('pwa_supabase_refresh', body.refresh_token);
      return true;
    } catch (e) { return false; }

  // ── Archivos: Supabase Storage sustituye a Google Drive ────────────────
  //
  // RUTA:  <empresa_id>/<modulo>/<uuid>/<campo>_<n>.<ext>
  // La empresa va primero porque las políticas del bucket aíslan por carpeta.
  //
  // Buckets:  evidencias (privado) · documentos (privado) · publico
  //
  // El bucket se decide por el TIPO del archivo, y se puede re-derivar de la
  // extensión de la ruta guardada: así la columna solo guarda la ruta (como
  // hasta ahora) y la vista de Detalle sabe dónde firmarla.
  //   imagen (foto, firma)                          → evidencias
  //   cualquier otro (PDF, Word, Excel, PPT, CSV…)  → documentos
  EXT_IMAGEN: ['jpg', 'jpeg', 'png', 'webp', 'heic', 'gif'],

  _bucketDe(mime) {
    return /^image\//i.test(String(mime || '')) ? 'evidencias' : 'documentos';
  },

  bucketDeRuta(ruta) {
    const ext = String(ruta || '').split('?')[0].split('.').pop().toLowerCase();
    return this.EXT_IMAGEN.indexOf(ext) !== -1 ? 'evidencias' : 'documentos';
  },

  /** true si el valor es una ruta de Storage (no una URL ni un dataURL) */
  esRutaStorage(v) {
    const t = String(v || '').trim();
    return !!t && !/^(https?:|data:|blob:)/i.test(t) && t.indexOf('/') !== -1;
  },

  /** dataURL (cámara/firma) → Blob, sin librerías */
  _aBlob(dataUrl) {
    const [cab, b64] = String(dataUrl).split(',');
    const mime = (cab.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream';
    const bin  = atob(b64);
    const buf  = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    return new Blob([buf], { type: mime });
  },

  _extDe(mime) {
    return ({ 'image/jpeg':'jpg', 'image/png':'png', 'image/webp':'webp', 'image/heic':'heic',
              'application/pdf':'pdf', 'text/csv':'csv', 'text/plain':'txt',
              'application/msword':'doc', 'application/vnd.ms-excel':'xls',
              'application/vnd.ms-powerpoint':'ppt',
              'application/vnd.openxmlformats-officedocument.wordprocessingml.document':'docx',
              'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'xlsx',
              'application/vnd.openxmlformats-officedocument.presentationml.presentation':'pptx'
            })[mime] || 'bin';
  },

   * caducan, la ruta no. Se guarda la ruta en la columna del registro.
   * @param {File|Blob|string} archivo  File, Blob o dataURL
   * @returns {Promise<{ruta:string, bucket:string}>}
   */
  async subirArchivo(modulo, uuid, campo, archivo, indice, _reintentado) {
    const empresa = (AppState.User || {}).EmpresaId || 'sin-empresa';
    const blob    = (typeof archivo === 'string') ? this._aBlob(archivo) : archivo;
    const bucket  = this._bucketDe(blob.type);
    const ext     = (archivo && archivo.name && archivo.name.indexOf('.') !== -1)
      ? archivo.name.split('.').pop().toLowerCase()
      : this._extDe(blob.type);

    // Nombre ÚNICO por subida: la evidencia nunca se sobrescribe (RLS solo deja
    // sobrescribir a Admin). Antes el nombre era campo_<posición>: al quitar
    // una foto de una galería y añadir otra, la nueva pisaba un archivo que
    // otra posición seguía usando.
    const sello = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const ruta = [empresa, modulo, uuid, campo + '_' + (indice || 0) + '_' + sello + '.' + ext].join('/');

    let res;
    try {
      res = await fetch(`${this._url}/storage/v1/object/${bucket}/${ruta}`, {
        method: 'POST',
        headers: {
          'apikey': this._key,
          'Authorization': `Bearer ${AppState.User?.SupabaseJWT || this._key}`,
          'Content-Type': blob.type || 'application/octet-stream',
          'x-upsert': 'false'
        },
        body: blob
      });
    } catch (e) {
      const err = new Error('No se pudo subir ' + campo + ': sin conexión');
      err.transitorio = true;
      throw err;
    }

    // Tras horas offline el JWT ya venció: se renueva una vez, como en _fetch.
    // Storage puede responder 400/403 con "jwt expired" en vez de 401.
    let cuerpo = null;
    if (!res.ok) { try { cuerpo = await res.json(); } catch (e) {} }
    const jwtVencido = res.status === 401 || /jwt|token/i.test(String(cuerpo && (cuerpo.message || cuerpo.error) || ''));
    if (!res.ok && jwtVencido && !_reintentado && await this._refrescarSesion()) {
      return this.subirArchivo(modulo, uuid, campo, archivo, indice, true);
    }

    if (!res.ok) {
      const msg = (cuerpo && (cuerpo.message || cuerpo.error)) || ('HTTP ' + res.status);
      const err = new Error('No se pudo subir ' + campo + ': ' + msg);
      err.transitorio = jwtVencido || this._esTransitorio(res.status);
