  /**
   * Sube todos los campos de archivo de un registro y sustituye su valor por
   * la ruta almacenada. Es el equivalente a processFilesForItem() de Apps
   * Script, pero del lado del cliente.
   */
  async subirArchivosDe(modulo, datos) {
    const clave = 'SUBCONFIG_' + String(modulo).toUpperCase().replace(/[^A-Z0-9_]/g, '');
    const cfg = window[clave];
    if (!cfg || !cfg.Variables) return datos;

    const salida = Object.assign({}, datos);
    const tiposArchivo = ['Image', 'Image_Collection', 'Signature', 'File', 'Face_Photo'];

    for (const campo in cfg.Variables) {
      const def = cfg.Variables[campo] || {};
      if (tiposArchivo.indexOf(def.type) === -1) continue;
      const valor = salida[campo];
      if (!valor) continue;

      // Un campo puede traer varias imágenes separadas por coma
      const partes = partirListaMedia(valor);
      const rutas = [];
      for (let i = 0; i < partes.length; i++) {
        // Ya es una ruta guardada o una URL externa: se respeta tal cual.
        // Una URL firmada (la que pinta el Detalle) se devuelve a su ruta
        // original, para no guardar en la base un enlace que caduca en 1 h.
        if (partes[i].indexOf('data:') !== 0) {
          const m = partes[i].match(/\/storage\/v1\/object\/sign\/[^/]+\/([^?]+)/);
          rutas.push(m ? decodeURIComponent(m[1]) : partes[i]);
          continue;
        }
        const r = await this.subirArchivo(modulo, salida.UUID, campo, partes[i], i);
        rutas.push(r.ruta);
      }
      salida[campo]            = rutas.join(',');
      salida[campo + '_Path']  = rutas.join(',');
      salida[campo + '_ID']    = rutas[0] || '';
    }
    return salida;
  },

  /**
   * URL temporal para mostrar un archivo privado. Las vistas de Detalle la
   * usan en lugar de la URL de Drive.
   * @param {number} segundos  validez del enlace (1 hora por defecto)
   */
  async urlFirmada(ruta, bucket, segundos) {
    if (!ruta) return '';
    const mapa = await this.urlsFirmadas([ruta], segundos, bucket);
    return mapa[ruta] || '';
  },

  // Caché de URLs firmadas: { ruta: { url, vence } }. Evita volver a firmar
  // la misma foto cada vez que se abre un Detalle o se exporta un PDF.
  _firmas: {},

  /**
   * Firma varias rutas de una vez (un POST por bucket, no uno por archivo).
   * @param {string[]} rutas
   * @returns {Promise<Object<string,string>>}  ruta → URL temporal ('' si falló)
   */
  async urlsFirmadas(rutas, segundos, bucketForzado, _reintentado) {
    const validez = segundos || 3600;
    const ahora = Date.now();
    const salida = {};
    const porBucket = {};

    (rutas || []).forEach(r => {
      if (!r) return;
      const c = this._firmas[r];
      if (c && c.vence > ahora + 60000) { salida[r] = c.url; return; }
      const b = bucketForzado || this.bucketDeRuta(r);
      (porBucket[b] = porBucket[b] || []).push(r);
    });

    for (const b in porBucket) {
      const lote = porBucket[b];
      let resp = null;
      try {
        // Storage no cuelga de /rest/v1, así que se compone la ruta a mano
        const res = await fetch(`${this._url}/storage/v1/object/sign/${b}`, {
          method: 'POST',
          headers: this._headers(),
          body: JSON.stringify({ expiresIn: validez, paths: lote })
        });
        if (res.status === 401 && !_reintentado && await this._refrescarSesion()) {
          return this.urlsFirmadas(rutas, segundos, bucketForzado, true);
        }
        resp = res.ok ? await res.json() : null;
      } catch (e) { resp = null; }

      lote.forEach(r => {
        const hit = Array.isArray(resp) ? resp.find(x => x.path === r) : null;
        const url = (hit && hit.signedURL) ? this._url + '/storage/v1' + hit.signedURL : '';
        salida[r] = url;
        if (url) this._firmas[r] = { url, vence: ahora + validez * 1000 };
      });
    }
    return salida;
  },

  /**
   * Convierte los valores de un campo de archivo (rutas, URLs o dataURLs)
   * en URLs mostrables, en el mismo orden. Las rutas de Storage se firman;
   * lo demás pasa tal cual.
   */
  async resolverMedia(valores) {
    const lista = (valores || []).map(v => String(v || '').trim()).filter(Boolean);
    const rutas = lista.filter(v => this.esRutaStorage(v));
    const firmadas = rutas.length ? await this.urlsFirmadas(rutas) : {};
    return lista.map(v => this.esRutaStorage(v) ? (firmadas[v] || '') : v);
  },

  /**
   * Login por DNI contra Supabase Auth.
   * Supabase identifica usuarios por email, no por DNI, así que primero se
   * resuelve el email vía la función `login_email_de_dni` (SECURITY DEFINER,
   * ver tools/supabase_05_login.sql) y luego se hace el login real — con la
   * contraseña TAL CUAL la escribió el usuario, no un hash: Supabase la
   * recibe por HTTPS y la hashea con bcrypt en su servidor, que es la
   * práctica estándar (ver handleLogin() en App_Routing.js.html).
   */
  async auth(dni, password) {
    let email;
    try {
      const rpc = await fetch(`${this._url}/rest/v1/rpc/login_email_de_dni`, {
        method: 'POST', headers: this._headers(), body: JSON.stringify({ p_dni: dni })
      });
      if (!rpc.ok) {
        // p. ej. el límite de consultas por IP de login_email_de_dni
        const err = await rpc.json().catch(() => ({}));
        return { status: 'ERROR', msg: (err && err.message) || 'No se pudo validar el usuario.' };
      }
      email = await rpc.json();
    } catch (e) {
      return { status: 'ERROR', msg: 'Sin conexión con el servidor.' };
    }
    if (!email) return { status: 'ERROR', msg: 'Usuario no encontrado.' };

    let tokenBody;
    try {
      const tokenRes = await fetch(`${this._url}/auth/v1/token?grant_type=password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: this._key },
        body: JSON.stringify({ email, password })
      });
      tokenBody = await tokenRes.json().catch(() => ({}));
      if (!tokenRes.ok) {
        return { status: 'ERROR', msg: tokenBody.error_description || tokenBody.msg || 'Contraseña incorrecta.' };
      }
    } catch (e) {
      return { status: 'ERROR', msg: 'Sin conexión con el servidor.' };
    }

    // Con el JWT recién emitido, RLS ya reconoce a este usuario (id = auth.uid())
    const cabecerasSesion = { apikey: this._key, Authorization: `Bearer ${tokenBody.access_token}` };
    // El perfil se busca por el id de la cuenta autenticada, no por DNI: un
    // SuperAdmin (que ve todas las empresas) o un DNI repetido podían cargar
    // el perfil —rol y empresa— de OTRA persona.
    const authId = tokenBody.user && tokenBody.user.id;
    if (!authId) return { status: 'ERROR', msg: 'Respuesta de autenticación incompleta.' };
    const perfilRes = await fetch(`${this._url}/rest/v1/usuarios?id=eq.${encodeURIComponent(authId)}&select=*`, { headers: cabecerasSesion });
    const perfiles = await perfilRes.json().catch(() => []);
    const perfil = Array.isArray(perfiles) ? perfiles[0] : null;
    if (!perfil) return { status: 'ERROR', msg: 'Perfil de usuario no encontrado.' };

    const estado = String(perfil.status || '').toLowerCase();
    if (estado === 'cesado' || estado === 'inactivo') {
      return { status: 'CESADO', msg: 'Acceso revocado. Contacte al administrador.' };
    }

    // Nombre, plan de módulos (lo que activa el SuperAdmin) y configuración
    // de la empresa. `config` solo existe tras supabase_07; si aún no se
    // aplicó, se reintenta sin ella para no bloquear el login.
    let empresa = {};
    if (perfil.empresa_id) {
      const pedir = cols => fetch(`${this._url}/rest/v1/empresas?id=eq.${perfil.empresa_id}&select=${cols}`, { headers: cabecerasSesion });
      let eRes = await pedir('nombre,modulos,config,activa');
      if (!eRes.ok) eRes = await pedir('nombre,modulos,activa');
      const eBody = await eRes.json().catch(() => []);
      empresa = (Array.isArray(eBody) && eBody[0]) || {};
      if (empresa.activa === false && String(perfil.rol).toLowerCase() !== 'superadmin') {
        return { status: 'CESADO', msg: 'La cuenta de tu empresa está suspendida. Contacta al proveedor.' };
      }
    }
    const empresaNombre = empresa.nombre || '';

    return {
      status: 'OK',
      userData: {
        UUID: perfil.id, DNI: perfil.dni, Nombre_Completo: perfil.nombre, Email: perfil.email,
        Rol: perfil.rol, Status: perfil.status,
        EmpresaId: perfil.empresa_id || null, EmpresaNombre: empresaNombre,
        EmpresaModulos: empresa.modulos || null, EmpresaConfig: empresa.config || null,
        SupabaseJWT: tokenBody.access_token, SupabaseRefreshToken: tokenBody.refresh_token
      }
    };
  },

  _usuarioAFrontend(fila) {
    return {
      UUID: fila.id, DNI: fila.dni, Nombre_Completo: fila.nombre, Email: fila.email,
      Rol: fila.rol, Status: fila.status, Area: fila.area, Puesto: fila.puesto,
      Foto_Perfil: fila.foto_perfil || '', Firma_Cargo: fila.firma_cargo || '',
      // Constancia de autorización de firma digital: con fecha, el asistente
      // de primer ingreso ya no se le vuelve a mostrar a esa persona.
      Consentimiento_Fecha: fila.consentimiento_fecha || '',
      Consentimiento_Folio: fila.consentimiento_folio || '',
      Consentimiento_Path:  fila.consentimiento_path  || '',
      empresa_id: fila.empresa_id
    };
  },

  /**
   * Alta de cuentas y cambio de contraseña. Crear un usuario real de Supabase
   * Auth requiere la service_role, que NUNCA viaja al navegador: lo hace la
   * función serverless /api/usuarios (Vercel), que verifica que quien llama
   * sea Admin de la empresa. Requiere conexión: la contraseña no se encola
   * offline para no dejarla en IndexedDB.
   */
  async _apiUsuarios(cuerpo, _reintentado) {
    let res;
    try {
      res = await fetch('/api/usuarios', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json',
                   Authorization: `Bearer ${(AppState.User || {}).SupabaseJWT || ''}` },
        body: JSON.stringify(cuerpo)
      });
    } catch (e) {
      return { status: 'ERROR', msg: 'Se necesita conexión para gestionar cuentas.', transitorio: true };
    }
    if (res.status === 401 && !_reintentado && await this._refrescarSesion()) return this._apiUsuarios(cuerpo, true);
    if (res.status === 404) {
      return { status: 'ERROR', msg: 'El servicio de cuentas (/api/usuarios) no está disponible en este despliegue.' };
    }
    const body = await res.json().catch(() => ({}));
    return res.ok ? Object.assign({ status: 'OK' }, body)
                  : { status: 'ERROR', msg: body.msg || ('HTTP ' + res.status), transitorio: this._esTransitorio(res.status) };
  },

  async crearUsuario(datos, password) {
    // Foto y firma se suben primero con la sesión del Admin (RLS de Storage
    // aísla por empresa) y a la API solo viajan sus rutas.
    let conArchivos;
    try { conArchivos = await this.subirArchivosDe('01_Usuarios', datos); }
    catch (e) { return { status: 'ERROR', msg: e.message }; }
    return this._apiUsuarios({
      accion: 'crear', id: datos.UUID, password,
      dni: datos.DNI, nombre: datos.Nombre_Completo, email: datos.Email || '',
      rol: String(datos.Rol || 'Trabajador').toLowerCase(), status: datos.Status || 'Activo',
      area: datos.Area || null, puesto: datos.Puesto || null,
      foto_perfil: conArchivos.Foto_Perfil || null, firma_cargo: conArchivos.Firma_Cargo || null
    });
  },

  /**
   * Cierra la sesión en Supabase Auth: invalida el refresh_token de ESTE
   * dispositivo (scope=local). Antes el logout solo borraba localStorage, y un
   * refresh_token copiado seguía sirviendo para emitir JWT nuevos.
   * Sin red no se puede revocar: se intenta y se sigue (no bloquea el logout).
   */
  async cerrarSesion() {
    const jwt = (AppState.User || {}).SupabaseJWT;
    if (!jwt) return;
    try {
      const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const t = ctrl ? setTimeout(() => ctrl.abort(), 4000) : null;
      await fetch(`${this._url}/auth/v1/logout?scope=local`, {
        method: 'POST', headers: { apikey: this._key, Authorization: `Bearer ${jwt}` },
        signal: ctrl ? ctrl.signal : undefined
      });
      if (t) clearTimeout(t);
    } catch (e) { /* sin red: la sesión local se borra igual */ }
  },

  cambiarPassword(uuid, password) {
    return this._apiUsuarios({ accion: 'password', id: uuid, password });
  },

  /**
   * Cambio de la PROPIA contraseña. No pasa por /api/usuarios (que exige rol
   * Admin): Supabase Auth deja que cualquier sesión válida cambie su propia
   * clave con PUT /auth/v1/user, así que un Trabajador también puede.
   * La contraseña actual ya se verificó antes (DataService.changeOwnPassword).
   */
  async cambiarMiPassword(password) {
    const jwt = (AppState.User || {}).SupabaseJWT;
    if (!jwt) return { status: 'ERROR', msg: 'Tu sesión expiró. Vuelve a entrar e inténtalo de nuevo.' };
    let res, body;
    try {
      res = await fetch(`${this._url}/auth/v1/user`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', apikey: this._key, Authorization: `Bearer ${jwt}` },
        body: JSON.stringify({ password })
      });
      body = await res.json().catch(() => ({}));
    } catch (e) {
      return { status: 'ERROR', msg: 'Se necesita conexión para cambiar tu contraseña.', transitorio: true };
    }
    if (!res.ok) {
      return { status: 'ERROR', msg: body.error_description || body.msg || body.message || 'No se pudo cambiar la contraseña.' };
    }
    return { status: 'OK' };
  },

  /**
   * Constancia de consentimiento de firma digital → bucket `documentos`.
   * Ruta: <empresa_id>/consentimientos/<DNI>.pdf — la empresa va primero
   * porque la política del bucket aísla por esa carpeta (supabase_03).
   * Se sobrescribe (x-upsert) a propósito: la constancia es una por persona,
   * y si alguien la vuelve a firmar manda la última.
   */
  async guardarConsentimiento({ blob, dni }) {
    const empresaId = (AppState.User || {}).EmpresaId;
    if (!empresaId) return { status: 'ERROR', msg: 'Tu cuenta no está asociada a una empresa.' };
    const ruta = `${empresaId}/consentimientos/${String(dni).replace(/[^\w.-]/g, '_')}.pdf`;
    const jwt = (AppState.User || {}).SupabaseJWT;
    try {
      const res = await fetch(`${this._url}/storage/v1/object/documentos/${ruta}`, {
        method: 'POST',
        headers: { apikey: this._key, Authorization: `Bearer ${jwt}`, 'Content-Type': 'application/pdf', 'x-upsert': 'true' },
        body: blob
      });
      if (!res.ok) {
        const b = await res.json().catch(() => ({}));
        return { status: 'ERROR', msg: b.message || b.error || ('No se pudo subir la constancia (HTTP ' + res.status + ').') };
      }
    } catch (e) {
      return { status: 'ERROR', msg: 'Se necesita conexión para guardar tu constancia.', transitorio: true };
    }
    return { status: 'OK', ruta };
  },

  // ── Informe PDF del registro (bucket `informes`) ──
  // Ruta: <empresa_id>/<modulo>/<uuid>/informe.pdf — la empresa va primero
  // porque la política del bucket aísla por esa carpeta (supabase_03), y el
  // nombre es fijo: al editar el registro se SUSTITUYE su informe, no se
  // acumula una copia por edición.
  //
  // Es un bucket aparte de `evidencias`/`documentos` a propósito: ahí
  // sobrescribir y borrar están reservados al Admin (destruir evidencia), y
  // un informe es un documento DERIVADO que se regenera con cada cambio, así
  // que lo reescribe quien puede editar el registro o quien lo creó.
  BUCKET_INFORMES: 'informes',

  rutaInforme(modulo, uuid) {
    const empresa = (AppState.User || {}).EmpresaId;
    if (!empresa || !modulo || !uuid) return '';
    return [empresa, modulo, String(uuid), 'informe.pdf'].join('/');
  },

  async guardarInforme({ blob, modulo, uuid }, _reintentado) {
    const ruta = this.rutaInforme(modulo, uuid);
    if (!ruta) return { status: 'ERROR', msg: 'Tu cuenta no está asociada a una empresa.' };
    const jwt = (AppState.User || {}).SupabaseJWT;
    let res, cuerpo = null;
    try {
      res = await fetch(`${this._url}/storage/v1/object/${this.BUCKET_INFORMES}/${ruta}`, {
        method: 'POST',
        headers: { apikey: this._key, Authorization: `Bearer ${jwt || this._key}`,
                   'Content-Type': 'application/pdf', 'x-upsert': 'true' },
        body: blob
      });
    } catch (e) {
      return { status: 'ERROR', msg: 'Sin conexión para archivar el informe.', transitorio: true };
    }
    if (!res.ok) { try { cuerpo = await res.json(); } catch (e) {} }
    const jwtVencido = res.status === 401 ||
      /jwt|token/i.test(String((cuerpo && (cuerpo.message || cuerpo.error)) || ''));
    if (!res.ok && jwtVencido && !_reintentado && await this._refrescarSesion()) {
      return this.guardarInforme({ blob, modulo, uuid }, true);
    }
    if (!res.ok) {
      const msg = (cuerpo && (cuerpo.message || cuerpo.error)) || ('HTTP ' + res.status);
      return { status: 'ERROR', msg: 'No se pudo archivar el informe: ' + msg,
               transitorio: jwtVencido || this._esTransitorio(res.status) };
    }
    delete this._firmas[ruta];   // el enlace firmado apuntaba al archivo viejo
    return { status: 'OK', ruta, donde: 'Storage' };
  },

  async eliminarInforme(modulo, uuid) {
    const ruta = this.rutaInforme(modulo, uuid);
    if (!ruta) return { status: 'OK' };
    const jwt = (AppState.User || {}).SupabaseJWT;
    try {
      const res = await fetch(`${this._url}/storage/v1/object/${this.BUCKET_INFORMES}/${ruta}`, {
        method: 'DELETE', headers: { apikey: this._key, Authorization: `Bearer ${jwt || this._key}` }
      });
      delete this._firmas[ruta];
      // 404 = no había informe archivado: para el llamador es lo mismo que
      // haberlo borrado.
      if (!res.ok && res.status !== 404) {
        const b = await res.json().catch(() => ({}));
        return { status: 'ERROR', msg: b.message || b.error || ('HTTP ' + res.status),
                 transitorio: this._esTransitorio(res.status) };
      }
    } catch (e) {
      return { status: 'ERROR', msg: 'Sin conexión para borrar el informe.', transitorio: true };
    }
    return { status: 'OK' };
  },

  /**
   * ¿Hay informe archivado y con qué enlace? Un enlace firmado que no se
   * puede crear significa que el objeto no existe (o que RLS no lo deja ver).
   * `compartir: true` (WhatsApp) lo firma por 7 días: el destinatario lo abre
   * sin cuenta, y pasada esa semana el enlace deja de servir — a diferencia
   * de un archivo público, que queda expuesto para siempre.
   */
  async infoInforme(modulo, uuid, opts) {
    const ruta = this.rutaInforme(modulo, uuid);
    if (!ruta) return { existe: false };
    const segundos = (opts && opts.compartir) ? 7 * 24 * 3600 : 3600;
    let res, body;
    try {
      res = await fetch(`${this._url}/storage/v1/object/sign/${this.BUCKET_INFORMES}/${ruta}`, {
        method: 'POST', headers: this._headers(), body: JSON.stringify({ expiresIn: segundos })
      });
      body = await res.json().catch(() => ({}));
    } catch (e) {
      return { existe: false, transitorio: true };
    }
    if (!res.ok || !body.signedURL) return { existe: false };
    return { existe: true, ruta, donde: 'Storage', enlace: this._url + '/storage/v1' + body.signedURL };
  },

  /** Guarda la configuración de la app para toda la empresa (solo Admin). */
  async guardarConfigEmpresa(config) {
    const r = await this._fetch('/rpc/guardar_config_empresa', {
      method: 'POST', body: JSON.stringify({ p_config: config || {} })
    });
    return r.status === 'OK' ? { status: 'OK', config: r._raw } : r;
  },

  /**
   * Edita el perfil de un usuario existente. El alta pasa por crearUsuario()
   * (online, vía /api/usuarios); si llega aquí un DNI desconocido es porque
   * se encoló offline un alta, cosa que la vista de Edición ya no permite.
   */
  async _guardarUsuario(datos) {
    const existeRes = await this._fetch(`/usuarios?dni=eq.${encodeURIComponent(datos.DNI)}&select=id,email`);
    // Un fallo de red NO significa que el usuario no exista
    if (existeRes.status !== 'OK') return existeRes;
    const fila = (existeRes._raw && existeRes._raw[0]) || null;
    if (!fila) {
      return { status: 'ERROR', msg: 'El usuario ' + datos.DNI + ' no existe. Las cuentas nuevas se crean con conexión desde Usuarios → Nuevo.' };
    }
    // La ruta de Storage usa el id real del perfil, no el UUID del formulario
    let conArchivos;
    try { conArchivos = await this.subirArchivosDe('01_Usuarios', Object.assign({}, datos, { UUID: fila.id })); }
    catch (e) { return { status: 'ERROR', msg: e.message, transitorio: !!e.transitorio }; }

    // El email es la llave del login (DNI → email → Auth): cambiarlo solo en
    // la tabla dejaba al usuario sin poder entrar. Lo cambia /api/usuarios,
    // que actualiza a la vez la cuenta de Auth y el perfil.
    const emailNuevo = String(datos.Email || '').trim().toLowerCase();
    if (datos.Email !== undefined && emailNuevo && emailNuevo !== String(fila.email || '').toLowerCase()) {
      const re = await this._apiUsuarios({ accion: 'perfil', id: fila.id, email: emailNuevo });
      if (re.status !== 'OK') return re;
    }

    const cambios = {};
    if (datos.Nombre_Completo !== undefined) cambios.nombre = datos.Nombre_Completo;
    if (datos.Rol      !== undefined) cambios.rol    = String(datos.Rol).toLowerCase();
    if (datos.Status   !== undefined) cambios.status = datos.Status;
    if (datos.Area     !== undefined) cambios.area   = datos.Area;
    if (datos.Puesto   !== undefined) cambios.puesto = datos.Puesto;
    if (conArchivos.Foto_Perfil) cambios.foto_perfil = conArchivos.Foto_Perfil;
    if (conArchivos.Firma_Cargo) cambios.firma_cargo = conArchivos.Firma_Cargo;
    // Sello del consentimiento de firma digital (lo escribe el propio usuario
    // al terminar el asistente de primer ingreso; RLS lo permite sobre su fila)
    if (datos.Consentimiento_Fecha !== undefined) cambios.consentimiento_fecha = datos.Consentimiento_Fecha;
    if (datos.Consentimiento_Folio !== undefined) cambios.consentimiento_folio = datos.Consentimiento_Folio;
    if (datos.Consentimiento_Path  !== undefined) cambios.consentimiento_path  = datos.Consentimiento_Path;
    if (!Object.keys(cambios).length) return { status: 'OK', uuid: fila.id };

    const r = await this._fetch(`/usuarios?id=eq.${fila.id}`, {
      method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: JSON.stringify(cambios)
    });
    return r.status === 'OK' ? { status: 'OK', uuid: fila.id } : r;
  },

  async read(module) {
    if (module === '01_Usuarios') {
      const r = await this._fetch('/usuarios?select=*&order=creado_en.desc');
      if (r.status !== 'OK') return r;
      return { status: 'OK', payload: (r._raw || []).map(f => this._usuarioAFrontend(f)) };
    }
    // Orden por 'creado_en': es la única columna de fecha presente en TODAS
    // las tablas (a diferencia de Fecha_Emision/Fecha_Peru/etc., que varían
    // por módulo). No se leen tablas hijas aquí: tal como en Code.gs/READ_DB,
    // el listado trae solo la fila principal.
    // IMPORTANTE: sin Range explicito, PostgREST aplica `db-max-rows` (1000 en
    // Supabase) y devuelve status OK con la tabla CORTADA y sin avisar. Por eso
    // read() ahora recorre paginas hasta agotar la tabla, con un techo duro:
    // devolver 50 000 filas al navegador no es "leer todo", es colgarlo.
    // Quien solo necesite una pagina debe usar consultar(), no read().
    const PAGINA = 1000, TECHO = this.TECHO_LECTURA_COMPLETA;
    let filas = [], desde = 0, total = null;
    while (desde < TECHO) {
      const r = await this._fetch(`/${this._table(module)}?select=*&order=creado_en.desc`, {
        headers: { Prefer: 'count=exact', 'Range-Unit': 'items', Range: `${desde}-${desde + PAGINA - 1}` }
      });
      if (r.status !== 'OK') return desde ? { status: 'OK', payload: filas, total: filas.length, truncado: true } : r;
      const lote = r._raw || [];
      filas = filas.concat(lote.map(f => this._aFrontend(module, f)));
      if (r._total != null) total = r._total;
      if (lote.length < PAGINA) break;
      desde += PAGINA;
    }
    const truncado = total != null && filas.length < total;
    return { status: 'OK', payload: filas, total: total != null ? total : filas.length,
             truncado, msg: filas.length + ' registros' + (truncado ? ' de ' + total : '') };
  },

  /** Techo de read(): mas alla de esto hay que paginar, no cargar todo. */
  TECHO_LECTURA_COMPLETA: 10000,

  // -- Consulta paginada y filtrada EN EL SERVIDOR --------------------------
  // El unico camino correcto para un Resumen: trae una pagina y el total real.
  //   opts = { filtros:{Campo:'texto'}, busqueda:'libre', cond:{...},
  //            limite:50, desde:0, orden:'creado_en.desc' }
  async consultar(module, opts) {
    opts = opts || {};
    const limite = Math.max(1, Math.min(500, parseInt(opts.limite, 10) || 50));
    const desde  = Math.max(0, parseInt(opts.desde, 10) || 0);

    if (module === '01_Usuarios') {
      // La tabla de personal es pequena por naturaleza (una por empresa) y su
      // mapeo de columnas es propio: se filtra y pagina en memoria.
      const r = await this.read(module);
      if (r.status !== 'OK') return r;
      const todas = FILTRO_LOCAL.aplicar(module, r.payload, opts);
      return { status: 'OK', payload: todas.slice(desde, desde + limite), total: todas.length,
               desde, hayMas: desde + limite < todas.length };
    }

    const partes = ['select=*', 'order=' + encodeURIComponent(opts.orden || 'creado_en.desc')]
      .concat(this._condicionesPG(module, opts));
    const r = await this._fetch(`/${this._table(module)}?${partes.join('&')}`, {
      headers: { Prefer: 'count=exact', 'Range-Unit': 'items', Range: `${desde}-${desde + limite - 1}` }
    });
    // 416: el desplazamiento quedo mas alla del final (la tabla cambio entre
    // dos "Cargar mas"). No es un error que el usuario deba ver.
    if (r.status === 'ERROR' && r.httpStatus === 416) {
      return { status: 'OK', payload: [], total: desde, desde, hayMas: false };
    }
    if (r.status !== 'OK') return r;
    const filas = (r._raw || []).map(f => this._aFrontend(module, f));
    const total = r._total != null ? r._total : desde + filas.length;
    return { status: 'OK', payload: filas, total, desde, hayMas: desde + filas.length < total };
  },

  /**
   * Cuenta filas en el servidor SIN traerlas. Es lo que permite que un KPI
   * ("12 vencidos") sea exacto sobre 50 000 registros mientras la tabla solo
   * muestra 50: el conteo lo hace Postgres, no el navegador.
   * @returns {Promise<{status:string, total?:number, msg?:string}>}
   */
  async contar(module, opts) {
    opts = opts || {};
    if (module === '01_Usuarios') {
      const r = await this.consultar(module, Object.assign({}, opts, { limite: 1, desde: 0 }));
      return r.status === 'OK' ? { status: 'OK', total: r.total } : r;
    }
    const partes = ['select=uuid'].concat(this._condicionesPG(module, opts));
    const r = await this._fetch(`/${this._table(module)}?${partes.join('&')}`, {
      headers: { Prefer: 'count=exact', 'Range-Unit': 'items', Range: '0-0' }
    });
    if (r.status !== 'OK') return r;
    return { status: 'OK', total: r._total != null ? r._total : (r._raw || []).length };
  },

  /**
   * Agregado calculado por Postgres: count, sum, max, min o avg sobre TODAS
   * las filas que el usuario puede ver, no solo las cargadas.
   * Usa la funcion motor_agregado (tools/supabase_08_rendimiento.sql), que es
   * `security invoker`: el RLS se aplica igual que en una consulta normal.
   * @param {string} module
   * @param {{metrica?:string, campo?:string, cond?:Object}} opts
   * @returns {Promise<{status:string, valor?:string|null, msg?:string}>}
   */
  async agregado(module, opts) {
    opts = opts || {};
    const metrica = opts.metrica || 'count';
    if (module === '01_Usuarios') {
      // La tabla de plataforma no esta en la lista blanca de la funcion (y no
      // hace falta: es pequena). Se calcula sobre las filas visibles.
      const r = await this.read(module);
      if (r.status !== 'OK') return r;
      return { status: 'OK', valor: FILTRO_LOCAL.agregar(module, r.payload, opts) };
    }
    const r = await this._fetch('/rpc/motor_agregado', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        p_tabla: this._table(module),
        p_metrica: metrica,
        p_columna: opts.campo ? String(opts.campo).toLowerCase() : null,
        p_cond: this._condJSON(module, opts.cond)
      })
    });
    if (r.status !== 'OK') return r;
    return { status: 'OK', valor: r._raw };
  },

  /**
   * Varios agregados a la vez. En Postgres cada conteo usa su indice y sale
   * practicamente gratis, asi que se lanzan en paralelo y no hace falta una
   * funcion aparte. El contrato es el mismo que en Apps Script, donde si hay
   * que agruparlos.
   */
  async agregadoLote(module, consultas) {
    const res = await Promise.all((consultas || []).map(c =>
      this.agregado(module, c).catch(e => ({ status: 'ERROR', msg: (e && e.message) || String(e) }))
    ));
    // Un fallo suelto no invalida el resto: ese KPI queda sin numero y el
    // motor lo marca como parcial.
    return { status: 'OK', valores: res.map(r => (r && r.status === 'OK') ? r.valor : undefined) };
  },

  /**
   * Condiciones del KPI -> jsonb para motor_agregado: claves en snake_case y
   * comodines ('@hoy') ya resueltos, de modo que la base solo ve literales.
   */
  _condJSON(modulo, cond) {
    const out = {};
    Object.keys(cond || {}).forEach(campo => {
      const regla = cond[campo];
      if (regla == null) return;
      if (campo === '$o') {
        out['$o'] = [].concat(regla).map(alt => this._condJSON(modulo, alt));
        return;
      }
      const col = String(campo).toLowerCase();
      if (typeof regla !== 'object' || Array.isArray(regla)) {
        out[col] = { eq: FILTRO_LOCAL.resolverComodin(regla) };
        return;
      }
      const ops = {};
      Object.keys(regla).forEach(op => {
        const v = FILTRO_LOCAL.resolverComodin(regla[op]);
        ops[op] = (op === 'in') ? [].concat(v) : v;
      });
      out[col] = ops;
    });
    return out;
  },

  // -- Traduccion de condiciones a PostgREST --------------------------------

  /**
   * Valor listo para un filtro de PostgREST. Se entrecomilla si contiene algo
   * que PostgREST usa como sintaxis, y los parentesis se codifican a mano:
   * encodeURIComponent los deja pasar y dentro de un and=(...)/or(...) cerrarian
   * el grupo antes de tiempo.
   */
  _valorPG(v) {
    const t = String(v == null ? '' : v);
    const citado = /[,.()"\s:]/.test(t) ? '"' + t.replace(/"/g, '\\"') + '"' : t;
    return encodeURIComponent(citado).replace(/\(/g, '%28').replace(/\)/g, '%29');
  },

  /**
   * Condiciones -> expresion de PostgREST para incrustar en and=(...).
   * Se usa esta forma (y no parametros sueltos) porque es la unica que admite
   * alternativas: and=(estado.neq.Cerrado,or(fecha.lt.X,and(fecha.eq.X,hora.lt.Y)))
   * @returns {string} '' si no hay nada que filtrar
   */
  _exprPG(cond) {
    const partes = [];
    Object.keys(cond || {}).forEach(campo => {
      const regla = cond[campo];
      if (regla == null) return;

      if (campo === '$o') {
        const alts = [].concat(regla).map(alt => this._exprPG(alt)).filter(Boolean);
        if (alts.length === 1) partes.push(alts[0]);
        else if (alts.length) partes.push('or(' + alts.map(e => 'and(' + e + ')').join(',') + ')');
        return;
      }

      const col = String(campo).toLowerCase();
      if (typeof regla !== 'object' || Array.isArray(regla)) {
        partes.push(col + '.eq.' + this._valorPG(FILTRO_LOCAL.resolverComodin(regla)));
        return;
      }
      Object.keys(regla).forEach(op => {
        const v = FILTRO_LOCAL.resolverComodin(regla[op]);
        if (op === 'nulo')      partes.push(col + '.is.' + (v ? 'null' : 'not.null'));
        else if (op === 'like') partes.push(col + '.ilike.' + this._valorPG('*' + v + '*'));
        else if (op === 'in')   partes.push(col + '.in.(' + [].concat(v).map(x => this._valorPG(x)).join(',') + ')');
        else if (['eq','neq','lt','lte','gt','gte'].indexOf(op) !== -1) partes.push(col + '.' + op + '.' + this._valorPG(v));
      });
    });
    return partes.join(',');
  },

  /**
   * { filtros, busqueda, cond } -> lista de parametros de consulta PostgREST.
   *  - filtros:  lo que el usuario escribio en el panel. Texto -> ilike parcial;
   *              Enum/Date/Number -> igualdad (un "contiene" sobre una columna
   *              date o numeric es un error de tipo en Postgres, no un filtro).
   *  - busqueda: termino libre -> or=(col.ilike.*q*,...) sobre columnas de texto.
   *  - cond:     condiciones declarativas de los KPIs { Campo: { op: valor } }.
   */
  _condicionesPG(modulo, opts) {
    const cfg = this._subconfig(modulo);
    const vars = (cfg && cfg.Variables) || {};
    const out = [];

    const filtros = opts.filtros || {};
    Object.keys(filtros).forEach(campo => {
      const v = filtros[campo];
      if (v === '' || v == null) return;
      const def = vars[campo];
      if (!def) return;
      const col = campo.toLowerCase();
      const tipo = FILTRO_LOCAL.tipoColumna(campo, def.type);
      if (tipo === 'text' && def.type !== 'Enum') out.push(`${col}=ilike.${this._valorPG('*' + v + '*')}`);
      else out.push(`${col}=eq.${this._valorPG(v)}`);
    });

    const q = String(opts.busqueda == null ? '' : opts.busqueda).trim();
    if (q) {
      const cols = FILTRO_LOCAL.camposBuscables(modulo).map(c => c.toLowerCase());
      if (cols.length) {
        // Los parentesis y la coma delimitan la propia sintaxis de or=(...)
        const patron = '*' + q.replace(/[(),]/g, ' ') + '*';
        out.push('or=(' + cols.map(c => `${c}.ilike.${patron}`).join(',') + ')');
      }
    }

    const expr = this._exprPG(opts.cond || {});
    if (expr) out.push('and=(' + expr + ')');

    return out;
  },

  async readDelta(module, lastSync) {
    if (module === '01_Usuarios') return this.read(module);
    const ts = encodeURIComponent(lastSync);
    // actualizado_en (supabase_07) captura también las ediciones; si la
    // migración aún no se aplicó, se cae a creado_en (solo altas).
    let r = await this._fetch(`/${this._table(module)}?actualizado_en=gte.${ts}&select=*&order=actualizado_en.asc`);
    if (r.status !== 'OK' && /actualizado_en/.test(r.msg || '')) {
      r = await this._fetch(`/${this._table(module)}?creado_en=gte.${ts}&select=*&order=creado_en.asc`);
    }
    if (r.status !== 'OK') return r;
    return { status: 'OK', payload: (r._raw || []).map(f => this._aFrontend(module, f)) };
  },

  /**
   * Filas hijas de un registro puntual. READ_DB/read() nunca las trae (por
   * diseño: el listado solo pinta la fila principal), así que el formulario
   * de Edición debe pedirlas aparte antes de reconstruir sus filas
   * dinámicas — si no, _guardar() las borra al re-sincronizar (ver abajo).
   */
  async leerHijos(modulo, parentUuid) {
    const childTable = this._childTable(modulo);
    if (!childTable || !parentUuid) return [];
    const r = await this._fetch(`/${childTable}?parent_uuid=eq.${encodeURIComponent(parentUuid)}&select=*`);
    if (r.status !== 'OK') return [];
    return (r._raw || []).map(f => this._hijoAFrontend(modulo, f));
  },

  /**
   * Guarda un registro (alta o edición: mismo camino, como en Sheets) y
   * reemplaza sus filas hijas. "Reemplazar" y no "acumular" es intencional:
   * el formulario manda el set completo de filas dinámicas vigentes — pero
   * eso solo es cierto si el formulario las cargó primero con leerHijos()
   * al editar. Si el llamador manda un array vacío porque nunca las pidió,
   * esto las borra de verdad. Toda vista de Edición con tabla hija DEBE
   * llamar a DataService.readChildren() antes de reconstruir sus filas.
   */
  async _guardar(modulo, datosCrudos, hijosCrudos) {
    if (modulo === '01_Usuarios') return this._guardarUsuario(datosCrudos);

    // Galerías (Image_Collection): al editar, el formulario solo trae las
    // fotos NUEVAS, porque no recarga las ya guardadas. Sin esto, añadir una
    // foto reemplazaba toda la galería (y la subía como _0, pisando el
    // archivo anterior en Storage). Se antepone lo que ya hay en la base.
    const cfg = this._subconfig(modulo);
    const colecciones = cfg && cfg.Variables ? Object.keys(cfg.Variables)
      .filter(k => cfg.Variables[k].type === 'Image_Collection' && datosCrudos[k]) : [];
    if (colecciones.length && datosCrudos.UUID) {
      const prev = await this._fetch(`/${this._table(modulo)}?uuid=eq.${encodeURIComponent(datosCrudos.UUID)}` +
                                     `&select=${colecciones.map(c => c.toLowerCase()).join(',')}`);
      const filaPrev = prev.status === 'OK' && Array.isArray(prev._raw) ? prev._raw[0] : null;
      if (filaPrev) {
        datosCrudos = Object.assign({}, datosCrudos);
        colecciones.forEach(c => {
          const viejas = partirListaMedia(filaPrev[c.toLowerCase()]);
          const nuevas = partirListaMedia(datosCrudos[c]).filter(n => viejas.indexOf(n) === -1);
          datosCrudos[c] = viejas.concat(nuevas).join(',');
        });
      }
    }

    let datos;
    try {
      datos = await this.subirArchivosDe(modulo, datosCrudos);
    } catch (e) {
      return { status: 'ERROR', msg: e.message, transitorio: !!e.transitorio };
    }

    const empresaId = (AppState.User || {}).EmpresaId || null;
    const dniAutor  = (AppState.User || {}).DNI || '';

    const fila = this._aColumnas(modulo, datos);
    fila.empresa_id     = empresaId;
    fila.creado_por_dni = dniAutor;

    // Upsert por UUID: una re-sincronización del mismo registro actualiza en
    // vez de fallar por clave duplicada. OJO: como es un upsert, Postgres
    // evalúa la política RLS de UPDATE si el UUID ya existe — un rol con
    // canCreate:true pero canUpdate:false (ej. Trabajador en 02_Reportes)
    // recibirá 403 si se reintenta el mismo UUID ya guardado (offline
    // retry tras perder la respuesta de éxito). Es un caso extremo poco
    // frecuente; se prefiere sobre la alternativa (ignore-duplicates), que
    // impediría que Admin/Supervisor editen registros existentes.
    const r = await this._fetch(`/${this._table(modulo)}?on_conflict=uuid`, {
      method: 'POST',
      headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify([fila])
    });
    if (r.status !== 'OK') return r;

    const childTable = this._childTable(modulo);
    if (childTable && Array.isArray(hijosCrudos)) {
      const filasHijas = hijosCrudos.map(h => {
        const fh = this._hijoAColumnas(modulo, h);
        fh.empresa_id  = empresaId;
        fh.parent_uuid = datos.UUID;
        return fh;
      });
      const cr = await this._reemplazarHijos(childTable, datos.UUID, filasHijas);
      if (cr.status !== 'OK') return { status: 'PARTIAL', msg: 'Registro guardado; no se actualizaron los detalles: ' + cr.msg, transitorio: !!cr.transitorio };
    }
    return { status: 'OK', uuid: datos.UUID };
  },

  /**
   * Sustituye el detalle de un registro. Usa la RPC reemplazar_hijos
   * (supabase_07): DELETE + INSERT en una sola transacción, así un INSERT
   * fallido no deja el registro sin detalle. Si la base aún no tiene la RPC
   * se usa el método anterior, pero insertando ANTES de borrar lo viejo.
   */
  async _reemplazarHijos(childTable, parentUuid, filas) {
    const r = await this._fetch('/rpc/reemplazar_hijos', {
      method: 'POST',
      body: JSON.stringify({ p_tabla: childTable, p_parent: parentUuid, p_filas: filas })
    });
    if (r.status === 'OK') return r;
    if (!/reemplazar_hijos|PGRST202|Could not find the function|HTTP 404/i.test(r.msg || '')) return r;

    // Respaldo sin RPC: insertar lo nuevo y, solo si funcionó, borrar lo viejo
    const filtro = `parent_uuid=eq.${encodeURIComponent(parentUuid)}`;
    const previos = await this._fetch(`/${childTable}?${filtro}&select=id`);
    if (previos.status !== 'OK') return previos;
    if (filas.length) {
      const ins = await this._fetch(`/${childTable}`, {
        method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify(filas)
      });
      if (ins.status !== 'OK') return ins;
    }
    const ids = (previos._raw || []).map(f => f.id).filter(id => id != null);
    if (ids.length) {
      const del = await this._fetch(`/${childTable}?id=in.(${ids.join(',')})`, { method: 'DELETE' });
      if (del.status !== 'OK') return del;
    }
    return { status: 'OK' };
  },

  create(module, data)  { return this._guardar(module, data, []); },
  update(module, data)  { return this._guardar(module, data, []); },

  async delete(module, uuid) {
    if (!uuid) return { status: 'ERROR', msg: 'UUID requerido para eliminar.' };
    // Solo el padre: la FK de las hijas es ON DELETE CASCADE. Antes se borraban
    // las hijas primero y, si RLS rechazaba borrar el padre (Supervisor,
    // Trabajador), el registro quedaba en pie pero sin su detalle.
    // return=representation: un DELETE que RLS filtra no da error, devuelve
    // 0 filas; así se distingue "eliminado" de "sin permiso".
    const r = await this._fetch(`/${this._table(module)}?uuid=eq.${encodeURIComponent(uuid)}`, {
      method: 'DELETE', headers: { Prefer: 'return=representation' }
    });
    if (r.status !== 'OK') return r;
    if (Array.isArray(r._raw) && r._raw.length === 0) {
      return { status: 'ERROR', msg: 'No se eliminó: el registro no existe o no tienes permiso para borrarlo.' };
    }
    return { status: 'OK' };
  },

  /** Punto de entrada real de guardado: lo usa Offline_Engine tras cada flush de la cola. */
  async syncQueue(module, items) {
    let success = 0, errors = 0;
    const mensajes = [];
    const okIds = [];
    // Por registro: la cola distingue un rechazo real (cuenta para bloquearlo)
    // de un fallo transitorio de red/sesión (se reintenta sin contar).
    const fallos = [];
    for (const item of items) {
      let r;
      try { r = await this._guardar(module, item.payload, item.childPayload || []); }
      catch (e) { r = { status: 'ERROR', msg: e.message, transitorio: !!e.transitorio }; }
      if (r.status === 'OK') { success++; okIds.push(item.localQueueId); }
      else {
        errors++; mensajes.push(r.msg);
        fallos.push({ id: item.localQueueId, msg: r.msg, transitorio: !!r.transitorio });
      }
    }
    return {
      status: errors === 0 ? 'OK' : (success > 0 ? 'PARTIAL' : 'ERROR'),
      processed: items.length,
      success, errors, okIds, fallos,
      msg: mensajes.join('; ')
    };
  }
};


// ── DataService ── Singleton que auto-selecciona el proveedor activo
const DataService = {
  // Sin respaldos silenciosos: si Supabase está elegido pero sin credenciales,
  // se usa Supabase igual y verificarConexion() lo dice. Antes caía a Sheets
  // sin avisar y los datos iban a otro sitio.
  get provider() {
    return AppState.DB_PROVIDER === 'appscript' ? AppsScriptProvider : SupabaseProvider;
  },
  /** { nombre, etiqueta, destino } del proveedor activo (para el panel de Admin) */
  info: () => ({ nombre: DataService.provider.nombre, etiqueta: DataService.provider.etiqueta, destino: DataService.provider.destino }),
  /** Módulos con tabla de datos propia (los subconfigs registrados, sin Admin/Config/Usuarios) */
  modulosDeDatos: () => Object.keys(window)
    .filter(k => /^SUBCONFIG_\d\d_/.test(k) && window[k] && window[k].Config_Modular)
    .map(k => window[k].Config_Modular.NombreInterno)
    .filter(m => m && !/^0[01]_/.test(m) && !/configuraciones/i.test(m))
    .sort(),
  /**
   * Diagnóstico de la conexión con la base de datos activa.
   * @returns {Promise<{proveedor, etiqueta, destino, ok, checks:Array<{grupo,nombre,estado,detalle}>}>}
   */
  async verificarConexion() {
    const p = DataService.provider;
    let checks;
    try { checks = await p.verificarConexion(); }
    catch (e) { checks = [{ grupo: 'conexion', nombre: 'Diagnóstico', estado: 'error', detalle: e.message }]; }
    return { proveedor: p.nombre, etiqueta: p.etiqueta, destino: p.destino,
             ok: !checks.some(c => c.estado === 'error'), checks, fecha: new Date().toISOString() };
  },
  auth:       (dni, hash)        => DataService.provider.auth(dni, hash),
  read:       (module)           => DataService.provider.read(module),
  readDelta:  (module, lastSync) => DataService.provider.readDelta(module, lastSync),
  /**
   * Una PAGINA de un modulo, filtrada en el servidor. Es lo que debe usar todo
   * Resumen: read() trae la tabla entera y no escala a miles de registros.
   * @param {string} module
   * @param {{filtros?:Object, busqueda?:string, cond?:Object, limite?:number, desde?:number, orden?:string}} opts
   * @returns {Promise<{status:string, payload?:Array, total?:number, hayMas?:boolean, msg?:string}>}
   */
  query: (module, opts) => DataService.provider.consultar
    ? DataService.provider.consultar(module, opts)
    : DataService.provider.read(module),
  /**
   * Cuantas filas cumplen una condicion, contadas por la base de datos.
   * Un KPI DEBE usar esto y nunca contar sobre las filas cargadas: con la
   * tabla paginada, contar en el navegador deja fuera lo antiguo (una
   * inspeccion vencida de hace meses) y el tablero miente sin avisar.
   * @returns {Promise<{status:string, total?:number, msg?:string}>}
   */
  count: (module, opts) => DataService.provider.contar
    ? DataService.provider.contar(module, opts)
    : Promise.resolve({ status: 'ERROR', msg: 'Conteo no disponible con este proveedor.' }),
  /**
   * Agregado sobre TODAS las filas visibles: count (por omision), sum, max,
   * min o avg. Lo calcula la base de datos.
   * @param {string} module
   * @param {{metrica?:string, campo?:string, cond?:Object}} opts
   * @returns {Promise<{status:string, valor?:string|null, msg?:string}>}
   */
  aggregate: (module, opts) => DataService.provider.agregado
    ? DataService.provider.agregado(module, opts)
    : Promise.resolve({ status: 'ERROR', msg: 'Agregados no disponibles con este proveedor.' }),
  /**
   * Varios agregados de golpe (la fila de KPIs de un modulo).
   * @param {string} module
   * @param {Array<{metrica?:string, campo?:string, cond?:Object}>} consultas
   * @returns {Promise<{status:string, valores?:Array<string|null|undefined>, msg?:string}>}
   *   valores[i] corresponde a consultas[i]; undefined = ese no se pudo calcular.
   */
  aggregateBatch: (module, consultas) => DataService.provider.agregadoLote
    ? DataService.provider.agregadoLote(module, consultas)
    : Promise.resolve({ status: 'ERROR', msg: 'Agregados no disponibles con este proveedor.' }),
  create:     (module, data)     => DataService.provider.create(module, data),
  update:     (module, data)     => DataService.provider.update(module, data),
  /**
   * Elimina el registro principal y, con él, su informe PDF archivado.
   * El orden importa: primero el registro, después el documento. Si se
   * borrara antes el PDF y el servidor rechazara el borrado del registro
   * (RLS, permiso), quedaría un registro vivo sin su informe y nada volvería
   * a generarlo. Un informe huérfano, en cambio, sí se puede borrar después.
   * El fallo al borrar el documento no convierte en error un borrado que el
   * servidor ya aceptó: se avisa por consola.
   */
  async delete(module, uuid) {
    const r = await DataService.provider.delete(module, uuid);
    if (r && r.status === 'OK' && typeof PDF_TEMPLATE !== 'undefined') {
      try {
        const b = await PDF_TEMPLATE.borrarArchivo(module, uuid);
        if (b && b.status !== 'OK') console.warn('[Informe PDF] no se borró el de ' + module + '/' + uuid + ': ' + b.msg);
      } catch (e) { console.warn('[Informe PDF] no se borró el de ' + module + '/' + uuid + ':', e); }
    }
    return r;
  },
  /**
   * Archiva el informe PDF de un registro (Drive o Storage, según proveedor).
   * Lo llama PDF_TEMPLATE tras cada sincronización del registro.
   * @param {{blob:Blob, modulo:string, uuid:string}} datos
   */
  saveReport: (datos) => DataService.provider.guardarInforme
    ? DataService.provider.guardarInforme(datos)
    : Promise.resolve({ status: 'ERROR', msg: 'Archivo de informes no disponible con este proveedor.' }),
  deleteReport: (module, uuid) => DataService.provider.eliminarInforme
    ? DataService.provider.eliminarInforme(module, uuid) : Promise.resolve({ status: 'OK' }),
  /** { existe, enlace, ruta, donde }. Con `{compartir:true}`, enlace para enviar. */
  reportInfo: (module, uuid, opts) => DataService.provider.infoInforme
    ? DataService.provider.infoInforme(module, uuid, opts) : Promise.resolve({ existe: false }),
  syncQueue:  (module, items)    => DataService.provider.syncQueue(module, items),
  // Detalle (tabla hija) de un registro: lo implementan los dos proveedores
  readChildren: (module, uuid)   => DataService.provider.leerHijos
    ? DataService.provider.leerHijos(module, uuid) : Promise.resolve([]),
  // Archivos: Supabase firma rutas de Storage; Apps Script entrega dataURL desde Drive
  resolveMedia: (valores)        => DataService.provider.resolverMedia
    ? DataService.provider.resolverMedia(valores) : Promise.resolve((valores || []).filter(Boolean)),
  // Cuentas y configuración de empresa (online en los dos proveedores)
  createUser:     (datos, pass)  => DataService.provider.crearUsuario
    ? DataService.provider.crearUsuario(datos, pass)
    : Promise.resolve({ status: 'ERROR', msg: 'Alta de cuentas no disponible con este proveedor.' }),
  changePassword: (uuid, pass)   => DataService.provider.cambiarPassword
    ? DataService.provider.cambiarPassword(uuid, pass)
    : Promise.resolve({ status: 'ERROR', msg: 'No disponible con este proveedor.' }),
  /**
   * Cambio de la propia contraseña (autoservicio desde "Ver mi perfil").
   * Se comprueba la contraseña ACTUAL antes de nada: sin eso, un celular
   * desbloqueado con la sesión abierta bastaría para secuestrar la cuenta.
   * La verificación es un login real, así que también detecta la cuenta cesada.
   * @returns {Promise<{status:'OK'|'ERROR', msg?:string}>}
   */
  async changeOwnPassword(actual, nueva) {
    const dni = (AppState.User || {}).DNI;
    if (!dni) return { status: 'ERROR', msg: 'No hay una sesión activa.' };
    if (!navigator.onLine) return { status: 'ERROR', msg: 'Necesitas conexión a internet para cambiar tu contraseña.' };
    if (String(actual || '') === String(nueva || '')) {
      return { status: 'ERROR', msg: 'La contraseña nueva debe ser distinta de la actual.' };
    }

    let v;
    try { v = await DataService.auth(dni, actual); }
    catch (e) { return { status: 'ERROR', msg: 'No se pudo contactar al servidor. Inténtalo de nuevo.' }; }
    if (v.status === 'CESADO') return { status: 'ERROR', msg: 'Tu acceso está revocado. Contacta al administrador.' };
    if (v.status !== 'OK')     return { status: 'ERROR', msg: 'La contraseña actual no es correcta.' };

    // El login de verificación emite un JWT nuevo; se adopta para que el
    // cambio viaje con una sesión fresca (el anterior podía estar por expirar).
    if (v.userData && v.userData.SupabaseJWT) {
      AppState.updateSession({
        SupabaseJWT: v.userData.SupabaseJWT,
        SupabaseRefreshToken: v.userData.SupabaseRefreshToken || AppState.User.SupabaseRefreshToken
      });
    }

    const p = DataService.provider;
    if (!p.cambiarMiPassword) return { status: 'ERROR', msg: 'No disponible con este proveedor.' };
    return p.cambiarMiPassword(nueva);
  },
  // Constancia de consentimiento de firma digital (Drive o Storage, según proveedor)
  saveConsent:    (datos)        => DataService.provider.guardarConsentimiento
    ? DataService.provider.guardarConsentimiento(datos)
    : Promise.resolve({ status: 'ERROR', msg: 'Guardado de constancias no disponible con este proveedor.' }),
  saveCompanyConfig: (config)    => DataService.provider.guardarConfigEmpresa
    ? DataService.provider.guardarConfigEmpresa(config) : Promise.resolve({ status: 'OK' }),
  // Revoca la sesión en el servidor (no solo en el navegador)
  logout:         ()             => DataService.provider.cerrarSesion
    ? DataService.provider.cerrarSesion() : Promise.resolve(),
};
</script>
