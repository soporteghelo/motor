      <!-- Avatar + Info -->
      <div class="relative z-10 px-5 pt-7 pb-5">
        <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-2xl font-black mb-3 shadow-xl border-2 border-white/25 bg-white/20 text-white" id="drawer-avatar">A</div>
        <div class="text-white font-black text-[15px] leading-snug" id="drawer-username">Admin Usuario</div>
        <div class="text-white/55 text-[11px] mt-0.5" id="drawer-email">admin@empresa.com</div>
        <div class="mt-2.5 inline-flex items-center gap-1 bg-white/15 backdrop-blur-sm text-white/90 text-[9px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-widest border border-white/10">
          <span class="material-symbols-outlined text-[10px]" style="font-variation-settings:'FILL' 1">verified</span>
          <span id="drawer-role-label">Administrador</span>
        </div>
        <button type="button" onclick="openActiveUserProfile()" class="mt-3 flex items-center gap-1.5 text-[10px] font-bold text-white/90 hover:text-white transition-colors">
          <span class="material-symbols-outlined text-[14px]" aria-hidden="true">account_circle</span>
          Ver mi perfil
        </button>
      </div>
    </div>

    <!-- ═══ NAVEGACIÓN ═══ -->
    <!-- nav-label-icon + nav-state-active: cada destino lleva icono Y texto; el activo se
         marca con aria-current. Elementos <button> = navegables por teclado. -->
    <nav id="drawer-nav-list" class="px-3 pt-3 pb-2 flex-1 min-h-0 overflow-y-auto touch-pan-y" aria-label="Navegación principal">

  <script>
    // -------------------------------------------------------------
    // LOGICA VISUAL TOP-BAR GLOBAL Y APLICACIÓN DE COLORES GLOBALES
    // -------------------------------------------------------------
    const btnTheme = document.getElementById("btn-theme");
    const htmlRoot = document.documentElement;

    // Aplicar colores desde Global_Config a las variables CSS (Defensive Mode)
    function applyGlobalColors() {
       try {
           const colors = AppState.UI_Colors;
           if(colors) {
               htmlRoot.style.setProperty('--color-primary', colors.Primary || '#000666');
               htmlRoot.style.setProperty('--color-bg', colors.Background);
               htmlRoot.style.setProperty('--color-surface', colors.Surface);
               htmlRoot.style.setProperty('--color-text', colors.Text);
               
               htmlRoot.style.setProperty('--header-bg', colors.Header_BG);
               htmlRoot.style.setProperty('--footer-bg', colors.Footer_BG);
               htmlRoot.style.setProperty('--fab-bg', colors.FAB_BG);
           }

           const footer = AppState.UI_Components?.Footer;
           if(footer && footer.Visible) {
              const footerEl = document.getElementById('main-footer');
              if(footerEl) footerEl.style.display = 'grid';
              
              const footerText = document.getElementById('footer-text');
              if(footerText) footerText.innerText = footer.Text || '';
              
              const footerVer = document.getElementById('footer-version');
              if(footerVer) footerVer.innerText = `v${AppState.VERSION}`;
           }
       } catch(e) {
           console.warn('Advertencia en UI Theming:', e);
       }
    }
    applyGlobalColors();
    
    // Auto-detección inicial (LocalStorage para Memoria Visual)
    const storedTheme = localStorage.getItem('pwa_theme');
    if(storedTheme === "dark") enableDarkMode();

    btnTheme.addEventListener("click", () => {
       const currentTheme = htmlRoot.getAttribute("data-theme");
       if(currentTheme === "dark") disableDarkMode();
       else enableDarkMode();
    });

    function enableDarkMode() {
       htmlRoot.setAttribute("data-theme", "dark");
       htmlRoot.style.colorScheme = 'dark';   // controles nativos (scroll, selects) acordes al tema
       const ico = document.getElementById('btn-theme-icon');
       if (ico) ico.innerText = "light_mode";
       btnTheme.setAttribute('aria-pressed', 'true');
       btnTheme.setAttribute('aria-label', 'Activar modo claro');
       localStorage.setItem('pwa_theme', 'dark');
    }
    function disableDarkMode() {
       htmlRoot.removeAttribute("data-theme");
       htmlRoot.style.colorScheme = 'light';
       const ico = document.getElementById('btn-theme-icon');
       if (ico) ico.innerText = "dark_mode";
       btnTheme.setAttribute('aria-pressed', 'false');
       btnTheme.setAttribute('aria-label', 'Activar modo oscuro');
       localStorage.setItem('pwa_theme', 'light');
    }

    // -------------------------------------------------------------
    // HELPERS VISUALES DEL MOTOR DE SINCRONIA (Llamado via Offline_Engine)
    // -------------------------------------------------------------
    /**
     * Estado de sincronización del Header. DOS señales, cada una en su sitio:
     *   · la pastilla dice si hay enlace con el servidor (una palabra);
     *   · el número sobre el botón dice cuántos cambios faltan por subir.
     * El texto NO repite el número: con «Sin conexión · 3 pendiente(s)» la
     * cabecera se partía en dos líneas en el móvil, que es donde se registra.
     *
     * @param {string}  statusText  palabra de estado (Conectado, Sin conexión…)
     * @param {boolean} isOffline   no hay enlace con el servidor
     * @param {number}  pendientes  cambios que AÚN no llegaron al servidor.
     *        Sin número = todo enviado; es la señal de que ya se puede cerrar
     *        la app tranquilo. Si no se pasa, el contador se queda como estaba
     *        (una llamada intermedia como "Enviando…" no debe borrarlo).
     */
    function updateSyncUI(statusText, isOffline, pendientes) {
       const texto = String(statusText == null ? '' : statusText);
       const enviando = /enviando|sincroniz[aá]ndo/i.test(texto);
       const conError = /error/i.test(texto);

       const el = document.getElementById('ui-sync-text');
       if (el) el.textContent = texto;
       const dot = document.getElementById('ui-sync-dot');
       if (dot) dot.classList.toggle('offline', !!isOffline && !enviando);

       // Un solo estado para toda la pastilla: color del texto, del borde,
       // del fondo y del punto. Así no hay combinaciones imposibles.
       const chip = document.getElementById('ui-sync-chip');
       if (chip) {
         const estado = enviando ? 'is-sync' : conError ? 'is-warn' : isOffline ? 'is-off' : 'is-ok';
         chip.classList.remove('is-ok', 'is-off', 'is-warn', 'is-sync');
         chip.classList.add(estado);
       }

       const btn = document.getElementById('ui-global-sync-btn');
       // Mientras el usuario fuerza la actualización manda su propio giro
       // (triggerGlobalSync lo mantiene un mínimo visible): un aviso
       // intermedio del motor no debe apagarlo antes de tiempo.
       if (btn) {
         if (enviando) btn.classList.add('sincronizando');
         else if (!btn.dataset.ocupado) btn.classList.remove('sincronizando');
       }

       if (pendientes === undefined) return;
       const badge = document.getElementById('ui-sync-badge');
       if (!badge) return;
       const n = Number(pendientes) || 0;
       badge.hidden = n === 0;
       badge.textContent = n > 99 ? '99+' : String(n);

       // El botón se ve en TODA la app con sesión abierta: en los módulos y en
       // el panel principal. Es el único control de actualización que hay, y
       // esconderlo deja al usuario sin forma de forzar el envío ni de
       // comprobar que todo llegó. Solo desaparece en el Login.
       if (btn && typeof AppState !== 'undefined' && AppState.currentView !== 'Login') {
         btn.style.display = 'flex';
       }
       // El número tiene que llegar también a quien usa lector de pantalla:
       // el distintivo es decorativo, el texto accesible va en el botón.
       if (btn) {
         btn.setAttribute('aria-label', n
           ? 'Sincronizar: ' + n + (n === 1 ? ' cambio pendiente' : ' cambios pendientes')
           : 'Sincronizar datos. Todo enviado');
         btn.title = n
           ? n + (n === 1 ? ' cambio sin enviar' : ' cambios sin enviar') + ' · pulsa para sincronizar'
           : 'Todo sincronizado';
       }
    }
