/**
 * Escapa un valor para insertarlo en HTML (texto o atributo entre comillas).
 * OBLIGATORIO para todo dato de un registro que se pinte con innerHTML o
 * plantillas: los campos los escribe cualquier usuario y, sin escapar, un
 * `<img onerror=…>` se ejecutaría en la sesión de quien abre la lista
 * (y podría leer su token). Para valores dentro de onclick usar data-* +
 * this.dataset, nunca interpolar en código JS.
 */
/**
 * CSS.escape se usa para meter un valor dentro de un selector sin que rompa
 * la consulta. Existe en los navegadores actuales, pero no en webviews
 * antiguos ni en los entornos de prueba: sin este respaldo, cualquier
 * querySelector con un identificador dinámico lanzaba y dejaba la vista a
 * medio pintar.
 */
if (typeof window !== 'undefined' && (typeof window.CSS === 'undefined' || typeof window.CSS.escape !== 'function')) {
  window.CSS = window.CSS || {};
  window.CSS.escape = function (valor) {
    return String(valor).replace(/[^a-zA-Z0-9_ -￿-]/g, c => '\\' + c);
  };
}

function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/**
 * Todo input de DNI acepta como máximo 8 caracteres.
 * Es campo DNI si su nombre lo dice (DNI, Trabajador_DNI, DNI_Jefe…) o su
 * etiqueta lo menciona ("DNI Reportante"). Devuelve los atributos a pegar en
 * el <input> (o '' si no es DNI).
 */
const DNI_MAX = 8;
function esCampoDNI(nombre, etiqueta) {
  return /(^|_)DNI($|_)/i.test(String(nombre || '')) || /\bDNI\b/i.test(String(etiqueta || ''));
}
function attrsDNI(nombre, etiqueta) {
  // Un documento de identidad no lleva espacios ni signos. Se admiten letras
  // porque el carné de extranjería las usa, y el backend acepta 6 a 15
  // caracteres alfanuméricos; aquí el tope son 8 (regla 8).
  return esCampoDNI(nombre, etiqueta)
    ? ' maxlength="' + DNI_MAX + '" inputmode="numeric" autocomplete="off"' +
      ' pattern="[0-9A-Za-z]{6,' + DNI_MAX + '}" title="Entre 6 y ' + DNI_MAX + ' caracteres, sin espacios ni signos"'
    : '';
}

AppState.DB_PROVIDER = (function (p) {
  try { if (/\.googleusercontent\.com$/i.test(location.hostname)) return 'appscript'; } catch (e) {}

  return (p === 'appscript' || p === 'appsscript' || p === 'sheets' || p === 'gas' || p === 'drive') ? 'appscript' : 'supabase';
