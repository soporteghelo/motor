<script>
/**
 * =========================================================================
 * MOTOR_RENDER — las tres vistas se dibujan desde el subconfig
 * =========================================================================
 * ARCHIVO: Motor_Render.js.html
 *
 * QUÉ PROBLEMA RESUELVE
 * Cada módulo describía sus campos DOS veces: una en el subconfig (tipo,
 * etiqueta, obligatorio, filtro) y otra a mano en el HTML de Resumen,
 * Edición y Detalle. Eran ~830 líneas por módulo que había que mantener
 * sincronizadas: agregar un campo al subconfig no lo hacía aparecer en el
 * formulario, y un arreglo de diseño había que repetirlo nueve veces.
 * Peor aún, los errores también se repetían: cuatro Detalles leían
 * `r._asistentes` / `r._peligros` / `r._items`, campos que nadie llenaba,
 * así que el detalle de la tabla hija SIEMPRE salía vacío.
 *
 * CÓMO FUNCIONA
 * El subconfig es la única fuente. Este archivo lee `Variables` y
 * `Config_Modular` y construye las tres vistas. Lo que no se declara se
 * deduce con valores razonables, así que un módulo nuevo funciona con solo
 * su subconfig. El bloque opcional `Vistas` afina columnas, secciones y
 * distintivos sin escribir HTML.
 *
 * LO ESPECÍFICO SIGUE SIENDO POSIBLE — dos escapes, de menor a mayor:
 *   1. MOTOR_HOOKS['07_IPERC'] = { resumen(ctx), edicion(ctx), detalle(ctx) }
 *      Se ejecuta después de pintar: ahí viven el tablero de cobertura de
 *      Charlas, la matriz de riesgo de IPERC o el panel de vigencia de PETAR.
 *   2. Un archivo Mod_XX_Vista.html propio. Si existe, MANDA sobre el
 *      renderizador: el motor no toca esa vista.
 *
 * CONTRATO CON EL RESTO DEL MOTOR
 *   · Escapa todo con esc() (regla 23) y nunca interpola datos en onclick.
 *   · Dos columnas también en móvil (regla 24); solo textos largos, galerías
 *     y firmas ocupan la fila entera.
 *   · Esqueleto de carga, estado vacío, tarjetas móviles y asteriscos de
 *     obligatorio salen de PWA_SKILLS, igual que en las vistas a mano.
 *   · El alcance por rol se aplica con PERMISOS.filtrarDatos() antes de
 *     pintar; la restricción real la impone RLS en la base de datos.
 * =========================================================================
 */

/** Ganchos por módulo: { resumen(ctx), edicion(ctx), detalle(ctx) } */
var MOTOR_HOOKS = window.MOTOR_HOOKS || {};

const MOTOR_RENDER = {

  // Tipos que nunca se pintan como campo de formulario
  OCULTOS: ['Hidden', 'Hidden_UUID'],
  // Tipos que guardan archivos (ocupan fila completa y se suben aparte)
  ARCHIVO: ['Image', 'Image_Collection', 'Signature', 'File', 'Face_Photo'],
  // Campos que llena el sistema: se muestran en el Detalle, nunca se piden
  // en el formulario (quién registró, cuándo) — el usuario no los escribe.
  AUTOMATICOS: ['Registrado_Por', 'Fecha_Registro', 'Creado_Por', 'Creado_En', 'Actualizado_En'],

  _datos: {},        // caché de filas por módulo
  _archivos: {},     // archivos pendientes del formulario abierto
  _refs: {},         // nombre visible elegido en cada campo REF

  // =======================================================================
  // 1 · LECTURA DEL SUBCONFIG
  // =======================================================================
  subconfig: function(modulo) {
    const clave = 'SUBCONFIG_' + String(modulo).toUpperCase().replace(/[^A-Z0-9_]/g, '');
    return window[clave] || null;
  },

  cfg: function(modulo) {
    const sc = this.subconfig(modulo);
    return (sc && sc.Config_Modular) ? sc.Config_Modular : {};
  },

  variables: function(modulo) {
    const sc = this.subconfig(modulo);
    return (sc && sc.Variables) ? sc.Variables : {};
  },

  titulo: function(modulo) {
    const c = this.cfg(modulo);
    return c.Titulo || String(modulo).replace(/^\d+_/, '').replace(/_/g, ' ');
  },

  /** Campos visibles en formulario y detalle (sin UUID ni _ID/_Path) */
  campos: function(modulo) {
    const vars = this.variables(modulo);
    return Object.keys(vars).filter(k => this.OCULTOS.indexOf(vars[k].type) === -1);
  },

  esArchivo: function(def) { return this.ARCHIVO.indexOf(def.type) !== -1; },

  etiqueta: function(nombre, def) {
    return (def && def.label) || String(nombre).replace(/_/g, ' ');
  },

  /**
   * Control concreto para un campo. El subconfig puede imponerlo con
   * `control:`; si no, se deduce del tipo y del nombre, porque los
   * subconfigs declaran como "Text" cosas que son hora, número o párrafo.
   */
  control: function(nombre, def) {
    if (def.control) return def.control;
    // Captura facial: tipo propio, o un Image que la pide con captura:"rostro"
    if (def.type === 'Face_Photo') return 'rostro';
    if ((def.type === 'Image' || def.type === 'Image_Collection') &&
        String(def.captura || '').toLowerCase() === 'rostro') return 'rostro';
    switch (def.type) {
      case 'Date':      return 'date';
      case 'Enum':      return 'select';
      case 'REF':       return 'ref';
      case 'Password':  return 'password';
      case 'Image':
      case 'Image_Collection': return 'imagen';
      case 'Signature': return 'firma';
      case 'File':      return 'archivo';
    }
    if (/^hora|_hora|hora_/i.test(nombre))                                   return 'time';
    if (/(^|_)(email|correo)(_|$)/i.test(nombre))                            return 'email';
    if (/(^|_)(celular|telefono|tel|movil|whatsapp)(_|$)/i.test(nombre))     return 'tel';
    if (/(^|_)(link|url|sitio_web|website)(_|$)/i.test(nombre))              return 'url';
    // Un campo que guarda una cantidad no debe aceptar letras: «Días de
    // descanso» con «dsdsds» dentro no es un error del usuario, es un campo
    // mal declarado. Lo seguro es `control: "number"` en el subconfig; esta
    // lista solo cubre los nombres que no admiten otra lectura.
    if (/(^|_)(dias|horas|minutos|anios|edad|cantidad|cant|num|nro|numero|total|nota|puntaje|monto|costo|precio|importe|peso|porcentaje)(_|$)/i.test(nombre) ||
        /duracion|_min$|^total_|^n_|numero_|cant_/i.test(nombre))            return 'number';
    if (/descripcion|observacion|puntos|compromis|detalle|medida|causa|recomendacion|conclusion|acuerdo|hallazgo|comentario/i.test(nombre)) return 'textarea';
    return 'text';
  },

  /** ¿El campo ocupa la fila entera? (regla 24: aprovechar el espacio) */
  anchoCompleto: function(nombre, def) {
    if (def.anchoCompleto != null) return !!def.anchoCompleto;
    const c = this.control(nombre, def);
    return c === 'textarea' || c === 'imagen' || c === 'firma' || c === 'archivo' || c === 'rostro';
  },

  // =======================================================================
  // 2 · CONFIGURACIÓN DE VISTAS (lo declarado + lo deducido)
  // =======================================================================
  /**
   * Fusiona `Vistas` del subconfig con valores por defecto deducidos de
   * `Variables`. Un módulo sin `Vistas` obtiene tres vistas correctas.
   */
  vistas: function(modulo) {
    if (this._vcache && this._vcache[modulo]) return this._vcache[modulo];
    const sc = this.subconfig(modulo) || {};
    const v  = sc.Vistas || {};
    const vars = this.variables(modulo);
    const campos = this.campos(modulo);

    // ── Resumen: columnas ────────────────────────────────────────────────
    let columnas = v.Resumen && v.Resumen.columnas;
    if (!columnas) {
      // Deducción: se prefieren los campos filtrables (son los que importan)
      const preferidos = campos.filter(k => vars[k].isFilter && !this.esArchivo(vars[k]));
      const resto      = campos.filter(k => !vars[k].isFilter && !this.esArchivo(vars[k]) &&
                                            this.control(k, vars[k]) !== 'textarea');
      columnas = preferidos.concat(resto).slice(0, 6);
    }
    columnas = columnas.map(c => (typeof c === 'string') ? { campo: c } : c);

    // ── Detalle: secciones ───────────────────────────────────────────────
    let secDet = v.Detalle && v.Detalle.secciones;
    if (!secDet) {
      const datos  = campos.filter(k => !this.esArchivo(vars[k]));
      secDet = [{ titulo: 'Datos del registro', campos: datos }];
    }

    // ── Edición: secciones ───────────────────────────────────────────────
    let secEd = v.Edicion && v.Edicion.secciones;
    if (!secEd) {
      const editable = campos.filter(k => this.AUTOMATICOS.indexOf(k) === -1);
      const normales = editable.filter(k => !this.esArchivo(vars[k]));
      const archivos = editable.filter(k =>  this.esArchivo(vars[k]));
      secEd = [{ titulo: 'Datos del registro', icono: this.cfg(modulo).Card_Icon || 'edit_note', campos: normales }];
      if (archivos.length) secEd.push({ titulo: 'Evidencia', icono: 'photo_camera', campos: archivos });
    }

    // Campos de archivo que no estén en ninguna sección de detalle: galería
    const enSecciones = {};
    secDet.forEach(s => (s.campos || []).forEach(c => { enSecciones[c] = true; }));
    const galeria = (v.Detalle && v.Detalle.galeria) ||
      campos.filter(k => this.esArchivo(vars[k]) && !enSecciones[k]);

    const out = {
      subtitulo: v.Subtitulo || '',
      Resumen: Object.assign({
        columnas: columnas,
        ordenPor: (v.Resumen && v.Resumen.ordenPor) || this._campoFecha(modulo),
        orden: 'desc',
        etiquetaCrear: 'Registrar',
        vacio: null
      }, v.Resumen || {}, { columnas: columnas }),
      Edicion: Object.assign({
        secciones: secEd,
        tituloNuevo: 'Registrar ' + this.titulo(modulo).replace(/s$/, ''),
        tituloEditar: 'Editar ' + this.titulo(modulo).replace(/s$/, '')
      }, v.Edicion || {}, { secciones: secEd }),
      Detalle: Object.assign({
        secciones: secDet,
        galeria: galeria,
        titulo: (v.Detalle && v.Detalle.titulo) || columnas[0].campo,
        subtitulo: (v.Detalle && v.Detalle.subtitulo) || []
      }, v.Detalle || {}, { secciones: secDet, galeria: galeria }),
      Hijos: v.Hijos || {},
      Badges: v.Badges || {}
    };
    this._vcache = this._vcache || {};
    this._vcache[modulo] = out;
    return out;
  },

  /** Primer campo de tipo fecha: sirve para ordenar el listado */
  _campoFecha: function(modulo) {
    const vars = this.variables(modulo);
    return Object.keys(vars).find(k => vars[k].type === 'Date') || null;
  },

  // =======================================================================
  // 3 · PIEZAS COMUNES
  // =======================================================================
  /** Identificador CSS/DOM estable por módulo: '10_Charlas' → 'm10-charlas' */
  slug: function(modulo) {
    return 'm' + String(modulo).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  },

  idCampo: function(modulo, nombre) { return this.slug(modulo) + '-f-' + nombre; },
  idTabla: function(modulo) { return this.slug(modulo) + '-body'; },

  /** El módulo entre comillas, listo para un atributo onclick */
  _mod: function(modulo) { return String(modulo).replace(/[^A-Za-z0-9_]/g, ''); },

  /** Distintivo de estado con color del sistema (--st-*), nunca hex crudo */
  badge: function(modulo, campo, valor) {
    if (valor == null || valor === '') return '<span class="text-[11px] text-secondary">—</span>';
    const mapa = this.vistas(modulo).Badges[campo] || {};
    let conf = mapa[valor];
    if (typeof conf === 'string') conf = { tono: conf };
    conf = conf || { tono: 'mute' };
    const ico = conf.icono
      ? '<span class="material-symbols-outlined text-[11px]" aria-hidden="true">' + esc(conf.icono) + '</span>' : '';
    return '<span class="mr-badge" style="background:var(--st-' + esc(conf.tono) + '-bg);color:var(--st-' + esc(conf.tono) +
           '-fg);border-color:var(--st-' + esc(conf.tono) + '-bd)">' + ico + esc(valor) + '</span>';
  },

  /** Valor de una celda ya escapado y listo para innerHTML */
  celda: function(modulo, fila, col) {
    // Columna calculada: la resuelve el módulo en MOTOR_HOOKS[m].columnas.
    // Es el caso de la vigencia de un PETAR o la reposición de un EPP, que
    // no son un campo guardado sino el resultado de comparar con la fecha.
    if (col.render) {
      const f = ((MOTOR_HOOKS[modulo] || {}).columnas || {})[col.render];
      if (typeof f === 'function') {
        try { return f.call(MOTOR_HOOKS[modulo], fila, this); }
        catch (e) { console.error('Columna ' + col.render + ' de ' + modulo + ':', e); return '—'; }
      }
    }
    const val = fila[col.campo];
    if (col.tipo === 'badge' || this.vistas(modulo).Badges[col.campo]) {
      return this.badge(modulo, col.campo, val);
    }
    const principal = '<div class="text-[11px] font-semibold text-on-surface' +
      (col.numero ? ' tabular-nums' : '') + '">' + esc(val || '—') + '</div>';
    if (!col.sub) return principal;
    const sub = fila[col.sub];
    return principal + (sub ? '<div class="text-[10px] text-secondary">' + esc(sub) + '</div>' : '');
  },

  // =======================================================================
  // 4 · VISTA RESUMEN
  // =======================================================================
  htmlResumen: function(modulo) {
    const V = this.vistas(modulo), s = this.slug(modulo), m = this._mod(modulo);
    const cols = V.Resumen.columnas;

    const ths = cols.map(c =>
      '<th class="px-3 py-2.5">' + esc(c.etiqueta || this.etiqueta(c.campo, this.variables(modulo)[c.campo] || {})) + '</th>'
    ).join('');

    return '' +
    '<div id="module-' + esc(modulo.toLowerCase()) + '-resumen" class="module-view">' +
      '<div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">' +
        '<div class="flex items-center gap-3">' +
          '<button onclick="showView(\'Menu\')" aria-label="Volver al menú principal" ' +
            'class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors text-secondary border border-outline-variant shrink-0">' +
            '<span class="material-symbols-outlined text-[20px]" aria-hidden="true">arrow_back</span></button>' +
          '<div><h2 class="font-h2 text-h2 text-on-surface leading-tight">' + esc(this.titulo(modulo)) + '</h2>' +
          (V.subtitulo ? '<p class="text-[11px] text-on-surface-variant">' + esc(V.subtitulo) + '</p>' : '') +
          '</div></div>' +
        '<div class="flex items-center gap-2 w-full sm:w-auto">' +
          '<span id="ui-result-count" class="text-[10px] font-bold text-on-surface-variant mr-auto sm:mr-1 hidden"></span>' +
          '<button id="' + esc(s) + '-export" ' +
            'class="flex items-center gap-1.5 px-3 h-9 border border-outline-variant text-[12px] font-bold text-primary rounded-lg hover:bg-surface-container transition-colors shadow-sm whitespace-nowrap">' +
            '<span class="material-symbols-outlined text-[16px]" aria-hidden="true">download</span>Exportar</button>' +
          '<button data-permiso="crear" onclick="changeInternalView(\'' + esc(m) + '\',\'Edicion\')" ' +
            'class="flex items-center gap-1.5 px-3 h-9 bg-primary text-on-primary rounded-lg text-[12px] font-bold hover:opacity-90 transition-all shadow-sm whitespace-nowrap">' +
            '<span class="material-symbols-outlined text-[16px]" aria-hidden="true">add</span>' + esc(V.Resumen.etiquetaCrear) + '</button>' +
        '</div>' +
      '</div>' +

      // Ranuras para los ganchos del módulo (indicadores, tableros propios)
      '<div id="' + esc(s) + '-kpis" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4 hidden"></div>' +
      '<div id="' + esc(s) + '-extra" class="mb-4 hidden"></div>' +

      '<div id="ui-search-bar-slot"></div>' +

      '<div class="bg-white rounded-2xl border border-outline-variant shadow-sm overflow-hidden">' +
        '<div class="overflow-x-auto"><table class="w-full text-left border-collapse">' +
          '<thead><tr class="bg-surface-container-low text-on-surface-variant text-[11px] font-black uppercase tracking-wider">' +
            ths + '<th class="px-3 py-2.5 text-center" data-nosort>Gestión</th>' +
          '</tr></thead>' +
          '<tbody id="' + esc(this.idTabla(modulo)) + '" class="divide-y divide-outline-variant/40"></tbody>' +
        '</table></div>' +

        // Pie de paginacion: el Resumen trae una pagina, no la tabla entera.
        // Sin este pie el usuario no tendria forma de saber que hay mas.
        '<div id="' + esc(s) + '-paginacion" class="hidden items-center justify-between gap-3 flex-wrap ' +
          'border-t border-outline-variant/60 px-3 py-2.5 bg-surface-container-low">' +
          '<span id="' + esc(s) + '-rango" class="text-[11px] font-bold text-on-surface-variant"></span>' +
          '<button type="button" id="' + esc(s) + '-mas" onclick="MOTOR_RENDER.cargarMas(\'' + esc(m) + '\')" ' +
            'class="flex items-center gap-1.5 px-3 h-8 border border-outline-variant text-[11px] font-bold ' +
            'text-primary rounded-lg hover:bg-surface-container transition-colors whitespace-nowrap">' +
            '<span class="material-symbols-outlined text-[15px]" aria-hidden="true">expand_more</span>' +
            'Cargar mas</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  },

  // -----------------------------------------------------------------------
  // PAGINACION DEL RESUMEN
  // -----------------------------------------------------------------------
  // Un Resumen NO carga la tabla: carga una pagina y pide el total. Con miles
  // de registros, traerlos todos significa (a) cortar en seco a las 1000 filas
  // en Supabase, (b) agotar el tiempo de ejecucion en Apps Script y (c) pintar
  // miles de <tr> que dejan el movil inservible.
  //
  // El precio es que la tabla ya no lo sabe todo. Por eso los KPIs se cuentan
  // en el servidor (ver kpis()) y los filtros viajan al servidor (ver
  // PWA_SKILLS.applyFilters): lo que no esta en pantalla sigue contando.
  TAM_PAGINA: 50,
  _pag: {},

  /** Estado de paginacion del modulo (lo crea si falta). */
  estado: function(modulo) {
    if (!this._pag[modulo]) {
      const V = this.vistas(modulo);
      this._pag[modulo] = {
        filtros: {}, busqueda: '', cond: null, condEtiqueta: '',
        orden: this.ordenServidor(modulo, V.Resumen.ordenPor),
        desde: 0, total: 0, filas: [], cargando: false, local: false
      };
    }
    return this._pag[modulo];
  },

  /**
   * 'Fecha_Peru' -> 'fecha_peru.desc'. El orden lo decide el servidor: ordenar
   * en el navegador solo ordenaria la pagina cargada, que es peor que no
   * ordenar (parece completo y no lo es).
   */
  ordenServidor: function(modulo, campo, dir) {
    const vars = this.variables(modulo);
    const col = (campo && vars[campo]) ? String(campo).toLowerCase() : 'creado_en';
    return col + '.' + (dir === 'asc' ? 'asc' : 'desc');
  },

  /** Carga los datos y pinta la tabla. La llama el router. */
  resumen: async function(modulo) {
    delete this._pag[modulo];
    const st = this.estado(modulo);
    st.desde = 0; st.filas = [];
    await this.cargar(modulo, true);
  },

  /**
   * Vuelve a consultar desde la primera pagina con los criterios actuales.
   * La llaman los filtros, la busqueda y los KPIs.
   * @param {Object} criterios  { filtros, busqueda, cond, condEtiqueta, orden }
   */
  recargar: async function(modulo, criterios) {
    const st = this.estado(modulo);
    Object.keys(criterios || {}).forEach(k => { st[k] = criterios[k]; });
    st.desde = 0; st.filas = [];
    // Si la primera carga del Resumen sigue en curso, `cargar` se habria
    // ido de vuelta sin consultar y la lista quedaria con TODO mientras el
    // aviso dice "solo los pendientes". Se espera a que termine.
    for (let i = 0; st.cargando && i < 100; i++) await new Promise(r => setTimeout(r, 50));
    await this.cargar(modulo, true);
  },

  /** Siguiente pagina, anexada a lo que ya hay en pantalla. */
  cargarMas: async function(modulo) {
    const st = this.estado(modulo);
    if (st.cargando || st.filas.length >= st.total) return;
    st.desde = st.filas.length;
    await this.cargar(modulo, false);
  },

  /**
   * Una pagina del servidor -> la tabla. Si no hay red, cae a la copia local
   * y lo dice: con la tabla paginada, callarlo haria creer que no hay mas
   * registros cuando lo que falta es conexion.
   */
  cargar: async function(modulo, reinicio) {
    const st = this.estado(modulo);
    const tb = this.idTabla(modulo);
    if (st.cargando) return;
    st.cargando = true;
    this._pintarPie(modulo, true);
    if (reinicio) PWA_SKILLS.renderSkeleton(tb, 6);

    const criterios = {
      filtros: st.filtros, busqueda: st.busqueda, cond: st.cond,
      orden: st.orden, limite: this.TAM_PAGINA, desde: st.desde
    };

    let res = null;
    try { res = await DataService.query(modulo, criterios); }
    catch (err) { res = { status: 'ERROR', msg: (err && err.message) || String(err) }; }

    if (!res || res.status !== 'OK' || !Array.isArray(res.payload)) {
      st.cargando = false;
      await this._desdeCacheLocal(modulo, criterios, reinicio, (res && res.msg) || '');
      return;
    }

    st.local = false;
    let pagina = res.payload;
    // Doble cinturon: el RLS ya filtro por alcance en el servidor, pero el
    // proveedor de Sheets delega mas en el cliente.
    if (typeof PERMISOS !== 'undefined') pagina = PERMISOS.filtrarDatos(modulo, pagina);
    st.filas = reinicio ? pagina : st.filas.concat(pagina);
    st.total = (typeof res.total === 'number') ? res.total : st.filas.length;
    st.cargando = false;

    this._datos[modulo] = st.filas;
    this.pintarTabla(modulo, st.filas, { servidor: true, anexar: !reinicio, total: st.total });
    this._guardarCache(modulo, st.filas, reinicio);
    this._pintarPie(modulo, false);
    try { PWA_SKILLS.actualizarOpcionesFiltro(modulo, st.filas); } catch (e) {}
  },

  /** Respaldo sin conexion: la ultima copia sincronizada, filtrada en memoria. */
  _desdeCacheLocal: async function(modulo, criterios, reinicio, motivo) {
    const st = this.estado(modulo);
    const tb = this.idTabla(modulo);
    let cache = [];
    try { cache = await this._leerCache(modulo); } catch (e) { cache = []; }
    if (typeof PERMISOS !== 'undefined') cache = PERMISOS.filtrarDatos(modulo, cache);
    const filtradas = (typeof FILTRO_LOCAL !== 'undefined')
      ? FILTRO_LOCAL.aplicar(modulo, cache, criterios) : cache;

    if (!filtradas.length) {
      if (reinicio) {
        PWA_SKILLS.showEmptyState(tb, {
          icon: 'cloud_off', title: 'Sin conexion',
          message: 'No se pudieron cargar los registros y no hay copia local en este dispositivo.' +
                   (motivo ? ' (' + motivo + ')' : ''),
          actionLabel: 'Reintentar', actionIcon: 'refresh',
          onAction: "MOTOR_RENDER.resumen('" + this._mod(modulo) + "')"
        });
      }
      this._pintarPie(modulo, false);
      return;
    }

    st.local = true;
    st.filas = filtradas.slice(0, Math.max(this.TAM_PAGINA, st.desde + this.TAM_PAGINA));
    st.total = filtradas.length;
    this._datos[modulo] = st.filas;
    this.pintarTabla(modulo, st.filas, { servidor: false, anexar: false, total: st.total });
    this._pintarPie(modulo, false);
    PWA_SKILLS.toast('Sin conexion: se muestra la ultima copia guardada en este dispositivo. ' +
                     'Los indicadores pueden estar incompletos.', 'warning', 5000);
  },

  /** Rango visible y boton "Cargar mas". */
  _pintarPie: function(modulo, cargando) {
    const st = this.estado(modulo), s = this.slug(modulo);
    const pie = document.querySelector('#main-container #' + CSS.escape(s + '-paginacion'));
    if (!pie) return;
    const rango = pie.querySelector('#' + CSS.escape(s + '-rango'));
    const btn = pie.querySelector('#' + CSS.escape(s + '-mas'));
    const n = st.filas.length, total = st.total;

    if (!n) { pie.classList.add('hidden'); pie.classList.remove('flex'); return; }
    pie.classList.remove('hidden'); pie.classList.add('flex');
    if (rango) {
      rango.textContent = (n >= total)
        ? n + (n === 1 ? ' registro' : ' registros') + (st.local ? ' (copia local)' : '')
        : 'Mostrando ' + n + ' de ' + total + (st.local ? ' (copia local)' : '');
    }
    if (btn) {
      const hayMas = n < total && !st.local;
      btn.classList.toggle('hidden', !hayMas);
      btn.disabled = !!cargando;
      btn.style.opacity = cargando ? '0.5' : '';
      btn.lastChild.textContent = cargando ? 'Cargando...' : 'Cargar mas';
    }
  },

  // -- Copia local (respaldo sin conexion) --------------------------------
  // Punto unico de acceso a la copia: asi el almacenamiento se puede cambiar
  // (localStorage -> IndexedDB) sin tocar las vistas.
  _leerCache: async function(modulo) {
    if (typeof MOTOR_CACHE !== 'undefined') return MOTOR_CACHE.leer(modulo);
    try { return JSON.parse(localStorage.getItem('refdata_' + modulo)) || []; } catch (e) { return []; }
  },

  _guardarCache: function(modulo, filas, reemplazar) {
    if (typeof MOTOR_CACHE !== 'undefined') { MOTOR_CACHE.guardar(modulo, filas, reemplazar); return; }
    try { localStorage.setItem('refdata_' + modulo, JSON.stringify(filas)); } catch (e) {}
  },

  /**
   * Pinta filas en la tabla del Resumen.
   * @param {Array} filas
   * @param {{servidor?:boolean, anexar?:boolean, total?:number}} [opts]
   *   servidor: las filas vienen ya ordenadas por la base de datos, no hay que
   *             reordenarlas aqui (reordenar una pagina es enganoso: parece un
   *             orden global y solo ordena lo cargado).
   *   anexar:   son la pagina siguiente, se agregan sin repintar lo anterior.
   *   total:    cuantas filas hay en total segun el servidor.
   */
  pintarTabla: function(modulo, filas, opts) {
    opts = opts || {};
    const V = this.vistas(modulo), tb = this.idTabla(modulo), m = this._mod(modulo);
    const tbody = document.querySelector('#main-container #' + tb);
    if (!tbody) return;
    const cols = V.Resumen.columnas;

    if (!filas.length) {
      const vac = V.Resumen.vacio || {};
      PWA_SKILLS.showEmptyState(tb, {
        icon: vac.icono || this.cfg(modulo).Card_Icon || 'inbox',
        title: vac.titulo || 'Sin registros todavía',
        message: vac.mensaje || 'Cuando registres el primero aparecerá en esta lista.',
        actionLabel: vac.accion || V.Resumen.etiquetaCrear, actionIcon: 'add',
        onAction: "changeInternalView('" + m + "','Edicion')"
      });
      const c = document.querySelector('#main-container #ui-result-count');
      if (c) { c.textContent = '0 registros'; c.classList.remove('hidden'); }
      this._hook(modulo, 'resumen', { filas: filas, modulo: modulo });
      return;
    }

    const campoOrden = V.Resumen.ordenPor;
    const orden = (campoOrden && !opts.servidor)
      ? filas.slice().sort((a, b) => String(b[campoOrden] || '').localeCompare(String(a[campoOrden] || '')))
      : filas.slice();
    // Al anexar solo se pintan las filas nuevas: repintar 2000 <tr> en cada
    // "Cargar mas" es justo el tiron que esto viene a evitar.
    const nuevas = opts.anexar ? orden.slice(tbody.querySelectorAll('tr[data-uuid]').length) : orden;

    PWA_SKILLS.finishLoading(tb);
    const self = this;
    const html = nuevas.map(function(r) {
      const celdas = cols.map(function (c, i) {
        // El primer dato lleva el aviso de "aun sin subir" (regla: lo
        // guardado sin conexion se ve, y se ve que todavia no viajo).
        const marca = (i === 0 && r._pendiente)
          ? '<span class="inline-flex items-center gap-1 align-middle ml-1 px-1.5 py-0.5 rounded-md text-[9px] font-bold" ' +
            'style="background:var(--st-warn-bg,#fff4d6);color:var(--st-warn-fg,#7a5300)" ' +
            'title="Guardado en este dispositivo. Se subirá en cuanto haya conexión.">' +
            '<span class="material-symbols-outlined text-[11px]" aria-hidden="true">cloud_upload</span>Por subir</span>'
          : '';
        return '<td class="px-3 py-2">' + self.celda(modulo, r, c) + marca + '</td>';
      }).join('');
      const u = esc(r.UUID);
      return '<tr class="hover:bg-surface-container-low/50 transition-colors cursor-pointer" data-uuid="' + u + '" ' +
               'onclick="changeInternalView(\'' + m + '\',\'Detalle\',this.dataset.uuid)">' + celdas +
             '<td class="px-3 py-2 text-center" onclick="event.stopPropagation()">' +
               '<div class="flex items-center justify-center gap-1">' +
               '<button data-uuid="' + u + '" onclick="changeInternalView(\'' + m + '\',\'Detalle\',this.dataset.uuid)" ' +
                 'aria-label="Ver el registro" class="w-7 h-7 flex items-center justify-center rounded-lg text-primary hover:bg-primary/10 transition-colors">' +
                 '<span class="material-symbols-outlined text-[15px]" aria-hidden="true">visibility</span></button>' +
               '<button data-permiso="editar" data-uuid="' + u + '" onclick="changeInternalView(\'' + m + '\',\'Edicion\',this.dataset.uuid)" ' +
                 'aria-label="Editar el registro" class="w-7 h-7 flex items-center justify-center rounded-lg text-secondary hover:bg-surface-variant transition-colors">' +
                 '<span class="material-symbols-outlined text-[15px]" aria-hidden="true">edit</span></button>' +
               '</div></td></tr>';
    }).join('');
    if (opts.anexar) tbody.insertAdjacentHTML('beforeend', html);
    else tbody.innerHTML = html;

    // El orden por cabecera se delega al servidor: ordenar solo la pagina
    // cargada daria un orden falso sobre miles de registros.
    PWA_SKILLS.initSortableTable(tb, opts.servidor ? {
      onOrdenar: (idx, dir) => {
        const col = cols[idx];
        if (!col || !col.campo) return false;
        MOTOR_RENDER.recargar(modulo, { orden: MOTOR_RENDER.ordenServidor(modulo, col.campo, dir) });
        return true;
      }
    } : null);
    PWA_SKILLS.enhanceTable(tb);
    const total = (typeof opts.total === 'number') ? opts.total : filas.length;
    const c = document.querySelector('#main-container #ui-result-count');
    if (c) {
      c.textContent = (filas.length >= total)
        ? total + (total === 1 ? ' registro' : ' registros')
        : filas.length + ' de ' + total;
      c.classList.remove('hidden');
    }

    this._hook(modulo, 'resumen', { filas: filas, orden: orden, modulo: modulo,
                                    total: total, parcial: filas.length < total });
  },

  /**
   * Atributos que hacen que un control acepte SOLO lo suyo (regla 28).
   * El teclado del móvil también cambia: numérico para una cantidad, con
   * arroba para un correo. Lo declarado en la variable manda sobre lo
   * deducido: `min`, `max`, `step`, `maxLength`, `pattern`, `placeholder`.
   */
  attrsTipo: function(nombre, def, ctl) {
    const a = [];
    const pon = (k, v) => { if (v !== undefined && v !== null && v !== '') a.push(' ' + k + '="' + esc(v) + '"'); };

    if (ctl === 'number') {
      // Una cantidad negativa no existe en ningún módulo de este motor
      // (días de descanso, trabajadores, notas, costos): el mínimo por
      // defecto es 0 y se cambia declarando `min` en la variable.
      pon('min',  def.min  !== undefined ? def.min  : 0);
      pon('max',  def.max);
      pon('step', def.step !== undefined ? def.step : 1);
      // `decimal` muestra la coma en el teclado del móvil; `numeric`, no
      const entero = String(def.step !== undefined ? def.step : 1).indexOf('.') === -1;
      pon('inputmode', entero ? 'numeric' : 'decimal');
    } else if (ctl === 'email') {
      pon('inputmode', 'email');
      pon('autocomplete', 'email');
      pon('autocapitalize', 'off');
      pon('spellcheck', 'false');
    } else if (ctl === 'tel') {
      pon('inputmode', 'tel');
      pon('autocomplete', 'tel');
      // Dígitos, espacios y los signos de un teléfono; nada de letras
      pon('pattern', def.pattern || '[0-9+()\s-]{6,20}');
    } else if (ctl === 'url') {
      pon('inputmode', 'url');
      pon('autocomplete', 'url');
      pon('pattern', def.pattern || 'https?://.+');
    } else if (ctl === 'text' || ctl === 'textarea') {
      pon('maxlength', def.maxLength);
    }
    if (def.pattern && ctl !== 'tel') pon('pattern', def.pattern);
    if (def.placeholder) pon('placeholder', def.placeholder);
    return a.join('');
  },

  /** Un campo del formulario, con su etiqueta y su control */
  campoHTML: function(modulo, nombre, def) {
    const id = this.idCampo(modulo, nombre);
    const ctl = this.control(nombre, def);
    const lbl = this.etiqueta(nombre, def);
    const ancho = this.anchoCompleto(nombre, def) ? 'col-span-2' : 'col-span-2 md:col-span-1';
    const base = 'w-full h-11 px-4 rounded-xl border border-outline-variant bg-surface-container-low text-sm focus:border-primary outline-none';
    let control;

    if (ctl === 'select') {
      const ops = (def.acceptedValues || []).map(v => '<option value="' + esc(v) + '">' + esc(v) + '</option>').join('');
      control = '<select id="' + esc(id) + '"' + (def.buscador ? ' data-buscador' : '') +
                ' class="' + base + '">' +
                '<option value="">Seleccione…</option>' + ops +
                (def.allowOtherValues ? '<option value="__otro__">Otro…</option>' : '') + '</select>' +
                (def.allowOtherValues
                  ? '<input type="text" id="' + esc(id) + '-otro' + '" placeholder="Especifique" ' +
                    'class="' + base + ' mt-2 hidden">' : '');

    } else if (ctl === 'ref') {
      control = '<select id="' + esc(id) + '" data-ref="' + esc(def.relationalDataOrigin || '') + '" class="' + base + '">' +
                '<option value="">Cargando…</option></select>';

    } else if (ctl === 'textarea') {
      control = '<textarea id="' + esc(id) + '" rows="3"' + this.attrsTipo(nombre, def, ctl) + ' ' +
                'class="w-full p-4 rounded-xl border border-outline-variant bg-surface-container-low text-sm focus:border-primary outline-none resize-none"></textarea>';

    } else if (ctl === 'firma') {
      control = '<canvas id="' + esc(id) + '" class="w-full max-w-lg h-36 bg-surface-container-low rounded-xl border border-outline-variant cursor-crosshair"></canvas>' +
                '<button type="button" onclick="PWA_SKILLS.clearSignature(\'' + esc(id) + '\')" ' +
                  'class="mt-2 text-[11px] font-bold text-secondary hover:text-error transition-colors uppercase flex items-center gap-1.5">' +
                  '<span class="material-symbols-outlined text-sm" aria-hidden="true">history</span>Limpiar firma</button>';

    } else if (ctl === 'rostro') {
      // El panel lo pinta FACE_CAPTURE al abrir la Edición (ver edicion()).
      control = '<div id="' + esc(id) + '" data-campo="' + esc(nombre) + '" ' +
                  'data-modulo="' + esc(this._mod(modulo)) + '" class="fc-host"></div>';

    } else if (ctl === 'imagen' || ctl === 'archivo') {
      const multiple = (def.type === 'Image_Collection') ? ' multiple' : '';
      const accept = (ctl === 'imagen') ? 'image/*' : '';
      const datos = 'data-campo="' + esc(nombre) + '" data-modulo="' + esc(this._mod(modulo)) + '" ' +
                    'onchange="MOTOR_RENDER.tomarArchivos(this)"';
      // Botón cuadrado de 80px: muy por encima del área táctil mínima y con
      // el mismo aspecto que ya tenían estos campos.
      const tecla = (destino, icono, texto, etiquetaAria) =>
          '<button type="button" onclick="document.getElementById(\'' + esc(destino) + '\').click()" ' +
            'aria-label="' + esc(etiquetaAria) + '" ' +
            'class="w-20 h-20 rounded-xl border-2 border-dashed border-outline-variant bg-surface flex flex-col items-center justify-center cursor-pointer hover:bg-surface-container transition-all text-secondary">' +
            '<span class="material-symbols-outlined text-2xl" aria-hidden="true">' + icono + '</span>' +
            '<span class="text-[12px] font-bold mt-0.5 uppercase">' + texto + '</span></button>';

      if (ctl === 'imagen') {
        // DOS entradas, no una. `capture="environment"` abre la cámara trasera
        // directamente; sin ese atributo se abre el selector de archivos.
        //
        // Hace falta separarlas porque dentro del APK el selector de Capacitor
        // NO ofrece la cámara: solo con `capture` lanza ACTION_IMAGE_CAPTURE
        // (ver BridgeWebChromeClient). Y no se puede poner `capture` en la
        // única entrada, porque entonces se pierde el acceso a la galería:
        // a veces la foto ya está tomada.
        //
        // La cámara va primero: en campo es lo que se usa casi siempre.
        control = '<div class="flex items-center gap-3 flex-wrap">' +
            tecla(id + '-cam', 'photo_camera', 'Cámara', 'Tomar foto de ' + lbl + ' con la cámara') +
            tecla(id, 'photo_library', 'Galería', 'Elegir ' + lbl + ' de la galería') +
            // La cámara entrega una foto cada vez: nunca lleva `multiple`.
            '<input type="file" id="' + esc(id) + '-cam" accept="image/*" capture="environment" ' +
              'style="display:none;" ' + datos + '>' +
            '<input type="file" id="' + esc(id) + '"' + multiple + ' accept="image/*" ' +
              'style="display:none;" ' + datos + '>' +
            '<div id="' + esc(id) + '-preview" class="flex gap-2 flex-wrap"></div></div>';
      } else {
        control = '<div class="flex items-center gap-3 flex-wrap">' +
            tecla(id, 'upload_file', 'Archivo', 'Agregar ' + lbl) +
            '<input type="file" id="' + esc(id) + '"' + multiple + (accept ? ' accept="' + accept + '"' : '') +
              ' style="display:none;" ' + datos + '>' +
            '<div id="' + esc(id) + '-preview" class="flex gap-2 flex-wrap"></div></div>';
      }

    } else {
      const tipo = (ctl === 'date') ? 'date' : (ctl === 'time') ? 'time'
                 : (ctl === 'number') ? 'number' : (ctl === 'password') ? 'password'
                 : (ctl === 'email') ? 'email' : (ctl === 'tel') ? 'tel' : (ctl === 'url') ? 'url' : 'text';
      // DNI: máximo 8 caracteres (ver attrsDNI en Global_Config)
      const dni = (tipo === 'text') ? attrsDNI(nombre, def.label) : '';
      control = '<input type="' + tipo + '" id="' + esc(id) + '"' + dni +
                this.attrsTipo(nombre, def, ctl) + ' class="' + base + '">';
    }

    const etiquetaHTML = (ctl === 'firma' || ctl === 'imagen' || ctl === 'archivo' || ctl === 'rostro')
      ? '<label class="block text-xs font-bold text-secondary mb-2">' + esc(lbl) + '</label>'
      : '<label class="block text-xs font-bold text-secondary mb-2" for="' + esc(id) + '">' + esc(lbl) + '</label>';

    return '<div class="' + ancho + '">' + etiquetaHTML + control + '</div>';
  },

  /** Prepara el formulario: opciones REF, firmas, enums con "otro" y datos */
  edicion: async function(modulo, uuid) {
    const s = this.slug(modulo), vars = this.variables(modulo), V = this.vistas(modulo);
    const root = document.querySelector('#main-container #module-' + modulo.toLowerCase() + '-edicion');
    if (!root) return;
    this._archivos[modulo] = {};
    this._refs[modulo] = {};

    const campoUUID = root.querySelector('#' + CSS.escape(s + '-uuid'));
    const titulo = root.querySelector('#' + CSS.escape(s + '-titulo'));
    const esEdicion = uuid && uuid !== 'CURRENT';

    // Formulario en blanco SIEMPRE. La vista se reutiliza mientras no se
    // salga del módulo: sin esto, pasar de editar un registro a crear otro
    // arrastraba los valores y —peor— las filas de detalle del anterior, que
    // se guardaban como si fueran del nuevo.
    this.limpiarFormulario(modulo, root);

    // Enums con valor libre
    this.campos(modulo).forEach(k => {
      if (this.control(k, vars[k]) === 'select' && vars[k].allowOtherValues) {
        PWA_SKILLS.initEnumWithOther(this.idCampo(modulo, k), this.idCampo(modulo, k) + '-otro');
      }
    });

    // Firmas y paneles de captura facial
    setTimeout(() => {
      this.campos(modulo).forEach(k => {
        const c = this.control(k, vars[k]);
        if (c === 'firma')  PWA_SKILLS.initSignaturePad(this.idCampo(modulo, k));
        if (c === 'rostro') this.montarRostro(modulo, k);
      });
    }, 150);

    // Campos REF: se cargan en paralelo
    await Promise.all(this.campos(modulo)
      .filter(k => this.control(k, vars[k]) === 'ref')
      .map(k => {
        const d = vars[k];
        return PWA_SKILLS.loadRelationalOptions(this.idCampo(modulo, k), d.relationalDataOrigin,
          d.columnLabel || 'Nombre_Completo', d.columnValue || 'DNI', d.slice)
          .catch(() => {});
      }));

    const contHijos = root.querySelector('#' + CSS.escape(s + '-hijos'));

    if (esEdicion) {
      let r = (this._datos[modulo] || []).find(x => String(x.UUID) === String(uuid));
      if (!r) {
        try {
          const copia = (typeof MOTOR_CACHE !== 'undefined')
            ? MOTOR_CACHE.leerSync(modulo)
            : (JSON.parse(localStorage.getItem('refdata_' + modulo)) || []);
          r = copia.find(x => String(x.UUID) === String(uuid));
        } catch (e) {}
      }
      if (r) {
        if (titulo) titulo.textContent = V.Edicion.tituloEditar;
        if (campoUUID) campoUUID.value = r.UUID;
        this.campos(modulo).forEach(k => {
          const el = root.querySelector('#' + CSS.escape(this.idCampo(modulo, k)));
          if (!el || el.tagName === 'CANVAS' || el.type === 'file') return;
          const val = r[k] == null ? '' : String(r[k]);
          if (el.tagName === 'SELECT' && val && !Array.from(el.options).some(o => o.value === val)) {
            // Valor escrito a mano con allowOtherValues
            const otro = root.querySelector('#' + CSS.escape(this.idCampo(modulo, k) + '-otro'));
            if (otro) { el.value = '__otro__'; otro.value = val; otro.classList.remove('hidden'); return; }
          }
          el.value = val;
        });
        // Nombre visible del REF, para guardarlo junto al DNI
        this.campos(modulo).filter(k => this.control(k, vars[k]) === 'ref').forEach(k => {
          const el = root.querySelector('#' + CSS.escape(this.idCampo(modulo, k)));
          const op = el && el.options[el.selectedIndex];
          this._refs[modulo][k] = (op && op.value) ? op.textContent.trim() : '';
        });

        // Detalle: se pide al servidor. Sin esto, guardar borraba las filas hijas.
        if (contHijos) {
          contHijos.innerHTML = '';
          let filas = [];
          try { filas = await DataService.readChildren(modulo, r.UUID); } catch (e) { filas = []; }
          filas.forEach(f => this.agregarFila(modulo, f));
          this.contarHijos(modulo);
        }
        this._hook(modulo, 'edicion', { modulo: modulo, uuid: uuid, registro: r, root: root, nuevo: false });
        return;
      }
    }

    // Registro nuevo
    if (titulo) titulo.textContent = V.Edicion.tituloNuevo;
    if (campoUUID) campoUUID.value = (typeof pseudoGenerateUUID === 'function') ? pseudoGenerateUUID() : String(Date.now());

    // La fecha de hoy ya puesta: el registro casi siempre es del día
    this.campos(modulo).forEach(k => {
      if (vars[k].type !== 'Date') return;
      const el = root.querySelector('#' + CSS.escape(this.idCampo(modulo, k)));
      if (el && !el.value && /fecha$|^fecha/i.test(k) && !/vencimiento|caducidad|proxima/i.test(k)) {
        el.value = PWA_SKILLS.getPeruTime(false);
      }
    });
    this.contarHijos(modulo);
    this._hook(modulo, 'edicion', { modulo: modulo, uuid: null, registro: null, root: root, nuevo: true });
  },

  /** Deja el formulario como recién abierto: campos, firmas, archivos y detalle */
  limpiarFormulario: function(modulo, root) {
    const s = this.slug(modulo), vars = this.variables(modulo), V = this.vistas(modulo);
    this._archivos[modulo] = {};
    this._refs[modulo] = {};

    this.campos(modulo).forEach(k => {
      const id = this.idCampo(modulo, k);
      const el = root.querySelector('#' + CSS.escape(id));
      if (!el) return;
      const ctl = this.control(k, vars[k]);
      if (ctl === 'firma') { PWA_SKILLS.clearSignature(id); return; }
      if (ctl === 'rostro') { FACE_CAPTURE.detenerTodas(); el.innerHTML = ''; return; }
      if (ctl === 'imagen' || ctl === 'archivo') {
        el.value = '';
        const prev = root.querySelector('#' + CSS.escape(id + '-preview'));
        if (prev) prev.innerHTML = '';
        return;
      }
      el.value = '';
      const otro = root.querySelector('#' + CSS.escape(id + '-otro'));
      if (otro) { otro.value = ''; otro.classList.add('hidden'); }
    });

    const cont = root.querySelector('#' + CSS.escape(s + '-hijos'));
    if (cont) {
      cont.innerHTML = '<div class="text-center py-6 border border-dashed border-outline-variant rounded-xl text-secondary text-[12px]" id="' +
        esc(s) + '-hijos-vacio">' + esc(V.Hijos.vacio || 'Todavía no agregaste filas al detalle.') + '</div>';
    }
    this.contarHijos(modulo);
  },

  agregarFila: function(modulo, valores) {
    const s = this.slug(modulo);
    const vacio = document.querySelector('#main-container #' + CSS.escape(s + '-hijos-vacio'));
    if (vacio) vacio.remove();
    PWA_SKILLS.addDynamicRow(s + '-hijos', this.cfg(modulo).Relational_Fields || [], valores);

  agregarFilas: function(modulo, n) {
    for (let i = 0; i < n; i++) this.agregarFila(modulo);

    if (n > 1) PWA_SKILLS.toast(n + ' filas agregadas.', 'info', 1800);

  contarHijos: function(modulo) {
    const s = this.slug(modulo);
    const n = document.querySelectorAll('#main-container #' + CSS.escape(s + '-hijos') + ' [id^="row-"]').length;
    const e = document.querySelector('#main-container #' + CSS.escape(s + '-conteo'));

  // ── Archivos ────────────────────────────────────────────────────────────
  /**
   * Panel de captura facial de un campo (`type: "Face_Photo"`, o `Image` con
   * `captura: "rostro"`). La foto entra en `_archivos` igual que una imagen
   * elegida a mano, así que Storage, Detalle y PDF no cambian en nada.
   * Al editar, no tomar una foto nueva deja la anterior tal cual.
   */
  montarRostro: function(modulo, campo) {
    if (typeof FACE_CAPTURE === 'undefined') return;
    const id = this.idCampo(modulo, campo);
    const def = this.variables(modulo)[campo] || {};
    const self = this;
    FACE_CAPTURE.montar(id, {
      etiqueta: this.etiqueta(campo, def),
      estabilidadMs: def.estabilidadMs,
      onCaptura: function(dataUrl) {
        self._archivos[modulo] = self._archivos[modulo] || {};
        self._archivos[modulo][campo] = [dataUrl];
        PWA_SKILLS.toast('Foto capturada.', 'success', 1600);
      },
      onRepetir: function() {
        if (self._archivos[modulo]) delete self._archivos[modulo][campo];
      }
    });
  },

  tomarArchivos: function(input) {
    const modulo = input.dataset.modulo, campo = input.dataset.campo;
    if (!input.files || !input.files.length) return;
    const def = this.variables(modulo)[campo] || {};
    const unico = (def.type === 'Image' || def.type === 'File');
    const id = this.idCampo(modulo, campo);
    const prev = document.querySelector('#main-container #' + CSS.escape(id + '-preview'));
    this._archivos[modulo] = this._archivos[modulo] || {};
    if (unico) { this._archivos[modulo][campo] = []; if (prev) prev.innerHTML = ''; }
    this._archivos[modulo][campo] = this._archivos[modulo][campo] || [];

    const archivos = Array.from(input.files).slice(0, unico ? 1 : 10);
    const calidad = (AppState.Settings || {}).CalidadCompresion || 'Medio';
    archivos.forEach(file => {
      const esImagen = /^image\//.test(file.type);
      const listo = (dataUrl) => {
        this._archivos[modulo][campo].push(dataUrl);
        if (!prev) return;
        const d = document.createElement('div');
        d.className = 'w-20 h-20 rounded-xl border border-outline-variant overflow-hidden relative flex items-center justify-center bg-surface-container-low';
        if (esImagen) {
          const img = document.createElement('img');
          img.className = 'w-full h-full object-cover';
          img.alt = this.etiqueta(campo, def);
          img.src = dataUrl;
          d.appendChild(img);
        } else {
          const t = document.createElement('span');
          t.className = 'text-[10px] font-bold text-secondary px-1 text-center break-all';
          t.textContent = file.name;
          d.appendChild(t);
        }
        prev.appendChild(d);
      };
      if (esImagen) PWA_SKILLS.compressImage(file, calidad).then(listo);
      else {
        const fr = new FileReader();
        fr.onload = () => listo(fr.result);
        fr.readAsDataURL(file);
      }
    });
  },

  // ── Guardado ────────────────────────────────────────────────────────────
  recolectar: function(modulo) {
    const s = this.slug(modulo), vars = this.variables(modulo), cfg = this.cfg(modulo);
    const root = document.querySelector('#main-container #module-' + modulo.toLowerCase() + '-edicion');
    const datos = {};
    if (!root) return { datos: datos, hijos: [] };

    const campoUUID = root.querySelector('#' + CSS.escape(s + '-uuid'));
    if (campoUUID && !campoUUID.value) {
      campoUUID.value = (typeof pseudoGenerateUUID === 'function') ? pseudoGenerateUUID() : String(Date.now());
    }
    datos.UUID = campoUUID ? campoUUID.value : String(Date.now());

    this.campos(modulo).forEach(k => {
      const ctl = this.control(k, vars[k]);
      const id = this.idCampo(modulo, k);
      const el = root.querySelector('#' + CSS.escape(id));

      if (ctl === 'firma') {
        if (!el) return;
        const blanco = document.createElement('canvas');
        blanco.width = el.width; blanco.height = el.height;
        try { if (el.toDataURL() !== blanco.toDataURL()) datos[k] = el.toDataURL('image/png'); } catch (e) {}
        return;
      }
      if (ctl === 'imagen' || ctl === 'archivo' || ctl === 'rostro') {
        const lista = (this._archivos[modulo] || {})[k];
        if (lista && lista.length) datos[k] = lista.join(',');
        return;
      }
      if (ctl === 'select' && vars[k].allowOtherValues) {
        datos[k] = PWA_SKILLS.getEnumValue(id, id + '-otro');
        return;
      }
      if (el) datos[k] = (el.value || '').trim();
    });

    // Campos de cortesía que muchos módulos declaran
    const usuario = (AppState.User || {});
    if (vars.Registrado_Por && !datos.Registrado_Por) datos.Registrado_Por = usuario.Nombre || '';
    if (vars.Fecha_Registro) datos.Fecha_Registro = PWA_SKILLS.getPeruTime();

    // Nombre visible de cada REF, si el módulo declara el campo gemelo
    Object.keys(this._refs[modulo] || {}).forEach(k => {
      const gemelo = k.replace(/_DNI$/, '');
      if (gemelo !== k && vars[gemelo] && !datos[gemelo]) datos[gemelo] = this._refs[modulo][k] || '';
    });

    const hijos = [];
    if (cfg.CHILD_TABLE) {
      root.querySelectorAll('#' + CSS.escape(s + '-hijos') + ' [id^="row-"]').forEach(fila => {
        const o = {};
        o[cfg.RELATIONAL_KEY || 'PARENT_UUID'] = datos.UUID;
        let algo = false;
        fila.querySelectorAll('input[name], select[name], textarea[name]').forEach(el => {
          o[el.name] = el.value;
          if (String(el.value || '').trim()) algo = true;
        });
        if (algo) hijos.push(o);   // las filas vacías del alta en bloque se descartan
      });
    }
    return { datos: datos, hijos: hijos };
  },

  guardarBorrador: function(modulo) {
    const r = this.recolectar(modulo);
    try { localStorage.setItem('draft_' + modulo, JSON.stringify(r)); } catch (e) {}
    PWA_SKILLS.toast('Borrador guardado en este dispositivo.', 'success', 2800);
  },

  guardar: async function(modulo) {
    const vars = this.variables(modulo);
    const { datos, hijos } = this.recolectar(modulo);

    // Validación: la misma lista de obligatorios que marca el asterisco. Solo
    // se exige lo que el formulario realmente pide; un campo obligatorio que
    // el módulo no muestra lo completa el servidor o un gancho, y no debe
    // dejar al usuario atrapado sin saber qué llenar.
    const raiz = document.querySelector('#main-container #module-' + modulo.toLowerCase() + '-edicion');
    const faltan = this.campos(modulo).filter(k =>
      vars[k].required && !String(datos[k] || '').trim() &&
      raiz && raiz.querySelector('#' + CSS.escape(this.idCampo(modulo, k))));
    if (faltan.length) {
      const primero = faltan[0];
      const el = document.querySelector('#main-container #' + CSS.escape(this.idCampo(modulo, primero)));
      if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); if (el.focus) el.focus(); }
      PWA_SKILLS.toast('Falta ' + this.etiqueta(primero, vars[primero]).toLowerCase() +
        (faltan.length > 1 ? ' y ' + (faltan.length - 1) + ' campo(s) más.' : '.'), 'error', 4200);
      return;
    }

    // Regla 28: cada casilla acepta solo lo suyo. El navegador ya impide
    // teclear letras en una cantidad, pero no cubre pegar, autocompletar ni
    // un valor fuera de rango (una nota de 85 sobre 20). Se revisa el
    // formulario entero, incluidas las filas del detalle, y se señala la
    // primera casilla mal puesta en vez de mandar el dato roto a la cola.
    if (raiz) {
      const malo = Array.prototype.find.call(
        raiz.querySelectorAll('input, select, textarea'),
        el => el.willValidate && !el.checkValidity());
      if (malo) {
        malo.scrollIntoView({ block: 'center', behavior: 'smooth' });
        if (malo.focus) malo.focus();
        const etq = (raiz.querySelector('label[for="' + CSS.escape(malo.id || '_') + '"]') || {}).textContent;
        PWA_SKILLS.toast('Revisa ' + ((etq || malo.name || 'el campo').replace('*', '').trim().toLowerCase()) +
          ': ' + (malo.validationMessage || 'el valor no es válido para este campo.'), 'error', 5000);
        if (malo.reportValidity) { try { malo.reportValidity(); } catch (e) {} }
        return;
      }
    }

    // Último filtro del módulo: puede cancelar el guardado devolviendo false
    const hook = (MOTOR_HOOKS[modulo] || {}).antesDeGuardar;
    if (typeof hook === 'function' && (await hook({ modulo: modulo, datos: datos, hijos: hijos })) === false) return;

    try {
      await pushToQueue(modulo, 'SYNC_OFFLINE_QUEUE', datos, hijos);
      try { localStorage.removeItem('draft_' + modulo); } catch (e) {}
      this._archivos[modulo] = {};
      // El registro entra YA en la copia local, marcado como pendiente: sin
      // conexión el Resumen se pinta desde esa copia, y lo que se acaba de
      // guardar tiene que verse. Si no, la persona cree que se perdió y lo
      // vuelve a escribir.
      if (typeof MOTOR_CACHE !== 'undefined' && MOTOR_CACHE.anteponer) {
        const ahora = (typeof PWA_SKILLS !== 'undefined' && PWA_SKILLS.getPeruTime)
          ? PWA_SKILLS.getPeruTime(true) : new Date().toISOString();
        try {
          await MOTOR_CACHE.anteponer(modulo, Object.assign({}, datos, {
            _pendiente: true,
            Creado_En: datos.Creado_En || ahora,
            creado_en: datos.creado_en || datos.Creado_En || ahora,
            Creado_Por_DNI: datos.Creado_Por_DNI || (AppState.User || {}).DNI || '',
            creado_por_dni: datos.creado_por_dni || (AppState.User || {}).DNI || ''
          }));
        } catch (e) { /* sin copia local: se verá al sincronizar */ }
      }
      PWA_SKILLS.toast('Registro guardado' + (hijos.length ? ' con ' + hijos.length + ' fila(s) de detalle' : '') + '.', 'success', 3400);
      changeInternalView(modulo, 'Resumen');
    } catch (err) {
      console.error('No se pudo guardar ' + modulo + ':', err);
      PWA_SKILLS.toast('No se pudo guardar. Vuelve a intentarlo.', 'error', 5000);
    }
  },

  detalle: async function(modulo, uuid) {
    const s = this.slug(modulo), V = this.vistas(modulo), vars = this.variables(modulo);
    const root = document.querySelector('#main-container #module-' + modulo.toLowerCase() + '-detalle');
    if (!root) return;
    const q = id => root.querySelector('#' + CSS.escape(id));
    const tit = q(s + '-det-titulo');
    if (tit) tit.textContent = 'Cargando…';

    let filas = this._datos[modulo] || [];
    if (!filas.length) {
      try { filas = JSON.parse(localStorage.getItem('refdata_' + modulo)) || []; } catch (e) { filas = []; }
    }
    let r = filas.find(x => String(x.UUID) === String(uuid));
    if (!r) {
      // Se pide ESE registro, no la tabla. Bajar el modulo entero para
      // encontrar una fila no escala (y en Supabase el corte de 1 000 filas
      // hacia que un registro antiguo "no existiera" aunque estuviera ahi).
      try {
        const res = await DataService.query(modulo, { cond: { UUID: { eq: String(uuid) } }, limite: 1 });
        const fila = (res && res.status === 'OK' && Array.isArray(res.payload)) ? res.payload[0] : null;
        if (fila) {
          r = fila;
          this._datos[modulo] = (this._datos[modulo] || []).filter(x => String(x.UUID) !== String(uuid)).concat([fila]);
        }
      } catch (e) { /* se resuelve abajo */ }
    }
    if (!r) {
      if (tit) tit.textContent = 'Registro no encontrado';
      // Sin registro no hay nada que editar ni que imprimir: dejar los
      // botones activos llevaba a exportar un PDF con datos de ejemplo.
      const sinDatos = q(s + '-det-editar'), sinPdf = q(s + '-det-pdf'), sinEnviar = q(s + '-det-enviar');
      [sinDatos, sinPdf, sinEnviar].forEach(b => { if (b) b.classList.add('hidden'); });
      const cuerpo = root.querySelector('#' + CSS.escape(s + '-det-cuerpo')) || root;
      const aviso = document.createElement('div');
      aviso.id = s + '-det-aviso';
      aviso.className = 'bg-white rounded-2xl border border-outline-variant p-6 text-center';
      aviso.innerHTML = '<span class="material-symbols-outlined text-3xl text-secondary" aria-hidden="true">search_off</span>' +
        '<h4 class="text-sm font-bold text-on-surface mt-2">No se encontro el registro</h4>' +
        '<p class="text-[12px] text-secondary mt-1">Puede que lo hayan eliminado, que pertenezca a otra empresa ' +
        'o que todavia no se haya sincronizado en este dispositivo.</p>';
      const previo = root.querySelector('#' + CSS.escape(s + '-det-aviso'));
      if (previo) previo.remove();
      cuerpo.insertBefore(aviso, cuerpo.firstChild);
      PWA_SKILLS.toast('No se pudo cargar el registro.', 'error', 4000);
      return;
    }
    // Registro encontrado: por si se venia de uno que no existia
    const avisoPrevio = root.querySelector('#' + CSS.escape(s + '-det-aviso'));
    if (avisoPrevio) avisoPrevio.remove();
    [q(s + '-det-editar'), q(s + '-det-pdf'), q(s + '-det-enviar')].forEach(b => { if (b) b.classList.remove('hidden'); });

    // Acciones de la cabecera (sin interpolar el UUID en onclick)
    const btnEd = q(s + '-det-editar');
    if (btnEd) btnEd.onclick = () => changeInternalView(modulo, 'Edicion', r.UUID);
    // Título del documento: lo que la persona lee en la cabecera del Detalle,
    // no el UUID (en el PDF y en WhatsApp un UUID no le dice nada a nadie).
    const tituloDoc = String(r[V.Detalle.titulo] || '').trim() || this.titulo(modulo);
    const btnPdf = q(s + '-det-pdf');
    if (btnPdf) btnPdf.onclick = () => PDF_TEMPLATE.exportarRegistro(modulo, r.UUID, tituloDoc);
    const btnEnviar = q(s + '-det-enviar');
    if (btnEnviar) btnEnviar.onclick = e => PDF_TEMPLATE.enviarPorWhatsApp(modulo, r.UUID, tituloDoc, e.currentTarget);

    if (tit) tit.textContent = r[V.Detalle.titulo] || this.titulo(modulo);

    const badges = q(s + '-det-badges');
    if (badges) {
      const conEstado = Object.keys(V.Badges).filter(k => r[k]).map(k => this.badge(modulo, k, r[k])).join('');
      const texto = (V.Detalle.subtitulo || []).map(k => r[k]).filter(Boolean).map(x => esc(x)).join(' · ');
      badges.innerHTML = conEstado + (texto ? '<span class="text-[10px] text-secondary font-semibold">' + texto + '</span>' : '');
    }

    V.Detalle.secciones.forEach((sec, i) => {
      const cont = q(s + '-det-sec-' + i);
      if (!cont) return;
      cont.innerHTML = (sec.campos || []).filter(k => vars[k]).map(k => {
        if (this.control(k, vars[k]) === 'textarea') {
          return '<div class="col-span-2"><p class="text-[10px] font-black text-secondary uppercase tracking-widest mb-1">' +
                 esc(this.etiqueta(k, vars[k])) + '</p>' +
                 '<p class="text-[13px] text-on-surface leading-relaxed">' + esc(r[k] || '—') + '</p></div>';
        }
        return this.detCampo(this.etiqueta(k, vars[k]), r[k]);
      }).join('');
    });

    // Detalle (tabla hija): se pide al servidor. Antes se leía una propiedad
    // que nadie llenaba y el detalle salía vacío siempre.
    if (this.cfg(modulo).CHILD_TABLE) {
      const lista = q(s + '-det-hijos'), conteo = q(s + '-det-conteo');
      let hijos = [];
      try { hijos = await DataService.readChildren(modulo, r.UUID); } catch (e) { hijos = []; }
      if (conteo) conteo.textContent = hijos.length ? hijos.length + ' fila(s)' : '';
      if (lista) lista.innerHTML = hijos.length ? this.tablaHijos(modulo, hijos) :
        '<div class="ds-empty" role="status">' +
          '<span class="material-symbols-outlined ds-empty-icon" aria-hidden="true">list_alt</span>' +
          '<h4>Sin detalle registrado</h4><p>' + esc(V.Hijos.vacioDetalle || 'Este registro no tiene filas de detalle.') + '</p></div>';
    }

    (V.Detalle.galeria || []).forEach(k => {
      PWA_SKILLS.renderDriveMedia(r[k] || '', k, s + '-det-media-' + k);
    });

    this._hook(modulo, 'detalle', { modulo: modulo, registro: r, uuid: uuid, root: root });
  },

  /** Las filas hijas como tabla compacta (se vuelve tarjetas en móvil) */
  tablaHijos: function(modulo, hijos) {
    const campos = (this.cfg(modulo).Relational_Fields || []).filter(f => f.type !== 'display' || true);
    const ths = campos.map(f => '<th class="px-3 py-2">' + esc(f.label || f.name) + '</th>').join('');
    const trs = hijos.map(h =>
      '<tr>' + campos.map(f =>
        '<td class="px-3 py-2 text-[12px] text-on-surface" data-label="' + esc(f.label || f.name) + '">' +
        esc(h[f.name] || '—') + '</td>').join('') + '</tr>').join('');
    return '<div class="overflow-x-auto"><table class="w-full text-left border-collapse mr-hijos">' +
      '<thead><tr class="bg-surface-container-low text-on-surface-variant text-[10px] font-black uppercase tracking-wider">' +
      ths + '</tr></thead><tbody class="divide-y divide-outline-variant/40">' + trs + '</tbody></table></div>';
  },

  // =======================================================================
  // 7 · INTEGRACIÓN CON EL ROUTER
  // =======================================================================
  _hook: function(modulo, cual, ctx) {
    const grupo = MOTOR_HOOKS[modulo] || {};
    const h = grupo[cual];
    if (typeof h !== 'function') return;
    // Con h(ctx) el gancho perdía su `this` y no podía usar sus propios
    // ayudantes (this._hoy(), etc.): se invoca sobre su objeto.
    try { h.call(grupo, ctx); } catch (e) { console.error('Hook ' + cual + ' de ' + modulo + ':', e); }
  },

  /**
   * Construye la vista que falte. Devuelve el elemento o null si el módulo
   * no tiene subconfig (no es un módulo de datos).
   */
  construir: function(modulo, tipo) {
    if (!this.subconfig(modulo)) return null;
    let html;
    if (tipo === 'resumen')      html = this.htmlResumen(modulo);
    else if (tipo === 'edicion') html = this.htmlEdicion(modulo);
    else if (tipo === 'detalle') html = this.htmlDetalle(modulo);
    else return null;

    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    const el = tmp.firstElementChild;

    // El router llama a loadResumen_X / loadEdicion_X / loadDetail_X. Se
    // registran aquí solo si el módulo no trae los suyos.
    const m = modulo;
    if (tipo === 'resumen' && typeof window['loadResumen_' + m] !== 'function') {
      window['loadResumen_' + m] = () => MOTOR_RENDER.resumen(m);
    }
    if (tipo === 'edicion' && typeof window['loadEdicion_' + m] !== 'function') {
      window['loadEdicion_' + m] = (uuid) => MOTOR_RENDER.edicion(m, uuid);
    }
    if (tipo === 'detalle' && typeof window['loadDetail_' + m] !== 'function') {
      window['loadDetail_' + m] = (uuid) => MOTOR_RENDER.detalle(m, uuid);
    }
    return el;
  },

  /**
   * Fila de indicadores sobre la tabla. La llaman los ganchos: el motor no
   * puede deducir que numero importa en cada modulo, pero si como se pinta y
   * -esto es lo importante- DONDE se cuenta.
   *
   * Un KPI se declara con una condicion, no con un filtro de JavaScript:
   *
   *   { tono:'bad', etiqueta:'Plazo vencido',
   *     cond: { Estado_Actual:{neq:'Cerrado'}, Plazo:{lt:'@hoy'} } }
   *
   * Esa condicion se usa para DOS cosas:
   *   1. Contar en la base de datos (count sobre la tabla entera, no sobre las
   *      filas cargadas). Con el Resumen paginado, contar en el navegador
   *      dejaria fuera lo que no esta en pantalla: una inspeccion vencida de
   *      hace ocho meses no apareceria en "vencidas" y el tablero mentiria.
   *   2. Filtrar al pulsar la tarjeta: la misma condicion viaja al servidor y
   *      vuelven esas filas, por antiguas que sean.
   *
   * Otras formas de tarjeta:
   *   { metrica:'sum', campo:'Total_Peligros' }      suma en la base
   *   { metrica:'max', campo:'Fecha_Evento', cond:{...}, formato:f }
   *   { valor: 42 }                                  numero ya calculado
   *
   * @param {{tono?:string, etiqueta:string, cond?:Object, metrica?:string,
   *          campo?:string, valor?:*, formato?:function, filtrable?:boolean,
   *          filtro?:function}[]} tarjetas
   */
  kpis: function(modulo, tarjetas) {
    const cont = document.querySelector('#main-container #' + CSS.escape(this.slug(modulo) + '-kpis'));
    if (!cont) return;
    if (!tarjetas || !tarjetas.length) { cont.classList.add('hidden'); return; }

    this._kpis[modulo] = tarjetas;
    const esperando = t => (t.valor === undefined && (t.cond || t.metrica));

    cont.innerHTML = tarjetas.map((t, i) => {
      const tono = t.tono || 'mute';
      // Hueco mientras llega el conteo: '—' y no un 0, porque un 0 provisional
      // se lee como "no hay ninguno" y es justo lo contrario de "no se sabe".
      const valor = esperando(t) ? '—' : this._valorKpi(t, t.valor);
      const estilo = 'background:var(--st-' + esc(tono) + '-bg);border-color:var(--st-' + esc(tono) + '-bd)';
      const cuerpo =
        '<p class="text-[10px] font-black uppercase tracking-widest mb-1" style="color:var(--st-' + esc(tono) + '-fg)">' +
          esc(t.etiqueta) + '</p>' +
        '<p data-kpi-valor="' + i + '" class="text-2xl font-black tabular-nums" style="color:var(--st-' + esc(tono) + '-fg)">' +
          esc(valor) + '</p>';
      const clicable = t.filtro || (t.cond && t.filtrable !== false);
      return clicable
        ? '<button type="button" data-kpi="' + i + '" aria-pressed="false" ' +
            'class="mr-kpi rounded-2xl border p-3 shadow-sm text-left hover:shadow-md transition-all" style="' + estilo + '">' +
            cuerpo + '</button>'
        : '<div class="rounded-2xl border p-3 shadow-sm" style="' + estilo + '">' + cuerpo + '</div>';
    }).join('');
    cont.classList.remove('hidden');

    const self = this;
    cont.querySelectorAll('.mr-kpi').forEach(b => {
      const i = parseInt(b.dataset.kpi, 10);
      const t = tarjetas[i];
      b.addEventListener('click', () => {
        // Compatibilidad: un gancho sin migrar trae su propio filtro de JS.
        if (t.filtro) { t.filtro(); self.marcarKpiActivo(modulo, i); return; }
        const st = self.estado(modulo);
        const yaActivo = st.condEtiqueta === t.etiqueta;
        self.recargar(modulo, yaActivo
          ? { cond: null, condEtiqueta: '' }                 // segundo clic: quita el filtro
          : { cond: t.cond, condEtiqueta: t.etiqueta, filtros: {}, busqueda: '' });
        if (!yaActivo) self._limpiarControlesFiltro();
        self.marcarKpiActivo(modulo, yaActivo ? -1 : i);
      });
    });

    this._resolverKpis(modulo, tarjetas);
  },

  _kpis: {},

  /** Aplica el formato declarado por la tarjeta (si trae uno). */
  _valorKpi: function(t, valor) {
    if (typeof t.formato === 'function') {
      try { return t.formato(valor); } catch (e) { return valor; }
    }
    return (valor == null || valor === '') ? '—' : valor;
  },

  /**
   * Pide a la base los numeros de las tarjetas declarativas, TODOS en una sola
   * llamada (DataService.aggregateBatch).
   *
   * Que sea una y no una por tarjeta importa sobre todo con Apps Script: una
   * hoja de calculo no tiene indices, asi que cada peticion relee la hoja
   * completa. Pidiendo los cuatro KPI por separado, un Resumen leia la hoja
   * cinco veces (la pagina + cada KPI) y paginar habria salido mas caro que
   * no paginar. En Supabase el lote se resuelve en paralelo, donde cada conteo
   * usa su indice.
   *
   * Si no hay red, se cuenta sobre la copia cargada y el numero se marca como
   * parcial (un '~' y un title que lo explica): dar un numero incompleto como
   * si fuera exacto es peor que no darlo.
   */
  _resolverKpis: async function(modulo, tarjetas) {
    const cont = document.querySelector('#main-container #' + CSS.escape(this.slug(modulo) + '-kpis'));
    if (!cont) return;

    // Solo las que hay que preguntar: una tarjeta con 'valor' ya esta resuelta.
    const pendientes = [];
    tarjetas.forEach((t, i) => {
      if (t.valor === undefined && (t.cond || t.metrica)) pendientes.push({ i, t });
    });
    if (!pendientes.length) return;

    const res = await DataService.aggregateBatch(modulo, pendientes.map(({ t }) => ({
      metrica: t.metrica || 'count', campo: t.campo, cond: t.cond || {}
    }))).catch(e => ({ status: 'ERROR', msg: (e && e.message) || String(e) }));

    const valores = (res && res.status === 'OK' && Array.isArray(res.valores)) ? res.valores : [];
    const filasLocales = (this._pag[modulo] && this._pag[modulo].filas) || [];

    pendientes.forEach(({ i, t }, n) => {
      const destino = cont.querySelector('[data-kpi-valor="' + i + '"]');
      if (!destino) return;

      let valor = valores[n], parcial = false;
      if (valor === undefined) {
        // Ese conteo no se pudo hacer en el servidor: se estima con lo cargado.
        parcial = true;
        valor = (typeof FILTRO_LOCAL !== 'undefined')
          ? FILTRO_LOCAL.agregar(modulo, filasLocales, { metrica: t.metrica || 'count', campo: t.campo, cond: t.cond })
          : null;
      }

      const texto = this._valorKpi(t, valor);
      destino.textContent = parcial ? '~' + texto : texto;
      if (parcial) {
        destino.title = 'Calculado solo con los registros descargados en este dispositivo: ' +
                        'puede faltar lo que no se ha sincronizado.';
        destino.style.opacity = '0.75';
      } else {
        destino.removeAttribute('title');
        destino.style.opacity = '';
      }
    });
  },

  /** Resalta la tarjeta cuyo filtro esta aplicado (-1 = ninguna). */
  marcarKpiActivo: function(modulo, indice) {
    const cont = document.querySelector('#main-container #' + CSS.escape(this.slug(modulo) + '-kpis'));
    if (!cont) return;
    cont.querySelectorAll('.mr-kpi').forEach(b => {
      const activo = parseInt(b.dataset.kpi, 10) === indice;
      b.setAttribute('aria-pressed', activo ? 'true' : 'false');
      b.style.outline = activo ? '2px solid var(--color-primary, #162138)' : '';
      b.style.outlineOffset = activo ? '1px' : '';
    });
  },

  /** Vacia la barra de busqueda y el panel al aplicar un KPI. */
  _limpiarControlesFiltro: function() {
    const buscar = document.querySelector('#main-container #ui-search-input');
    if (buscar) buscar.value = '';
    const panel = document.querySelector('#main-container #ui-filter-panel');
    if (panel) {
      panel.querySelectorAll('input').forEach(i => { i.value = ''; });
      panel.querySelectorAll('select').forEach(sel => { sel.selectedIndex = 0; });
    }
  },

  /**
   * Exportacion del listado activo. Con la tabla paginada, exportar lo que se
   * ve seria exportar 50 filas de 3 480 y el archivo mentiria por omision: se
   * piden al servidor TODAS las filas que cumplen los filtros vigentes.
   * @param {string} modulo
   * @param {'xlsx'|'csv'} [formato]
   */
  exportar: async function(modulo, formato) {
    if (!this._pag[modulo]) { PWA_SKILLS.exportFilteredToExcel(); return; }   // vista no paginada
    const st = this.estado(modulo);
    const V = this.vistas(modulo);
    const cols = V.Resumen.columnas.filter(c => c.campo);

    PWA_SKILLS.toast('Preparando la exportación…', 'info', 2500);
    const filas = [];
    const LOTE = 500;
    let desde = 0, total = null;
    while (desde < this.TOPE_EXPORTACION) {
      const res = await DataService.query(modulo, {
        filtros: st.filtros, busqueda: st.busqueda, cond: st.cond,
        orden: st.orden, limite: LOTE, desde: desde
      }).catch(() => null);
      if (!res || res.status !== 'OK' || !Array.isArray(res.payload)) break;
      filas.push.apply(filas, res.payload);
      if (typeof res.total === 'number') total = res.total;
      if (res.payload.length < LOTE) break;
      desde += LOTE;
    }

    if (!filas.length) {
      // Sin red queda lo descargado: es poco, pero decirlo es mejor que un
      // archivo vacio sin explicacion.
      if (st.filas.length) PWA_SKILLS.toast('Sin conexión: se exporta solo lo descargado (' + st.filas.length + ' filas).', 'warning', 5000);
      else { PWA_SKILLS.toast('No se pudo obtener los datos para exportar.', 'error', 4000); return; }
      filas.push.apply(filas, st.filas);
    } else if (total != null && filas.length < total) {
      PWA_SKILLS.toast('La exportación se limitó a ' + filas.length + ' de ' + total +
                       ' registros. Filtra para acotarla.', 'warning', 6000);
    }

    // Una columna por columna del Resumen, con el valor del campo (no el HTML).
    const datos = filas.map(r => {
      const o = {};
      cols.forEach(c => {
        const etq = c.etiqueta || this.etiqueta(c.campo, this.variables(modulo)[c.campo] || {});
        o[etq] = (r[c.campo] == null) ? '' : String(r[c.campo]);
      });
      return o;
    });

    const nombre = String(modulo).replace(/^\d+_/, '');
    if (formato === 'csv') PWA_SKILLS.exportDatosToCSV(datos, nombre);
    else PWA_SKILLS.exportToExcel(datos, nombre);
  },

  /** Tope de la exportacion: un .xlsx de 50 000 filas no lo abre nadie. */
  TOPE_EXPORTACION: 20000
};

// El botón Exportar abre un menú pequeño; se arma al vuelo para no repetirlo
// en cada vista generada.
document.addEventListener('click', function(e) {
  const btn = e.target && e.target.closest ? e.target.closest('[id$="-export"]') : null;
  if (!btn || !AppState.activeModule) return;
  if (btn.dataset.abierto === '1') { btn.dataset.abierto = '0'; const m = document.getElementById('mr-export-menu'); if (m) m.remove(); return; }
  const viejo = document.getElementById('mr-export-menu');
  if (viejo) viejo.remove();
  const menu = document.createElement('div');
  menu.id = 'mr-export-menu';
  menu.className = 'absolute right-0 top-full mt-1.5 w-44 bg-white rounded-xl border border-outline-variant shadow-xl z-50 overflow-hidden';
  menu.innerHTML =
    '<button type="button" data-f="xlsx" class="w-full flex items-center gap-2.5 px-4 py-3 text-[12px] font-semibold text-on-surface hover:bg-surface-container-low transition-colors">' +
      '<span class="material-symbols-outlined text-[17px]" style="color:var(--st-ok-fg)" aria-hidden="true">grid_on</span>Excel (.xlsx)</button>' +
    '<button type="button" data-f="csv" class="w-full flex items-center gap-2.5 px-4 py-3 text-[12px] font-semibold text-on-surface hover:bg-surface-container-low transition-colors border-t border-outline-variant/30">' +
      '<span class="material-symbols-outlined text-[17px]" style="color:var(--st-info-fg)" aria-hidden="true">text_snippet</span>CSV (.csv)</button>';
  btn.parentNode.style.position = 'relative';
  btn.parentNode.appendChild(menu);
  btn.dataset.abierto = '1';
  menu.addEventListener('click', function(ev) {
    const b = ev.target.closest('[data-f]');
    if (!b) return;
    const mod = AppState.activeModule;
    // Si el modulo pagina, la exportacion la hace MOTOR_RENDER pidiendo todas
    // las filas filtradas; si no, se exporta lo de la tabla como siempre.
    if (typeof MOTOR_RENDER !== 'undefined' && MOTOR_RENDER._pag && MOTOR_RENDER._pag[mod]) {
      MOTOR_RENDER.exportar(mod, b.dataset.f === 'xlsx' ? 'xlsx' : 'csv');
    } else if (b.dataset.f === 'xlsx') PWA_SKILLS.exportFilteredToExcel();
    else PWA_SKILLS.exportVisibleToCSV(String(mod).replace(/^\d+_/, ''));
    menu.remove(); btn.dataset.abierto = '0';
  });
});
</script>

  display: inline-flex; align-items: center; gap: 4px;

  font-size: 10px; font-weight: 800; white-space: nowrap;
}

  .mr-hijos tr { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px;
                 padding: 8px 0; border-bottom: 1px solid var(--ds-border); }
  .mr-hijos td { padding: 2px 0 !important; }
  .mr-hijos td::before {
    content: attr(data-label); display: block;
    font-size: 9px; font-weight: 800; text-transform: uppercase;
    letter-spacing: .05em; color: var(--ds-fg-muted);
  }
}
</style>
