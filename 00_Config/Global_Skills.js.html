const PWA_SKILLS = {
  
  // -----------------------------------------------------------------------
  // SKILL C: OPTIMIZADOR FILE-CANVAS (Compresión Client-Side)
  // -----------------------------------------------------------------------
  /**
   * Comprime una imagen usando Canvas nativo antes de encolarla.
   * @param {File} file - El archivo de imagen de la cámara.
   * @param {string} quality - 'Bajo', 'Medio', 'Alto'.
   */
  compressImage: async function(file, quality = 'Medio') {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;

          // Escalamiento según calidad (Reducción de resolución)
          let scaleFactor = (quality === 'Alto') ? 0.9 : (quality === 'Bajo' ? 0.5 : 0.7);
          canvas.width = width * scaleFactor;
          canvas.height = height * scaleFactor;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          // Compresión de bits (JPEG)
          // Medio: 0.7 de calidad de bits.
          let bitQuality = (quality === 'Alto') ? 0.9 : (quality === 'Bajo' ? 0.4 : 0.7);
          const dataUrl = canvas.toDataURL('image/jpeg', bitQuality);
          
          console.log(`📸 Imagen optimizada (${quality}): de ${(file.size/1024).toFixed(1)}KB a ~${(dataUrl.length/1333).toFixed(1)}KB`);
          resolve(dataUrl);
        };
      };
    });
  },

    /**
     * Skill 12: Renderizador de media (Supabase Storage + URL + local)
     *
     * Acepta lo que guarde el campo: rutas de Storage
     * ("<empresa>/<modulo>/<uuid>/Foto_0.jpg", lo normal en producción),
     * URLs http(s) o dataURLs (registros aún en la cola offline), separados
     * por coma. Las rutas se firman en lote (URL temporal de 1 h) porque los
     * buckets son privados. Imágenes → miniatura que se abre en grande;
     * otros archivos (PDF, Word, Excel…) → tarjeta con enlace de descarga.
     */
    renderDriveMedia: function(fieldValue, fieldId, containerId) {
       const container = document.getElementById(containerId);
       if (!container) return;

       const vacio = '<div class="col-span-full w-full text-center flex flex-col items-center justify-center p-3 sm:p-6 opacity-40"><span class="material-symbols-outlined text-3xl mb-1" aria-hidden="true">image_not_supported</span><p class="text-[12px] font-bold uppercase tracking-tighter">Sin archivos registrados</p></div>';
       const valores = (typeof partirListaMedia === 'function')
          ? partirListaMedia(fieldValue)
          : String(fieldValue || '').split(',').map(s => s.trim()).filter(Boolean);
       if (!valores.length) { container.innerHTML = vacio; return; }

       // Solo se pinta lo que es http(s), data:image o blob: nunca javascript:
       const seguro = (src) => {
          const t = String(src || '').trim();
          if (/^(https?:\/\/|data:image\/|blob:)/i.test(t)) return t;
          if (t) console.warn('[SECURITY] URL de media bloqueada:', t.substring(0, 60));
          return '';
       };
       const esImagen = (original, url) =>
          /^data:image\//i.test(url) ||
          /\.(jpe?g|png|webp|gif|heic)(\?|$)/i.test(String(original).split('?')[0]) ||
          (!/\.[a-z0-9]{2,5}(\?|$)/i.test(String(original).split('?')[0]) && /^https?:/i.test(url));
       const nombreDe = (original) => decodeURIComponent(String(original).split('?')[0].split('/').pop() || 'archivo');

       // Esqueleto mientras se firman las rutas (evita salto de diseño)
       container.setAttribute('aria-busy', 'true');
       container.innerHTML = '<div class="grid grid-cols-2 md:grid-cols-4 gap-4 w-full">' +
          valores.map(() => '<div class="aspect-video rounded-xl bg-surface-variant animate-pulse"></div>').join('') + '</div>';

       const pintar = (urls) => {
          const grid = document.createElement('div');
          grid.className = 'grid grid-cols-2 md:grid-cols-4 gap-4 w-full';

          valores.forEach((original, i) => {
             const url = seguro(urls[i]);
             const card = document.createElement('a');
             card.className = 'group relative aspect-video rounded-xl overflow-hidden border border-outline-variant bg-surface shadow-sm hover:shadow-md transition-all flex items-center justify-center';

             if (!url) {
                card.setAttribute('role', 'img');
                card.setAttribute('aria-label', 'Archivo no disponible');
                card.innerHTML = '<div class="flex flex-col items-center gap-1 text-secondary p-2 text-center"><span class="material-symbols-outlined text-3xl" aria-hidden="true">broken_image</span><span class="text-[12px] font-bold">No disponible</span></div>';
                grid.appendChild(card);
                return;
             }

             card.href = url;
             card.target = '_blank';
             card.rel = 'noopener';

             if (esImagen(original, url)) {
                card.classList.add('cursor-zoom-in');
                card.setAttribute('aria-label', 'Ver en grande');
                const img = document.createElement('img');
                img.className = 'w-full h-full object-cover transition-transform duration-500 group-hover:scale-110';
                img.loading = 'lazy';
                img.alt = (fieldId || 'Imagen').replace(/_/g, ' ') + ' ' + (i + 1);
                img.src = url;
                img.onerror = function() {
                   card.innerHTML = '<div class="flex flex-col items-center gap-1 text-secondary"><span class="material-symbols-outlined text-3xl" aria-hidden="true">broken_image</span><span class="text-[12px] font-bold">Error de carga</span></div>';
                };
                // Las firmas digitales son PNG con fondo transparente
                if (/firma|signature/i.test(fieldId || '')) img.className = 'w-full h-full object-contain p-2 bg-white';
                const overlay = document.createElement('div');
                overlay.className = 'absolute inset-0 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-end p-2';
                overlay.innerHTML = '<span class="text-[12px] text-white font-black uppercase tracking-widest">Ver en grande</span>';
                card.appendChild(img);
                card.appendChild(overlay);
             } else {
                const nombre = nombreDe(original);
                const ext = (nombre.split('.').pop() || '').toUpperCase();
                card.setAttribute('aria-label', 'Descargar ' + nombre);
                card.innerHTML = '<div class="flex flex-col items-center gap-1 p-3 text-center min-w-0 w-full">' +
                   '<span class="material-symbols-outlined text-3xl text-primary" aria-hidden="true">' + (ext === 'PDF' ? 'picture_as_pdf' : 'description') + '</span>' +
                   '<span class="text-[12px] font-bold text-on-surface truncate w-full"></span>' +
                   '<span class="text-[12px] text-secondary">Descargar</span></div>';
                card.querySelector('.truncate').textContent = nombre;
             }
             grid.appendChild(card);
          });

          container.innerHTML = '';
          container.appendChild(grid);
          container.removeAttribute('aria-busy');
       };

       const resolver = (typeof DataService !== 'undefined' && DataService.resolveMedia)
          ? DataService.resolveMedia(valores) : Promise.resolve(valores);
       resolver.then(pintar).catch(() => pintar(valores.map(() => '')));
    },

  // -----------------------------------------------------------------------
  // SKILL B: AUTOGUARDADO INTERACTIVO (Drafts)
  // -----------------------------------------------------------------------
  /**
   * Guarda el estado de un formulario automáticamente en LocalStorage.
   * Se debe invocar en el 'oninput' o 'onblur' de los campos.
   */
  saveDraft: function(formId, moduleName) {
    const form = document.getElementById(formId);
    const formData = new FormData(form);
    const data = {};
    formData.forEach((value, key) => data[key] = value);
    
    localStorage.setItem(`draft_${moduleName}`, JSON.stringify(data));
    console.log(`💾 Borrador de [${moduleName}] guardado.`);
  },

  loadDraft: function(formId, moduleName) {
    const draft = localStorage.getItem(`draft_${moduleName}`);
    if (!draft) return;
    
    const data = JSON.parse(draft);
    const form = document.getElementById(formId);
    for (const key in data) {
      if (form.elements[key]) form.elements[key].value = data[key];

    console.log(`📂 Borrador de [${moduleName}] restaurado.`);

  // -----------------------------------------------------------------------
  // SKILL F: PIZARRA DE FIRMAS (Signature Pad)
  // -----------------------------------------------------------------------
  initSignaturePad: function(canvasId) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;

    // Limpiar handler de window previo asociado a este canvas (evita acumulación)
    const prevStopKey = `_sigStop_${canvasId}`;
    if (window[prevStopKey]) {
      window.removeEventListener('mouseup', window[prevStopKey]);
      delete window[prevStopKey];
    }

    canvas.width = canvas.offsetWidth || 300;
    canvas.height = canvas.offsetHeight || 200;

    const ctx = canvas.getContext('2d');
    ctx.strokeStyle = "#162138";
    ctx.lineWidth = 3;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";

    let drawing = false;

    const getCoords = (e) => {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    };

    const startDraw = (e) => {
      drawing = true;
      const { x, y } = getCoords(e);
      ctx.beginPath();
      ctx.moveTo(x, y);
    };

    const stopDraw = () => { drawing = false; ctx.closePath(); };

    const draw = (e) => {
      if (!drawing) return;
      if (e.touches) e.preventDefault();
      const { x, y } = getCoords(e);
      ctx.lineTo(x, y);
      ctx.stroke();
    };

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDraw);

    // Guardar referencia para limpieza futura
    window[prevStopKey] = stopDraw;
    window.addEventListener('mouseup', stopDraw);
  },

  clearSignature: function(canvasId) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  },

  // -----------------------------------------------------------------------
  // SKILL DE SEGURIDAD: HASH SHA-256
  // -----------------------------------------------------------------------
  /**
   * Encripta una cadena usando SHA-256 (Nativo del navegador)
   * @param {string} string - Texto plano (ej. contraseña)
   */
  hashSHA256: async function(string) {
    const utf8 = new TextEncoder().encode(string);
    const hashBuffer = await crypto.subtle.digest('SHA-256', utf8);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  },

  /**
   * Credencial para reentrar SIN red (modo Supabase): PBKDF2-SHA256 con sal
   * aleatoria y 210 000 iteraciones (recomendación OWASP). Antes se guardaba
   * un SHA-256 simple sin sal en localStorage: quien copiara el almacenamiento
   * del equipo adivinaba la contraseña en minutos. Ahora cada intento le
   * cuesta ~200 000 veces más.
   * @param {string} password
   * @param {string} [saltB64]  sal guardada (sin ella se genera una nueva)
   * @param {number} [iter]
   * @returns {Promise<{salt:string, iter:number, hash:string}>}
   */
  PBKDF2_ITER: 210000,
  derivarCredencial: async function(password, saltB64, iter) {
    const b64 = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
    const salt = saltB64
      ? Uint8Array.from(atob(saltB64), c => c.charCodeAt(0))
      : crypto.getRandomValues(new Uint8Array(16));
    const it = iter || PWA_SKILLS.PBKDF2_ITER;
    const clave = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(password)), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: it }, clave, 256);
    return { salt: b64(salt), iter: it, hash: b64(bits) };
  },

  // -----------------------------------------------------------------------
  // SKILL 7.A: RELACIONALIDAD DINÁMICA (Cascading & Cross-Module)
  // -----------------------------------------------------------------------
  /**
   * Carga opciones en un select basadas en la data de otro módulo.
   * @param {string} selectId - ID del elemento <select>
   * @param {string} originModule - Módulo de donde extraer (ej: '01_Usuarios')
   * @param {string} columnLabel - Columna para mostrar (ej: 'Nombre_Completo')
   * @param {string} columnValue - Columna para guardar (ej: 'DNI')
   */
  loadRelationalOptions: async function(selectId, originModule, columnLabel, columnValue, sliceConfig) {
    const select = document.getElementById(selectId);
    if (!select) return;

    select.innerHTML = '<option value="">Cargando...</option>';

    try {
      const cacheKey = `refdata_${originModule}`;
      const stampKey = `${cacheKey}_t`;
      const TTL = 10 * 60 * 1000;   // 10 minutos

      let data = null;
      const cached = localStorage.getItem(cacheKey);
      if (cached) { try { data = JSON.parse(cached); } catch(e) {} }

      // El caché tenía vida infinita: un usuario nuevo (o un cambio de rol)
      // no aparecía NUNCA en los desplegables hasta limpiar el navegador.
      // Ahora caduca; y si está vigente se sirve al instante y se refresca
      // por detrás, para no hacer esperar al usuario.
      const sello  = parseInt(localStorage.getItem(stampKey) || '0', 10);
      const vigente = data && data.length && (Date.now() - sello) < TTL;

      const traer = () => DataService.read(originModule)
        .then(res => {
          if (res && res.status === 'OK' && Array.isArray(res.payload)) {
            localStorage.setItem(cacheKey, JSON.stringify(res.payload));
            localStorage.setItem(stampKey, String(Date.now()));
            return res.payload;
          }
          return null;
        })
        .catch(() => null);

      if (vigente) {
        traer().then(frescos => {
          // Solo se repinta si la lista cambió y el select sigue en pantalla
          if (frescos && document.body.contains(select) &&
              JSON.stringify(frescos) !== JSON.stringify(data)) {
            const elegido = select.value;
            this.loadRelationalOptions(selectId, originModule, columnLabel, columnValue, sliceConfig)
                .then(() => { if (elegido) select.value = elegido; });
          }
        });
      } else {
        const frescos = await traer();
        if (frescos) data = frescos;
      }

      if (!data || data.length === 0) {
        select.innerHTML = '<option value="">Sin datos disponibles</option>';
        return;
      }

      let filteredData = data;
      if (sliceConfig && sliceConfig.column && sliceConfig.value) {
        filteredData = data.filter(row =>
          String(row[sliceConfig.column]).toLowerCase() === String(sliceConfig.value).toLowerCase()
        );
      }

      // Lista de otro módulo: siempre con buscador, por pocas opciones que
      // tenga hoy (ver «SKILL 28» al final de este archivo).
      select.setAttribute('data-buscador', '');
      select.innerHTML = '<option value="">Seleccione...</option>';
      filteredData.forEach(row => {
        const opt = document.createElement('option');
        opt.value = row[columnValue] || '';
        opt.textContent = row[columnLabel] || row[columnValue] || '';
        select.appendChild(opt);
      });

    } catch (err) {
      console.error(`Error cargando opciones relacionales para ${selectId}:`, err);
      select.innerHTML = '<option value="">Error al cargar</option>';
    }
  },

  // -----------------------------------------------------------------------
  // SKILL E: ESTÁNDAR CRONOLÓGICO PERUANO (GMT-5)
  // -----------------------------------------------------------------------
  /**
   * Obtiene la fecha/hora actual normalizada a Perú (UTC-5)
   * @param {boolean} formatFull - Si es true, retorna string ISO completo.
   */
  getPeruTime: function(formatFull = true) {
    const offsetHours = (AppState.Settings || {}).TimezoneOffset != null ? AppState.Settings.TimezoneOffset : -5;

    // La versión anterior sumaba getTimezoneOffset() a getTime() y luego leía
    // el resultado con toISOString(). getTime() ya es un instante absoluto, así
    // que ese ajuste se aplicaba dos veces y el resultado era la hora UTC, no
    // la del huso. En la práctica: a partir de las 19:00 en Perú, la fecha
    // registrada era la del día siguiente.
    //
    // Correcto: desplazar el instante absoluto al huso objetivo y leerlo con
    // los getters UTC, que es lo que hace toISOString().
    const t = new Date(Date.now() + offsetHours * 3600000);
    const iso = t.toISOString();
    return formatFull ? iso : iso.slice(0, 10);
  },

  // -----------------------------------------------------------------------
  // SKILL 1.B: EXPORTADOR ANALÍTICO (.XLSX NATIVO)
  // -----------------------------------------------------------------------
  /**
   * Convierte un JSON Array en archivo .xlsx y dispara la descarga.
   * @param {Array} data - El arreglo de objetos filtrados.
   * @param {string} fileName - Nombre sugerido del archivo.
   */
  /**
   * CSV a partir de los DATOS (no del DOM). Lo usa la exportacion de un
   * Resumen paginado: raspar la tabla solo daria la pagina visible.
   * @param {Array<Object>} datos  filas ya con las columnas que se quieren
   * @param {string} nombre
   */
  exportDatosToCSV: function(datos, nombre) {
    if (!datos || !datos.length) { this.toast('No hay datos para exportar.', 'error'); return; }
    const cols = Object.keys(datos[0]);
    const cita = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const lineas = [cols.map(cita).join(',')]
      .concat(datos.map(r => cols.map(c => cita(r[c])).join(',')));
    // BOM: sin el, Excel en Windows abre las tildes mal
    const blob = new Blob(['\ufeff' + lineas.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (nombre || 'Reporte') + '_' + this.getPeruTime(false).replace(/-/g, '') + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    this.toast(datos.length + ' registros exportados.', 'success');
  },

  /**
   * Hoja de cálculo a partir de los datos, con el ancho de cada columna
   * ajustado a su contenido. Sin esto Excel deja todas a 8 caracteres: un
   * nombre completo o un correo quedan cortados y parece que falta el dato.
   */
  _hojaXLSX: function(datos) {
    const ws = XLSX.utils.json_to_sheet(datos);
    const cols = Object.keys(datos[0] || {});
    ws['!cols'] = cols.map(c => {
      let ancho = String(c).length;
      datos.forEach(f => { const n = String(f[c] == null ? '' : f[c]).length; if (n > ancho) ancho = n; });
      return { wch: Math.min(Math.max(ancho + 2, 8), 48) };
    });
    return ws;
  },

  exportToExcel: function(data, fileName = "Reporte_Exportado") {
    if(!data || data.length === 0) return alert("❌ No hay datos para exportar.");

    // Crear el Libro (Workbook)
    const wb = XLSX.utils.book_new();
    // Convertir JSON a Hoja (Worksheet), con los anchos de columna ya puestos
    const ws = this._hojaXLSX(data);

    // Añadir Hoja al Libro
    XLSX.utils.book_append_sheet(wb, ws, "Base_Datos");
    
    // Generar archivo binario y forzar descarga
    const timestamp = this.getPeruTime(false).replace(/-/g, '');
    XLSX.writeFile(wb, `${fileName}_${timestamp}.xlsx`);
    
    console.log(`📊 Exportación .xlsx completada: ${data.length} registros.`);
  },

  /**
   * Igual que exportToExcel pero con UNA HOJA POR GRUPO. Pensado para que el
   * SuperAdmin mande a cada empresa cliente un solo archivo con su personal
   * separado por pestañas.
   * @param {Object} grupos  { "Empresa A": [fila, fila], "Empresa B": [...] }
   * @param {string} fileName
   */
  exportToExcelPorHojas: function(grupos, fileName = 'Personal_Por_Empresa') {
    const claves = Object.keys(grupos || {}).filter(k => (grupos[k] || []).length);
    if (!claves.length) { this.toast('No hay datos para exportar.', 'warning'); return; }

    const wb = XLSX.utils.book_new();
    const usados = {};
    claves.sort((a, b) => a.localeCompare(b, 'es')).forEach(clave => {
      // Excel: máximo 31 caracteres y sin : \ / ? * [ ]  — y nombres únicos
      let hoja = String(clave || 'Sin empresa').replace(/[:\\\/\?\*\[\]]/g, '-').slice(0, 31) || 'Sin empresa';
      if (usados[hoja]) { hoja = hoja.slice(0, 28) + '_' + (++usados[hoja]); } else { usados[hoja] = 1; }
      XLSX.utils.book_append_sheet(wb, this._hojaXLSX(grupos[clave]), hoja);
    });

    const timestamp = this.getPeruTime(false).replace(/-/g, '');
    XLSX.writeFile(wb, `${fileName}_${timestamp}.xlsx`);
    this.toast(`Exportado: ${claves.length} empresa(s) en hojas separadas.`, 'success', 3500);
  },

  // -----------------------------------------------------------------------
  // SKILL 1.C: ENVÍO DE CREDENCIALES POR WHATSAPP
  // -----------------------------------------------------------------------
  // La app no manda correos de invitación (el personal de campo casi nunca
  // tiene email real: api/usuarios.js les asigna uno técnico @sin-correo.invalid).
  // El alta se comunica por WhatsApp, que es lo que todos tienen.

  /** Normaliza un teléfono al formato que exige wa.me (solo dígitos, con país). */
  telefonoWhatsApp: function(tel) {
    let d = String(tel || '').replace(/[^\d]/g, '');
    if (!d) return '';
    d = d.replace(/^0+/, '');
    // 9 dígitos que empiezan con 9 = celular peruano sin código de país
    if (d.length === 9 && d.charAt(0) === '9') d = '51' + d;
    return d.length >= 10 ? d : '';
  },

  /** URL de WhatsApp con el texto ya cargado. Sin teléfono, deja elegir contacto. */
  linkWhatsApp: function(tel, texto) {
    const num = this.telefonoWhatsApp(tel);
    return 'https://wa.me/' + num + '?text=' + encodeURIComponent(String(texto || ''));
  },

  abrirWhatsApp: function(tel, texto) {
    window.open(this.linkWhatsApp(tel, texto), '_blank', 'noopener,noreferrer');
  },

  /** Copia al portapapeles con respaldo para navegadores sin permiso. */
  copiarTexto: async function(texto) {
    try {
      await navigator.clipboard.writeText(String(texto || ''));
      this.toast('Mensaje copiado.', 'success', 2500);
      return true;
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = String(texto || '');
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
      document.body.removeChild(ta);
      this.toast(ok ? 'Mensaje copiado.' : 'No se pudo copiar: selecciona el texto a mano.', ok ? 'success' : 'warning', 3500);
      return ok;
    }
  },

  /**

  mensajeCredenciales: function(d) {

                (d.empresa ? ' de *' + d.empresa + '*' : '') + '.');

    pila.push('');
    pila.push('⚠️ *Importante:* cambia tu contraseña al entrar.');
    pila.push('Menú ☰ → "Ver mi perfil" → *Cambiar mi contraseña*.');

      pila.push('❓ Si la olvidas, escribe a ' + (sop.Etiqueta || ('+' + sop.WhatsApp)) + '.');

  /** Abre WhatsApp con el proveedor del servicio (contraseña olvidada, etc.). */
  escribirASoporte: function(motivo, datos) {

    if (!sop.WhatsApp) { this.toast('No hay un contacto de soporte configurado.', 'warning'); return; }

  // -----------------------------------------------------------------------
  // SKILL 7.E: MOTOR DE FILAS DINÁMICAS (Sub-Tablas / Detail Rows)
  // -----------------------------------------------------------------------
  /**
   * Genera un bloque de campos repetibles para una tabla hija.
   * @param {string} containerId - ID del div donde se inyectarán las filas.
   * @param {Array} fields - Esquema de campos para la fila (del subconfig).
   */
  _rowSeq: 0,

  addDynamicRow: function(containerId, fields, valores) {
    const container = document.querySelector('#main-container #' + containerId) || document.getElementById(containerId);
    if (!container) return null;

    // Contador propio: dos filas creadas en el mismo milisegundo compartían id
    this._rowSeq += 1;
    const rowId = 'row-' + Date.now() + '-' + this._rowSeq;
    const rowDiv = document.createElement('div');
    rowDiv.id = rowId;
    // 2 columnas ya en móvil; 12 columnas fluidas desde tablet
    rowDiv.className = "grid grid-cols-2 md:grid-cols-12 gap-x-3 gap-y-3 md:gap-4 p-3 md:p-4 mb-3 bg-surface-container-lowest rounded-xl border border-outline-variant animate-in fade-in slide-in-from-top-1 duration-200 relative";

    const esc = v => String(v == null ? '' : v)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const previo = valores || {};
    const clase = "w-full h-10 px-3 rounded-lg border border-outline-variant bg-white text-xs focus:ring-1 focus:ring-primary outline-none";

    let html = "";
    fields.forEach(f => {
      // Un campo puede pedir fila entera en móvil con fullWidth: true
      const colSpan = f.colSpan || "md:col-span-3";
      const mobileSpan = f.fullWidth ? "col-span-2" : "";
      const val = previo[f.name];
      let control;

      if (f.type === 'select') {
        const ops = (f.options || []).map(o => {
          const v = (typeof o === 'object') ? o.value : o;
          const t = (typeof o === 'object') ? o.label : o;
          return '<option value="' + esc(v) + '"' +
                 (String(val) === String(v) ? ' selected' : '') + '>' + esc(t) + '</option>';
        }).join('');
        control = '<select name="' + f.name + '"' + (f.buscador ? ' data-buscador' : '') + ' class="' + clase + '">' +
                  '<option value="">' + esc(f.placeholder || '—') + '</option>' + ops + '</select>';

      } else if (f.type === 'display') {
        // Casilla de solo lectura para valores calculados; la rellena el módulo
        control = '<div data-display="' + f.name + '" ' +
                  'class="w-full h-10 px-3 rounded-lg border border-dashed border-outline-variant ' +
                  'bg-surface-container-low text-xs font-bold flex items-center justify-center text-secondary">—</div>';

      } else if (f.type === 'textarea') {
        control = '<textarea name="' + f.name + '" rows="2" class="w-full p-3 rounded-lg border border-outline-variant bg-white text-xs focus:ring-1 focus:ring-primary outline-none resize-none">' + esc(val) + '</textarea>';

      } else {
        // DNI: máximo 8 caracteres (ver attrsDNI en Global_Config)
        const tipo = f.type || 'text';
        const dni = (tipo === 'text' && typeof attrsDNI === 'function') ? attrsDNI(f.name, f.label) : '';
        // Regla 28: cada casilla acepta solo lo suyo. Una cantidad no admite
        // letras ni negativos, y en el móvil abre el teclado numérico.
        let extra = '';
        const pon = (k, v) => { if (v !== undefined && v !== null && v !== '') extra += ' ' + k + '="' + esc(v) + '"'; };
        if (tipo === 'number') {
          pon('min',  f.min !== undefined ? f.min : 0);
          pon('max',  f.max);
          pon('step', f.step !== undefined ? f.step : 1);
          pon('inputmode', String(f.step !== undefined ? f.step : 1).indexOf('.') === -1 ? 'numeric' : 'decimal');
        } else if (tipo === 'email') { pon('inputmode', 'email'); pon('autocapitalize', 'off'); }
        else if (tipo === 'tel')     { pon('inputmode', 'tel'); pon('pattern', f.pattern || '[0-9+()\s-]{6,20}'); }
        else                         { pon('maxlength', f.maxLength); }
        if (f.pattern && tipo !== 'tel') pon('pattern', f.pattern);
        control = '<input type="' + tipo + '" name="' + f.name + '" value="' + esc(val) + '"' + dni + extra + ' ' +
                  (f.placeholder ? 'placeholder="' + esc(f.placeholder) + '" ' : '') + 'class="' + clase + '">';
      }

      html += '<div class="' + mobileSpan + ' ' + colSpan + '">' +
              '<label class="block text-[10px] font-bold text-secondary mb-1 uppercase">' + esc(f.label) + '</label>' +
              control + '</div>';
    });

    // Botón de eliminar: en móvil ocupa su propia fila alineado a la derecha
    html += '<div class="col-span-2 md:col-span-1 flex items-end justify-end md:justify-start pb-1">' +
      '<button type="button" onclick="document.getElementById(\'' + rowId + '\').remove()" aria-label="Eliminar esta fila" ' +
      'class="w-9 h-9 flex items-center justify-center rounded-full text-error hover:bg-error/10 transition-colors">' +
      '<span class="material-symbols-outlined text-lg" aria-hidden="true">delete</span></button></div>';

    rowDiv.innerHTML = html;
    container.appendChild(rowDiv);
    return rowDiv;
  },

  /**
   * Skill #15: Motor de Sincronización Global Contextual
   */
  triggerGlobalSync: async function() {
      // Sube la cola offline (incluidos los registros bloqueados por rechazo)
      // y vuelve a pintar el Resumen del módulo activo con datos del servidor.
      // Antes llamaba a window.syncModuleData, que no existía: no hacía nada.
      const btn = document.getElementById('ui-global-sync-btn');
      if (btn && btn.dataset.ocupado) return;
      // El icono gira desde el primer momento: es la señal de que SÍ se pulsó
      // y de que se está forzando la actualización. Gira solo el icono, no el
      // botón: con 'animate-spin' el número de pendientes daba vueltas con él.
      const arranque = Date.now();
      if (btn) { btn.dataset.ocupado = '1'; btn.classList.add('sincronizando'); }

      try {
          if (!navigator.onLine) {
              PWA_SKILLS.toast('Sin conexión. Los registros guardados se subirán solos al volver la red.', 'warning', 4000);
              return;
          }
          const r = (typeof triggerSyncToCloud === 'function')
              ? await triggerSyncToCloud({ forzar: true, origen: 'manual' })
              : { subidos: 0, pendientes: 0, bloqueados: 0 };

          // Refresco de lo que se esté viendo, aunque no hubiera nada en cola
          // (pueden haber entrado datos de otras personas).
          const mod = AppState.activeModule;
          if (mod && typeof recargarResumenActivo === 'function') recargarResumenActivo([mod]);
          // En el panel principal no hay Resumen que recargar: lo que se
          // actualiza son sus indicadores. Es lo que espera quien pulsa el
          // botón estando en el inicio.
          else if (typeof loadDashboardData === 'function' &&
                   document.getElementById('dash-updated')) loadDashboardData(true);

          if (r.motivo === 'sin-sesion') {
              PWA_SKILLS.toast('Tu sesión expiró. Vuelve a iniciar sesión para subir los registros pendientes.', 'warning', 5000);
          } else if (r.pendientes) {
              PWA_SKILLS.toast((r.subidos ? r.subidos + ' subido(s). ' : '') +
                  'Quedan ' + r.pendientes + ' registro(s) sin subir' +
                  (r.bloqueados ? ' (' + r.bloqueados + ' rechazado(s) por el servidor)' : '') + '.', 'warning', 5000);
          } else {
              PWA_SKILLS.toast(r.subidos ? r.subidos + ' registro(s) subido(s). Todo sincronizado.' : 'Todo sincronizado.', 'success', 2500);
          }
      } catch (e) {
          console.error('Error al sincronizar:', e);
          PWA_SKILLS.toast('No se pudo sincronizar. Se reintentará automáticamente.', 'error', 4000);
      } finally {
          // Con buena red la subida puede durar 80 ms: sin un mínimo visible,
          // el giro no llega a verse y parece que el botón no hizo nada.
          const resto = Math.max(0, 650 - (Date.now() - arranque));
          setTimeout(() => {
            if (btn) { btn.classList.remove('sincronizando'); delete btn.dataset.ocupado; }
          }, resto);
      }
  },
