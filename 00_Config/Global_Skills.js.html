  // -----------------------------------------------------------------------
  // SKILL 15: ENUM CON VALOR LIBRE (allowOtherValues)
  // -----------------------------------------------------------------------
  initEnumWithOther: function(selectId, inputId) {
    const select = document.getElementById(selectId);
    const input = document.getElementById(inputId);
    if (!select || !input) return;
    input.style.display = 'none';
    select.addEventListener('change', () => {
      input.style.display = select.value === '__OTHER__' ? 'block' : 'none';
      if (select.value !== '__OTHER__') input.value = '';
    });
  },

  getEnumValue: function(selectId, inputId) {
    const select = document.getElementById(selectId);
    const input = document.getElementById(inputId);
    if (!select) return '';
    return select.value === '__OTHER__' ? (input ? input.value.trim() : '') : select.value;
  },

   /**
    * Skill #17: Toggle del panel de filtros colapsable
    * Llama a esto desde el botón de "Filtros" en la barra de búsqueda.
    */
   toggleFilterPanel: function(btn) {
       const panel = document.querySelector('#main-container #ui-filter-panel');
       const badge = document.querySelector('#main-container #ui-filter-badge');
       const icon = btn ? btn.querySelector('.filter-toggle-icon') : null;
       
       if (!panel) return;

       const isOpen = panel.classList.contains('filter-open');
       
       if (isOpen) {
           panel.classList.remove('filter-open');
           panel.style.maxHeight = '0';
           panel.style.opacity = '0';
           panel.style.pointerEvents = 'none';
           if (icon) icon.innerText = 'expand_more';
       } else {
           panel.classList.add('filter-open');
           panel.style.maxHeight = '1200px';
           panel.style.opacity = '1';
           panel.style.pointerEvents = 'auto';
           if (icon) icon.innerText = 'expand_less';
       }
   },

   /**
    * Skill #19: Renderizado Automático de Filtros en Panel Colapsable
    * Inyecta los controles dinámicos dentro del panel #ui-filter-panel
    * y actualiza el badge de cantidad en el botón toggle.
   */
  /** Subconfig de un módulo (SUBCONFIG_03_INSPECCIONES a partir de 03_Inspecciones). */
  _subconfigDe: function(moduleID) {
    const norm = String(moduleID).toUpperCase().replace(/\s/g, '_').replace(/[^A-Z0-9_]/g, '');
    return window['SUBCONFIG_' + norm] || window[moduleID] || window['SUBCONFIG_' + moduleID] || null;
  },

  /** Las filas que ya se cargaron de un módulo (memoria del motor o caché local). */
  _filasConocidas: function(moduleID) {
    let filas = null;
    try {
      if (typeof MOTOR_RENDER !== 'undefined' && MOTOR_RENDER._datos) filas = MOTOR_RENDER._datos[moduleID];
    } catch (e) {}
    if (!Array.isArray(filas) || !filas.length) {
      if (moduleID === '01_Usuarios' && Array.isArray(window._usrData) && window._usrData.length) filas = window._usrData;
    }
    if (!Array.isArray(filas) || !filas.length) {
      filas = (typeof MOTOR_CACHE !== 'undefined') ? MOTOR_CACHE.leerSync(moduleID) : [];
    }
    return Array.isArray(filas) ? filas : [];
  },

  /**
   * Opciones de un filtro Enum. Un Enum ABIERTO (allowOtherValues) o sin lista
   * —Empresa, por ejemplo— no tiene sus valores en el subconfig: viven en los
   * registros. Sin esto el desplegable sale con "Todos" y nada que elegir.
   */
  _opcionesFiltro: function(moduleID, key, field, filas) {
    const base = (field.acceptedValues || []).map(v => String(v == null ? '' : v).trim()).filter(Boolean);
    if (base.length && !field.allowOtherValues) return base;   // lista cerrada: orden declarado
    const vistos = {};
    base.forEach(v => { vistos[v.toLowerCase()] = true; });
    const extra = {};
    (Array.isArray(filas) ? filas : this._filasConocidas(moduleID)).forEach(r => {
      const v = String((r && r[key] != null) ? r[key] : '').trim();
      const k = v.toLowerCase();
      if (v && !vistos[k] && !extra[k]) extra[k] = v;
    });
    return base.concat(Object.keys(extra).sort().map(k => extra[k]));
  },

  /**
   * Repuebla los filtros Enum abiertos cuando llegan datos frescos, sin perder
   * lo que el usuario ya tenía elegido. La llaman los Resumen tras pintar.
   */
  actualizarOpcionesFiltro: function(moduleID, filas) {
    const config = this._subconfigDe(moduleID);
    if (!config || !config.Variables) return;
    const escId = (v) => (window.CSS && CSS.escape) ? CSS.escape(v) : String(v).replace(/[^\w-]/g, '\$&');
    Object.keys(config.Variables).forEach(key => {
      const field = config.Variables[key];
      if (!field.isFilter || field.type !== 'Enum') return;
      if ((field.acceptedValues || []).length && !field.allowOtherValues) return;
      const sel = document.querySelector('#main-container #filter-' + escId(key));
      if (!sel) return;
      const opciones = this._opcionesFiltro(moduleID, key, field, filas);
      const actuales = Array.prototype.slice.call(sel.options, 1).map(o => o.value);
      if (actuales.length === opciones.length && actuales.every((v, i) => v === opciones[i])) return;
      const elegido = sel.value;
      sel.innerHTML = '<option value="">Todos</option>' +
                      opciones.map(v => '<option value="' + esc(v) + '">' + esc(v) + '</option>').join('');
      sel.value = elegido;
      if (sel.value !== elegido) sel.value = '';   // el valor elegido ya no existe
    });
  },

   renderDynamicFilters: function(moduleID) {
    const panel = document.querySelector('#main-container #ui-filter-panel');
    const badge = document.querySelector('#main-container #ui-filter-badge');
    if (!panel) return;
    panel.innerHTML = '';

    // Normalización de nombre: SUBCONFIG_03_INSPECCIONES
    const normalizedID = moduleID.toUpperCase().replace(/\s/g, '_').replace(/[^A-Z0-9_]/g, '');
    const subConfigName = `SUBCONFIG_${normalizedID}`;
    
    console.log(`🔍 Buscando Esquema de Filtros: ${subConfigName}...`);
    
    // Búsqueda agresiva en el scope global
    const config = window[subConfigName] || window[moduleID] || window[`SUBCONFIG_${moduleID}`];
    
    if (!config || !config.Variables) {
        console.warn(`⚠️ Error: No se halló el objeto [${subConfigName}] en el ruteador global.`);
        panel.innerHTML = `<p class="text-[10px] text-error text-center p-3">No se pudo cargar el esquema de filtros.</p>`;
        return;
    }

    // Generar los controles de filtro
    let filterCount = 0;
    const filterFields = Object.keys(config.Variables).filter(key => config.Variables[key].isFilter);
    filterCount = filterFields.length;
    
    // La insignia cuenta los filtros APLICADOS, no los disponibles: un "7"
    // permanente junto a "Filtros" hacia creer que la lista estaba filtrada
    // cuando se estaban viendo todos los registros.
    this.actualizarBadgeFiltros();

    // Contenedor interno del panel. Columnas de ancho mínimo 140px que se
    // reacomodan solas según el ancho real del panel (no del viewport): antes
    // se forzaban 3–4 columnas fijas y en paneles estrechos las etiquetas se
    // partían en dos líneas y los selects quedaban cortados ("Todo", "mn").
    const grid = document.createElement('div');
    grid.className = 'grid gap-x-3 gap-y-3 p-3 sm:p-4';
    grid.style.gridTemplateColumns = 'repeat(auto-fit, minmax(min(140px, 100%), 1fr))';

    filterFields.forEach(key => {
        const field = config.Variables[key];
        const div = document.createElement('div');
        div.className = 'flex flex-col gap-1 min-w-0';

        const labelText = (field.label || key).replace(/_/g, ' ');
        const fid = 'filter-' + key;
        // Etiqueta en una sola línea; si no cabe, se recorta y el texto completo queda en el title
        const etiqueta = `<label for="${esc(fid)}" title="${esc(labelText)}" class="block truncate text-[10px] font-black uppercase tracking-wide text-on-surface-variant px-0.5">${esc(labelText)}</label>`;

        if (field.type === 'Enum') {
            div.innerHTML = `${etiqueta}
                <div class="filter-compact-field relative flex items-center bg-surface rounded-lg border border-outline-variant/60 hover:border-primary/50 focus-within:border-primary transition-colors h-9 min-w-0">
                    <select id="${esc(fid)}" onchange="PWA_SKILLS.applyFilters()"
                        class="filter-compact-control bg-transparent border-none text-[11px] font-semibold text-on-surface w-full min-w-0 h-full pl-2.5 pr-7 focus:ring-0 appearance-none cursor-pointer truncate">
                        <option value="">Todos</option>
                        ${this._opcionesFiltro(moduleID, key, field).map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('')}
                    </select>
                    <span class="material-symbols-outlined text-[16px] text-outline absolute right-2 pointer-events-none" aria-hidden="true">expand_more</span>
                </div>`;
        } else {
            const esFecha = field.type === 'Date';
            // Las fechas no llevan lupa: el selector nativo necesita todo el ancho
            div.innerHTML = `${etiqueta}
                <div class="filter-compact-field flex items-center bg-surface rounded-lg border border-outline-variant/60 hover:border-primary/50 focus-within:border-primary transition-colors h-9 px-2.5 gap-1.5 min-w-0">
                    ${esFecha ? '' : '<span class="material-symbols-outlined text-outline text-[15px] shrink-0" aria-hidden="true">search</span>'}
                    <input type="${esFecha ? 'date' : 'text'}" id="${esc(fid)}"
                        onkeyup="PWA_SKILLS.applyFilters()" onchange="PWA_SKILLS.applyFilters()"
                        ${esFecha ? '' : 'placeholder="Escribe..."'}
                        class="filter-compact-control bg-transparent border-none p-0 text-[11px] font-medium text-on-surface placeholder:text-outline-variant w-full min-w-0 h-full focus:ring-0">
                </div>`;
        }

        grid.appendChild(div);
    });

    // Fila de acciones del panel
    const actions = document.createElement('div');
    actions.className = 'flex items-center justify-between gap-3 border-t border-outline-variant/60 px-3 sm:px-4 py-2.5 bg-surface-container-low';
    actions.innerHTML = `
        <button onclick="PWA_SKILLS.clearFilters()" class="text-[10px] font-bold text-secondary hover:text-error transition-colors flex items-center gap-1">
            <span class="material-symbols-outlined text-[13px]">filter_alt_off</span>
            Limpiar
        </button>
        <button onclick="PWA_SKILLS.applyFilters(); PWA_SKILLS.toggleFilterPanel(this.closest('[data-filter-bar]').querySelector('[data-filter-btn]'))" class="flex items-center gap-1 px-3 py-1 bg-primary text-on-primary rounded-lg text-[10px] font-bold hover:opacity-90 transition-all">
            <span class="material-symbols-outlined text-[13px]">check</span>
            Aplicar
        </button>
    `;

    panel.appendChild(grid);
    panel.appendChild(actions);
  },

  /**
   * Skill #17/19: Aplicación de Filtros Ejecutiva
   */
  /**
   * Lee el panel y la caja de busqueda.
   * @returns {{filtros:Object, busqueda:string}}
   */
  _criteriosDelPanel: function() {
    const searchInput = document.querySelector('#main-container #ui-search-input');
    const panel = document.querySelector('#main-container #ui-filter-panel');
    const inputs = panel ? panel.querySelectorAll('input, select') : [];
    const filtros = {};
    inputs.forEach(input => {
      if (input.value) filtros[input.id.replace('filter-', '')] = input.value;
    });
    return { filtros, busqueda: (searchInput && searchInput.value) || '' };
  },

  /**
   * true si el modulo activo pagina contra el servidor. En ese caso filtrar
   * ocultando filas del DOM esta MAL: solo filtraria la pagina cargada, y una
   * inspeccion vencida de hace meses -que no esta en pantalla- quedaria fuera
   * del resultado sin que nadie lo note. El filtro tiene que ir a la base.
   */
  _filtraEnServidor: function(modulo) {
    return typeof MOTOR_RENDER !== 'undefined' && MOTOR_RENDER._pag &&
           Object.prototype.hasOwnProperty.call(MOTOR_RENDER._pag, modulo);
  },

  _filtroPendiente: null,

  /**
   * Pinta en el boton "Filtros" cuantos criterios hay puestos (incluida la
   * busqueda libre). Sin ninguno, la insignia se esconde.
   */
  actualizarBadgeFiltros: function() {
    const badge = document.querySelector('#main-container #ui-filter-badge');
    if (!badge) return;
    const panel = document.querySelector('#main-container #ui-filter-panel');
    const controles = panel ? Array.from(panel.querySelectorAll('input, select')) : [];
    let n = controles.filter(c => !c.classList.contains('sb-input') && String(c.value || '').trim() !== '').length;
    const buscar = document.querySelector('#main-container #ui-search-input');
    if (buscar && String(buscar.value || '').trim() !== '') n++;
    badge.textContent = n > 0 ? String(n) : '';
    badge.style.display = n > 0 ? 'flex' : 'none';
    badge.setAttribute('aria-label', n ? n + ' filtro(s) aplicado(s)' : '');
  },

  applyFilters: function() {
    if (!AppState.activeModule) return;
    this.actualizarBadgeFiltros();

    // Camino nuevo: el filtro viaja a la base de datos.
    if (this._filtraEnServidor(AppState.activeModule)) {
      const modulo = AppState.activeModule;
      const { filtros, busqueda } = this._criteriosDelPanel();
      // Se escribe letra a letra: sin esperar, cada tecla seria una consulta.
      clearTimeout(this._filtroPendiente);
      this._filtroPendiente = setTimeout(() => {
        // Un filtro del usuario manda sobre el KPI que estuviera aplicado:
        // mezclarlos daria un resultado que no corresponde a ningun control.
        MOTOR_RENDER.recargar(modulo, { filtros, busqueda, cond: null, condEtiqueta: '' });
        MOTOR_RENDER.marcarKpiActivo(modulo, -1);
      }, 280);
      return;
    }

    const searchInput = document.querySelector('#main-container #ui-search-input');
    const panel = document.querySelector('#main-container #ui-filter-panel');
    const inputs = panel ? panel.querySelectorAll('input, select') : [];
    const criteria = {};

    if (searchInput && searchInput.value) {
      criteria['_global'] = searchInput.value.toLowerCase();
    }
    inputs.forEach(input => {
      if (input.value) criteria[input.id.replace('filter-', '')] = input.value.toLowerCase();
    });

    const tableBody = document.querySelector('#main-container table tbody');
    if (!tableBody) return;

    const dataRows = this._dataRows(tableBody);
    dataRows.forEach(row => {
      const text = row.innerText.toLowerCase();
      const matchesControls = Object.values(criteria).every(v => text.includes(v));
      const matchesDrawer = typeof drawerWorkActiveRowMatches === 'function'
        ? drawerWorkActiveRowMatches(row)
        : true;
      row.style.display = matchesControls && matchesDrawer ? '' : 'none';
    });

    const vis = dataRows.filter(r => r.style.display !== 'none').length;

    // empty-states: si el filtro no deja nada, se explica y se ofrece salida
    this._toggleNoResults(tableBody, dataRows.length > 0 && vis === 0, criteria._global || '');

    // Update live counter (scoped to #main-container to avoid hitting hidden registry copy)
    const countEl = document.querySelector('#main-container #ui-result-count');
    if (countEl) {
      countEl.textContent = vis === dataRows.length ? `${dataRows.length} registros` : `${vis} de ${dataRows.length}`;
      countEl.style.color = vis < dataRows.length ? 'var(--color-primary,#162138)' : '';
    }
  },

  /**
   * Skill #17: Limpiar todos los filtros y resetear tabla
   */
  clearFilters: function() {
    const searchInput = document.querySelector('#main-container #ui-search-input');
    if (searchInput) searchInput.value = '';
    const panel = document.querySelector('#main-container #ui-filter-panel');
    if (panel) {
      panel.querySelectorAll('input').forEach(i => i.value = '');
      panel.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
    }
    this.actualizarBadgeFiltros();
    if (AppState.activeModule && this._filtraEnServidor(AppState.activeModule)) {
      clearTimeout(this._filtroPendiente);
      MOTOR_RENDER.recargar(AppState.activeModule, { filtros: {}, busqueda: '', cond: null, condEtiqueta: '' });
      MOTOR_RENDER.marcarKpiActivo(AppState.activeModule, -1);
      return;
    }
    const tableBody = document.querySelector('#main-container table tbody');
    if (tableBody) {
      this._toggleNoResults(tableBody, false);
      this._dataRows(tableBody).forEach(r => r.style.display = '');
    }
    const countEl = document.querySelector('#main-container #ui-result-count') || document.getElementById('ui-result-count');
    if (countEl && tableBody) {
      countEl.textContent = `${this._dataRows(tableBody).length} registros`;
      countEl.style.color = '';
    }
  },

  // -----------------------------------------------------------------------
  // SKILL 23: SISTEMA DE NOTIFICACIONES (Toast / Snackbar)
  // -----------------------------------------------------------------------
  toast: function(message, type, duration) {
    type = type || 'info';
    duration = duration || 3200;
    const container = document.getElementById('toast-container');
    if (!container) { console.log('[Toast]', message); return; }

    const iconMap = { success:'check_circle', error:'error', warning:'warning', info:'info' };
    const colorMap = { success:'#34d399', error:'#f87171', warning:'#fbbf24', info:'#60a5fa' };

    const el = document.createElement('div');
    el.className = 'pwa-toast ' + type;
    el.innerHTML =
      '<span class="material-symbols-outlined" style="font-size:17px;color:' + colorMap[type] + ';font-variation-settings:\'FILL\' 1;flex-shrink:0">' + iconMap[type] + '</span>' +
      '<span style="flex:1;line-height:1.35">' + esc(message) + '</span>' +
      '<button onclick="this.parentElement.remove()" style="background:none;border:none;color:inherit;opacity:0.5;cursor:pointer;padding:0;line-height:1;flex-shrink:0">' +
      '<span class="material-symbols-outlined" style="font-size:15px">close</span></button>';

    container.appendChild(el);
    const timer = setTimeout(function() {
      el.classList.add('toast-out');
      setTimeout(function() { el.remove(); }, 220);
    }, duration);
    el.querySelector('button').addEventListener('click', function() { clearTimeout(timer); });
  },

  // -----------------------------------------------------------------------
  // SKILL 20: MOTOR DE ORDENAMIENTO DE TABLAS (Sort Engine)
  // -----------------------------------------------------------------------
  _sortState: {},

  /**
   * @param {string} tbodyId
   * @param {{onOrdenar?:function(number,string):boolean}} [opts]
   *   onOrdenar(indiceColumna, 'asc'|'desc') -> true si lo asume quien llama.
   *   Lo usa el Resumen paginado: ordenar solo las filas cargadas daria un
   *   orden que parece global y no lo es, asi que el orden se pide a la base
   *   de datos y la tabla se repinta desde la primera pagina.
   */
  initSortableTable: function(tbodyId, opts) {
    opts = opts || {};
    const tbody = document.getElementById(tbodyId);
    if (!tbody) return;
    const table = tbody.closest('table');
    if (!table) return;
    const ths = Array.from(table.querySelectorAll('thead th'));

    ths.forEach((th, idx) => {
      if (th.hasAttribute('data-nosort')) return;
      th.style.userSelect = 'none';
      th.style.cursor = 'pointer';
      // sortable-table + keyboard-nav: la cabecera es operable por teclado
      // y aria-sort comunica el estado de orden al lector de pantalla.
      th.setAttribute('tabindex', '0');
      th.setAttribute('role', 'columnheader');
      th.setAttribute('aria-sort', 'none');
      if (!th.title) th.title = 'Ordenar por esta columna';
      // Inject sort icon
      if (!th.querySelector('.sort-icon')) {
        const ico = document.createElement('span');
        ico.className = 'sort-icon material-symbols-outlined align-middle';
        ico.style.cssText = 'font-size:11px;margin-left:3px;opacity:0.25;transition:opacity 0.15s';
        ico.setAttribute('aria-hidden', 'true');
        ico.innerText = 'unfold_more';
        th.appendChild(ico);
      }
      const doSort = () => {
        const key = tbodyId + '_' + idx;
        const curr = this._sortState[key] || 'none';
        // Con orden del servidor no hay estado "sin ordenar": la tabla siempre
        // llega ordenada por algo, asi que el ciclo es solo asc <-> desc.
        const next = opts.onOrdenar
          ? (curr === 'asc' ? 'desc' : 'asc')
          : (curr === 'none' ? 'asc' : curr === 'asc' ? 'desc' : 'none');
        this._sortState[key] = next;
        if (!(opts.onOrdenar && opts.onOrdenar(idx, next))) this._sortTableByCol(tbody, idx, next);
        ths.forEach((th2, i2) => {
          const ico2 = th2.querySelector('.sort-icon');
          if (i2 === idx && next !== 'none') {
            th2.setAttribute('aria-sort', next === 'asc' ? 'ascending' : 'descending');
          } else if (!th2.hasAttribute('data-nosort')) {
            th2.setAttribute('aria-sort', 'none');
          }
          if (!ico2) return;
          if (i2 === idx && next !== 'none') {
            ico2.innerText = next === 'asc' ? 'arrow_upward' : 'arrow_downward';
            ico2.style.opacity = '1';
            ico2.style.color = 'var(--color-primary,#162138)';
          } else {
            ico2.innerText = 'unfold_more';
            ico2.style.opacity = '0.25';
            ico2.style.color = '';
          }
        });
      };
      th.addEventListener('click', doSort);
      th.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); doSort(); }
      });
    });
  },

  _sortTableByCol: function(tbody, colIdx, direction) {
    const rows = this._dataRows(tbody);
    if (direction === 'none') {
      rows.sort((a, b) => (+a.dataset.origIdx || 0) - (+b.dataset.origIdx || 0));
    } else {
      rows.forEach((r, i) => { if (!r.dataset.origIdx) r.dataset.origIdx = i; });
      rows.sort((a, b) => {
        const ca = a.cells[colIdx] ? a.cells[colIdx].innerText.trim() : '';
        const cb = b.cells[colIdx] ? b.cells[colIdx].innerText.trim() : '';
        const na = parseFloat(ca.replace(/[^\d.-]/g, ''));
        const nb = parseFloat(cb.replace(/[^\d.-]/g, ''));
        const cmp = (!isNaN(na) && !isNaN(nb)) ? na - nb
          : ca.localeCompare(cb, 'es', { sensitivity: 'base' });
        return direction === 'asc' ? cmp : -cmp;
      });
    }
    rows.forEach(r => tbody.appendChild(r));
  },

  // -----------------------------------------------------------------------
  // SKILL 21: CONTADOR DE RESULTADOS VIVOS
  // -----------------------------------------------------------------------
  updateResultCount: function(tbodyId, countElId) {
    const tbody = document.querySelector(`#main-container #${tbodyId}`) || document.getElementById(tbodyId);
    const el = document.querySelector(`#main-container #${countElId}`) || document.getElementById(countElId);
    if (!tbody || !el) return;
    const rows = this._dataRows(tbody);
    const all = rows.length;
    const vis = rows.filter(r => r.style.display !== 'none').length;
    el.textContent = vis === all ? `${all} registros` : `${vis} de ${all}`;
    el.style.color = vis < all ? 'var(--color-primary,#162138)' : '';
    // Si la navegación provino del resumen de trabajo, el render asíncrono
    // acaba de reemplazar las filas. Reaplica el filtro persistente ahora.
    if (typeof applyActiveDrawerWorkFilter === 'function') {
      setTimeout(applyActiveDrawerWorkFilter, 0);
    }
  },

  // -----------------------------------------------------------------------
  // SKILL 22: EXPORTADOR CSV (Solo filas visibles, limpio)
  // -----------------------------------------------------------------------
  exportVisibleToCSV: function(slug) {
    const table = document.querySelector('#main-container table');
    if (!table) { this.toast('Sin tabla activa para exportar.', 'error'); return; }

    const lines = [];
    const hdr = Array.from(table.querySelectorAll('thead th')).map(th => {
      const c = th.cloneNode(true);
      c.querySelectorAll('.sort-icon').forEach(e => e.remove());
      return '"' + c.innerText.trim().replace(/"/g, '""') + '"';
    });
    lines.push(hdr.join(','));

    table.querySelectorAll('tbody tr').forEach(row => {
      if (row.style.display === 'none') return;
      const cells = Array.from(row.cells).map(td => {
        const c = td.cloneNode(true);
        c.querySelectorAll('button,img,.material-symbols-outlined').forEach(e => e.remove());
        return '"' + c.innerText.replace(/[\r\n\t]+/g, ' ').trim().replace(/"/g, '""') + '"';
      });
      lines.push(cells.join(','));
    });

    const csv = '﻿' + lines.join('\r\n');
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
    const fname = (slug || 'export') + '_' + new Date().toISOString().slice(0, 10) + '.csv';
    a.download = fname;
    a.click();
    this.toast('CSV descargado: ' + fname, 'success');
  },

  // -----------------------------------------------------------------------
  // SKILL 17 (Export): Exportador XLSX Nativo — Filas visibles, datos limpios
  // -----------------------------------------------------------------------
  exportFilteredToExcel: function() {
    if (!AppState.activeModule) return;
    const slug = AppState.activeModule.replace(/^\d+_/, '');
    const table = document.querySelector('#main-container table');
    if (!table) { this.toast('No hay tabla activa para exportar.', 'error'); return; }

    // Build clean header list (skip action columns)
    const skipLabels = ['acciones', 'gestión', 'gestion', 'ver', 'acción', 'accion'];
    const rawHeaders = Array.from(table.querySelectorAll('thead th'));
    const colMap = [];
    const headers = [];
    rawHeaders.forEach((th, i) => {
      const c = th.cloneNode(true);
      c.querySelectorAll('.sort-icon').forEach(e => e.remove());
      const label = c.innerText.trim();
      if (!skipLabels.includes(label.toLowerCase())) {
        colMap.push(i);
        headers.push(label);
      }
    });

    // Extract visible rows as clean objects
    const dataRows = [];
    table.querySelectorAll('tbody tr').forEach(row => {
      if (row.style.display === 'none') return;
      const obj = {};
      colMap.forEach((ci, hi) => {
        const cell = row.cells[ci];
        if (!cell) return;
        const c = cell.cloneNode(true);
        c.querySelectorAll('button,img,.material-symbols-outlined').forEach(e => e.remove());
        obj[headers[hi]] = c.innerText.replace(/[\r\n\t]+/g, ' ').trim();
      });
      dataRows.push(obj);
    });

    if (dataRows.length === 0) { this.toast('No hay registros visibles para exportar.', 'warning'); return; }

    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(dataRows, { header: headers });
    XLSX.utils.book_append_sheet(wb, ws, slug);
    const ts = new Date().toISOString().slice(0, 10).replace(/-/g, '');
    XLSX.writeFile(wb, `${slug}_${ts}.xlsx`);
    this.toast(`${dataRows.length} registros exportados a Excel.`, 'success');
  },

  // =======================================================================
  // SISTEMA DE DISEÑO "Data-Dense Dashboard" (ui-ux-pro-max)
  // Skills 24–27: tabla responsiva, carga, vacío y filas de datos.
  // Documentación de tokens: design-system/motor-pwa/MASTER.md
  // =======================================================================

  /**
   * SKILL 25: CAMPOS OBLIGATORIOS CON ASTERISCO
   * Regla de diseño: todo valor obligatorio lleva un asterisco rojo en su etiqueta.
   * Marca como obligatorios, dentro de `root` (la vista de Edición):
   *   · los ids listados en `data-obligatorios="id1 id2 …"` del propio root,
   *   · todo control con `required`, `aria-required="true"` o `data-obligatorio`.
   * Además unifica los asteriscos escritos a mano ("Área *") con el estilo
   * estándar `.req-star`. Es idempotente: se puede llamar varias veces.
   * @param {HTMLElement} root - vista de Edición (o document)
   */
  marcarObligatorios: function(root) {
    root = root || document;
    if (!root.querySelectorAll) return;
    const STAR = '<span class="req-star" aria-hidden="true">*</span>';
    const esc_id = (v) => (window.CSS && CSS.escape) ? CSS.escape(v) : String(v).replace(/[^\w-]/g, '\\$&');

    const controles = [];
    const lista = (root.dataset && root.dataset.obligatorios) ? root.dataset.obligatorios.split(/\s+/).filter(Boolean) : [];
    lista.forEach(id => { const c = root.querySelector('#' + esc_id(id)); if (c) controles.push(c); });
    root.querySelectorAll('[required], [aria-required="true"], [data-obligatorio]').forEach(c => {
      if (controles.indexOf(c) < 0) controles.push(c);
    });

    // Etiqueta de un control: label[for], o la <label> hermana más cercana hacia arriba
    const labelDe = (c) => {
      if (c.id) { const l = root.querySelector('label[for="' + esc_id(c.id) + '"]'); if (l) return l; }
      let n = c.parentElement;
      for (let i = 0; i < 3 && n && n !== root; i++, n = n.parentElement) {
        const l = Array.prototype.find.call(n.children, el => el.tagName === 'LABEL');
        if (l) return l;
      }
      return null;
    };
    // Convierte un "*" escrito a mano en el estándar; con `forzar` lo añade si falta
    const marcar = (lab, forzar) => {
      if (!lab || lab.querySelector('.req-star')) return;
      const ult = lab.lastChild;
      if (ult && ult.nodeType === 3 && /\s*\*\s*$/.test(ult.nodeValue)) {
        ult.nodeValue = ult.nodeValue.replace(/\s*\*\s*$/, '');
        lab.insertAdjacentHTML('beforeend', STAR);
      } else if (forzar && !/\*\s*$/.test(lab.textContent)) {
        lab.insertAdjacentHTML('beforeend', STAR);
      }
    };

    controles.forEach(c => { c.setAttribute('aria-required', 'true'); marcar(labelDe(c), true); });
    root.querySelectorAll('label').forEach(l => marcar(l, false));
  },

  /**
   * SKILL 24: TABLA RESPONSIVA (tabla en escritorio → tarjetas en móvil)
   * Regla `horizontal-scroll` (severidad ALTA): en <640px una tabla de 7-8
   * columnas obliga a desplazamiento lateral y esconde datos. Aquí cada fila
   * se convierte en tarjeta y cada celda muestra la etiqueta de su columna.
   * Es idempotente: se puede llamar tras cada render.
   * @param {string} tbodyId - ID del <tbody>
   */
  enhanceTable: function(tbodyId) {
    const tbody = document.querySelector(`#main-container #${tbodyId}`) || document.getElementById(tbodyId);
    if (!tbody) return;
    const table = tbody.closest('table');
    if (!table) return;

    table.classList.add('pwa-table-cards');

    // Etiquetas de columna tomadas del <thead> (se ignoran los iconos de orden)
    const headers = Array.from(table.querySelectorAll('thead th')).map(th => {
      const c = th.cloneNode(true);
      c.querySelectorAll('.sort-icon').forEach(e => e.remove());
      return c.innerText.trim();
    });
    const actionLabels = ['acciones', 'gestión', 'gestion', 'acción', 'accion', 'ver'];

    tbody.querySelectorAll('tr').forEach(row => {
      if (row.hasAttribute('data-ds-ui')) return;   // filas de interfaz, no de datos
      Array.from(row.cells).forEach((cell, i) => {
        const label = headers[i] || '';
        cell.setAttribute('data-label', label);
        if (actionLabels.includes(label.toLowerCase())) cell.classList.add('pwa-cell-actions');
      });
    });

    this._cardThumbs(tbody);
  },

  // -----------------------------------------------------------------------
  // MINIATURA DE TARJETA (todas las tarjetas móviles de Resumen)
  // -----------------------------------------------------------------------
  // Cuadrado a la izquierda de cada tarjeta con la imagen de UNA columna del
  // módulo; si el registro no tiene foto, el icono del módulo.
  //   Subconfig → Config_Modular.Card_Image: "Campo"  (o ["Campo1","Campo2"]: el primero con valor)
  //               Config_Modular.Card_Icon:  "material_symbol"   (opcional)
  // Sin Card_Image se usa el primer campo Image / Image_Collection del módulo.
  // El registro de cada fila se busca por data-uuid (o data-dni) en la copia
  // que todo Resumen guarda en localStorage (refdata_<módulo>).
  _thumbCache: {},          // valor guardado → URL lista (las firmadas caducan en 1 h)
  _THUMB_TTL: 50 * 60 * 1000,

  _cardThumbConfig: function(modulo) {
    const cfg = (typeof PERMISOS !== 'undefined' && PERMISOS._subconfig) ? PERMISOS._subconfig(modulo) : null;
    const cm = (cfg && cfg.Config_Modular) || {};
    let campos = cm.Card_Image;   // declarado (aunque sea "") manda sobre la detección automática
    if (!("Card_Image" in cm) && cfg && cfg.Variables) {
      const vars = cfg.Variables;
      campos = Object.keys(vars).find(k => vars[k] && (vars[k].type === 'Image' || vars[k].type === 'Face_Photo')) ||
               Object.keys(vars).find(k => vars[k] && vars[k].type === 'Image_Collection') || '';
    }
    campos = [].concat(campos || []).filter(Boolean);
    // Icono: el del subconfig, si no el del módulo en el menú lateral
    let icono = cm.Card_Icon || (cfg && cfg.Icon) || '';
    if (!icono) {
      const link = document.querySelector(`.drawer-nav-link[onclick*="'${CSS.escape(modulo)}'"] .material-symbols-outlined`);
      icono = link ? link.textContent.trim() : '';
    }
    return { campos, icono: icono || 'description' };
  },

  _cardThumbs: function(tbody) {
    const modulo = (typeof AppState !== 'undefined' && AppState.activeModule) || '';
    if (!modulo) return;
    const filas = Array.from(tbody.querySelectorAll('tr')).filter(r => !r.hasAttribute('data-ds-ui'));
    if (!filas.length) return;
    const { campos, icono } = this._cardThumbConfig(modulo);

    // Lectura sincrona: esto corre en el mismo turno que el pintado de la
    // tabla, asi que no puede esperar a IndexedDB (ver MOTOR_CACHE.leerSync).
    let datos = (typeof MOTOR_CACHE !== 'undefined') ? MOTOR_CACHE.leerSync(modulo) : [];
    if (!datos.length) {
      try { datos = JSON.parse(localStorage.getItem('refdata_' + modulo) || '[]') || []; } catch (e) { datos = []; }
    }
    const porClave = {};
    datos.forEach(r => {
      if (!r) return;
      if (r.UUID) porClave['u:' + r.UUID] = r;
      if (r.DNI)  porClave['d:' + r.DNI]  = r;
    });

    const pendientes = [];   // { img, valor }
    filas.forEach(row => {
      row.classList.add('pwa-card-thumb-row');
      const celda = row.cells[0];
      if (!celda) return;
      let thumb = celda.querySelector(':scope > .pwa-card-thumb');
      if (!thumb) {
        thumb = document.createElement('div');   // div: hay reglas que ocultan los span de la 1.ª celda
        thumb.className = 'pwa-card-thumb';
        thumb.setAttribute('aria-hidden', 'true');
        thumb.innerHTML = `<span class="material-symbols-outlined">${esc(icono)}</span>`;
        celda.insertBefore(thumb, celda.firstChild);
      }
      const reg = porClave['u:' + (row.dataset.uuid || '')] || porClave['d:' + (row.dataset.dni || '')];
      if (!reg || !campos.length) return;
      // Primer archivo de imagen de la primera columna con valor
      let valor = '';
      for (const c of campos) {
        const lista = (typeof partirListaMedia === 'function') ? partirListaMedia(reg[c]) : String(reg[c] || '').split(',');
        valor = lista.find(v => /^data:image\//i.test(v) || !/\.(pdf|docx?|xlsx?|csv|pptx?|txt|zip)(\?|$)/i.test(v)) || '';
        if (valor) break;
      }
      if (!valor || thumb.dataset.src === valor) return;
      thumb.dataset.src = valor;
      let img = thumb.querySelector('img');
      if (!img) {
        img = document.createElement('img');
        img.alt = ''; img.loading = 'lazy'; img.decoding = 'async';
        // Si la imagen no carga, queda el icono
        img.onerror = () => { img.remove(); thumb.classList.remove('has-img'); };
        img.onload  = () => thumb.classList.add('has-img');
        thumb.appendChild(img);
      }
      pendientes.push({ img, valor });
    });
    if (!pendientes.length) return;

    // Lo que ya es una URL utilizable se pinta directo; el resto (rutas de
    // Storage / referencias de Drive) se firma en un solo lote.
    const ahora = Date.now();
    const directo = v => /^(data:image\/|blob:)/i.test(v);
    const porResolver = [];
    pendientes.forEach(p => {
      const c = this._thumbCache[p.valor];
      if (directo(p.valor)) p.img.src = p.valor;
      else if (c && ahora - c.t < this._THUMB_TTL) p.img.src = c.url;
      else if (porResolver.indexOf(p.valor) === -1) porResolver.push(p.valor);
    });
    if (!porResolver.length || typeof DataService === 'undefined' || !DataService.resolveMedia) return;
    DataService.resolveMedia(porResolver).then(urls => {
      porResolver.forEach((v, i) => { if (urls && urls[i]) this._thumbCache[v] = { url: urls[i], t: Date.now() }; });
      pendientes.forEach(p => {
        const c = this._thumbCache[p.valor];
        if (c && p.img.isConnected && !directo(p.valor)) p.img.src = c.url;
        else if (!c && p.img.isConnected && !p.img.src) p.img.remove();
      });
    }).catch(() => {
      // Sin red: quedan los iconos
      pendientes.forEach(p => { if (p.img.isConnected && !p.img.src) p.img.remove(); });
    });
  },

  /**
   * SKILL 25: ESQUELETO DE CARGA (progressive-loading)
   * Regla `loading-states`: toda espera >300ms necesita realimentación. Un
   * esqueleto conserva la altura de la tabla y evita el salto de layout (CLS).
   * @param {string} tbodyId
   * @param {number} rows - filas simuladas (por defecto 6)
   */
  renderSkeleton: function(tbodyId, rows) {
    const tbody = document.querySelector(`#main-container #${tbodyId}`) || document.getElementById(tbodyId);
    if (!tbody) return;
    const table = tbody.closest('table');
    const cols = table ? Math.max(1, table.querySelectorAll('thead th').length) : 4;
    const n = rows || 6;
    const widths = ['70%', '45%', '85%', '55%', '65%', '40%'];

    let html = '';
    for (let r = 0; r < n; r++) {
      html += '<tr data-ds-ui="skeleton" class="ds-skeleton-row" aria-hidden="true">';
      for (let c = 0; c < cols; c++) {
        html += `<td><div class="ds-skeleton-bar" style="width:${esc(widths[(r + c) % widths.length])}"></div></td>`;
      }
      html += '</tr>';
    }
    tbody.innerHTML = html;

    // Anuncio para lector de pantalla sin robar el foco
    if (table) table.setAttribute('aria-busy', 'true');
  },

  /**
   * SKILL 26: ESTADO VACÍO (empty-states)
   * Regla `empty-states`: nunca dejar un espacio en blanco. Siempre mensaje
   * claro + camino de salida (acción).
   * @param {string} tbodyId
   * @param {object} opts - { icon, title, message, actionLabel, onAction }
   */
  showEmptyState: function(tbodyId, opts) {
    const tbody = document.querySelector(`#main-container #${tbodyId}`) || document.getElementById(tbodyId);
    if (!tbody) return;
    const table = tbody.closest('table');
    const cols = table ? Math.max(1, table.querySelectorAll('thead th').length) : 1;
    const o = opts || {};
    // OJO: `action` ya es HTML con sus partes escapadas una por una. No se
    // vuelve a escapar al insertarlo (eso imprimia el <button> como texto).
    const action = (o.actionLabel && o.onAction)
      ? `<button type="button" class="ds-empty-action" onclick="${esc(o.onAction)}">
           <span class="material-symbols-outlined text-[16px]" aria-hidden="true">${esc(o.actionIcon || 'refresh')}</span>${esc(o.actionLabel)}
         </button>`
      : '';

    if (table) table.removeAttribute('aria-busy');
    tbody.innerHTML = `
      <tr data-ds-ui="empty">
        <td colspan="${esc(cols)}" style="padding:0;border:0;">
          <div class="ds-empty" role="status">
            <span class="material-symbols-outlined ds-empty-icon" aria-hidden="true">${esc(o.icon || 'inbox')}</span>
            <h4>${esc(o.title || 'Sin registros')}</h4>
            <p>${esc(o.message || 'Todavía no hay información para mostrar.')}</p>
            ${action}
          </div>
        </td>
      </tr>`;
  },

  /**
   * SKILL 27: FIN DE CARGA — limpia el estado ocupado de la tabla.
   */
  finishLoading: function(tbodyId) {
    const tbody = document.querySelector(`#main-container #${tbodyId}`) || document.getElementById(tbodyId);
    if (!tbody) return;
    const table = tbody.closest('table');
    if (table) table.removeAttribute('aria-busy');
    tbody.querySelectorAll('tr[data-ds-ui="skeleton"]').forEach(r => r.remove());
  },

  /**
   * SKILL 28: DIAGNÓSTICO DE LA BASE DE DATOS — ejecuta
   * DataService.verificarConexion() (Supabase o Apps Script, el que esté
   * activo) y pinta la lista de comprobaciones en el contenedor.
   * @returns {Promise<object|null>} el resultado del diagnóstico
   */
  renderDiagnosticoBD: async function(containerId) {
    const cont = document.querySelector('#main-container #' + containerId) || document.getElementById(containerId);
    if (!cont || typeof DataService === 'undefined') return null;
    cont.setAttribute('aria-busy', 'true');
    cont.innerHTML = '<div class="space-y-2" role="status" aria-label="Verificando conexión">' +
      [1, 2, 3, 4].map(() => '<div class="h-10 rounded-xl bg-surface-variant animate-pulse"></div>').join('') + '</div>';

    const r = await DataService.verificarConexion();
    const conf = {
      ok:    { ico: 'check_circle', cls: 'text-emerald-700', fondo: 'bg-emerald-50 border-emerald-200' },
      warn:  { ico: 'warning',      cls: 'text-amber-700',   fondo: 'bg-amber-50 border-amber-200' },
      error: { ico: 'cancel',       cls: 'text-red-700',     fondo: 'bg-red-50 border-red-200' }
    };
    const n = e => r.checks.filter(c => c.estado === e).length;
    const estadoGeneral = n('error') ? 'error' : (n('warn') ? 'warn' : 'ok');
    const titulo = { ok: 'Conexión correcta', warn: 'Conecta, con avisos', error: 'Hay problemas de conexión' }[estadoGeneral];
    const g = conf[estadoGeneral];

    cont.innerHTML =
      '<div class="flex items-start gap-3 p-3 rounded-xl border ' + g.fondo + ' mb-3">' +
        '<span class="material-symbols-outlined text-[24px] ' + g.cls + ' shrink-0" aria-hidden="true">' + g.ico + '</span>' +
        '<div class="min-w-0"><p class="text-[13px] font-black ' + g.cls + '">' + esc(titulo) + '</p>' +
        '<p class="text-[12px] text-on-surface-variant">' + esc(r.etiqueta) + ' · ' + n('ok') + ' correctas, ' +
          n('warn') + ' avisos, ' + n('error') + ' errores · ' + esc(new Date(r.fecha).toLocaleTimeString('es-PE')) + '</p></div>' +
      '</div>' +
      '<ul class="space-y-1.5">' + r.checks.map(c => {
        const k = conf[c.estado] || conf.warn;
        return '<li class="flex items-start gap-2.5 px-3 py-2 rounded-lg bg-surface-container-low border border-outline-variant">' +
          '<span class="material-symbols-outlined text-[18px] ' + k.cls + ' shrink-0 mt-px" aria-hidden="true">' + k.ico + '</span>' +
          '<span class="sr-only">' + esc({ ok: 'Correcto', warn: 'Aviso', error: 'Error' }[c.estado] || '') + ': </span>' +
          '<div class="min-w-0 flex-1"><p class="text-[12px] font-bold text-on-surface">' + esc(c.nombre) + '</p>' +
          (c.detalle ? '<p class="text-[12px] text-on-surface-variant break-words">' + esc(c.detalle) + '</p>' : '') +
          '</div></li>';
      }).join('') + '</ul>';
    cont.removeAttribute('aria-busy');
    return r;
  },

  /**
   * SKILL 29: GEOLOCALIZACIÓN DEL DISPOSITIVO
   *
   * Captura lat/lng/precisión con la Geolocation API del navegador: funciona
   * igual en el PWA del navegador y dentro del WebView de Capacitor (la app
   * instalada), sin plugin nativo — `vercel.json` ya declara
   * `Permissions-Policy: geolocation=(self)`. Ningún módulo la usa todavía;
   * queda lista para el que la necesite (dónde ocurrió un incidente, dónde se
   * hizo una inspección, etc.): basta llamar a
   * `PWA_SKILLS.obtenerUbicacion()` desde un botón o un MOTOR_HOOKS propio.
   *
   * @param {object} [opts] - { altaPrecision (bool, por defecto true), timeoutMs (por defecto 10000) }
   * @returns {Promise<{lat:number, lng:number, precision:number, hora:string}>}
   *   precision va en metros; hora es ISO 8601. Rechaza con un Error cuyo
   *   mensaje ya está listo para `PWA_SKILLS.toast(msg, 'error')`: sin
   *   soporte del navegador, contexto inseguro (http sin TLS), permiso
   *   denegado, GPS apagado o sin señal a tiempo.
   */
  obtenerUbicacion: function(opts) {
    const o = opts || {};
    return new Promise((resolve, reject) => {
      if (!('geolocation' in navigator)) {
        reject(new Error('Este dispositivo no permite compartir su ubicación.'));
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const c = pos.coords;
          resolve({
            lat: c.latitude,
            lng: c.longitude,
            precision: Math.round(c.accuracy || 0),
            hora: new Date(pos.timestamp).toISOString()
          });
        },
        (err) => {
          const MSG = {
            1: 'Permiso de ubicación denegado. Actívalo en los ajustes del navegador o de la app.',
            2: 'No se pudo obtener la ubicación: revisa que el GPS esté encendido.',
            3: 'La ubicación tardó demasiado en llegar. Inténtalo de nuevo con mejor señal.'
          };
          reject(new Error((err && MSG[err.code]) || 'No se pudo obtener la ubicación.'));
        },
        { enableHighAccuracy: o.altaPrecision !== false, timeout: o.timeoutMs || 10000, maximumAge: 0 }
      );
    });
  },

  /** "lat, lng (±precisión m)" — listo para mostrar en una vista. */
  formatoUbicacion: function(ubic) {
    if (!ubic || ubic.lat == null || ubic.lng == null) return '';
    return Number(ubic.lat).toFixed(6) + ', ' + Number(ubic.lng).toFixed(6) +
      (ubic.precision ? ' (±' + ubic.precision + ' m)' : '');
  },

  /** Enlace de Google Maps a un punto: para abrirlo en una app externa. */
  enlaceMapa: function(lat, lng) {
    return 'https://www.google.com/maps?q=' + encodeURIComponent(lat) + ',' + encodeURIComponent(lng);
  },

  /**
   * Helper interno: filas reales de datos (excluye esqueleto / vacío / sin-resultados).
   */
  _dataRows: function(tbody) {
    return Array.from(tbody.querySelectorAll('tr')).filter(r => !r.hasAttribute('data-ds-ui'));
  },

  /**
   * Helper interno: muestra u oculta el aviso "sin resultados" dentro de la tabla.
   * Regla `empty-states` aplicada al filtrado: el usuario debe saber que su
   * búsqueda no arrojó nada y poder deshacerla en un toque.
   */
  _toggleNoResults: function(tbody, show, term) {
    let row = tbody.querySelector('tr[data-ds-ui="no-results"]');
    if (!show) { if (row) row.remove(); return; }
    if (row) return;

    const table = tbody.closest('table');
    const cols = table ? Math.max(1, table.querySelectorAll('thead th').length) : 1;
    row = document.createElement('tr');
    row.setAttribute('data-ds-ui', 'no-results');
    row.innerHTML = `
      <td colspan="${esc(cols)}" style="padding:0;border:0;">
        <div class="ds-empty" role="status">
          <span class="material-symbols-outlined ds-empty-icon" aria-hidden="true">search_off</span>
          <h4>Sin coincidencias</h4>
          <p>${term ? `Ningún registro coincide con «${esc(term)}» y los filtros activos.` : 'Ningún registro coincide con los filtros activos.'}</p>
          <button type="button" class="ds-empty-action" onclick="PWA_SKILLS.clearFilters()">
            <span class="material-symbols-outlined text-[16px]" aria-hidden="true">filter_alt_off</span>Limpiar filtros
          </button>
        </div>
      </td>`.trim();
    tbody.appendChild(row);
  }
};

/* ─── Cuadrículas de datos en las vistas Detalle (.det-grid, 2 columnas) ───
   Evita el hueco a la derecha: un campo que quedaría solo en su fila (el último
   impar, o el que precede a uno de ancho completo) pasa a ocupar las 2 columnas.
   Se recalcula sola cuando el módulo inyecta los campos con innerHTML. */
(function () {
  function ajustarDetGrid(g) {
    const items = Array.from(g.children).filter(el => !el.hidden);
    let col = 0;
    for (let i = 0; i < items.length; i++) {
      const el = items[i];
      if (el.classList.contains('col-span-2')) { col = 0; continue; }
      const sig = items[i + 1];
      if (col === 0 && (!sig || sig.classList.contains('col-span-2'))) {
        el.classList.add('col-span-2');   // queda solo en la fila: ocupa el ancho completo
      } else {
        col = 1 - col;
      }
    }
  }
  let pendiente = false;
  function programar() {
    if (pendiente) return;
    pendiente = true;
    requestAnimationFrame(function () {
      pendiente = false;
      document.querySelectorAll('.det-grid').forEach(ajustarDetGrid);
    });
  }
  function iniciar() {
    programar();
    new MutationObserver(function (muts) {
      for (const m of muts) {
        for (const n of m.addedNodes) {
          if (n.nodeType !== 1) continue;
          if (n.matches('.det-grid') || n.closest('.det-grid') || n.querySelector('.det-grid')) { programar(); return; }
        }
      }
    }).observe(document.body, { childList: true, subtree: true });
  }
  if (document.body) iniciar(); else document.addEventListener('DOMContentLoaded', iniciar);
})();

/* =======================================================================
   SKILL 28: LISTAS LARGAS QUE SE ESCRIBEN (buscador en los desplegables)
   -----------------------------------------------------------------------
   Regla de diseño: toda lista con más de 8 opciones se filtra al escribir.
   Un desplegable de cuarenta personas obliga a recorrerlo con el pulgar
   para encontrar un nombre que la persona ya sabe; teclear tres letras
   basta.

   Se monta SOBRE el <select> real, que sigue en el formulario con su
   name, su value y su `required`: la cola offline, el Detalle, el PDF y
   todo el código que hace `select.value` siguen funcionando igual aunque
   este componente falle. Lo aplica un observador global, así que alcanza
   a los campos que genera MOTOR_RENDER, a los de las filas hijas, a los
   del panel de filtros y a las vistas escritas a mano (01_Usuarios,
   00_Admin, Configuraciones) sin tocar ningún módulo.

   Para dejar un desplegable sin buscador: data-sin-buscador en el select.
   ======================================================================= */
(function () {
  var MIN_OPCIONES = 8;      // 8 o menos: un select normal es más rápido
  var seq = 0;

  function norm(v) {
    var s = String(v == null ? '' : v).toLowerCase();
    return s.normalize ? s.normalize('NFD').replace(/[̀-ͯ]/g, '') : s;
  }
  function escHtml(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function reales(sel) {
    return Array.prototype.filter.call(sel.options, function (o) { return o.value !== ''; });
  }
  function idSeguro(v) { return (window.CSS && CSS.escape) ? CSS.escape(v) : String(v).replace(/[^\w-]/g, '\\$&'); }

  function estilos() {
    if (document.getElementById('sb-estilos')) return;
    var st = document.createElement('style');
    st.id = 'sb-estilos';
    st.textContent = [
      '.sb-wrap{position:relative;display:block;width:100%}',
      '.sb-nativo{position:absolute!important;left:0;top:0;width:1px;height:1px;opacity:0;padding:0;margin:0;border:0;pointer-events:none}',
      '.sb-input{padding-right:34px!important;text-overflow:ellipsis}',
      '.sb-flecha{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ds-fg-muted);font-size:18px;line-height:1}',
      '.sb-lista{position:absolute;z-index:60;left:0;right:0;top:calc(100% + 4px);max-height:min(50vh,17rem);overflow-y:auto;-webkit-overflow-scrolling:touch;',
      ' margin:0;padding:4px;list-style:none;background:var(--ds-surface);border:1px solid var(--ds-border);border-radius:12px;box-shadow:var(--ds-shadow-lg)}',
      '.sb-lista[hidden]{display:none}',
      '.sb-op{min-height:44px;display:flex;align-items:center;padding:8px 12px;border-radius:8px;cursor:pointer;',
      ' font-size:13px;line-height:1.3;color:var(--ds-fg)}',
      '.sb-op[aria-selected="true"]{font-weight:700}',
      '.sb-op.sb-act,.sb-op:hover{background:var(--ds-surface-sunken)}',
      '.sb-vacio{padding:10px 12px;font-size:12px;color:var(--ds-fg-muted)}',
      /* el panel de filtros recorta su contenido mientras esta cerrado:
         abierto tiene que dejar salir la lista del buscador */
      '#ui-filter-panel.filter-open{overflow:visible}'
    ].join('');
    document.head.appendChild(st);
  }

  /**
   * ¿Esta lista lleva buscador siempre, sin esperar al umbral?
   * Sí cuando sus opciones vienen de otro módulo: el personal de una obra
   * empieza con ocho nombres y acaba con doscientos, y el campo no puede
   * cambiar de comportamiento a mitad del año. `data-ref` lo pone
   * MOTOR_RENDER en todo campo REF; `data-buscador` lo pone
   * loadRelationalOptions y cualquiera que lo quiera forzar a mano.
   */
  function siempreBuscable(sel) {
    return sel.hasAttribute('data-ref') || sel.hasAttribute('data-buscador');
  }

  /** Monta el buscador sobre un select. Devuelve true si lo montó. */
  function montar(sel) {
    if (!sel || sel.dataset.sbMontado || sel.multiple || sel.disabled) return false;
    if (sel.hasAttribute('data-sin-buscador')) return false;
    if (sel.closest('#module-registry')) return false;            // plantillas ocultas
    // Una lista que crece (REF) lleva buscador desde la segunda opción; una
    // lista cerrada del subconfig, solo cuando pasa del umbral.
    var minimo = siempreBuscable(sel) ? 2 : MIN_OPCIONES + 1;
    if (reales(sel).length < minimo) return false;
    estilos();

    var clases = sel.className;
    sel.dataset.sbMontado = '1';
    sel.classList.add('sb-nativo');
    sel.tabIndex = -1;

    var id = 'sb' + (++seq);
    var wrap = document.createElement('div');
    wrap.className = 'sb-wrap';
    sel.parentNode.insertBefore(wrap, sel);
    wrap.appendChild(sel);

    var input = document.createElement('input');
    input.type = 'text';
    input.className = clases + ' sb-input';
    input.id = id + '-in';
    input.autocomplete = 'off';
    input.setAttribute('autocapitalize', 'off');
    input.setAttribute('autocorrect', 'off');
    input.setAttribute('spellcheck', 'false');
    input.setAttribute('role', 'combobox');
    input.setAttribute('aria-autocomplete', 'list');
    input.setAttribute('aria-expanded', 'false');
    input.setAttribute('aria-controls', id + '-lista');
    input.placeholder = 'Escribe para buscar…';

    var etiqueta = sel.id ? document.querySelector('label[for="' + idSeguro(sel.id) + '"]') : null;
    if (etiqueta) input.setAttribute('aria-labelledby', etiqueta.id || (etiqueta.id = id + '-lab'));
    else if (sel.getAttribute('aria-label')) input.setAttribute('aria-label', sel.getAttribute('aria-label'));
    else input.setAttribute('aria-label', 'Buscar opción');

    // Un control obligatorio no puede ser invisible: el navegador intentaría
    // mostrar su aviso sobre el select escondido y no se vería nada. La
    // exigencia pasa al campo visible; la validación del motor no depende de
    // este atributo, sino de `required` en el subconfig.
    if (sel.required) {
      sel.required = false;
      input.required = true;
      input.setAttribute('aria-required', 'true');
    }

    var flecha = document.createElement('span');
    flecha.className = 'material-symbols-outlined sb-flecha';
    flecha.setAttribute('aria-hidden', 'true');
    flecha.textContent = 'expand_more';

    var lista = document.createElement('ul');
    lista.className = 'sb-lista';
    lista.id = id + '-lista';
    lista.setAttribute('role', 'listbox');
    lista.hidden = true;

    wrap.appendChild(input);
    wrap.appendChild(flecha);
    wrap.appendChild(lista);

    var act = -1;   // opción resaltada dentro de lo pintado

    function textoActual() {
      var o = sel.options[sel.selectedIndex];
      return (o && o.value !== '') ? o.textContent : '';
    }
    function sincronizar() { if (document.activeElement !== input) input.value = textoActual(); }

    function items() { return lista.querySelectorAll('.sb-op'); }

    function resaltar(i, desplazar) {
      var els = items();
      if (!els.length) { act = -1; return; }
      act = Math.max(0, Math.min(els.length - 1, i));
      Array.prototype.forEach.call(els, function (el, n) { el.classList.toggle('sb-act', n === act); });
      input.setAttribute('aria-activedescendant', els[act].id);
      if (desplazar !== false && els[act].scrollIntoView) els[act].scrollIntoView({ block: 'nearest' });
    }

    function pintar(q) {
      var t = norm(q);
      var ops = reales(sel).filter(function (o) {
        return !t || norm(o.textContent).indexOf(t) >= 0 || norm(o.value).indexOf(t) >= 0;
      });
      if (!ops.length) {
        lista.innerHTML = '<li class="sb-vacio">Sin coincidencias</li>';
        act = -1;
        input.removeAttribute('aria-activedescendant');
        return;
      }
      lista.innerHTML = ops.map(function (o, i) {
        var n = Array.prototype.indexOf.call(sel.options, o);
        return '<li role="option" class="sb-op" id="' + id + '-o' + i + '" data-n="' + n + '"' +
               ' aria-selected="' + (sel.selectedIndex === n ? 'true' : 'false') + '">' +
               escHtml(o.textContent) + '</li>';
      }).join('');
      var elegido = -1;
      ops.forEach(function (o, i) { if (Array.prototype.indexOf.call(sel.options, o) === sel.selectedIndex) elegido = i; });
      resaltar(elegido >= 0 ? elegido : 0, false);
    }

    function abrir() {
      if (!lista.hidden) return;
      pintar('');
      lista.hidden = false;
      input.setAttribute('aria-expanded', 'true');
    }
    function cerrar(restaurar) {
      lista.hidden = true;
      input.setAttribute('aria-expanded', 'false');
      input.removeAttribute('aria-activedescendant');
      if (restaurar !== false) input.value = textoActual();
    }
    function elegir(n) {
      if (sel.selectedIndex !== n) {
        sel.selectedIndex = n;
        sel.dispatchEvent(new Event('input', { bubbles: true }));
        sel.dispatchEvent(new Event('change', { bubbles: true }));
      }
      input.value = textoActual();
      cerrar(false);
    }

    input.addEventListener('focus', function () { sincronizar(); input.select(); abrir(); });
    input.addEventListener('click', abrir);
    input.addEventListener('input', function () {
      if (lista.hidden) { lista.hidden = false; input.setAttribute('aria-expanded', 'true'); }
      pintar(input.value);
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (lista.hidden) { abrir(); return; }
        resaltar(act + (e.key === 'ArrowDown' ? 1 : -1));
      } else if (e.key === 'Enter') {
        var els = items();
        if (!lista.hidden && act >= 0 && els[act]) { e.preventDefault(); elegir(parseInt(els[act].dataset.n, 10)); }
      } else if (e.key === 'Escape') {
        if (!lista.hidden) { e.preventDefault(); e.stopPropagation(); cerrar(true); }
      } else if (e.key === 'Tab') {
        cerrar(true);
      }
    });
    lista.addEventListener('mousedown', function (e) {
      var op = e.target.closest ? e.target.closest('.sb-op') : null;
      if (!op) return;
      e.preventDefault();              // no perder el foco antes de elegir
      elegir(parseInt(op.dataset.n, 10));
    });
    input.addEventListener('blur', function () {
      setTimeout(function () {
        if (wrap.contains(document.activeElement)) return;
        // Texto vacío = sin selección. Un texto a medio escribir nunca se
        // guarda: el campo vuelve al último valor elegido.
        if (!input.value.trim() && sel.value !== '') {
          sel.value = '';
          sel.dispatchEvent(new Event('change', { bubbles: true }));
        }
        cerrar(true);
      }, 120);
    });
    // Pulsar la etiqueta enfoca el select oculto: se traslada al buscador
    sel.addEventListener('focus', function () { input.focus(); });

    // El select sigue siendo el control de verdad: nunca se redefine su
    // `value` ni se toca su prototipo. Cuando otro código lo asigna al
    // precargar la Edición, el texto del buscador se pone al día por tres
    // caminos: el evento change, el repaso del observador (corre en el
    // siguiente fotograma, después de la precarga) y el foco del campo.
    sel.addEventListener('change', sincronizar);

    sel._sbSync = sincronizar;
    sincronizar();
    return true;
  }

  /** Recorre root y monta (o resincroniza) el buscador donde corresponde. */
  function mejorarSelects(root) {
    root = root || document;
    if (!root.querySelectorAll) return 0;
    var n = 0;
    root.querySelectorAll('select').forEach(function (sel) {
      if (sel.dataset.sbMontado) {
        if (sel._sbSync) sel._sbSync();     // las opciones pueden llegar después
      } else if (montar(sel)) n++;
    });
    return n;
  }

  // PWA_SKILLS se declara con const: es un enlace global, no una propiedad
  // de window, así que se comprueba con typeof y no con window.PWA_SKILLS.
  try {
    if (typeof PWA_SKILLS !== 'undefined' && PWA_SKILLS) {
      PWA_SKILLS.selectBuscable = montar;
      PWA_SKILLS.mejorarSelects = mejorarSelects;
    }
  } catch (e) { /* sin PWA_SKILLS: el observador sigue funcionando igual */ }

  // Observador global: alcanza a los campos del motor, a las filas hijas, a
  // los filtros y a las vistas escritas a mano, sin tocar ningún módulo.
  var pendiente = false;
  function programar() {
    if (pendiente) return;
    pendiente = true;
    requestAnimationFrame(function () { pendiente = false; mejorarSelects(document); });
  }
  function iniciar() {
    programar();
    // Cualquier cambio del DOM vuelve a pasar el repaso: así se monta el
    // buscador en lo que acaba de pintarse y, de paso, se pone al día el
    // texto de los que ya estaban (la Edición asigna `select.value` después
    // de crear los campos, sin disparar ningún evento). El repaso va
    // agrupado en un fotograma y solo recorre los <select>.
    new MutationObserver(programar)
      .observe(document.body, { childList: true, subtree: true });
    // Última red: al volver a la pestaña y al enfocar un campo del formulario
    document.addEventListener('visibilitychange', function () { if (!document.hidden) programar(); });
  }
  if (document.body) iniciar(); else document.addEventListener('DOMContentLoaded', iniciar);
})();

</script>
