/**
 * =========================================================================
 * APP ROUTING & MODULE LOADER
 * =========================================================================
 * ARCHIVO: App_Routing.js.html
 * DESCRIPCIÓN: Gestiona la navegación entre módulos y la carga dinámica
 * de configuraciones (Subconfig). Es el cerebro que decide qué se muestra.
 */

// El objeto AppState ya viene definido desde Global_Config.js.html
// Solo aseguramos que las propiedades necesarias para el ruteo existan:
if(!AppState.currentView) AppState.currentView = 'Login';

/**
 * Inicializador Maestro
 */
async function initApp() {
  console.log("🚀 Iniciando Ruteador...");

  // 1. Inicializar DB Offline (con timeout de 3s por si falla silenciosamente)
  await Promise.race([
    initOfflineDB(),
    new Promise(resolve => setTimeout(resolve, 3000))
  ]);

  // 2. Aplicar configuraciones guardadas (colores, nombre app, etc.)
  if (typeof applyAppSettings === 'function') applyAppSettings();

  // 3. Sembrar usuario demo si no existe
  if (typeof seedDemoUsers === 'function') await seedDemoUsers();

  // 4. Kill-switch: verificar expiración de sesión (8 horas)
  const sessionExpiry = localStorage.getItem('pwa_session_expiry');
  if (sessionExpiry && Date.now() > parseInt(sessionExpiry)) {
    AppState.clearSession();
    showView('Login');
    return;
  }

  // 5. Kill-switch: verificar status "CESADO" guardado localmente
  const localStatus = AppState.User.Status;
  if (localStatus && localStatus.toUpperCase() === 'CESADO') {
    alert('Su acceso ha sido revocado corporativamente. Contacte al administrador.');
    AppState.clearSession();
    showView('Login');
    return;
  }

  // 6. Verificar Sesión
  if (!AppState.User.Token) {
    showView('Login');
  } else {
    showView('Menu');
  }
}

/**
 * Cambia la vista principal del contenedor
 * @param {string} viewID - Login, Menu o el nombre de un módulo (ej: 01_Reportes)
 */
function showView(viewID, options) {
  options = options || {};
  // Un filtro abierto desde el resumen del drawer pertenece solamente a esa
  // navegación. Cualquier acceso normal (menú, footer, dashboard) vuelve a
  // mostrar el módulo sin arrastrar un filtro anterior.
  if (!options.keepDrawerWorkFilter && typeof drawerWorkActiveFilter !== 'undefined' && drawerWorkActiveFilter) {
    drawerWorkActiveFilter = null;
    const staleNotice = document.getElementById('drawer-work-filter-notice');
    if (staleNotice) staleNotice.remove();
  }
  const container = document.getElementById('main-container');
  const appTitle = document.getElementById('app-title');
    // Limpiar clases activas en sidebar si aplica
    document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
    
    // Skill #15/17: Control de Visibilidad y Limpieza de Interfaz
    const syncBtn = document.getElementById('ui-global-sync-btn');
    const footer = document.getElementById('main-footer');

    // Mantiene el estado visual de la navegaciÃ³n inferior sin interferir
    // con los controles de permisos que hace showView mÃ¡s abajo.
    document.querySelectorAll('[data-footer-view]').forEach(button => {
      const isActive = button.dataset.footerView === viewID;
      button.classList.toggle('is-active', isActive);
      button.setAttribute('aria-current', isActive ? 'page' : 'false');
    });
    
    // Limpieza del SLOT de filtros que ahora está en la vista clonada (usar querySelector sobre el contenedor)
    const activeFilterSlot = container.querySelector('#ui-filter-slot');
    if (activeFilterSlot) activeFilterSlot.innerHTML = '';

    if (viewID !== 'Login' && viewID !== 'Menu') {
        if (syncBtn) syncBtn.style.display = 'flex';
        if (footer) footer.style.display = 'grid';
    } else {
        if (syncBtn) syncBtn.style.display = 'none';
        if (footer) footer.style.display = (viewID === 'Menu' ? 'grid' : 'none');
        AppState.activeModule = null;
    }

  // Actualizar el link activo del drawer
  if (typeof updateDrawerActiveLink === 'function') updateDrawerActiveLink(viewID);

  // Limpiar antes de inyectar
  container.innerHTML = '';
  
  if (viewID === 'Login') {
    appTitle.innerText = "Acceso - PWA";
    container.innerHTML = renderLogin();
  } 
  else if (viewID === 'Menu') {
    appTitle.innerText = "Menú Principal";
    container.innerHTML = renderMenu();
    // Los <script> insertados vía innerHTML no se ejecutan: la carga de datos
    // del panel debe dispararse explícitamente desde aquí.
    setTimeout(() => loadDashboardData(false), 40);
  }
  else {
    // Control de acceso: un módulo desactivado o sin permiso de lectura no se
    // abre ni escribiendo la ruta a mano. La comprobación va ANTES de inyectar.
    if (typeof PERMISOS !== 'undefined' && !PERMISOS.moduloVisible(viewID)) {
      const motivo = !PERMISOS.moduloActivo(viewID)
        ? 'Este módulo no está incluido en el plan de tu empresa.'
        : 'Tu rol (' + PERMISOS.etiqueta() + ') no tiene acceso a este módulo.';
      container.innerHTML =
        '<div class="ds-empty" role="status" style="min-height:60vh">' +
        '<span class="material-symbols-outlined ds-empty-icon" aria-hidden="true">lock</span>' +
        '<h4>Acceso no disponible</h4><p>' + motivo + '</p>' +
        '<button type="button" class="ds-empty-action" onclick="showView(\'Menu\')">' +
        '<span class="material-symbols-outlined text-[16px]" aria-hidden="true">home</span>Volver al panel</button></div>';
      appTitle.innerText = 'Acceso restringido';
      AppState.activeModule = null;
      return;
    }

    // Carga de Módulos (Ej: 03_Inspecciones)
    AppState.activeModule = viewID;
    appTitle.innerText = viewID.replace(/^\d+_/, '').replace(/_/g, ' ');
    
    // Inyectar TODAS las vistas del módulo (Resumen, Edicion, Detalle)
    const views = ['resumen', 'edicion', 'detalle'];
    let foundAny = false;
    
    views.forEach(v => {
      const viewDOM = document.getElementById(`module-${viewID.toLowerCase()}-${v}`);
      if (viewDOM) {
        container.appendChild(viewDOM.cloneNode(true));
        foundAny = true;
      }
    });

    if (!foundAny) {
      // Fallback: buscar cualquier elemento cuyo ID contenga el moduleID (ej: 00-admin-container)
      const altSlug = viewID.toLowerCase().replace(/_/g, '-');
      document.querySelectorAll(`#module-registry [id*="${altSlug}"]`).forEach(el => {
        container.appendChild(el.cloneNode(true));
        foundAny = true;
      });
    }

    if (!foundAny) {
      container.innerHTML = `<p style="color:red; text-align:center;">Error: No se encontraron vistas para [${viewID}].</p>`;
    } else {
      // Por defecto mostrar el Resumen al entrar
      changeInternalView(viewID, 'Resumen');
    }
  }
}

/**
 * Controla la navegación interna entre las 3 vistas obligatorias
 * @param {string} moduleID - ID del módulo
 * @param {string} viewType - Resumen, Edicion o Detalle
 * @param {string} recordID - Opcional para carga de datos en Detalle/Edicion
 */
function changeInternalView(moduleID, viewType, recordID = null) {
  try {
    console.log(`🔄 Cambiando vista interna: ${moduleID} -> ${viewType}`);
    const modLower = moduleID.toLowerCase();
    // Normalización de nombres de vistas (Soporte Multi-idioma Detail/Detalle)
    let viewMap = {
      'detail': 'detalle',
      'edit': 'edicion',
      'edition': 'edicion',
      'summary': 'resumen',
      'resumen': 'resumen',
      'detalle': 'detalle',
      'edicion': 'edicion'
    };
    const vtLower = viewType.toLowerCase();
    const vtRef = viewMap[vtLower] || vtLower;

    console.log(`🎯 Buscando elemento con patrón: [${modLower}] + [${vtRef}]`);

    // 1. Ocultar todas las vistas del módulo actual dentro del contenedor
    const allViews = document.querySelectorAll('#main-container .module-view');
    allViews.forEach(el => el.style.display = 'none');

    // 2. Identificar y activar la vista solicitada (Selector flexible para ID)
    const activeEl = document.querySelector(`#main-container [id*="${modLower}"][id*="${vtRef}"]`);
    
    if (!activeEl) {
        console.error(`❌ No se pudo localizar el elemento de vista para modulo: ${modLower} y vista: ${vtRef}`);
        // Fallback: tratar de buscar por ID exacto si el selector flexible falla
        const fallbackId = `module-${modLower}-${vtRef}`;
        const fallbackEl = document.getElementById(fallbackId);
        if(!fallbackEl) {
          console.error("❌ Fallback de ID exacto también falló.");
          return;
        }
        fallbackEl.style.display = 'block';
        return;
    }

    activeEl.style.display = 'block';

    // Skill #17: Gestión de Filtros
    if (vtLower === 'resumen') {
        // FIX-13: Barra de búsqueda reutilizable
        const _searchPlaceholders = {
          '01_Usuarios': 'Buscar por nombre, DNI...',
          '02_Reportes': 'Buscar reportes...',
          '03_Inspecciones': 'Buscar en Inspecciones...',
          '04_Actos_Condiciones': 'Buscar por reportante, área, tipo...',
          '05_Incidentes': 'Buscar por afectado, área, tipo...',
          '06_Capacitaciones': 'Buscar por nombre, tema, instructor...',
          '07_IPERC': 'Buscar por proceso, área, tarea...',
          '08_PETAR': 'Buscar por tipo de trabajo, área, empresa...',
          '09_EPP': 'Buscar por trabajador, área, equipo...',
          '10_Charlas': 'Buscar por tema, área, expositor...'
        };
        PWA_SKILLS.renderSearchBar('ui-search-bar-slot', _searchPlaceholders[moduleID] || 'Buscar...');
        // Skill #19: Renderizado dinámico de filtros basado en Subconfig
        PWA_SKILLS.renderDynamicFilters(moduleID);
        // Módulos con carga dinámica en vista resumen
        const resumenFn = `loadResumen_${moduleID}`;
        if (typeof window[resumenFn] === 'function') setTimeout(() => window[resumenFn](), 50);
        // Skill #24: tabla → tarjetas en móvil. Se aplica a TODO módulo con tabla,
        // después de que su loader haya pintado las filas.
        setTimeout(enhanceActiveTable, 160);
        // Retira de la vista los botones que este rol no puede usar y avisa
        // del alcance de datos aplicado.
        if (typeof PERMISOS !== 'undefined') setTimeout(() => PERMISOS.aplicarVista(moduleID), 180);
    }
    else if (vtRef === 'edicion') {
        // Skill 11: Auto-inicialización de Pizarras de Firma
        setTimeout(() => {
          const pads = activeEl.querySelectorAll('canvas[id*="sign"], canvas[id*="signature"]');
          pads.forEach(p => PWA_SKILLS.initSignaturePad(p.id));
          console.log(`✍️ Signature Pads inicializados en ${moduleID}`);
        }, 300);
        // Módulos con carga dinámica en vista edición
        const edicionFn = `loadEdicion_${moduleID}`;
        if (typeof window[edicionFn] === 'function') setTimeout(() => window[edicionFn](recordID), 50);
    }
    
    // Si entramos a DETALLE, disparamos el motor de renderizado de la Regla 12
    // vtRef ya normaliza "Detail" y "Detalle" al identificador de la vista.
    // Usarlo aquí garantiza que el cargador reciba el registro seleccionado.
    if (vtRef === 'detalle' && recordID) {
      const renderFunctionName = `loadDetail_${moduleID}`;
      if (typeof window[renderFunctionName] === "function") {
         window[renderFunctionName](recordID);
      }
    }
  } catch (err) {
    console.error("🔥 Error crítico en ruteo interno:", err);
  }
}

/**
 * Sistema de diseño: adapta la tabla activa a tarjetas en móvil y mantiene
 * el contador de resultados sincronizado. Segura de llamar varias veces.
 * Se invoca desde el router y tras cualquier render dinámico de filas.
 */
function enhanceActiveTable() {
  const tbody = document.querySelector('#main-container table tbody');
  if (!tbody || !tbody.id) return;
  PWA_SKILLS.enhanceTable(tbody.id);
}

function toggleLoginPassword() {
  const input = document.getElementById('login-pass');
  const eye   = document.getElementById('login-pass-eye');
  if (!input) return;
  if (input.type === 'password') {
    input.type = 'text';
    if (eye) eye.innerText = 'visibility_off';
  } else {
    input.type = 'password';
    if (eye) eye.innerText = 'visibility';
  }
}

 * invoca después de inyectar el HTML.
 *
 * @param {boolean} manual - true si la disparó el usuario (muestra realimentación)
 */
function loadDashboardData(manual) {
  const ico = document.getElementById('dash-refresh-ico');
  if (manual && ico) {
    ico.classList.add('animate-spin');
    setTimeout(() => ico.classList.remove('animate-spin'), 700);
  }

  // Sello de frescura del panel.
  const stamp = document.getElementById('dash-updated');
  if (stamp) {
    const h = new Date().toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' });
    stamp.textContent = 'Actualizado ' + h;
  }
}

/**
 * Lógica de Login (SHA-256 Integration)
 */
async function handleLogin() {
  const dni = document.getElementById('login-dni').value.trim();
  const pass = document.getElementById('login-pass').value;

  if (!dni || !pass) {
    PWA_SKILLS.toast('Ingresa tu DNI y contraseña.', 'warning');
    if (!dni) document.getElementById('login-dni').focus();
    else document.getElementById('login-pass').focus();
    return;
  }

  const hash = await PWA_SKILLS.hashSHA256(pass);

  const onLoginSuccess = (u) => {
    AppState.updateSession({
      DNI: u.DNI || dni,
      Token: hash,
      Status: u.Status || 'Activo',
      Nombre: u.Nombre_Completo || '',
      Email: u.Email || '',
      Rol: u.Rol || 'Trabajador'
    });
    const timeoutMin = parseInt((typeof getAppSettings === 'function' ? getAppSettings().Session_Timeout : null) || '480');
    localStorage.setItem('pwa_session_expiry', String(Date.now() + timeoutMin * 60 * 1000));
    showView('Menu');
  };

  const tryOfflineLogin = async () => {
    if (typeof authenticateOffline === 'function') {
      const offlineUser = await authenticateOffline(dni, hash);
      if (offlineUser) {
        console.log('✅ Login offline exitoso para:', dni);
        onLoginSuccess(offlineUser);
        return true;
      }
    }
    return false;
  };

  // Usar DataService (soporta Sheets y Supabase de forma transparente)
  try {
    const parsed = await DataService.auth(dni, hash);
    if (parsed.status === 'CESADO') {
      PWA_SKILLS.toast('Acceso revocado. Contacte al administrador.', 'error', 5000);
      return;
    }
    if (parsed.status === 'OK' && parsed.userData) {
      onLoginSuccess(parsed.userData);
      return;
    }
    const ok = await tryOfflineLogin();
    if (!ok) PWA_SKILLS.toast(parsed.msg || 'Credenciales inválidas.', 'error');
  } catch (err) {
    console.warn('Servidor no disponible, intentando login offline:', err);
    const ok = await tryOfflineLogin();
    if (!ok) PWA_SKILLS.toast('Sin conexión. Verifica tus credenciales demo.', 'error');
  }
}

const DRAWER_WORK_MODULES = [
  { id: '03_Inspecciones',      label: 'Inspecciones' },
  { id: '02_Reportes',          label: 'Reportes' },
  { id: '04_Actos_Condiciones', label: 'Actos y condiciones' },
  { id: '05_Incidentes',        label: 'Incidentes' },
  { id: '06_Capacitaciones',    label: 'Capacitaciones' },
  { id: '07_IPERC',             label: 'Matriz IPERC' },
  { id: '08_PETAR',             label: 'Permisos PETAR' },
  { id: '09_EPP',               label: 'Entrega de EPP' },
  { id: '10_Charlas',           label: 'Charlas 5 minutos' }
];
let drawerWorkSummaryCache = { key: '', at: 0, data: null };
let drawerWorkActiveFilter = null;

function drawerSummaryDate(value) {
  const text = String(value || '').trim();
  let match = text.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (match) return new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
  match = text.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  return match ? new Date(Number(match[3]), Number(match[2]) - 1, Number(match[1])) : null;
}

function drawerSummaryIsPending(record) {
  const stateKeys = Object.keys(record).filter(key => /(^|_)(estado|status|situacion)(_|$)/i.test(key));
  if (!stateKeys.length) return false;
  const state = stateKeys.map(key => String(record[key] || '')).join(' ').toLowerCase();
  return state !== '' && !/(cerrad|complet|finaliz|atendid|archivad|anulad|cancelad|entregad)/.test(state);
}

function drawerSummaryIsOverdue(record, today) {
  const dueKeys = Object.keys(record).filter(key => /(plazo|fecha.*(limite|venc|compromiso|programad)|vencimiento)/i.test(key));
  const dates = dueKeys.map(key => drawerSummaryDate(record[key])).filter(Boolean);
  return dates.some(date => date < today);
}

function renderDrawerWorkSummary(items, isAdmin) {
  const body = document.getElementById('drawer-work-summary-body');
  const scope = document.getElementById('drawer-work-summary-scope');
  if (!body || !scope) return;

  scope.textContent = isAdmin ? 'Todos los registros' : 'Solo tus pendientes';
  const active = items.filter(item => item.pending > 0);
  if (!active.length) {
    body.innerHTML = '<p class="drawer-work-empty">No hay pendientes registrados para tu alcance.</p>';
    return;
  }

  const maxPending = Math.max.apply(null, active.map(item => item.pending));
  body.innerHTML = active.map(item => {
    const pendingWidth = Math.max(8, Math.round(item.pending / maxPending * 100));
    const overdueWidth = item.overdue ? Math.max(8, Math.round(item.overdue / item.pending * pendingWidth)) : 0;
    return '<div class="drawer-work-row">' +
      '<button type="button" class="drawer-work-name" title="Ver pendientes" onclick="openDrawerWorkModule(\'' + item.id + '\', \'pendientes\')">' + item.label + '</button>' +
      '<button type="button" class="drawer-work-bar" title="Ver pendientes" aria-label="' + item.pending + ' pendientes, ' + item.overdue + ' vencidos" onclick="openDrawerWorkModule(\'' + item.id + '\', \'pendientes\')">' +
        '<span class="drawer-work-bar-pending" style="width:' + pendingWidth + '%"></span>' +
        (overdueWidth ? '<span class="drawer-work-bar-overdue" style="width:' + overdueWidth + '%"></span>' : '') +
      '</button>' +
      '<span class="drawer-work-actions">' +
        '<button type="button" class="drawer-work-count" title="Ver pendientes" onclick="openDrawerWorkModule(\'' + item.id + '\', \'pendientes\')">' + item.pending + '</button>' +
        (item.overdue ? '<button type="button" class="drawer-work-overdue" title="Ver vencidos" onclick="openDrawerWorkModule(\'' + item.id + '\', \'vencidos\')">' + item.overdue + '</button>' : '') +
      '</span>' +
    '</div>';
  }).join('');
}

function drawerWorkRowMatches(row, filterKind) {
  const text = String(row.innerText || '').toLowerCase();
  const closed = /(cerrad|complet|finaliz|atendid|archivad|anulad|cancelad|entregad)/.test(text);
  const pending = !closed && /(pendiente|en proceso|programad|reportad|investigaci|acciones abiertas|abierto|solicitad|revisi[oó]n|borrador|firma|actualizaci[oó]n|no realizada)/.test(text);
  if (!pending) return false;
  if (filterKind !== 'vencidos') return true;

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const dates = String(row.innerText || '').match(/\b(?:\d{4}-\d{2}-\d{2}|\d{2}\/\d{2}\/\d{4})\b/g) || [];
  return dates.map(drawerSummaryDate).filter(Boolean).some(date => date < today);
}

function drawerWorkActiveRowMatches(row) {
  const active = drawerWorkActiveFilter;
  if (!active || typeof AppState === 'undefined' || AppState.activeModule !== active.moduleId) return true;

  // Los UUID provienen exactamente de los mismos registros usados para crear
  // los contadores del drawer. Se buscan también en el onclick de la fila,
  // porque algunos módulos no muestran el UUID como texto visible.
  if (active.uuids && active.uuids.length) {
    const rowSource = String(row.outerHTML || row.innerText || '').toLowerCase();
    return active.uuids.some(uuid => rowSource.includes(uuid));
  }

  // Compatibilidad con datos antiguos o registros sin UUID.
  return drawerWorkRowMatches(row, active.kind);
}

function renderDrawerWorkFilterNotice(filterKind, visible, total) {
  const oldNotice = document.getElementById('drawer-work-filter-notice');
  if (oldNotice) oldNotice.remove();

  const table = document.querySelector('#main-container table');
  if (!table || !table.parentElement || !table.parentElement.parentElement) return;

  const label = filterKind === 'vencidos' ? 'vencidos' : 'pendientes';
  const notice = document.createElement('div');
  notice.id = 'drawer-work-filter-notice';
  notice.className = 'mb-3 flex items-center justify-between gap-2 rounded-lg border border-primary/20 bg-primary/5 px-3 py-2 text-[10px] font-semibold text-primary';
  notice.innerHTML = '<span>Mostrando ' + visible + ' de ' + total + ' ' + label + '.</span>' +
    '<button type="button" class="underline" onclick="clearDrawerWorkFilter()">Ver todos</button>';
  table.parentElement.parentElement.insertBefore(notice, table.parentElement);
}

function applyDrawerWorkFilter(moduleId, filterKind) {
  if (!drawerWorkActiveFilter || drawerWorkActiveFilter.moduleId !== moduleId) return;
  if (typeof AppState === 'undefined' || AppState.activeModule !== moduleId) return;

  const body = document.querySelector('#main-container table tbody');
  const rows = body ? Array.from(body.querySelectorAll('tr:not([data-ds-ui])')) : [];
  rows.forEach(row => { row.style.display = drawerWorkActiveRowMatches(row) ? '' : 'none'; });

  const visible = rows.filter(row => row.style.display !== 'none').length;
  if (body && typeof PWA_SKILLS !== 'undefined') {
    PWA_SKILLS._toggleNoResults(body, rows.length > 0 && visible === 0, filterKind);
  }
  const countEl = document.querySelector('#main-container #ui-result-count') ||
    document.querySelector('#main-container [id$="result-count"]');
  if (countEl) {
    countEl.textContent = visible === rows.length ? rows.length + ' registros' : visible + ' de ' + rows.length;
    countEl.style.color = visible < rows.length ? 'var(--color-primary,#000666)' : '';
  }
  renderDrawerWorkFilterNotice(filterKind, visible, rows.length);
}

function applyActiveDrawerWorkFilter() {
  if (!drawerWorkActiveFilter) return;
  applyDrawerWorkFilter(drawerWorkActiveFilter.moduleId, drawerWorkActiveFilter.kind);
}

function clearDrawerWorkFilter() {
  drawerWorkActiveFilter = null;
  const notice = document.getElementById('drawer-work-filter-notice');
  if (notice) notice.remove();
  if (typeof PWA_SKILLS !== 'undefined') PWA_SKILLS.applyFilters();
}

function openDrawerWorkModule(moduleId, filterKind) {
  const item = (drawerWorkSummaryCache.data || []).find(summary => summary.id === moduleId);
  const sourceIds = item
    ? (filterKind === 'vencidos' ? item.overdueIds : item.pendingIds)
    : [];
  drawerWorkActiveFilter = {
    moduleId: moduleId,
    kind: filterKind === 'vencidos' ? 'vencidos' : 'pendientes',
    uuids: (sourceIds || []).map(value => String(value || '').trim().toLowerCase()).filter(Boolean)
  };

  const drawer = document.getElementById('nav-drawer');
  if (drawer && drawer.classList.contains('drawer-open')) toggleNavDrawer();
  showView(moduleId, { keepDrawerWorkFilter: true });

  // Primera aplicación para tablas ya pintadas y reintentos de respaldo para
  // cargas asíncronas. El renderizador común vuelve a aplicarlo al terminar.
  [80, 240, 600, 1200, 2500, 5000].forEach(delay => {
    setTimeout(applyActiveDrawerWorkFilter, delay);
  });
}

async function loadDrawerWorkSummary(force) {
  const body = document.getElementById('drawer-work-summary-body');
  if (!body || typeof DataService === 'undefined') return;

  const isAdmin = typeof PERMISOS !== 'undefined' && PERMISOS.esAlMenos('Admin');
  const userDni = (typeof AppState !== 'undefined' && AppState.User) ? AppState.User.DNI || '' : '';
  const cacheKey = (isAdmin ? 'all' : 'own') + ':' + userDni;
  const fresh = drawerWorkSummaryCache.key === cacheKey && Date.now() - drawerWorkSummaryCache.at < 60000;
  if (!force && fresh && drawerWorkSummaryCache.data) {
    renderDrawerWorkSummary(drawerWorkSummaryCache.data, isAdmin);
    return;
  }

  body.innerHTML = '<p class="drawer-work-empty">Actualizando pendientes…</p>';
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const items = await Promise.all(DRAWER_WORK_MODULES.map(async module => {
    try {
      if (typeof PERMISOS !== 'undefined' && !PERMISOS.moduloVisible(module.id)) return null;
      const response = await DataService.read(module.id);
      const parsed = typeof response === 'string' ? JSON.parse(response) : response;
      const rows = Array.isArray(parsed && parsed.payload) ? parsed.payload : [];
      const scopedRows = isAdmin || typeof PERMISOS === 'undefined'
        ? rows
        : PERMISOS.filtrarDatos(module.id, rows);
      const pendingRows = scopedRows.filter(drawerSummaryIsPending);
      const overdueRows = pendingRows.filter(row => drawerSummaryIsOverdue(row, today));
      return {
        id: module.id,
        label: module.label,
        pending: pendingRows.length,
        overdue: overdueRows.length,
        pendingIds: pendingRows.map(row => row.UUID).filter(Boolean),
        overdueIds: overdueRows.map(row => row.UUID).filter(Boolean)
      };
    } catch (error) {
      console.warn('No se pudo resumir ' + module.id, error);
      return null;
    }
  }));

  drawerWorkSummaryCache = { key: cacheKey, at: Date.now(), data: items.filter(Boolean) };
  renderDrawerWorkSummary(drawerWorkSummaryCache.data, isAdmin);
}

function toggleNavDrawer() {
  const drawer = document.getElementById('nav-drawer');
  const overlay = document.getElementById('nav-overlay');
  if (!drawer || !overlay) return;

  const menuBtn = document.getElementById('btn-menu');
  const isOpen = drawer.classList.contains('drawer-open');

  if (isOpen) {
    drawer.classList.remove('drawer-open');
    overlay.classList.remove('overlay-visible');
    // escape-routes / focus-management: el foco vuelve al botón que abrió el panel
    drawer.setAttribute('aria-hidden', 'true');
    if (menuBtn) {
      menuBtn.setAttribute('aria-expanded', 'false');
      menuBtn.focus({ preventScroll: true });
    }
  } else {
    // Cada apertura inicia con los cinco accesos principales y evita un menú largo.
    setDrawerNavExpanded(false);
    // Actualizar datos del perfil con la sesión actual
    const nameEl = document.getElementById('drawer-username');
    const emailEl = document.getElementById('drawer-email');
    const avatarEl = document.getElementById('drawer-avatar');
    
    if (nameEl && AppState.User.Nombre) {
      nameEl.textContent = AppState.User.Nombre;
    }
    if (emailEl && AppState.User.DNI) {
      emailEl.textContent = AppState.User.Email || `DNI: ${AppState.User.DNI}`;
    }
    if (avatarEl && AppState.User.Nombre) {
      avatarEl.textContent = AppState.User.Nombre.charAt(0).toUpperCase();
    }
    const roleLabel = document.getElementById('drawer-role-label');
    if (roleLabel && AppState.User.Rol) {
      roleLabel.textContent = (typeof PERMISOS !== 'undefined') ? PERMISOS.etiqueta() : AppState.User.Rol;
      if (typeof PERMISOS !== 'undefined') PERMISOS.aplicarMenu();
    }

    drawer.classList.add('drawer-open');
    overlay.classList.add('overlay-visible');
    drawer.setAttribute('aria-hidden', 'false');
    if (menuBtn) menuBtn.setAttribute('aria-expanded', 'true');
    setTimeout(() => loadDrawerWorkSummary(false), 60);

    // Foco al primer destino del menú (lector de pantalla y teclado)
    setTimeout(() => {
      const first = drawer.querySelector('.drawer-nav-link');
      if (first) first.focus({ preventScroll: true });
    }, 120);

    // Refrescar estadísticas al abrir
    if (typeof refreshDrawerStats === 'function') {
      setTimeout(refreshDrawerStats, 50); // leve delay para que el DOM esté listo
    }
  }
}

// escape-routes: Escape cierra el panel lateral (patrón esperado en diálogos)
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const drawer = document.getElementById('nav-drawer');
  if (drawer && drawer.classList.contains('drawer-open')) toggleNavDrawer();
});

/**
 * Actualiza el link activo del drawer según la vista actual.
 * Llamar desde showView() y changeInternalView()
 */
function updateDrawerActiveLink(viewID) {
  document.querySelectorAll('.drawer-nav-link').forEach(el => el.classList.remove('active'));
  
  const map = {
    'Menu': 'dnav-menu',
    '03_Inspecciones': 'dnav-03',
    '01_Usuarios': 'dnav-01',
    '02_Reportes': 'dnav-02',
    '00_Admin': 'dnav-00',
    '04_Configuraciones': 'dnav-04',
    '04_Actos_Condiciones': 'dnav-04ac',
    '05_Incidentes': 'dnav-05',
    '06_Capacitaciones': 'dnav-06',
    '07_IPERC': 'dnav-07',
    '08_PETAR': 'dnav-08',
    '09_EPP': 'dnav-09',
    '10_Charlas': 'dnav-10'
  };
  
  document.querySelectorAll('.drawer-nav-link[aria-current]').forEach(el => el.removeAttribute('aria-current'));

  const activeId = map[viewID];
  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.classList.add('active');
      el.setAttribute('aria-current', 'page');  // nav-state-active
    }
  }
}

/**
 * Refresca las barras del drawer con conteos reales de las tablas del DOM.
 * Se llama al abrir el drawer y al pulsar "Actualizar".
 */
function refreshDrawerStats() {
  // Las filas de interfaz (esqueleto / estado vacío) nunca cuentan como datos
  function dataRowsOf(tbodyId) {
    const tbody = document.getElementById(tbodyId);
    return tbody ? tbody.querySelectorAll('tr:not([data-ds-ui])') : null;
  }

  function countInTable(tbodyId, colValue) {
    const rows = dataRowsOf(tbodyId);
    if (!rows) return null;
    let count = 0;
    rows.forEach(row => {
      if (row.innerText.toLowerCase().includes(colValue.toLowerCase())) count++;
    });
    return count;
  }

  function setBar(statId, barId, count, total) {
    const statEl = document.getElementById(statId);
    const barEl  = document.getElementById(barId);
    if (statEl) statEl.textContent = (count !== null) ? count : '—';
    if (barEl)  barEl.style.width  = (count !== null && total > 0) ? Math.round((count / total) * 100) + '%' : '0%';
  }

  function setLabel(labelId, total) {
    const el = document.getElementById(labelId);
    if (el) el.textContent = (total !== null) ? `${total} total` : 'sin datos';
  }

  function setKPI(id, value) {
    const el = document.getElementById(id);
    if (el) el.textContent = (value !== null) ? value : '—';
  }

  function setBadge(badgeId, count) {
    const el = document.getElementById(badgeId);
    if (!el) return;
    if (count !== null && count > 0) {
      el.textContent = count;
      el.classList.remove('hidden');
    } else {
      el.classList.add('hidden');
    }
  }

  // 03 Inspecciones
  const tbody03  = document.getElementById('inspecciones-table-body');
  const total03  = tbody03 ? tbody03.querySelectorAll('tr:not([data-ds-ui])').length : null;
  const pend03   = tbody03 ? countInTable('inspecciones-table-body', 'Pendiente')  : null;
  const proc03   = tbody03 ? countInTable('inspecciones-table-body', 'En Proceso') : null;
  const cerr03   = tbody03 ? countInTable('inspecciones-table-body', 'Cerrado')    : null;
  setLabel('stat-label-03', total03);
  setBar('stat-03-pendiente', 'bar-03-pendiente', pend03, total03);
  setBar('stat-03-enproceso', 'bar-03-enproceso', proc03, total03);
  setBar('stat-03-cerrado',   'bar-03-cerrado',   cerr03, total03);
  setKPI('kpi-03-pendiente', pend03);
  setKPI('kpi-03-cerrado-kpi', cerr03);
  setBadge('dnav-badge-03', pend03);

  // 02 Reportes
  const tbody02  = document.getElementById('reportes-table-body');
  const total02  = tbody02 ? tbody02.querySelectorAll('tr:not([data-ds-ui])').length : null;
  const alto02   = tbody02 ? countInTable('reportes-table-body', 'Alto (Rojo)')     : null;
  setLabel('stat-label-02', total02);
  setBar('stat-02-critico', 'bar-02-critico', tbody02 ? countInTable('reportes-table-body', 'Crítico (Negro)') : null, total02);
  setBar('stat-02-alto',    'bar-02-alto',    alto02, total02);
  setKPI('kpi-02-alto', alto02);
  setBadge('dnav-badge-02', alto02);

  // 01 Usuarios
  const tbody01  = document.getElementById('usuarios-table-body');
  const total01  = tbody01 ? tbody01.querySelectorAll('tr:not([data-ds-ui])').length : null;
  const act01    = tbody01 ? countInTable('usuarios-table-body', 'Activo') : null;
  setLabel('stat-label-01', total01);
  setBar('stat-01-activo', 'bar-01-activo', act01, total01);
  setBar('stat-01-cesado', 'bar-01-cesado', tbody01 ? countInTable('usuarios-table-body', 'Cesado') : null, total01);
  setKPI('kpi-01-activo', act01);
}

/**
 * Navega al módulo y aplica automáticamente un filtro pre-seleccionado.
 * @param {string} moduleID    - Ej: '03_Inspecciones'
 * @param {string} filterField - Campo del subconfig, ej: 'Estado_Actual'
 * @param {string} filterValue - Valor a filtrar, ej: 'Pendiente'
 */
function navigateWithFilter(moduleID, filterField, filterValue) {
  // 1. Cerrar drawer
  toggleNavDrawer();

  // 2. Navegar al módulo (vista Resumen)
  showView(moduleID);

  // 3. Esperar a que los filtros dinámicos se inyecten y luego aplicarlos
  setTimeout(() => {
    // Abrir panel de filtros si está cerrado
    const panel = document.querySelector('#main-container #ui-filter-panel');
    if (panel && !panel.classList.contains('filter-open')) {
      panel.classList.add('filter-open');
      panel.style.maxHeight = '600px';
      panel.style.opacity   = '1';
      panel.style.pointerEvents = 'auto';
      const icon = document.querySelector('#main-container .filter-toggle-icon');
      if (icon) icon.innerText = 'expand_less';
    }

    // Establecer el valor en el input/select del filtro
    const filterInput = document.getElementById(`filter-${filterField}`);
    if (filterInput) {
      filterInput.value = filterValue;
      if (typeof PWA_SKILLS !== 'undefined') PWA_SKILLS.applyFilters();
      filterInput.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }, 380);
}
