<script>
/**
 * =========================================================================
 * MOTOR PWA - OFFLINE & SYNC ENGINE (IndexedDB)
 * =========================================================================
 * ARCHIVO: Offline_Engine.js.html
 * DESCRIPCION: Intercepta todas las transacciones Frontend. Si fallan por 
 * falta de conexión o cortes de ruta en terreno, las congela a largo plazo.
 */

// -------------------------------------------------------------------------
// ⚠️ CONFIGURACIÓN DEL MOTOR OFFLINE ⚠️
// -------------------------------------------------------------------------
const OFFLINE_DB_NAME = "Enterprise_PWA_DB";
// v2: se anade el almacen de copias de modulo (MOTOR_CACHE). Subir la version
// dispara onupgradeneeded sin tocar la cola, que es otro almacen.
const OFFLINE_DB_VERSION = 2;
const OFFLINE_STORE_NAME = "Pending_Transactions_Queue";
const CACHE_STORE_NAME = "Modulo_Cache";


// -------------------------------------------------------------------------
// 1. INICIALIZADOR INDEXED_DB NATIVO 
// -------------------------------------------------------------------------
let localDB;
function initOfflineDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(OFFLINE_DB_NAME, OFFLINE_DB_VERSION);

        request.onupgradeneeded = (event) => {
            let db = event.target.result;
            // Estructura de Cola: autoIncrement true para ejecutar LIFO/FIFO Exacto.
            if (!db.objectStoreNames.contains(OFFLINE_STORE_NAME)) {
                db.createObjectStore(OFFLINE_STORE_NAME, { keyPath: "localQueueId", autoIncrement: true });
            }
            // Copia de consulta por modulo. Antes vivia en localStorage, que
            // tiene ~5 MB por origen para TODA la app: con diez modulos y
            // miles de registros se llenaba, y el error se perdia en un
            // catch vacio, asi que el modo sin conexion dejaba de guardar sin
            // que nadie se enterara.
            if (!db.objectStoreNames.contains(CACHE_STORE_NAME)) {
                db.createObjectStore(CACHE_STORE_NAME, { keyPath: "modulo" });
            }
        };

        request.onsuccess = (event) => {
            localDB = event.target.result;
            console.log("✅ Offline Engine Montado Exitosamente.");
            resolve();
        };

        request.onerror = (event) => {
            console.error("❌ Fallo crítico al iniciar Almacenamiento Offline en PWA.");
            reject(event.target.error);
        };
    });
}

// -------------------------------------------------------------------------
// 2. ENCOLADOR UNIVERSAL (Interceptor de Acciones)
// -------------------------------------------------------------------------
/**
 * Tu IA utilizará exclusivamente esta función para grabar.
 * Ej: pushToQueue("02_Inspecciones", "INSERT", {campoA: "x", campoB: "y"});
 */
async function pushToQueue(moduleName, action, payloadObj, childDataArray = null) {
    if(!localDB) await initOfflineDB();

    // Asignación mandataria UUID en el Edge (Celular) antes de encolar
    if(payloadObj && !payloadObj?.UUID) {
       payloadObj.UUID = pseudoGenerateUUID();
    }

    const transaction = localDB.transaction([OFFLINE_STORE_NAME], "readwrite");
    const store = transaction.objectStore(OFFLINE_STORE_NAME);

    const paquete = {
        module: moduleName,
        action: action,
        payload: payloadObj,
        childPayload: childDataArray || [],
        timestamp: new Date().toISOString()
    };

    return new Promise((resolve) => {
        store.add(paquete);
        transaction.oncomplete = () => {
            actualizarIndicadorSync();
            // Con red, el registro sube en el acto (antes esperaba a recargar
            // la app o a un corte de red). Sin red lo recoge el evento 'online'.
            programarSync({ origen: 'guardado' });
            resolve(paquete.payload.UUID);
        };
    });
}


// -------------------------------------------------------------------------
// 3. SINCRONIZADOR A NUBE (THE BATCH PUSH)
// -------------------------------------------------------------------------
// Cuándo se sube la cola:
//   · justo después de cada guardado (si hay red)
//   · al volver la red (evento 'online'), al abrir la app y al iniciar sesión
//   · cada SYNC_REINTENTO_MS mientras queden pendientes y la app esté visible
//     (cubre el wifi "conectado" sin salida real a internet)
//   · al volver a la app (visibilitychange) y con el botón del Header
//
// Errores: un fallo de red / sesión / servidor caído es TRANSITORIO y no
// cuenta. Un rechazo del servidor (RLS, dato inválido) sí cuenta; tras
// SYNC_MAX_RECHAZOS el registro queda "bloqueado": sigue guardado en el
// dispositivo (nunca se descarta evidencia) pero el reintento automático lo
// salta y se avisa al usuario. El botón de sincronizar lo vuelve a intentar.
const SYNC_MAX_RECHAZOS = 5;
const SYNC_REINTENTO_MS = 90000;
let _syncEnCurso = null;        // promesa de la sincronización activa
let _syncRepetir = null;        // opciones de una llamada que llegó durante otra
let _syncTimeout = null;

/**
 * ¿El mensaje de error dice "no se pudo preguntar" en vez de "el servidor dijo
 * que no"? Es la última red de seguridad por si un proveedor olvida marcar
 * `transitorio`: confundir ambas cosas bloquea registros que estaban bien.
 */
/** ¿Corre dentro del APK (Capacitor) y no en un navegador? */
function enAppInstalada() {
    return !!(window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' &&
              window.Capacitor.isNativePlatform());
}

const RED_CAIDA = /sin conexi[oó]n|failed to fetch|networkerror|load failed|net::|err_internet|err_network|timeout|tiempo de espera|HTTP 5\d\d|servidor ocupado/i;
function esFalloDeRed(msg) {
    return RED_CAIDA.test(String(msg || ''));
}

/**
 * Desbloquea lo que se bloqueó por quedarse sin señal, no por un rechazo real.
 *
 * Antes, un fallo de red contaba como rechazo: cinco reintentos sin cobertura
 * y el registro quedaba bloqueado para siempre del envío automático. Esto
 * recupera los que ya están así en el dispositivo; sin ello, los registros
 * atrapados por ese error seguirían sin subir aunque el fallo esté corregido.
 */
async function rehabilitarBloqueadosPorRed() {
    if (!localDB) return 0;
    let items = [];
    try { items = await readAllPendings(); } catch (e) { return 0; }
    const recuperables = items.filter(it => it.bloqueado && esFalloDeRed(it.ultimoError));
    if (!recuperables.length) return 0;
    await new Promise((resolve) => {
        const tx = localDB.transaction([OFFLINE_STORE_NAME], 'readwrite');
        const store = tx.objectStore(OFFLINE_STORE_NAME);
        recuperables.forEach(it => { it.bloqueado = false; it.rechazos = 0; store.put(it); });
        tx.oncomplete = resolve;
        tx.onerror = resolve;
    });
    console.log('[Sync] ' + recuperables.length + ' registro(s) bloqueados por falta de señal vuelven a la cola.');
    return recuperables.length;
}

/** Solo se sube con una sesión real: sin JWT, RLS rechazaría todo y se contarían rechazos falsos. */
function sesionListaParaSync() {
    // AppState es un `const` global: NO cuelga de window, se consulta con typeof
    const u = (typeof AppState !== 'undefined' && AppState.User) || {};
    if (!u.Token) return false;
    if (AppState.DB_PROVIDER === 'supabase' && !u.SupabaseJWT) return false;
    return true;
}

/** Agenda una sincronización en breve (agrupa llamadas seguidas en una sola). */
function programarSync(opciones) {
    clearTimeout(_syncTimeout);
    _syncTimeout = setTimeout(() => triggerSyncToCloud(opciones), 400);
}

/**
 * Sube la cola agrupada por módulo y en lotes.
 * @param {{forzar?:boolean, origen?:string}} opciones
 *   forzar → reintenta también los bloqueados (botón manual)
 * @returns {Promise<{subidos:number, pendientes:number, bloqueados:number, motivo?:string}>}
 */
function triggerSyncToCloud(opciones) {
    opciones = (opciones && typeof opciones === 'object' && !(opciones instanceof Event)) ? opciones : {};
    if (_syncEnCurso) {
        // No se lanzan dos subidas a la vez (duplicaría escrituras); se repite al terminar.
        _syncRepetir = Object.assign({}, _syncRepetir || {}, opciones,
            { forzar: !!(opciones.forzar || (_syncRepetir && _syncRepetir.forzar)) });
        return _syncEnCurso;
    }
    _syncEnCurso = _sincronizarCola(opciones).finally(() => {
        _syncEnCurso = null;
        if (_syncRepetir) { const o = _syncRepetir; _syncRepetir = null; triggerSyncToCloud(o); }
    });
    return _syncEnCurso;
}

async function _sincronizarCola(opciones) {
    const resumen = { subidos: 0, pendientes: 0, bloqueados: 0 };
    if (!localDB) { try { await initOfflineDB(); } catch (e) { return Object.assign(resumen, { motivo: 'sin-db' }); } }

    const todos = await readAllPendings();
    // En el navegador, navigator.onLine es fiable y ahorra un intento inútil.
    // Dentro del APK NO lo es (el WebView de Android no lo actualiza sin el
    // plugin de red), así que ahí se intenta siempre: si no hay señal el fallo
    // es transitorio y no cuenta. Confiar en él aquí dejaría la cola parada.
    if (!navigator.onLine && !enAppInstalada()) { await actualizarIndicadorSync(); return Object.assign(resumen, { pendientes: todos.length, motivo: 'sin-red' }); }
    if (!sesionListaParaSync())  { await actualizarIndicadorSync(); return Object.assign(resumen, { pendientes: todos.length, motivo: 'sin-sesion' }); }

    const aSubir = opciones.forzar ? todos : todos.filter(it => !it.bloqueado);
    if (aSubir.length === 0) { await actualizarIndicadorSync(); return finalizarResumen(resumen); }

    console.log(`📡 Sync de ${aSubir.length} transacciones pendientes...`);
    if (window.updateSyncUI) updateSyncUI('Enviando…', false);

    const byModule = {};
    aSubir.forEach(item => {
      const mod = item.module || 'UNKNOWN';
      (byModule[mod] = byModule[mod] || []).push(item);
    });

    const BATCH_SIZE = AppState?.Settings?.MaxBatchSize || 50;
    const modulosConCambios = [];
    const nuevosBloqueados = [];

    for (const [moduleName, items] of Object.entries(byModule)) {
      for (let i = 0; i < items.length; i += BATCH_SIZE) {
        const batch = items.slice(i, i + BATCH_SIZE);
        let result;
        try {
          result = await DataService.syncQueue(moduleName, batch);
        } catch (err) {
          // Excepción = no llegó al servidor (red / Apps Script caído): transitorio
          console.warn(`⚠️ Sync sin conexión [${moduleName}]:`, err);
          continue;
        }

        if (result && result.status === 'FORCE_LOGOUT') {
          AppState.clearSession();   // no borra la cola: se sube al volver a entrar
          return finalizarResumen(resumen);
        }

        const okIds = (result && Array.isArray(result.okIds)) ? result.okIds
          : (result && result.status === 'OK') ? batch.map(it => it.localQueueId) : [];
        const hechos = batch.filter(it => okIds.indexOf(it.localQueueId) !== -1);
        if (hechos.length) {
          await clearQueueAfterSync(hechos);
          resumen.subidos += hechos.length;
          modulosConCambios.push(moduleName);
          // El informe PDF del registro se archiva cuando el registro ya está
          // en el servidor, nunca antes: sin señal no hay dónde subirlo. Aquí
          // solo se apunta (es inmediato); generarlos es lo que viene después,
          // fuera de este bucle, para no retrasar el resto de la cola.
          if (typeof PDF_TEMPLATE !== 'undefined' && PDF_TEMPLATE.encolarArchivo) {
            try { PDF_TEMPLATE.encolarArchivo(moduleName, hechos.map(it => it.payload && it.payload.UUID)); }
            catch (e) { console.warn('[Informe PDF] no se pudo encolar:', e); }
          }
          // Ya viajaron: se les quita el distintivo "Por subir" de la copia
          // local, aunque su Resumen no esté abierto para repintarse.
          if (typeof MOTOR_CACHE !== 'undefined' && MOTOR_CACHE.marcarSubidos) {
            try { await MOTOR_CACHE.marcarSubidos(moduleName, hechos.map(it => it.payload && it.payload.UUID)); } catch (e) {}
          }
        }

        // Fallos por registro (Supabase los detalla; Sheets responde por lote)
        const fallos = {};
        if (result && Array.isArray(result.fallos)) {
          result.fallos.forEach(f => { fallos[f.id] = f; });
        } else if (result && result.status !== 'OK') {
          // Transitorio = el registro NO fue rechazado, es que no se pudo
          // preguntar. No debe sumar rechazos: a los SYNC_MAX_RECHAZOS el
          // registro se bloquea y deja de subir solo, y un trabajador sin
          // señal acumularía esos intentos hasta perder el envío automático.
          // El proveedor ya lo clasifica (`transitorio`): hay que respetarlo.
          const transitorio = !!result.transitorio ||
                              result.status === 'INVALID_TOKEN' ||
                              esFalloDeRed(result.msg);
          batch.forEach(it => { if (okIds.indexOf(it.localQueueId) === -1) fallos[it.localQueueId] = { msg: result.msg, transitorio }; });
        }

        const rechazados = batch.filter(it => fallos[it.localQueueId]);
        if (rechazados.length) {
          await registrarFallos(rechazados, fallos, nuevosBloqueados);
          console.error(`❌ [${moduleName}] ${rechazados.length} registro(s) no se guardaron:`, result && result.msg);
        }
      }
    }

    if (nuevosBloqueados.length) avisarBloqueados(nuevosBloqueados);
    if (modulosConCambios.length) recargarResumenActivo(modulosConCambios);
    if (resumen.subidos && opciones.origen !== 'guardado' && !opciones.forzar && typeof PWA_SKILLS !== 'undefined') {
      PWA_SKILLS.toast(resumen.subidos + ' registro(s) guardado(s) sin conexión ya se subieron.', 'success', 3500);
    }

    await actualizarIndicadorSync();
    // Informes PDF de lo que acaba de subir. Va al final y sin await: generar
    // un PDF cuesta ~1 s de CPU y la persona ya está viendo su Resumen; el
    // retraso evita que el guardado se sienta lento. Lo que no alcance queda
    // apuntado y sale en la pasada siguiente.
    archivarInformesPendientes();
    return finalizarResumen(resumen);
}

/**
 * Lanza el archivado de informes PDF sin bloquear a quien lo llama.
 * Es seguro invocarla de más: PDF_TEMPLATE.procesarPendientes() ignora las
 * llamadas que se solapan y no hace nada si la lista está vacía.
 */
let _informesTimer = null;
function archivarInformesPendientes(retraso) {
    if (typeof PDF_TEMPLATE === 'undefined' || !PDF_TEMPLATE.procesarPendientes) return;
    clearTimeout(_informesTimer);
    _informesTimer = setTimeout(() => {
        PDF_TEMPLATE.procesarPendientes().catch(e => console.warn('[Informe PDF]', e));
    }, retraso == null ? 1500 : retraso);
}

async function finalizarResumen(resumen) {
    const restantes = localDB ? await readAllPendings() : [];
    resumen.bloqueados = restantes.filter(it => it.bloqueado).length;
    resumen.pendientes = restantes.length;
    return resumen;
}

/** Suma el intento fallido a cada registro; los rechazos reales acumulan hasta bloquearlo. */
function registrarFallos(items, fallos, nuevosBloqueados) {
    return new Promise((resolve) => {
        const tx = localDB.transaction([OFFLINE_STORE_NAME], 'readwrite');
        const store = tx.objectStore(OFFLINE_STORE_NAME);
        items.forEach(it => {
            const f = fallos[it.localQueueId] || {};
            it.ultimoError = String(f.msg || 'Error desconocido');
            it.ultimoIntento = new Date().toISOString();
            if (!f.transitorio) {
                it.rechazos = (it.rechazos || 0) + 1;
                if (it.rechazos >= SYNC_MAX_RECHAZOS && !it.bloqueado) {
                    it.bloqueado = true;
                    nuevosBloqueados.push(it);
                }
            }
            store.put(it);
        });
        tx.oncomplete = resolve;
        tx.onerror = resolve;
    });
}

function avisarBloqueados(items) {
    if (typeof PWA_SKILLS === 'undefined') return;
    const it = items[0];
    const mod = String(it.module || '').replace(/^\d+_/, '').replace(/_/g, ' ');
    const extra = items.length > 1 ? ' (y ' + (items.length - 1) + ' más)' : '';
    PWA_SKILLS.toast('El servidor rechazó un registro de ' + mod + extra + ': ' + it.ultimoError +
        '. Sigue guardado en este dispositivo; corrige el problema y pulsa sincronizar.', 'error', 9000);
}

/** Si el Resumen del módulo que acaba de subir está a la vista, se vuelve a pintar con los datos nuevos. */
function recargarResumenActivo(modulos) {
    const mod = typeof AppState !== 'undefined' && AppState.activeModule;
    if (!mod || modulos.indexOf(mod) === -1) return;
    const vista = document.querySelector(`#main-container [id*="${mod.toLowerCase()}"][id*="resumen"]`);
    const fn = window['loadResumen_' + mod];
    if (!vista || vista.style.display === 'none' || typeof fn !== 'function') return;
    fn();
    if (typeof enhanceActiveTable === 'function') setTimeout(enhanceActiveTable, 160);
}

/** Indicador del Header con el número real de pendientes. */
async function actualizarIndicadorSync() {
    if (!window.updateSyncUI) return;
    let items = [];
    try { if (localDB) items = await readAllPendings(); } catch (e) {}
    const bloqueados = items.filter(it => it.bloqueado).length;
    const pendientes = items.length - bloqueados;
    // El distintivo del botón cuenta TODO lo que no ha llegado al servidor,
    // con error o sin él: para el trabajador la pregunta es "¿ya se envió?".
    const sinEnviar = items.length;
    // navigator.onLine solo se cree en el navegador: en el APK vale siempre
    // true y diría "Sincronizado" estando sin señal.
    // La pastilla dice UNA palabra: si hay enlace con el servidor. Cuántos
    // cambios faltan lo dice el número sobre el botón de sincronizar, y no se
    // repite aquí: «Sin conexión · 3 pendiente(s)» partía la cabecera en dos
    // líneas en el móvil, justo donde se registra en campo.
    if (!navigator.onLine && !enAppInstalada()) {
        updateSyncUI('Sin conexión', true, sinEnviar);
    } else if (bloqueados) {
        updateSyncUI('Con error', true, sinEnviar);
    } else if (pendientes) {
        updateSyncUI('Por enviar', true, sinEnviar);
    } else {
        updateSyncUI('Conectado', false, 0);
    }
}

function readAllPendings() {
    return new Promise((resolve) => {
        const transaction = localDB.transaction([OFFLINE_STORE_NAME], "readonly");
        const sr = transaction.objectStore(OFFLINE_STORE_NAME).getAll();
        sr.onsuccess = () => resolve(sr.result || []);
        sr.onerror = () => resolve([]);
    });
}

function clearQueueAfterSync(itemsArray) {
    return new Promise((resolve) => {
        const transaction = localDB.transaction([OFFLINE_STORE_NAME], "readwrite");
        const store = transaction.objectStore(OFFLINE_STORE_NAME);
        itemsArray.forEach(i => store.delete(i.localQueueId));
        transaction.oncomplete = () => {
           console.log("☁️ Data Offline Purificada Hacia La Nube Exitosamente.");
           resolve();
        };
        transaction.onerror = () => resolve();
    });
}


// -------------------------------------------------------------------------
// 4. GENERADOR UUID EDGE (Evita Colapso de RowNumbers)
// -------------------------------------------------------------------------
function pseudoGenerateUUID() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
    });
}

// Inicializamos base general a la carga del html
window.addEventListener("load", () => {
   // Sin .catch(), un navegador que niega IndexedDB (ventana privada,
   // almacenamiento bloqueado) dejaba una promesa rechazada sin atender.
   initOfflineDB().then(async ()=> {
      // Rescata lo que se bloqueó por falta de señal antes de intentar subir
      await rehabilitarBloqueadosPorRed();
      // Sube lo que quedó pendiente de la última vez
      triggerSyncToCloud({ origen: 'inicio' });
      // Y archiva los informes que quedaron sin generar (app cerrada a medias,
      // dispositivo sin señal todo el turno): la lista vive en localStorage.
      archivarInformesPendientes(6000);
   }).catch(() => { /* ya se avisó al usuario desde initApp */ });
});

window.addEventListener('online',  () => programarSync({ origen: 'red' }));
window.addEventListener('offline', () => { actualizarIndicadorSync(); });

// Reintento periódico: el evento 'online' no basta si el primer intento falla
// (wifi sin salida real, servidor caído) y, sobre todo, porque dentro del
// WebView de Android `navigator.onLine` NO es de fiar: sin el plugin de red
// vale siempre true y el evento 'online' no llega nunca. Por eso aquí NO se
// consulta: se intenta y, si no hay señal, el fallo es transitorio y no
// cuenta como rechazo. Solo con la app a la vista, para no gastar batería.
setInterval(() => {
   if (document.visibilityState === 'visible') triggerSyncToCloud({ origen: 'reintento' });
}, SYNC_REINTENTO_MS);

document.addEventListener('visibilitychange', () => {
   if (document.visibilityState === 'visible') programarSync({ origen: 'retorno' });
});


// -------------------------------------------------------------------------
// 5. SINCRONIZACIÓN BIDIRECCIONAL DELTA (SILENT FETCH) - SKILL 7.D
// -------------------------------------------------------------------------
/**
 * Rastrea asincrónicamente registros ignorados o creados por otros operarios.
 */
async function silentFetchDelta(moduleName) {
    if(!navigator.onLine || !moduleName) return;

    console.log(`🔍 [DeltaSync]: Buscando novedades en ${moduleName}...`);

    const lastSync = localStorage.getItem(`lastSync_${moduleName}`) || "2026-01-01T00:00:00Z";

    try {
      const parsed = await DataService.readDelta(moduleName, lastSync);
      if (parsed.status === "OK" && parsed.payload && parsed.payload.length > 0) {
        localStorage.setItem(`lastSync_${moduleName}`, PWA_SKILLS.getPeruTime(true));
        console.log(`[DeltaSync]: ${parsed.payload.length} registros nuevos en ${moduleName}.`);
      }
    } catch (err) {
      console.error("[DeltaSync] fallo red:", err);
    }
}

// Disparador Pasivo con Page Visibility API (pausar cuando la app está en background)
let deltaSyncInterval = null;

function startDeltaSync() {
  if (deltaSyncInterval) return;
  deltaSyncInterval = setInterval(() => {
    if (window.AppState?.activeModule) silentFetchDelta(window.AppState.activeModule);
  }, 120000);
}

function stopDeltaSync() {
  if (deltaSyncInterval) { clearInterval(deltaSyncInterval); deltaSyncInterval = null; }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    startDeltaSync();
    if (window.AppState?.activeModule) silentFetchDelta(window.AppState.activeModule);
  } else {
    stopDeltaSync();
  }
});

if (document.visibilityState === 'visible') startDeltaSync();



// =========================================================================
// MOTOR_CACHE - copia local de consulta, por modulo
// =========================================================================
// Para que un Resumen tenga algo que mostrar sin conexion. NO es la cola de
// escritura (eso es pushToQueue): aqui solo hay lectura.
//
// Tres niveles, de mas rapido a mas duradero:
//   1. memoria   lo que se consulta durante la sesion (lecturas sincronas)
//   2. IndexedDB la copia que sobrevive al cierre del navegador, sin el
//                tope de 5 MB de localStorage
//   3. localStorage  solo un RESUMEN recortado (TOPE_SINCRONO filas), para que
//                el primer pintado tras abrir la app en frio tenga datos antes
//                de que IndexedDB responda. Al estar acotado, no desborda.
//
// Las claves 'refdata_<modulo>' de localStorage se mantienen con ese nombre a
// proposito: varias vistas antiguas las leen de forma sincrona.
const MOTOR_CACHE = {
  _mem: {},
  TOPE_SINCRONO: 200,

  _db() {
    return new Promise((resolve, reject) => {
      if (typeof localDB !== 'undefined' && localDB) return resolve(localDB);
      if (typeof initOfflineDB !== 'function') return reject(new Error('sin IndexedDB'));
      initOfflineDB().then(() => resolve(localDB)).catch(reject);
    });
  },

  /**
   * Guarda (o anade) las filas de un modulo.
   * @param {boolean} reemplazar true = esta es la primera pagina y sustituye
   *   la copia; false = es una pagina siguiente y se acumula.
   */
  async guardar(modulo, filas, reemplazar) {
    if (!Array.isArray(filas)) return;
    const previas = reemplazar ? [] : (this._mem[modulo] || []);
    // Sin duplicados: "cargar mas" vuelve a traer filas si alguien inserto
    // algo entre dos paginas.
    const vistos = {}, todas = [];
    previas.concat(filas).forEach(r => {
      const k = r && (r.UUID || r.DNI);
      if (k && vistos[k]) return;
      if (k) vistos[k] = true;
      todas.push(r);
    });
    this._mem[modulo] = todas;

    // Resumen recortado para las lecturas sincronas del primer pintado.
    try {
      localStorage.setItem('refdata_' + modulo, JSON.stringify(todas.slice(0, this.TOPE_SINCRONO)));
    } catch (e) {
      // Cuota llena: se descarta el atajo, no la copia buena (IndexedDB).
      try { localStorage.removeItem('refdata_' + modulo); } catch (e2) {}
    }

    try {
      const db = await this._db();
      await new Promise((resolve, reject) => {
        const tx = db.transaction([CACHE_STORE_NAME], 'readwrite');
        tx.objectStore(CACHE_STORE_NAME).put({ modulo, filas: todas, fecha: Date.now() });
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    } catch (e) {
      // Sin IndexedDB (ventana privada, navegador antiguo) la copia duradera
      // no existe, pero la app funciona: queda la de memoria y el resumen
      // recortado. Se avisa una sola vez, no en cada pagina.
      if (!this._avisado) {
        this._avisado = true;
        console.warn('[MOTOR_CACHE] sin almacenamiento duradero: la copia sin conexión ' +
                     'se limitará a esta sesión. ' + ((e && e.message) || ''));
      }
    }
  },

  /**
   * Mete (o reemplaza) UNA fila al principio de la copia local.
   * Es lo que hace que un registro guardado sin conexión se vea en el acto
   * en su Resumen: antes solo entraba en la cola y la lista seguía diciendo
   * "sin registros", así que la persona volvía a escribirlo.
   */
  async anteponer(modulo, fila) {
    if (!fila) return;
    const clave = fila.UUID || fila.DNI;
    let previas = [];
    try { previas = (await this.leer(modulo)) || []; } catch (e) { previas = this._mem[modulo] || []; }
    const resto = previas.filter(r => String(r && (r.UUID || r.DNI)) !== String(clave));
    await this.guardar(modulo, [fila].concat(resto), true);
  },

  /** Quita el distintivo "por subir" de los registros que ya se subieron. */
  async marcarSubidos(modulo, uuids) {
    const set = {};
    (uuids || []).forEach(u => { if (u) set[String(u)] = true; });
    if (!Object.keys(set).length) return;
    let filas = [];
    try { filas = (await this.leer(modulo)) || []; } catch (e) { filas = this._mem[modulo] || []; }
    let cambio = false;
    const limpias = filas.map(r => {
      if (r && r._pendiente && set[String(r.UUID)]) { cambio = true; const c = Object.assign({}, r); delete c._pendiente; return c; }
      return r;
    });
    if (cambio) await this.guardar(modulo, limpias, true);
  },

  _avisado: false,

  /** Copia completa del modulo (memoria -> IndexedDB -> resumen recortado). */
  async leer(modulo) {
    if (this._mem[modulo]) return this._mem[modulo];
    try {
      const db = await this._db();
      const filas = await new Promise((resolve, reject) => {
        const tx = db.transaction([CACHE_STORE_NAME], 'readonly');
        const pet = tx.objectStore(CACHE_STORE_NAME).get(modulo);
        pet.onsuccess = () => resolve((pet.result && pet.result.filas) || null);
        pet.onerror = () => reject(pet.error);
      });
      if (filas) { this._mem[modulo] = filas; return filas; }
    } catch (e) { /* se cae al resumen recortado */ }
    return this.leerSync(modulo);
  },

  /**
   * Lectura SINCRONA: solo memoria o el resumen recortado. La usan las vistas
   * que pintan en el mismo turno (miniaturas de tarjeta, PDF, detalle) y no
   * pueden esperar a IndexedDB. Puede devolver menos filas que leer().
   */
  leerSync(modulo) {
    if (this._mem[modulo]) return this._mem[modulo];
    try { return JSON.parse(localStorage.getItem('refdata_' + modulo)) || []; } catch (e) { return []; }
  },

  /** Deja la copia del modulo lista en memoria (al abrirlo). */
  precargar(modulo) { return this.leer(modulo).catch(() => []); },

  async borrar(modulo) {
    delete this._mem[modulo];
    try { localStorage.removeItem('refdata_' + modulo); } catch (e) {}
    try {
      const db = await this._db();
      await new Promise(resolve => {
        const tx = db.transaction([CACHE_STORE_NAME], 'readwrite');
        tx.objectStore(CACHE_STORE_NAME).delete(modulo);
        tx.oncomplete = resolve; tx.onerror = resolve;
      });
    } catch (e) {}
  },

  /** Cuanto ocupa la copia, por modulo (lo muestra el panel de Configuracion). */
  async inventario() {
    try {
      const db = await this._db();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction([CACHE_STORE_NAME], 'readonly');
        const pet = tx.objectStore(CACHE_STORE_NAME).getAll();
        pet.onsuccess = () => resolve((pet.result || []).map(r => ({
          modulo: r.modulo, filas: (r.filas || []).length, fecha: r.fecha
        })));
        pet.onerror = () => reject(pet.error);
      });
    } catch (e) { return []; }
  }
};
</script>
