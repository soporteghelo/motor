<script>
/**
 * =========================================================================
 * PLANTILLAS PDF — formato interno (bloques → HTML → impresión del navegador)
 * =========================================================================
 * ARCHIVO: PDF_Templates.js.html
 *
 * CÓMO FUNCIONA
 * El PDF se arma 100% en el cliente: `plantillaBase()` deriva los bloques
 * del subconfig del módulo (datos, tabla de detalle, imágenes, firmas),
 * `renderHTML()` los convierte en HTML imprimible y `exportar()` abre una
 * ventana con `window.print()` (el propio diálogo "Guardar como PDF" del
 * navegador). No depende de ningún servicio externo — funciona igual
 * online, offline y con cualquier proveedor de datos (Sheets o Supabase).
 *
 * Este formato reemplaza al anterior gestor de plantillas de Google Docs
 * (retirado: dependía 100% de Drive/Docs). No es editable visualmente por
 * el admin; para cambiar el diseño hay que editar `plantillaBase()` o
 * `CSS` en este archivo.
 * =========================================================================
 */

const PDF_TEMPLATE = {

  // -----------------------------------------------------------------------
  // LECTURA DEL ESQUEMA DEL MÓDULO
  // -----------------------------------------------------------------------
  /**
   * Devuelve los campos que el admin puede colocar en el PDF, ya clasificados.
   * Se leen del subconfig del módulo: así, si mañana añades un campo al
   * formulario, aparece solo en el editor. Cero mantenimiento.
   */
  camposDe: function(modulo) {
    const nombre = 'SUBCONFIG_' + String(modulo).toUpperCase().replace(/[^A-Z0-9_]/g, '');
    const cfg = window[nombre];
    const out = { texto: [], media: [], hijos: [] };
    if (!cfg || !cfg.Variables) return out;

    Object.keys(cfg.Variables).forEach(clave => {
      const def = cfg.Variables[clave] || {};
      if (def.type === 'Hidden' || def.type === 'Hidden_UUID') return;   // trazabilidad interna
      const item = { clave: clave, etiqueta: (def.label || clave).replace(/_/g, ' '), tipo: def.type,
                     valores: def.acceptedValues || null };
      if (['Image', 'Image_Collection', 'Signature', 'File', 'Face_Photo'].includes(def.type)) out.media.push(item);
      else out.texto.push(item);
    });

    const rel = (cfg.Config_Modular || {}).Relational_Fields || [];
    rel.forEach(f => out.hijos.push({ clave: f.name, etiqueta: f.label || f.name, tipo: f.type || 'text' }));

    return out;
  },

  tieneTablaHija: function(modulo) {
    const nombre = 'SUBCONFIG_' + String(modulo).toUpperCase().replace(/[^A-Z0-9_]/g, '');
    const cfg = window[nombre];
    return !!(cfg && cfg.Config_Modular && cfg.Config_Modular.CHILD_TABLE);
  },

  // -----------------------------------------------------------------------
  // PLANTILLA BASE (la "versión cero" que programa el desarrollador)
  // -----------------------------------------------------------------------
  /**
   * Genera una plantilla de arranque a partir del esquema del módulo.
   * El admin nunca parte de una hoja en blanco: recibe un documento armado
   * con todos los campos y a partir de ahí quita, mueve y ajusta.
   */
  plantillaBase: function(modulo) {
    const ajustes = (typeof getAppSettings === 'function') ? getAppSettings() : {};

    // 05_Incidentes tiene un formato propio (Flash Report): la industria
    // espera un banner de severidad y un orden de secciones específico, no
    // la grilla genérica de "Datos del registro" que reciben los demás módulos.
    if (modulo === '05_Incidentes') return this._plantillaFlashReport(modulo, ajustes);

    const campos = this.camposDe(modulo);
    const titulo = String(modulo).replace(/^\d+_/, '').replace(/_/g, ' ');

    const bloques = [
      { id: this._id(), tipo: 'encabezado',
        titulo: 'Informe de ' + titulo,
        subtitulo: ajustes.App_Empresa || '',
        logoUrl: ajustes.App_Logo || '',
        mostrarFecha: true, alineacion: 'izquierda' },
      { id: this._id(), tipo: 'datos', titulo: 'Datos del registro', columnas: 2,
        campos: campos.texto.map(c => c.clave) }
    ];

    if (this.tieneTablaHija(modulo) && campos.hijos.length) {
      bloques.push({ id: this._id(), tipo: 'tablaHija', titulo: 'Detalle',
                     campos: campos.hijos.map(c => c.clave) });
    }

    const fotos = campos.media.filter(c => c.tipo !== 'Signature');
    if (fotos.length) {
      bloques.push({ id: this._id(), tipo: 'imagenes', titulo: 'Evidencia fotográfica',
                     campos: fotos.map(c => c.clave) });
    }

    const firmas = campos.media.filter(c => c.tipo === 'Signature');
    bloques.push({ id: this._id(), tipo: 'firmas', titulo: 'Conformidad',
      firmas: firmas.length
        ? firmas.map(f => ({ etiqueta: f.etiqueta, campo: f.clave }))
        : [{ etiqueta: 'Responsable', campo: '' }, { etiqueta: 'Supervisor', campo: '' }] });

    return {
      version: 1, modulo: modulo,
      pagina: { tamano: 'A4', orientacion: 'vertical', margen: 16 },
      bloques: bloques
    };
  },

  _id: function() { return 'b' + Math.random().toString(36).slice(2, 9); },

  /**
   * Plantilla "Flash Report" — el formato estándar de la industria para
   * notificar un incidente en las primeras horas, antes de cerrar la
   * investigación: banner de severidad al frente, respuesta inmediata y
   * notificación antes que el análisis de causas, plan de acción al final.
   */
  _plantillaFlashReport: function(modulo, ajustes) {
    const bloques = [
      { id: this._id(), tipo: 'encabezado',
        titulo: 'Reporte Flash de Incidente',
        subtitulo: ajustes.App_Empresa || '',
        logoUrl: ajustes.App_Logo || '',
        mostrarFecha: true, alineacion: 'izquierda' },
      { id: this._id(), tipo: 'bannerSeveridad', campoGravedad: 'Gravedad', campoTipo: 'Tipo_Evento' },
      { id: this._id(), tipo: 'datos', titulo: 'Datos del evento', columnas: 3,
        campos: ['Fecha_Evento', 'Hora_Evento', 'Area', 'Lugar_Exacto', 'Estado', 'Severidad_Potencial'] },
      { id: this._id(), tipo: 'datos', titulo: 'Persona(s) involucrada(s)', columnas: 3,
        campos: ['Nombre_Trabajador', 'Trabajador_DNI', 'Puesto', 'Tipo_Personal', 'Parte_Afectada', 'Dias_Descanso', 'Testigos'] },
      { id: this._id(), tipo: 'texto', titulo: 'Descripción de lo ocurrido', contenido: '{{Descripcion}}' },
      { id: this._id(), tipo: 'texto', titulo: 'Acciones inmediatas tomadas', contenido: '{{Acciones_Inmediatas}}' },
      { id: this._id(), tipo: 'datos', titulo: 'Notificación', columnas: 2,
        campos: ['Requiere_Notificacion_Autoridad', 'Notificados'] },
      { id: this._id(), tipo: 'datos', titulo: 'Impacto y daños', columnas: 2,
        campos: ['Equipo_Involucrado', 'Costo_Estimado_Danos'] },
      { id: this._id(), tipo: 'datos', titulo: 'Análisis de causas', columnas: 1,
        campos: ['Causa_Inmediata', 'Causa_Basica', 'Categoria_Causa'] },
      { id: this._id(), tipo: 'tablaHija', titulo: 'Plan de acción correctiva',
        campos: ['Accion', 'Responsable', 'Fecha_Limite', 'Estado_Accion'] },
      { id: this._id(), tipo: 'imagenes', titulo: 'Evidencia fotográfica', campos: ['Evidencia_Fotos'] },
      { id: this._id(), tipo: 'datos', titulo: 'Seguimiento de la investigación', columnas: 2,
        campos: ['Investigador_DNI', 'Fecha_Cierre'] },
      { id: this._id(), tipo: 'firmas', titulo: 'Conformidad',
        firmas: [
          { etiqueta: 'Investigador', campo: 'Firma_Investigador' },
          { etiqueta: 'Jefe de Área / Gerencia', campo: '' }
        ] }
    ];

    return {
      version: 1, modulo: modulo,
      pagina: { tamano: 'A4', orientacion: 'vertical', margen: 14 },
      bloques: bloques
    };
  },

  // -----------------------------------------------------------------------
  // RENDERIZADO — bloques → HTML imprimible
  // -----------------------------------------------------------------------
  _esc: function(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  },

  /** Sanea una URL de imagen: solo http(s) o data:image */
  _src: function(v) {
    const t = String(v || '').trim();
    return (/^https?:\/\//i.test(t) || /^data:image\//i.test(t)) ? t : '';
  },

  _valor: function(registro, clave) {
    const v = registro ? registro[clave] : '';
    return (v === null || v === undefined || v === '') ? '—' : v;
  },

  /** Sustituye {{Campo}} dentro de un texto libre */
  _interpolar: function(texto, registro) {
    return this._esc(texto).replace(/\{\{\s*([\w]+)\s*\}\}/g, (m, clave) =>
      this._esc(this._valor(registro, clave)));
  },

  _etiquetaDe: function(modulo, clave) {
    const campos = this.camposDe(modulo);
    const todos = campos.texto.concat(campos.media, campos.hijos);
    const hit = todos.find(c => c.clave === clave);
    return hit ? hit.etiqueta : String(clave).replace(/_/g, ' ');
  },

  /**
   * Convierte la plantilla + un registro en el HTML del documento.
   * @param {object} plantilla
   * @param {object} registro  - fila principal
   * @param {Array}  hijos     - filas de la tabla hija
   */
  renderHTML: function(plantilla, registro, hijos) {
    const self = this;
    const mod = plantilla.modulo;
    hijos = hijos || [];
    let cuerpo = '';

    (plantilla.bloques || []).forEach(b => {
      switch (b.tipo) {

        case 'encabezado': {
          const logo = self._src(b.logoUrl);
          const fecha = b.mostrarFecha
            ? '<div class="pt-fecha">Emitido: ' + self._esc(new Date().toLocaleDateString('es-PE',
                { day:'2-digit', month:'long', year:'numeric' })) + '</div>' : '';
          cuerpo +=
            '<header class="pt-head pt-al-' + self._esc(b.alineacion || 'izquierda') + '">' +
              (logo ? '<img class="pt-logo" src="' + self._esc(logo) + '" alt="">' : '') +
              '<div class="pt-head-tx">' +
                '<h1>' + self._esc(b.titulo || '') + '</h1>' +
                (b.subtitulo ? '<p>' + self._esc(b.subtitulo) + '</p>' : '') +
                fecha +
              '</div>' +
            '</header>';
          break;
        }

        case 'bannerSeveridad': {
          const grav = registro ? (registro[b.campoGravedad] || '') : '';
          const evento = registro ? (registro[b.campoTipo] || '') : '';
          const clave = String(grav).toLowerCase();
          const clase = clave.indexOf('mortal') !== -1 ? 'pt-sev-mortal'
                      : clave.indexOf('grave')  !== -1 ? 'pt-sev-grave'
                      : 'pt-sev-leve';
          cuerpo +=
            '<div class="pt-banner ' + clase + '">' +
              '<div class="pt-banner-item"><span>Gravedad</span><strong>' + self._esc(grav || '—') + '</strong></div>' +
              '<div class="pt-banner-item"><span>Tipo de evento</span><strong>' + self._esc(evento || '—') + '</strong></div>' +
            '</div>';
          break;
        }

        case 'datos': {
          const cols = Math.min(3, Math.max(1, parseInt(b.columnas) || 2));
          const celdas = (b.campos || []).map(clave =>
            '<div class="pt-campo">' +
              '<span class="pt-lbl">' + self._esc(self._etiquetaDe(mod, clave)) + '</span>' +
              '<span class="pt-val">' + self._esc(self._valor(registro, clave)) + '</span>' +
            '</div>').join('');
          cuerpo +=
            '<section class="pt-sec">' +
              (b.titulo ? '<h2>' + self._esc(b.titulo) + '</h2>' : '') +
              '<div class="pt-grid pt-c' + cols + '">' + celdas + '</div>' +
            '</section>';
          break;
        }

        case 'texto':
          cuerpo += '<section class="pt-sec"><p class="pt-texto">' +
                    self._interpolar(b.contenido || '', registro) + '</p></section>';
          break;

        case 'tablaHija': {
          const cs = b.campos || [];
          const th = cs.map(c => '<th>' + self._esc(self._etiquetaDe(mod, c)) + '</th>').join('');
          const tr = hijos.length
            ? hijos.map(fila => '<tr>' + cs.map(c =>
                '<td>' + self._esc(self._valor(fila, c)) + '</td>').join('') + '</tr>').join('')
            : '<tr><td colspan="' + Math.max(1, cs.length) + '" class="pt-vacio">Sin registros de detalle</td></tr>';
          cuerpo +=
            '<section class="pt-sec">' +
              (b.titulo ? '<h2>' + self._esc(b.titulo) + '</h2>' : '') +
              '<table class="pt-tabla"><thead><tr>' + th + '</tr></thead><tbody>' + tr + '</tbody></table>' +
            '</section>';
          break;
        }

        case 'imagenes': {
          const imgs = (b.campos || []).map(clave => {
            const bruto = registro ? registro[clave] : '';
            if (!bruto) return '';
            const lista = (typeof partirListaMedia === 'function') ? partirListaMedia(bruto) : String(bruto).split(',');
            return lista.map(u => {
              const src = self._src(u.trim());
              return src ? '<figure class="pt-fig"><img src="' + self._esc(src) + '" alt="">' +
                           '<figcaption>' + self._esc(self._etiquetaDe(mod, clave)) + '</figcaption></figure>' : '';
            }).join('');
          }).join('');
          cuerpo +=
            '<section class="pt-sec">' +
              (b.titulo ? '<h2>' + self._esc(b.titulo) + '</h2>' : '') +
              (imgs ? '<div class="pt-figs">' + imgs + '</div>'
                    : '<p class="pt-vacio">Sin imágenes adjuntas</p>') +
            '</section>';
          break;
        }

        case 'firmas': {
          const fs = (b.firmas || []).map(f => {
            // Una firma es un solo archivo: si el campo trae varios, se usa el primero
            const crudo = f.campo && registro ? registro[f.campo] : '';
            const primero = (typeof partirListaMedia === 'function') ? (partirListaMedia(crudo)[0] || '') : crudo;
            const src = f.campo ? self._src(primero) : '';
            return '<div class="pt-firma">' +
                     (src ? '<img src="' + self._esc(src) + '" alt="">' : '<div class="pt-firma-hueco"></div>') +
                     '<span>' + self._esc(f.etiqueta || '') + '</span>' +
                   '</div>';
          }).join('');
          cuerpo +=
            '<section class="pt-sec pt-no-cortar">' +
              (b.titulo ? '<h2>' + self._esc(b.titulo) + '</h2>' : '') +
              '<div class="pt-firmas">' + fs + '</div>' +
            '</section>';
          break;
        }

        case 'espacio':
          cuerpo += '<div style="height:' + (parseInt(b.alto) || 16) + 'px"></div>';
          break;

        case 'saltoPagina':
          cuerpo += '<div class="pt-salto"></div>';
          break;
      }
    });

    return cuerpo;
  },

  /** Documento completo (con estilos de impresión) listo para imprimir */
  documentoHTML: function(plantilla, registro, hijos, titulo) {
    const pag = plantilla.pagina || {};
    const orientacion = pag.orientacion === 'horizontal' ? 'landscape' : 'portrait';
    const margen = parseInt(pag.margen) || 16;
    const reglaPagina = '@page { size: ' + (pag.tamano || 'A4') + ' ' + orientacion +
                        '; margin: ' + margen + 'mm; }';
    return '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">' +
      '<title>' + this._esc(titulo || 'Documento') + '</title>' +
      '<style>' + this.CSS.replace('@PAGE_RULE@', reglaPagina) + '</style>' +
      '</head><body>' + this.renderHTML(plantilla, registro, hijos) + '</body></html>';
  },

  /** Hoja de estilos del formato interno de respaldo */
  CSS: '@PAGE_RULE@' +
      '* { box-sizing:border-box; }' +
      'body { font-family: Inter, Arial, Helvetica, sans-serif; color:#1b1b21; font-size:11pt; margin:0; line-height:1.45; }' +
      '.pt-head { display:flex; gap:14px; align-items:center; border-bottom:2px solid #000666; padding-bottom:10px; margin-bottom:16px; }' +
      '.pt-al-centro { justify-content:center; text-align:center; } .pt-al-derecha { justify-content:flex-end; text-align:right; }' +
      '.pt-logo { max-height:52px; max-width:150px; object-fit:contain; }' +
      '.pt-head h1 { font-size:17pt; margin:0; color:#000666; }' +
      '.pt-head p { margin:2px 0 0; font-size:10pt; color:#505f76; }' +
      '.pt-fecha { font-size:8.5pt; color:#767683; margin-top:3px; }' +
      '.pt-banner { display:flex; margin-bottom:16px; border-radius:6px; overflow:hidden; border:1px solid #c6c5d4; break-inside:avoid; }' +
      '.pt-banner-item { flex:1; padding:10px 14px; }' +
      '.pt-banner-item + .pt-banner-item { border-left:1px solid rgba(0,0,0,.12); }' +
      '.pt-banner-item span { display:block; font-size:7.5pt; text-transform:uppercase; letter-spacing:.05em; opacity:.85; }' +
      '.pt-banner-item strong { display:block; font-size:13pt; margin-top:2px; }' +
      '.pt-sev-leve   { background:#ecfdf5; color:#065f46; border-color:#a7f3d0; }' +
      '.pt-sev-grave  { background:#fff7ed; color:#9a3412; border-color:#fed7aa; }' +
      '.pt-sev-mortal { background:#1b1b21; color:#ffffff; border-color:#1b1b21; }' +
      '.pt-sev-mortal .pt-banner-item + .pt-banner-item { border-left-color:rgba(255,255,255,.25); }' +
      '.pt-sec { margin-bottom:14px; }' +
      '.pt-sec h2 { font-size:10pt; text-transform:uppercase; letter-spacing:.06em; color:#505f76; ' +
        'border-bottom:1px solid #c6c5d4; padding-bottom:3px; margin:0 0 8px; }' +
      '.pt-grid { display:grid; gap:7px 16px; }' +
      '.pt-c1 { grid-template-columns:1fr; } .pt-c2 { grid-template-columns:1fr 1fr; } .pt-c3 { grid-template-columns:1fr 1fr 1fr; }' +
      '.pt-campo { display:flex; flex-direction:column; border-bottom:1px dotted #dcdbe4; padding-bottom:3px; }' +
      '.pt-lbl { font-size:7.5pt; text-transform:uppercase; letter-spacing:.05em; color:#767683; font-weight:700; }' +
      '.pt-val { font-size:10.5pt; font-weight:600; }' +
      '.pt-texto { margin:0; font-size:10.5pt; white-space:pre-wrap; }' +
      '.pt-tabla { width:100%; border-collapse:collapse; font-size:9pt; }' +
      '.pt-tabla th { background:#f0eff5; text-align:left; padding:5px 7px; border:1px solid #c6c5d4; ' +
        'font-size:8pt; text-transform:uppercase; letter-spacing:.04em; }' +
      '.pt-tabla td { padding:5px 7px; border:1px solid #dcdbe4; vertical-align:top; }' +
      '.pt-vacio { color:#767683; font-style:italic; text-align:center; font-size:9pt; }' +
      '.pt-figs { display:flex; flex-wrap:wrap; gap:10px; }' +
      '.pt-fig { width:31%; margin:0; } .pt-fig img { width:100%; border:1px solid #c6c5d4; border-radius:4px; }' +
      '.pt-fig figcaption { font-size:7.5pt; color:#767683; margin-top:3px; text-align:center; }' +
      '.pt-firmas { display:flex; gap:26px; margin-top:26px; }' +
      '.pt-firma { flex:1; text-align:center; }' +
      '.pt-firma img { max-height:58px; display:block; margin:0 auto 3px; }' +
      '.pt-firma-hueco { height:58px; }' +
      '.pt-firma span { display:block; border-top:1px solid #1b1b21; padding-top:4px; font-size:9pt; font-weight:600; }' +
      '.pt-no-cortar { break-inside:avoid; page-break-inside:avoid; }' +
      '.pt-salto { break-after:page; page-break-after:always; }',

  // -----------------------------------------------------------------------
  // SALIDA
  // -----------------------------------------------------------------------
  /**
   * Abre el diálogo de impresión (Guardar como PDF).
   * Parte del HTML-plantilla guardado —el mismo que vive en la base de datos—
   * y solo sustituye marcadores. Así el documento impreso es exactamente el
   * que el administrador aprobó, no una nueva interpretación de los bloques.
   */
  exportar: function(modulo, registro, hijos, titulo, ventana) {
    const html = this.documentoHTML(this.plantillaBase(modulo), registro, hijos, titulo || modulo);
    const win = ventana || window.open('', '_blank');
    if (!win) {
      if (typeof PWA_SKILLS !== 'undefined') {
        PWA_SKILLS.toast('El navegador bloqueó la ventana. Permite las ventanas emergentes.', 'error', 5000);
      }
      return false;
    }
    win.document.open();
    win.document.write(html);
    win.document.close();
    // Se espera a que carguen las imágenes (fotos/firmas firmadas). Si la
    // ventana venía abierta de antes, el load puede haber ocurrido ya.
    const imprimir = function() { win.focus(); win.print(); };
    if (win.document.readyState === 'complete') setTimeout(imprimir, 400);
    else win.onload = imprimir;
    return true;
  },

  /**
   * Localiza un registro por UUID probando las fuentes disponibles, en orden:
   * caché en memoria del módulo → caché de referencia en localStorage → datos demo.
   * Así funciona igual online, offline y en el preview local.
   */
  buscarRegistro: function(modulo, uuid) {
    const fuentes = [];

    // Caché en memoria del renderizador: es la que acaba de pintar la vista
    if (typeof MOTOR_RENDER !== 'undefined' && Array.isArray(MOTOR_RENDER._datos[modulo])) {
      fuentes.push(MOTOR_RENDER._datos[modulo]);
    }
    // Caché específica que publique un módulo con vista propia
    ['_actData', '_actDemoData'].forEach(k => { if (Array.isArray(window[k])) fuentes.push(window[k]); });

    // Caché de referencia estándar
    try {
      const copia = (typeof MOTOR_CACHE !== 'undefined') ? MOTOR_CACHE.leerSync(modulo) : null;
      if (copia && copia.length) fuentes.unshift(copia);
      else {
        const raw = localStorage.getItem('refdata_' + modulo);
        if (raw) { const arr = JSON.parse(raw); if (Array.isArray(arr)) fuentes.unshift(arr); }
      }
    } catch (e) {}

    for (const f of fuentes) {
      const hit = f.find(r => String(r.UUID) === String(uuid));
      if (hit) return hit;
    }
    return null;
  },

  /**
   * Exporta el registro visible con el formato interno.
   * Con `uuid`: si no esta en la copia local se pide al servidor y, si aun
   * asi no aparece, NO se exporta (un PDF de seguridad con datos de ejemplo
   * es un documento falso). Sin `uuid` es la vista previa del formato.
   * (Historico) Antes caia a los datos de ejemplo para
   * que el usuario al menos vea el formato (y se le avisa).
   */
  /**
   * Copia del registro con los campos de imagen/firma convertidos a URLs
   * mostrables: en producción el campo guarda la RUTA de Storage (bucket
   * privado), que hay que firmar para que la ventana de impresión la cargue.
   */
  async _conMediaResuelta(modulo, registro) {
    if (!registro || typeof DataService === 'undefined' || !DataService.resolveMedia) return registro;
    const copia = Object.assign({}, registro);
    const campos = this.camposDe(modulo).media || [];
    for (const c of campos) {
      const v = copia[c.clave];
      if (!v) continue;
      try { copia[c.clave] = (await DataService.resolveMedia(partirListaMedia(v))).filter(Boolean).join(','); }
      catch (e) {}
    }
    return copia;
  },

  async exportarRegistro(modulo, uuid, titulo) {
    // La ventana se abre YA, dentro del clic: si se abre después de los
    // await (hijos, firmas de URL), el bloqueador de emergentes la frena.
    const ventana = window.open('', '_blank');
    if (ventana) {
      ventana.document.write('<p style="font-family:Arial,sans-serif;padding:24px;color:#454652">Generando documento…</p>');
    }
    let registro = uuid ? this.buscarRegistro(modulo, uuid) : null;
    let hijos = [];

    // No esta en la copia local: se pide ESE registro al servidor.
    if (!registro && uuid && typeof DataService !== 'undefined' && DataService.query) {
      try {
        const res = await DataService.query(modulo, { cond: { UUID: { eq: String(uuid) } }, limite: 1 });
        if (res && res.status === 'OK' && Array.isArray(res.payload) && res.payload[0]) registro = res.payload[0];
      } catch (e) { /* sin red: se avisa abajo */ }
    }

    if (!registro && uuid) {
      // NUNCA un PDF con datos inventados cuando se pidio un registro
      // concreto: un documento de seguridad con aspecto oficial y contenido
      // de ejemplo es peor que no tener documento. (La vista previa del
      // formato, que llama sin uuid, si usa el registro de ejemplo.)
      if (ventana) {
        ventana.document.body.innerHTML =
          '<div style="font-family:Arial,sans-serif;padding:32px;color:#162138;max-width:520px">' +
          '<h2 style="margin:0 0 8px">No se pudo generar el documento</h2>' +
          '<p style="color:#4f5c78;line-height:1.5">No se encontro el registro en este dispositivo y no fue ' +
          'posible pedirlo al servidor. Conectate y vuelve a abrir el registro antes de exportarlo.</p></div>';
      }
      if (typeof PWA_SKILLS !== 'undefined') {
        PWA_SKILLS.toast('No se encontró el registro: no se exporta un PDF con datos de ejemplo.', 'error', 5000);
      }
      return null;
    }

    if (!registro) {
      const ej = this.registroEjemplo(modulo);
      registro = ej.registro; hijos = ej.hijos;
      if (typeof PWA_SKILLS !== 'undefined') {
        PWA_SKILLS.toast('Vista previa del formato con datos de ejemplo.', 'info', 3200);
      }
    } else if (this.tieneTablaHija(modulo) && uuid && typeof DataService !== 'undefined' && DataService.readChildren) {
      // Igual que en Edición y Detalle: READ_DB solo trae el padre, así que
      // las filas hijas del PDF hay que pedirlas aparte o la tabla sale vacía.
      try { hijos = await DataService.readChildren(modulo, uuid); } catch (e) { hijos = []; }
    }
    registro = await this._conMediaResuelta(modulo, registro);
    return this.exportar(modulo, registro, hijos, titulo || (modulo + ' ' + (uuid || '')), ventana);
  },

  /** Registro de ejemplo para la vista previa del editor */
  registroEjemplo: function(modulo) {
    const campos = this.camposDe(modulo);
    const ej = {};
    campos.texto.forEach(c => {
      // Valores realistas: el admin necesita ver cómo queda el formato de verdad
      if (c.tipo === 'Date')       ej[c.clave] = new Date().toISOString().slice(0, 10);
      else if (c.valores && c.valores.length) ej[c.clave] = c.valores[0];
      else                          ej[c.clave] = 'Ejemplo de ' + c.etiqueta.toLowerCase();
    });
    campos.media.forEach(c => { ej[c.clave] = ''; });
    const hijoEj = {};
    campos.hijos.forEach(c => { hijoEj[c.clave] = 'Dato ' + c.etiqueta.toLowerCase(); });
    return { registro: ej, hijos: campos.hijos.length ? [hijoEj, hijoEj] : [] };
  }
};
</script>
