<script>
/**
 * =========================================================================
 * PLANTILLAS PDF — formato interno (bloques → HTML → impresión del navegador)
 * =========================================================================
 * ARCHIVO: PDF_Templates.js.html
 *
 * CÓMO FUNCIONA
 * El PDF se arma 100% en el cliente: `plantillaBase()` deriva los bloques
 * del subconfig del módulo (datos, tabla de detalle, imágenes, firmas),
 * `renderHTML()` los convierte en HTML imprimible y `exportar()` abre una
 * ventana con `window.print()` (el propio diálogo "Guardar como PDF" del
 * navegador). No depende de ningún servicio externo — funciona igual
 * online, offline y con cualquier proveedor de datos (Sheets o Supabase).
 *
 * Este formato reemplaza al anterior gestor de plantillas de Google Docs
 * (retirado: dependía 100% de Drive/Docs). No es editable visualmente por
 * el admin; para cambiar el diseño hay que editar `plantillaBase()` o
 * `CSS` en este archivo.
 * =========================================================================
 */

const PDF_TEMPLATE = {

  // -----------------------------------------------------------------------
  // LECTURA DEL ESQUEMA DEL MÓDULO
  // -----------------------------------------------------------------------
  /**
   * Devuelve los campos que el admin puede colocar en el PDF, ya clasificados.
   * Se leen del subconfig del módulo: así, si mañana añades un campo al
   * formulario, aparece solo en el editor. Cero mantenimiento.
   */
  camposDe: function(modulo) {
    const nombre = 'SUBCONFIG_' + String(modulo).toUpperCase().replace(/[^A-Z0-9_]/g, '');
    const cfg = window[nombre];
    const out = { texto: [], media: [], hijos: [] };
    if (!cfg || !cfg.Variables) return out;

    Object.keys(cfg.Variables).forEach(clave => {
      const def = cfg.Variables[clave] || {};
      if (def.type === 'Hidden' || def.type === 'Hidden_UUID') return;   // trazabilidad interna
      const item = { clave: clave, etiqueta: (def.label || clave).replace(/_/g, ' '), tipo: def.type,
                     valores: def.acceptedValues || null };
      if (['Image', 'Image_Collection', 'Signature', 'File', 'Face_Photo'].includes(def.type)) out.media.push(item);
      else out.texto.push(item);
    });

    const rel = (cfg.Config_Modular || {}).Relational_Fields || [];
    rel.forEach(f => out.hijos.push({ clave: f.name, etiqueta: f.label || f.name, tipo: f.type || 'text' }));

    return out;
  },

  tieneTablaHija: function(modulo) {
    const nombre = 'SUBCONFIG_' + String(modulo).toUpperCase().replace(/[^A-Z0-9_]/g, '');
    const cfg = window[nombre];
    return !!(cfg && cfg.Config_Modular && cfg.Config_Modular.CHILD_TABLE);
  },

  // -----------------------------------------------------------------------
  // PLANTILLA BASE (la "versión cero" que programa el desarrollador)
  // -----------------------------------------------------------------------
  /**
   * Genera una plantilla de arranque a partir del esquema del módulo.
   * El admin nunca parte de una hoja en blanco: recibe un documento armado
   * con todos los campos y a partir de ahí quita, mueve y ajusta.
   */
  plantillaBase: function(modulo) {
    const ajustes = (typeof getAppSettings === 'function') ? getAppSettings() : {};

    // 05_Incidentes tiene un formato propio (Flash Report): la industria
    // espera un banner de severidad y un orden de secciones específico, no
    // la grilla genérica de "Datos del registro" que reciben los demás módulos.
    if (modulo === '05_Incidentes') return this._plantillaFlashReport(modulo, ajustes);

    const campos = this.camposDe(modulo);
    const titulo = String(modulo).replace(/^\d+_/, '').replace(/_/g, ' ');

    const bloques = [
      { id: this._id(), tipo: 'encabezado',
        titulo: 'Informe de ' + titulo,
        subtitulo: ajustes.App_Empresa || '',
        logoUrl: ajustes.App_Logo || '',
        mostrarFecha: true, alineacion: 'izquierda' },
      { id: this._id(), tipo: 'datos', titulo: 'Datos del registro', columnas: 2,
        campos: campos.texto.map(c => c.clave) }
    ];

    if (this.tieneTablaHija(modulo) && campos.hijos.length) {
      bloques.push({ id: this._id(), tipo: 'tablaHija', titulo: 'Detalle',
                     campos: campos.hijos.map(c => c.clave) });
    }

    const fotos = campos.media.filter(c => c.tipo !== 'Signature');
    if (fotos.length) {
      bloques.push({ id: this._id(), tipo: 'imagenes', titulo: 'Evidencia fotográfica',
                     campos: fotos.map(c => c.clave) });
    }

    const firmas = campos.media.filter(c => c.tipo === 'Signature');
    bloques.push({ id: this._id(), tipo: 'firmas', titulo: 'Conformidad',
      firmas: firmas.length
        ? firmas.map(f => ({ etiqueta: f.etiqueta, campo: f.clave }))
        : [{ etiqueta: 'Responsable', campo: '' }, { etiqueta: 'Supervisor', campo: '' }] });

    return {
      version: 1, modulo: modulo,
      pagina: { tamano: 'A4', orientacion: 'vertical', margen: 16 },
      bloques: bloques
    };
  },

  _id: function() { return 'b' + Math.random().toString(36).slice(2, 9); },

  /**
   * Plantilla "Flash Report" — el formato estándar de la industria para
   * notificar un incidente en las primeras horas, antes de cerrar la
   * investigación: banner de severidad al frente, respuesta inmediata y
   * notificación antes que el análisis de causas, plan de acción al final.
   */
  _plantillaFlashReport: function(modulo, ajustes) {
    const bloques = [
      { id: this._id(), tipo: 'encabezado',
        titulo: 'Reporte Flash de Incidente',
        subtitulo: ajustes.App_Empresa || '',
        logoUrl: ajustes.App_Logo || '',
        mostrarFecha: true, alineacion: 'izquierda' },
      { id: this._id(), tipo: 'bannerSeveridad', campoGravedad: 'Gravedad', campoTipo: 'Tipo_Evento' },
      { id: this._id(), tipo: 'datos', titulo: 'Datos del evento', columnas: 3,
        campos: ['Fecha_Evento', 'Hora_Evento', 'Area', 'Lugar_Exacto', 'Estado', 'Severidad_Potencial'] },
      { id: this._id(), tipo: 'datos', titulo: 'Persona(s) involucrada(s)', columnas: 3,
        campos: ['Nombre_Trabajador', 'Trabajador_DNI', 'Puesto', 'Tipo_Personal', 'Parte_Afectada', 'Dias_Descanso', 'Testigos'] },
      { id: this._id(), tipo: 'texto', titulo: 'Descripción de lo ocurrido', contenido: '{{Descripcion}}' },
      { id: this._id(), tipo: 'texto', titulo: 'Acciones inmediatas tomadas', contenido: '{{Acciones_Inmediatas}}' },
      { id: this._id(), tipo: 'datos', titulo: 'Notificación', columnas: 2,
        campos: ['Requiere_Notificacion_Autoridad', 'Notificados'] },
      { id: this._id(), tipo: 'datos', titulo: 'Impacto y daños', columnas: 2,
        campos: ['Equipo_Involucrado', 'Costo_Estimado_Danos'] },
      { id: this._id(), tipo: 'datos', titulo: 'Análisis de causas', columnas: 1,
        campos: ['Causa_Inmediata', 'Causa_Basica', 'Categoria_Causa'] },
      { id: this._id(), tipo: 'tablaHija', titulo: 'Plan de acción correctiva',
        campos: ['Accion', 'Responsable', 'Fecha_Limite', 'Estado_Accion'] },
      { id: this._id(), tipo: 'imagenes', titulo: 'Evidencia fotográfica', campos: ['Evidencia_Fotos'] },
      { id: this._id(), tipo: 'datos', titulo: 'Seguimiento de la investigación', columnas: 2,
        campos: ['Investigador_DNI', 'Fecha_Cierre'] },
      { id: this._id(), tipo: 'firmas', titulo: 'Conformidad',
        firmas: [
          { etiqueta: 'Investigador', campo: 'Firma_Investigador' },
          { etiqueta: 'Jefe de Área / Gerencia', campo: '' }
        ] }
    ];

    return {
      version: 1, modulo: modulo,
      pagina: { tamano: 'A4', orientacion: 'vertical', margen: 14 },
      bloques: bloques
    };
  },

  // -----------------------------------------------------------------------
  // RENDERIZADO — bloques → HTML imprimible
  // -----------------------------------------------------------------------
  _esc: function(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  },

  /** Sanea una URL de imagen: solo http(s) o data:image */
  _src: function(v) {
    const t = String(v || '').trim();
    return (/^https?:\/\//i.test(t) || /^data:image\//i.test(t)) ? t : '';
  },

  _valor: function(registro, clave) {
    const v = registro ? registro[clave] : '';
    return (v === null || v === undefined || v === '') ? '—' : v;
  },

  /** Sustituye {{Campo}} dentro de un texto libre */
  _interpolar: function(texto, registro) {
    return this._esc(texto).replace(/\{\{\s*([\w]+)\s*\}\}/g, (m, clave) =>
      this._esc(this._valor(registro, clave)));
  },

  _etiquetaDe: function(modulo, clave) {
    const campos = this.camposDe(modulo);
    const todos = campos.texto.concat(campos.media, campos.hijos);
    const hit = todos.find(c => c.clave === clave);
    return hit ? hit.etiqueta : String(clave).replace(/_/g, ' ');
  },

  /**
   * Convierte la plantilla + un registro en el HTML del documento.
   * @param {object} plantilla
   * @param {object} registro  - fila principal
   * @param {Array}  hijos     - filas de la tabla hija
   */
  renderHTML: function(plantilla, registro, hijos) {
    const self = this;
    const mod = plantilla.modulo;
    hijos = hijos || [];
    let cuerpo = '';

    (plantilla.bloques || []).forEach(b => {
      switch (b.tipo) {

        case 'encabezado': {
          const logo = self._src(b.logoUrl);
          const fecha = b.mostrarFecha
            ? '<div class="pt-fecha">Emitido: ' + self._esc(new Date().toLocaleDateString('es-PE',
                { day:'2-digit', month:'long', year:'numeric' })) + '</div>' : '';
          cuerpo +=
            '<header class="pt-head pt-al-' + self._esc(b.alineacion || 'izquierda') + '">' +
              (logo ? '<img class="pt-logo" src="' + self._esc(logo) + '" alt="">' : '') +
              '<div class="pt-head-tx">' +
                '<h1>' + self._esc(b.titulo || '') + '</h1>' +
                (b.subtitulo ? '<p>' + self._esc(b.subtitulo) + '</p>' : '') +
                fecha +
              '</div>' +
            '</header>';
          break;
        }

        case 'bannerSeveridad': {
          const grav = registro ? (registro[b.campoGravedad] || '') : '';
          const evento = registro ? (registro[b.campoTipo] || '') : '';
          const clave = String(grav).toLowerCase();
          const clase = clave.indexOf('mortal') !== -1 ? 'pt-sev-mortal'
                      : clave.indexOf('grave')  !== -1 ? 'pt-sev-grave'
                      : 'pt-sev-leve';
          cuerpo +=
            '<div class="pt-banner ' + clase + '">' +
              '<div class="pt-banner-item"><span>Gravedad</span><strong>' + self._esc(grav || '—') + '</strong></div>' +
              '<div class="pt-banner-item"><span>Tipo de evento</span><strong>' + self._esc(evento || '—') + '</strong></div>' +
            '</div>';
          break;
        }

        case 'datos': {
          const cols = Math.min(3, Math.max(1, parseInt(b.columnas) || 2));
          const celdas = (b.campos || []).map(clave =>
            '<div class="pt-campo">' +
              '<span class="pt-lbl">' + self._esc(self._etiquetaDe(mod, clave)) + '</span>' +
              '<span class="pt-val">' + self._esc(self._valor(registro, clave)) + '</span>' +
            '</div>').join('');
          cuerpo +=
            '<section class="pt-sec">' +
              (b.titulo ? '<h2>' + self._esc(b.titulo) + '</h2>' : '') +
              '<div class="pt-grid pt-c' + cols + '">' + celdas + '</div>' +
            '</section>';
          break;
        }

        case 'texto':
          cuerpo += '<section class="pt-sec"><p class="pt-texto">' +
                    self._interpolar(b.contenido || '', registro) + '</p></section>';
          break;

        case 'tablaHija': {
          const cs = b.campos || [];
          const th = cs.map(c => '<th>' + self._esc(self._etiquetaDe(mod, c)) + '</th>').join('');
          const tr = hijos.length
            ? hijos.map(fila => '<tr>' + cs.map(c =>
                '<td>' + self._esc(self._valor(fila, c)) + '</td>').join('') + '</tr>').join('')
            : '<tr><td colspan="' + Math.max(1, cs.length) + '" class="pt-vacio">Sin registros de detalle</td></tr>';
          cuerpo +=
            '<section class="pt-sec">' +
              (b.titulo ? '<h2>' + self._esc(b.titulo) + '</h2>' : '') +
              '<table class="pt-tabla"><thead><tr>' + th + '</tr></thead><tbody>' + tr + '</tbody></table>' +
            '</section>';
          break;
        }

        case 'imagenes': {
          const imgs = (b.campos || []).map(clave => {
            const bruto = registro ? registro[clave] : '';
            if (!bruto) return '';
            const lista = (typeof partirListaMedia === 'function') ? partirListaMedia(bruto) : String(bruto).split(',');
            return lista.map(u => {
              const src = self._src(u.trim());
              return src ? '<figure class="pt-fig"><img src="' + self._esc(src) + '" alt="">' +
                           '<figcaption>' + self._esc(self._etiquetaDe(mod, clave)) + '</figcaption></figure>' : '';
            }).join('');
          }).join('');
          cuerpo +=
            '<section class="pt-sec">' +
              (b.titulo ? '<h2>' + self._esc(b.titulo) + '</h2>' : '') +
              (imgs ? '<div class="pt-figs">' + imgs + '</div>'
                    : '<p class="pt-vacio">Sin imágenes adjuntas</p>') +
            '</section>';
          break;
        }

        case 'firmas': {
          const fs = (b.firmas || []).map(f => {
            // Una firma es un solo archivo: si el campo trae varios, se usa el primero
            const crudo = f.campo && registro ? registro[f.campo] : '';
            const primero = (typeof partirListaMedia === 'function') ? (partirListaMedia(crudo)[0] || '') : crudo;
            const src = f.campo ? self._src(primero) : '';
            return '<div class="pt-firma">' +
                     (src ? '<img src="' + self._esc(src) + '" alt="">' : '<div class="pt-firma-hueco"></div>') +
                     '<span>' + self._esc(f.etiqueta || '') + '</span>' +
                   '</div>';
          }).join('');
          cuerpo +=
            '<section class="pt-sec pt-no-cortar">' +
              (b.titulo ? '<h2>' + self._esc(b.titulo) + '</h2>' : '') +
              '<div class="pt-firmas">' + fs + '</div>' +
            '</section>';
          break;
        }

        case 'espacio':
          cuerpo += '<div style="height:' + (parseInt(b.alto) || 16) + 'px"></div>';
          break;

        case 'saltoPagina':
          cuerpo += '<div class="pt-salto"></div>';
          break;
      }
    });

    return cuerpo;
  },

  /**
   * La MISMA hoja de estilos, pero acotada a un contenedor: el documento se
   * pinta DENTRO de la app (visor y generador de PDF), no en una ventana
   * aparte. Sin acotarla, `body { font-size:11pt }` y `.pt-tabla th` se
   * aplicarían a toda la aplicación.
   *
   * La hoja es plana a propósito (una regla por selector, sin anidar), así que
   * basta anteponer el prefijo a cada selector. `@page` se descarta: en
   * pantalla no significa nada y la impresión la define `_cssImpresion()`.
   */
  _cssDocumento: function(prefijo) {
    const reglas = [prefijo + ' { box-sizing:border-box; }'];
    this.CSS.replace('@PAGE_RULE@', '').split('}').forEach(trozo => {
      const corte = trozo.indexOf('{');
      if (corte === -1) return;
      const selector = trozo.slice(0, corte).trim();
      const cuerpo = trozo.slice(corte + 1).trim();
      if (!selector || !cuerpo || selector.charAt(0) === '@') return;
      const sels = selector.split(',').map(s => s.trim()).filter(Boolean)
        .map(s => (s === 'body' || s === 'html') ? prefijo : prefijo + ' ' + s);
      reglas.push(sels.join(', ') + ' { ' + cuerpo + ' }');
    });
    return reglas.join('\n');
  },

  /**
   * Impresión: se oculta la app y se imprime solo la hoja del visor. Antes el
   * documento vivía en una ventana nueva —que en la app instalada y en el
   * móvil se abría a pantalla completa SIN forma de volver atrás—.
   */
  _cssImpresion: function(plantilla) {
    const pag = (plantilla && plantilla.pagina) || {};
    const orientacion = pag.orientacion === 'horizontal' ? 'landscape' : 'portrait';
    const margen = parseInt(pag.margen) || 16;
    return '@media print {' +
      '  body > *:not(#' + this.VISOR_ID + ') { display:none !important; }' +
      '  #' + this.VISOR_ID + ' { position:static !important; inset:auto !important; background:#fff !important; overflow:visible !important; display:block !important; }' +
      '  #' + this.VISOR_ID + ' .pt-visor-barra, #' + this.VISOR_ID + ' .pt-visor-pie { display:none !important; }' +
      '  #' + this.VISOR_ID + ' .pt-visor-scroll { overflow:visible !important; padding:0 !important; display:block !important; }' +
      '  #' + this.VISOR_ID + ' .pt-doc { box-shadow:none !important; margin:0 !important; padding:0 !important; width:auto !important; max-width:none !important; min-height:0 !important; }' +
      '  @page { size: ' + (pag.tamano || 'A4') + ' ' + orientacion + '; margin: ' + margen + 'mm; }' +
      '}';
  },

  VISOR_ID: 'pt-visor',

  /** Inyecta (una sola vez por formato) los estilos acotados del documento. */
  _montarEstilos: function(plantilla) {
    let hoja = document.getElementById('pt-estilos');
    if (!hoja) {
      hoja = document.createElement('style');
      hoja.id = 'pt-estilos';
      document.head.appendChild(hoja);
    }
    hoja.textContent = this._cssDocumento('.pt-doc') + '\n' +
      '.pt-doc { background:#fff; color:#1b1b21; }' +
      '.pt-doc img { max-width:100%; }' +
      '.pt-doc .pt-banner, .pt-doc .pt-sev-mortal { -webkit-print-color-adjust:exact; print-color-adjust:exact; }' +
      '\n' + this._cssImpresion(plantilla);
  },

  /** Hoja de estilos del formato interno de respaldo */
  CSS: '@PAGE_RULE@' +
      '* { box-sizing:border-box; }' +
      'body { font-family: Inter, Arial, Helvetica, sans-serif; color:#1b1b21; font-size:11pt; margin:0; line-height:1.45; }' +
      '.pt-head { display:flex; gap:14px; align-items:center; border-bottom:2px solid #000666; padding-bottom:10px; margin-bottom:16px; }' +
      '.pt-al-centro { justify-content:center; text-align:center; } .pt-al-derecha { justify-content:flex-end; text-align:right; }' +
      '.pt-logo { max-height:52px; max-width:150px; object-fit:contain; }' +
      '.pt-head h1 { font-size:17pt; margin:0; color:#000666; }' +
      '.pt-head p { margin:2px 0 0; font-size:10pt; color:#505f76; }' +
      '.pt-fecha { font-size:8.5pt; color:#767683; margin-top:3px; }' +
      '.pt-banner { display:flex; margin-bottom:16px; border-radius:6px; overflow:hidden; border:1px solid #c6c5d4; break-inside:avoid; }' +
      '.pt-banner-item { flex:1; padding:10px 14px; }' +
      '.pt-banner-item + .pt-banner-item { border-left:1px solid rgba(0,0,0,.12); }' +
      '.pt-banner-item span { display:block; font-size:7.5pt; text-transform:uppercase; letter-spacing:.05em; opacity:.85; }' +
      '.pt-banner-item strong { display:block; font-size:13pt; margin-top:2px; }' +
      '.pt-sev-leve   { background:#ecfdf5; color:#065f46; border-color:#a7f3d0; }' +
      '.pt-sev-grave  { background:#fff7ed; color:#9a3412; border-color:#fed7aa; }' +
      '.pt-sev-mortal { background:#1b1b21; color:#ffffff; border-color:#1b1b21; }' +
      '.pt-sev-mortal .pt-banner-item + .pt-banner-item { border-left-color:rgba(255,255,255,.25); }' +
      '.pt-sec { margin-bottom:14px; }' +
      '.pt-sec h2 { font-size:10pt; text-transform:uppercase; letter-spacing:.06em; color:#505f76; ' +
        'border-bottom:1px solid #c6c5d4; padding-bottom:3px; margin:0 0 8px; }' +
      '.pt-grid { display:grid; gap:7px 16px; }' +
      '.pt-c1 { grid-template-columns:1fr; } .pt-c2 { grid-template-columns:1fr 1fr; } .pt-c3 { grid-template-columns:1fr 1fr 1fr; }' +
      '.pt-campo { display:flex; flex-direction:column; border-bottom:1px dotted #dcdbe4; padding-bottom:3px; }' +
      '.pt-lbl { font-size:7.5pt; text-transform:uppercase; letter-spacing:.05em; color:#767683; font-weight:700; }' +
      '.pt-val { font-size:10.5pt; font-weight:600; }' +
      '.pt-texto { margin:0; font-size:10.5pt; white-space:pre-wrap; }' +
      '.pt-tabla { width:100%; border-collapse:collapse; font-size:9pt; }' +
      '.pt-tabla th { background:#f0eff5; text-align:left; padding:5px 7px; border:1px solid #c6c5d4; ' +
        'font-size:8pt; text-transform:uppercase; letter-spacing:.04em; }' +
      '.pt-tabla td { padding:5px 7px; border:1px solid #dcdbe4; vertical-align:top; }' +
      '.pt-vacio { color:#767683; font-style:italic; text-align:center; font-size:9pt; }' +
      '.pt-figs { display:flex; flex-wrap:wrap; gap:10px; }' +
      '.pt-fig { width:31%; margin:0; } .pt-fig img { width:100%; border:1px solid #c6c5d4; border-radius:4px; }' +
      '.pt-fig figcaption { font-size:7.5pt; color:#767683; margin-top:3px; text-align:center; }' +
      '.pt-firmas { display:flex; gap:26px; margin-top:26px; }' +
      '.pt-firma { flex:1; text-align:center; }' +
      '.pt-firma img { max-height:58px; display:block; margin:0 auto 3px; }' +
      '.pt-firma-hueco { height:58px; }' +
      '.pt-firma span { display:block; border-top:1px solid #1b1b21; padding-top:4px; font-size:9pt; font-weight:600; }' +
      '.pt-no-cortar { break-inside:avoid; page-break-inside:avoid; }' +
      '.pt-salto { break-after:page; page-break-after:always; }',

  // -----------------------------------------------------------------------
  // SALIDA · VISOR DENTRO DE LA APP
  // -----------------------------------------------------------------------
  /**
   * Muestra el documento en una capa sobre la app, con su propia cabecera:
   * volver, imprimir (Guardar como PDF del sistema), descargar y enviar por
   * WhatsApp.
   *
   * POR QUÉ NO UNA VENTANA NUEVA
   * Antes se abría con `window.open()`. En el móvil y dentro de la app
   * instalada eso es una pestaña a pantalla completa sin barra de direcciones:
   * el PDF tapaba la app y no había forma de regresar al registro. Ahora el
   * documento es una vista más de la app: se cierra con el botón de volver,
   * con Escape y con el botón físico de atrás del teléfono.
   *
   * @param {object} doc  { registro, hijos, plantilla, titulo, modulo, uuid }
   */
  abrirVisor: function(doc) {
    this.cerrarVisor();
    this._montarEstilos(doc.plantilla);

    const capa = document.createElement('div');
    capa.id = this.VISOR_ID;
    capa.className = 'fixed inset-0 z-[9995] flex flex-col bg-[#0b101d]/95';
    capa.setAttribute('role', 'dialog');
    capa.setAttribute('aria-modal', 'true');
    capa.setAttribute('aria-label', 'Informe: ' + String(doc.titulo || ''));

    // Acciones de la barra. Cada icono va como literal en su propia línea
    // porque tools/vendor_cdn.js saca de aquí la lista de iconos que empaqueta:
    // un icono que no detecte se vería como la palabra "print" en la pantalla.
    const acciones = [
      { accion: 'imprimir',  icono: 'print',    etiqueta: 'Imprimir',
        clases: 'bg-[#ffd53f] text-[#162138] hover:brightness-105' },
      { accion: 'descargar', icono: 'download', etiqueta: 'Descargar',
        clases: 'border border-white/25 text-white hover:bg-white/10' },
      { accion: 'whatsapp',  icono: 'share',    etiqueta: 'Enviar',
        clases: 'border border-white/25 text-white hover:bg-white/10' }
    ];
    const boton = a =>
      '<button type="button" data-' + a.accion + ' aria-label="' + this._esc(a.etiqueta) + '" title="' + this._esc(a.etiqueta) + '" ' +
        'class="h-10 min-w-[2.5rem] px-2.5 rounded-xl text-[10px] font-black flex items-center justify-center gap-1.5 ' +
        'whitespace-nowrap transition-colors ' + a.clases + '">' +
        '<span class="material-symbols-outlined text-[18px]" aria-hidden="true">' + a.icono + '</span>' +
        '<span class="hidden sm:inline">' + this._esc(a.etiqueta) + '</span></button>';

    capa.innerHTML =
      '<header class="pt-visor-barra shrink-0 flex items-center gap-2 px-2 sm:px-4 py-2 bg-[#162138] text-white shadow-lg">' +
        '<button type="button" data-cerrar aria-label="Volver al registro" ' +
          'class="w-10 h-10 shrink-0 rounded-full hover:bg-white/10 flex items-center justify-center">' +
          '<span class="material-symbols-outlined" aria-hidden="true">arrow_back</span></button>' +
        '<div class="min-w-0 flex-1">' +
          '<p class="text-[12px] font-black leading-tight truncate">' + this._esc(doc.titulo || 'Informe') + '</p>' +
          '<p class="text-[10px] text-white/70 leading-tight truncate" data-estado>Documento generado desde el registro</p>' +
        '</div>' +
        acciones.map(boton).join('') +
      '</header>' +
      '<div class="pt-visor-scroll flex-1 overflow-auto p-2 sm:p-6">' +
        '<div class="pt-doc mx-auto shadow-2xl" style="width:100%;max-width:210mm;padding:14mm 12mm;min-height:60vh;">' +
          this.renderHTML(doc.plantilla, doc.registro, doc.hijos) +
        '</div>' +
      '</div>';

    const cerrar = () => this.cerrarVisor();
    capa.querySelector('[data-cerrar]').addEventListener('click', cerrar);
    capa.querySelector('[data-imprimir]').addEventListener('click', () => this.imprimirVisor());
    capa.querySelector('[data-descargar]').addEventListener('click', e =>
      this.descargar(doc.modulo, doc.uuid, e.currentTarget));
    capa.querySelector('[data-whatsapp]').addEventListener('click', e =>
      this.enviarPorWhatsApp(doc.modulo, doc.uuid, doc.titulo, e.currentTarget));

    this._onEsc = e => { if (e.key === 'Escape') cerrar(); };
    document.addEventListener('keydown', this._onEsc);
    document.body.appendChild(capa);
    // El documento se desplaza dentro del visor; la app de debajo, quieta
    this._scrollPrevio = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    // El botón físico de atrás del teléfono cierra el visor en vez de salir
    // de la app o de saltarse la vista del registro.
    try { history.pushState({ ptVisor: true }, ''); this._conHistorial = true; } catch (e) { this._conHistorial = false; }
    this._onAtras = () => { this._conHistorial = false; this.cerrarVisor(); };
    window.addEventListener('popstate', this._onAtras);
    capa.querySelector('[data-cerrar]').focus();

    this._visor = doc;
    if (doc.uuid) this._mostrarEstadoArchivo(doc.modulo, doc.uuid);
    return true;
  },

  cerrarVisor: function() {
    const capa = document.getElementById(this.VISOR_ID);
    if (this._onEsc) { document.removeEventListener('keydown', this._onEsc); this._onEsc = null; }
    if (this._onAtras) { window.removeEventListener('popstate', this._onAtras); this._onAtras = null; }
    if (capa) capa.remove();
    if (capa) document.body.style.overflow = this._scrollPrevio || '';
    if (this._conHistorial) { this._conHistorial = false; try { history.back(); } catch (e) {} }
    this._visor = null;
  },

  imprimirVisor: function() {
    if (!document.getElementById(this.VISOR_ID)) return false;
    window.print();
    return true;
  },

  /** Línea de estado de la cabecera: dónde está archivado el documento. */
  _mostrarEstadoArchivo: async function(modulo, uuid) {
    const linea = () => {
      const capa = document.getElementById(this.VISOR_ID);
      return capa ? capa.querySelector('[data-estado]') : null;
    };
    const el = linea();
    if (!el) return;
    let info = { existe: false };
    try { info = (await DataService.reportInfo(modulo, uuid)) || { existe: false }; } catch (e) {}
    const el2 = linea();
    if (!el2) return;
    if (info.existe) {
      el2.textContent = 'Archivado en ' + (info.donde || 'el servidor') +
        (info.fecha ? ' · ' + String(info.fecha).slice(0, 10) : '');
    } else if (this._pendiente(modulo, uuid)) {
      el2.textContent = 'Se archivará en cuanto haya conexión';
    } else {
      el2.textContent = 'Documento generado desde el registro';
    }
  },

  /**
   * Localiza un registro por UUID probando las fuentes disponibles, en orden:
   * caché en memoria del módulo → caché de referencia en localStorage → datos demo.
   * Así funciona igual online, offline y en el preview local.
   */
  buscarRegistro: function(modulo, uuid) {
    const fuentes = [];

    // Caché en memoria del renderizador: es la que acaba de pintar la vista
    if (typeof MOTOR_RENDER !== 'undefined' && Array.isArray(MOTOR_RENDER._datos[modulo])) {
      fuentes.push(MOTOR_RENDER._datos[modulo]);
    }
    // Caché específica que publique un módulo con vista propia
    ['_actData', '_actDemoData'].forEach(k => { if (Array.isArray(window[k])) fuentes.push(window[k]); });

    // Caché de referencia estándar
    try {
      const copia = (typeof MOTOR_CACHE !== 'undefined') ? MOTOR_CACHE.leerSync(modulo) : null;
      if (copia && copia.length) fuentes.unshift(copia);
      else {
        const raw = localStorage.getItem('refdata_' + modulo);
        if (raw) { const arr = JSON.parse(raw); if (Array.isArray(arr)) fuentes.unshift(arr); }
      }
    } catch (e) {}

    for (const f of fuentes) {
      const hit = f.find(r => String(r.UUID) === String(uuid));
      if (hit) return hit;
    }
    return null;
  },

  /**
   * Exporta el registro visible con el formato interno.
   * Con `uuid`: si no esta en la copia local se pide al servidor y, si aun
   * asi no aparece, NO se exporta (un PDF de seguridad con datos de ejemplo
   * es un documento falso). Sin `uuid` es la vista previa del formato.
   * (Historico) Antes caia a los datos de ejemplo para
   * que el usuario al menos vea el formato (y se le avisa).
   */
  /**
   * Copia del registro con los campos de imagen/firma convertidos a URLs
   * mostrables: en producción el campo guarda la RUTA de Storage (bucket
   * privado), que hay que firmar para que la ventana de impresión la cargue.
   */
  async _conMediaResuelta(modulo, registro) {
    if (!registro || typeof DataService === 'undefined' || !DataService.resolveMedia) return registro;
    const copia = Object.assign({}, registro);
    const campos = this.camposDe(modulo).media || [];
    for (const c of campos) {
      const v = copia[c.clave];
      if (!v) continue;
      try { copia[c.clave] = (await DataService.resolveMedia(partirListaMedia(v))).filter(Boolean).join(','); }
      catch (e) {}
    }
    return copia;
  },

  /**
   * Reúne todo lo que necesita el documento de UN registro: la fila, sus filas
   * hijas y las fotos/firmas ya firmadas (en Storage la columna guarda la ruta
   * de un bucket privado). Lo usan el visor, el PDF descargable y el archivo
   * automático: una sola forma de armar el documento, un solo resultado.
   *
   * @param {string} modulo
   * @param {string} [uuid]  sin uuid = vista previa del formato (datos de ejemplo)
   * @returns {Promise<{registro, hijos, plantilla, titulo, modulo, uuid, ejemplo, falta}>}
   */
  async prepararDocumento(modulo, uuid, titulo) {
    const plantilla = this.plantillaBase(modulo);
    const base = { modulo: modulo, uuid: uuid ? String(uuid) : '', plantilla: plantilla, hijos: [],
                   titulo: titulo || (this._tituloModulo(modulo) + (uuid ? '' : ' · formato')) };

    let registro = uuid ? this.buscarRegistro(modulo, uuid) : null;

    // No está en la copia local: se pide ESE registro al servidor (no la tabla).
    if (!registro && uuid && typeof DataService !== 'undefined' && DataService.query) {
      try {
        const res = await DataService.query(modulo, { cond: { UUID: { eq: String(uuid) } }, limite: 1 });
        if (res && res.status === 'OK' && Array.isArray(res.payload) && res.payload[0]) registro = res.payload[0];
      } catch (e) { /* sin red: se resuelve abajo */ }
    }

    // NUNCA un documento con datos inventados cuando se pidió un registro
    // concreto: un papel de seguridad con aspecto oficial y contenido de
    // ejemplo es peor que no tener documento.
    if (!registro && uuid) return Object.assign(base, { registro: null, falta: true });

    if (!registro) {
      const ej = this.registroEjemplo(modulo);
      return Object.assign(base, { registro: ej.registro, hijos: ej.hijos, ejemplo: true });
    }

    let hijos = [];
    if (this.tieneTablaHija(modulo) && typeof DataService !== 'undefined' && DataService.readChildren) {
      // Igual que en Edición y Detalle: la lectura del padre no trae el
      // detalle, así que las filas hijas se piden aparte o la tabla sale vacía.
      try { hijos = await DataService.readChildren(modulo, uuid); } catch (e) { hijos = []; }
    }
    return Object.assign(base, { registro: await this._conMediaResuelta(modulo, registro), hijos: hijos });
  },

  _tituloModulo: function(modulo) {
    const t = (typeof MOTOR_RENDER !== 'undefined' && MOTOR_RENDER.titulo) ? MOTOR_RENDER.titulo(modulo) : '';
    return t || String(modulo).replace(/^\d+_/, '').replace(/_/g, ' ');
  },

  /** Nombre del archivo PDF de un registro. */
  nombreArchivo: function(modulo, uuid) {
    return 'Informe_' + String(modulo).replace(/[^\w-]/g, '') +
           (uuid ? '_' + String(uuid).replace(/[^\w-]/g, '').slice(0, 12) : '') + '.pdf';
  },

  /**
   * Punto de entrada del botón "PDF" de cada Detalle. Mismo nombre que antes
   * —lo llama MOTOR_RENDER—, pero ahora abre el visor dentro de la app en vez
   * de una ventana nueva sin retorno.
   */
  async exportarRegistro(modulo, uuid, titulo) {
    const doc = await this.prepararDocumento(modulo, uuid, titulo);
    if (doc.falta) {
      if (typeof PWA_SKILLS !== 'undefined') {
        PWA_SKILLS.toast('No se encontró el registro en este dispositivo ni en el servidor: ' +
          'conéctate y vuelve a abrirlo antes de exportarlo.', 'error', 5500);
      }
      return null;
    }
    if (doc.ejemplo && typeof PWA_SKILLS !== 'undefined') {
      PWA_SKILLS.toast('Vista previa del formato con datos de ejemplo.', 'info', 3200);
    }
    return this.abrirVisor(doc);
  },

  // -----------------------------------------------------------------------
  // ARCHIVO PDF DEL REGISTRO (Drive / Storage)
  // -----------------------------------------------------------------------
  // El informe se archiva solo cuando el registro llega al servidor, y se
  // vuelve a generar con CADA cambio: lo que está archivado es siempre la
  // última versión del registro. Al eliminar el registro se borra su informe.
  //
  // Dónde queda, según el proveedor activo:
  //   appscript → Drive:   DATA/<modulo>/00_Informes/<uuid>.pdf
  //   supabase  → Storage: informes/<empresa_id>/<modulo>/<uuid>/informe.pdf
  //
  // El nombre de un registro es SIEMPRE el mismo: "actualizar" es sustituir
  // ese archivo, no acumular una copia por edición (en una fiscalización
  // nadie sabría cuál de las siete es la vigente).

  CLAVE_PENDIENTES: 'pdf_informes_pendientes',
  MAX_PENDIENTES: 300,
  MAX_INTENTOS: 3,

  /** El archivo automático se puede desactivar por empresa o por dispositivo. */
  archivoAutomatico: function() {
    const cfg = ((typeof AppState !== 'undefined' && AppState.User) || {}).EmpresaConfig || {};
    if (cfg.Informe_PDF_Auto === false || cfg.Informe_PDF_Auto === 'false') return false;
    const s = (typeof AppState !== 'undefined' && AppState.Settings) || {};
    return s.InformePDFAuto !== false;
  },

  /**
   * Carga el generador de PDF (html2pdf = html2canvas + jsPDF).
   * PRIMERO la copia local de /vendor: la CSP del proyecto solo permite
   * scripts del propio origen, y dentro del APK no hay internet garantizado.
   * El CDN queda como respaldo para PROD_INDEX.html (Apps Script), que es un
   * único HTML y no tiene archivos sueltos que referenciar.
   */
  CDN_PDF: 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js',
  SRI_PDF: 'sha384-Yv5O+t3uE3hunW8uyrbpPW3iw6/5/Y7HitWJBLgqfMoA36NogMmy+8wWZMpn3HWc',
  LOCAL_PDF: '/vendor/html2pdf.bundle.min.js',

  cargarGenerador: function() {
    if (window.html2pdf) return Promise.resolve(true);
    if (this._libPdf) return this._libPdf;
    const self = this;
    const intentar = (src, sri) => new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      if (sri) { s.integrity = sri; s.crossOrigin = 'anonymous'; s.referrerPolicy = 'no-referrer'; }
      s.onload = () => window.html2pdf ? resolve(true) : reject(new Error('html2pdf no quedó disponible'));
      s.onerror = () => reject(new Error('no se pudo cargar ' + src));
      document.head.appendChild(s);
    });
    this._libPdf = intentar(this.LOCAL_PDF, '')
      .catch(() => intentar(self.CDN_PDF, self.SRI_PDF))
      .catch(e => { self._libPdf = null; throw new Error('No se pudo cargar el generador de PDF. ' + e.message); });
    return this._libPdf;
  },

  /**
   * Hoja de 210 mm fuera de la vista: html2canvas necesita medidas reales,
   * así que el documento se renderiza de verdad, pero donde no se ve ni
   * desplaza la app.
   */
  _hostOculto: function(doc) {
    this._montarEstilos(doc.plantilla);
    const host = document.createElement('div');
    host.style.cssText = 'position:fixed;left:-10000px;top:0;z-index:-1;background:#fff;';
    host.innerHTML = '<div class="pt-doc" style="width:210mm;padding:14mm 12mm;">' +
      this.renderHTML(doc.plantilla, doc.registro, doc.hijos) + '</div>';
    document.body.appendChild(host);
    return host;
  },

  /** Documento → Blob PDF (A4). Es el archivo que se archiva y el que se adjunta. */
  async pdfBlob(doc) {
    await this.cargarGenerador();
    if (!window.html2pdf) throw new Error('No se pudo cargar el generador de PDF.');
    const pag = doc.plantilla.pagina || {};
    const host = this._hostOculto(doc);
    try {
      return await window.html2pdf().set({
        margin: 0,
        filename: this.nombreArchivo(doc.modulo, doc.uuid),
        image: { type: 'jpeg', quality: 0.92 },
        html2canvas: { scale: 2, useCORS: true, logging: false, backgroundColor: '#ffffff' },
        pagebreak: { mode: ['css', 'legacy'], avoid: '.pt-no-cortar' },
        jsPDF: { unit: 'mm', format: String(pag.tamano || 'a4').toLowerCase(),
                 orientation: pag.orientacion === 'horizontal' ? 'landscape' : 'portrait' }
      }).from(host.firstElementChild).outputPdf('blob');
    } finally {
      host.remove();
    }
  },

  /** Descarga el PDF en el dispositivo (botón del visor). */
  async descargar(modulo, uuid, boton) {
    const fin = this._ocupado(boton, 'Generando…');
    try {
      const doc = (this._visor && this._visor.uuid === String(uuid || ''))
        ? this._visor : await this.prepararDocumento(modulo, uuid);
      if (doc.falta) throw new Error('No se encontró el registro.');
      const blob = await this.pdfBlob(doc);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = this.nombreArchivo(modulo, uuid);
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      return true;
    } catch (e) {
      if (typeof PWA_SKILLS !== 'undefined') PWA_SKILLS.toast(e.message, 'error', 5000);
      return false;
    } finally { fin(); }
  },

  /** Desactiva un botón mientras dura una tarea larga (y lo deja como estaba). */
  _ocupado: function(boton, texto) {
    if (!boton) return function () {};
    const antes = boton.innerHTML;
    boton.disabled = true;
    boton.classList.add('opacity-60', 'pointer-events-none');
    boton.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin" aria-hidden="true">progress_activity</span>' +
                      '<span class="hidden sm:inline">' + this._esc(texto || 'Un momento…') + '</span>';
    return function () {
      boton.disabled = false;
      boton.classList.remove('opacity-60', 'pointer-events-none');
      boton.innerHTML = antes;
    };
  },

  /**
   * Genera el informe de un registro y lo archiva en el servidor.
   * Silencioso a propósito: es una consecuencia del guardado, no una acción
   * del usuario. Si falla por red, el registro sigue en la lista de pendientes.
   */
  async archivar(modulo, uuid) {
    if (!modulo || !uuid) return { status: 'ERROR', msg: 'Falta el módulo o el UUID.' };
    if (typeof DataService === 'undefined' || !DataService.saveReport) {
      return { status: 'ERROR', msg: 'El proveedor activo no archiva informes.' };
    }
    let doc;
    try { doc = await this.prepararDocumento(modulo, uuid); }
    catch (e) { return { status: 'ERROR', msg: e.message, transitorio: true }; }
    // Sin el registro no se archiva nada: un informe vacío con aspecto
    // oficial es peor que la falta de informe.
    if (!doc.registro || doc.falta) return { status: 'ERROR', msg: 'No se pudo leer el registro.', transitorio: true };

    let blob;
    try { blob = await this.pdfBlob(doc); }
    catch (e) { return { status: 'ERROR', msg: e.message, transitorio: true }; }

    try {
      const r = await DataService.saveReport({ blob: blob, modulo: modulo, uuid: uuid });
      return (r && r.status === 'OK') ? r : (r || { status: 'ERROR', msg: 'Respuesta vacía del servidor.' });
    } catch (e) {
      return { status: 'ERROR', msg: e.message, transitorio: true };
    }
  },

  /** Borra el informe archivado (lo llama DataService.delete al eliminar el registro). */
  async borrarArchivo(modulo, uuid) {
    this.olvidarPendiente(modulo, uuid);
    if (typeof DataService === 'undefined' || !DataService.deleteReport) return { status: 'OK' };
    try { return await DataService.deleteReport(modulo, uuid); }
    catch (e) { return { status: 'ERROR', msg: e.message }; }
  },

  // ── Lista de pendientes ────────────────────────────────────────────────
  // Un registro guardado sin señal no puede archivar su PDF: no hay dónde
  // subirlo. Se apunta aquí (módulo + uuid, unos bytes) y se archiva en cuanto
  // el registro llega al servidor. La lista sobrevive al cierre de la app, así
  // que un turno entero sin cobertura no deja informes sin generar.
  _pendientes: function() {
    try {
      const l = JSON.parse(localStorage.getItem(this.CLAVE_PENDIENTES) || '[]');
      return Array.isArray(l) ? l : [];
    } catch (e) { return []; }
  },
  _guardarPendientes: function(lista) {
    try { localStorage.setItem(this.CLAVE_PENDIENTES, JSON.stringify(lista.slice(-this.MAX_PENDIENTES))); }
    catch (e) { /* almacenamiento lleno: se archivará al próximo guardado */ }
  },
  _pendiente: function(modulo, uuid) {
    return this._pendientes().some(p => p.m === modulo && p.u === String(uuid));
  },

  /** Apunta uno o varios registros para archivar su informe. */
  encolarArchivo: function(modulo, uuids) {
    if (!this.archivoAutomatico()) return 0;
    const lista = this._pendientes();
    let nuevos = 0;
    [].concat(uuids || []).filter(Boolean).forEach(u => {
      const uuid = String(u);
      const i = lista.findIndex(p => p.m === modulo && p.u === uuid);
      // Si ya estaba, se reinician los intentos: el registro volvió a cambiar
      // y lo que haya archivado quedó viejo.
      if (i !== -1) lista.splice(i, 1);
      lista.push({ m: modulo, u: uuid, n: 0 });
      nuevos++;
    });
    this._guardarPendientes(lista);
    return nuevos;
  },

  olvidarPendiente: function(modulo, uuid) {
    this._guardarPendientes(this._pendientes().filter(p => !(p.m === modulo && p.u === String(uuid))));
  },

  /**
   * Archiva los pendientes, de uno en uno. Un fallo transitorio (sin red,
   * sesión caducada) deja el registro en la lista y detiene la pasada: no se
   * gastan intentos cuando el problema es la señal. Un rechazo real se
   * reintenta MAX_INTENTOS veces y luego se descarta, para que un registro
   * imposible no bloquee la lista entera.
   */
  async procesarPendientes(opciones) {
    opciones = opciones || {};
    if (this._drenando) return { archivados: 0, pendientes: this._pendientes().length, motivo: 'en-curso' };
    if (!this.archivoAutomatico()) return { archivados: 0, pendientes: 0, motivo: 'desactivado' };
    const sesion = (typeof AppState !== 'undefined' && AppState.User) || {};
    if (!sesion.DNI) return { archivados: 0, pendientes: this._pendientes().length, motivo: 'sin-sesion' };
    // navigator.onLine no es de fiar dentro del APK (el WebView no lo
    // actualiza): ahí se intenta siempre y el fallo de red es transitorio.
    if (!navigator.onLine && !(typeof enAppInstalada === 'function' && enAppInstalada())) {
      return { archivados: 0, pendientes: this._pendientes().length, motivo: 'sin-red' };
    }

    this._drenando = true;
    let archivados = 0;
    try {
      // Tope por pasada: generar un PDF cuesta ~1 s de CPU. Con 40 registros
      // subidos de golpe tras un turno sin señal, hacerlos todos seguidos
      // congelaría la app; el resto sale en la pasada siguiente.
      const tope = Math.max(1, parseInt(opciones.tope, 10) || 6);
      for (let k = 0; k < tope; k++) {
        const lista = this._pendientes();
        if (!lista.length) break;
        const item = lista[0];
        const r = await this.archivar(item.m, item.u);
        const actual = this._pendientes();
        const i = actual.findIndex(p => p.m === item.m && p.u === item.u);
        if (i === -1) continue;                      // lo quitaron mientras tanto (registro eliminado)
        if (r && r.status === 'OK') {
          actual.splice(i, 1);
          archivados++;
        } else if (r && r.transitorio) {
          this._guardarPendientes(actual);           // se reintenta luego, sin gastar intentos
          break;
        } else {
          actual[i].n = (actual[i].n || 0) + 1;
          actual[i].error = String((r && r.msg) || 'error');
          if (actual[i].n >= this.MAX_INTENTOS) {
            console.warn('[Informe PDF] se descarta ' + item.m + '/' + item.u + ': ' + actual[i].error);
            actual.splice(i, 1);
          }
        }
        this._guardarPendientes(actual);
        await new Promise(sigue => setTimeout(sigue, 150));   // la interfaz respira entre documentos
      }
    } finally { this._drenando = false; }
    return { archivados: archivados, pendientes: this._pendientes().length };
  },

  // -----------------------------------------------------------------------
  // ENVÍO POR WHATSAPP
  // -----------------------------------------------------------------------
  /**
   * Manda el informe por WhatsApp. Dos caminos, en este orden:
   *   1. El PDF como ADJUNTO (Web Share API): el documento llega al chat y se
   *      puede reenviar, abrir y guardar. Es lo que la gente espera.
   *   2. Si el dispositivo no sabe compartir archivos —el WebView de Android,
   *      dentro del APK, no implementa Web Share—, el ENLACE del documento
   *      archivado (Drive o Storage).
   * Si no hay ninguno de los dos se explica por qué, en vez de abrir WhatsApp
   * con un mensaje sin documento.
   */
  async enviarPorWhatsApp(modulo, uuid, titulo, boton) {
    const fin = this._ocupado(boton, 'Preparando…');
    try {
      if (!uuid) {
        if (typeof PWA_SKILLS !== 'undefined') {
          PWA_SKILLS.toast('Esta es la vista previa del formato: no hay registro que enviar.', 'info', 4000);
        }
        return false;
      }
      const doc = (this._visor && this._visor.uuid === String(uuid))
        ? this._visor : await this.prepararDocumento(modulo, uuid, titulo);
      if (doc.falta) throw new Error('No se encontró el registro: conéctate y vuelve a abrirlo.');

      const nombre = this.nombreArchivo(modulo, uuid);
      const encabezado = this._tituloModulo(modulo) + ' · ' + (doc.titulo || uuid);

      // 1 · Adjunto
      if (navigator.share && typeof File === 'function') {
        let archivo = null;
        try {
          const blob = await this.pdfBlob(doc);
          archivo = new File([blob], nombre, { type: 'application/pdf' });
        } catch (e) { archivo = null; }
        if (archivo && (!navigator.canShare || navigator.canShare({ files: [archivo] }))) {
          try {
            await navigator.share({ files: [archivo], title: encabezado, text: this._mensaje(encabezado) });
            return true;
          } catch (e) {
            // Selector cerrado por el usuario: no es un fallo que explicar
            if (e && (e.name === 'AbortError' || /abort|cancel/i.test(e.message || ''))) return false;
          }
        }
      }

      // 2 · Enlace del documento archivado
      let info = null;
      try { info = await DataService.reportInfo(modulo, uuid, { compartir: true }); } catch (e) { info = null; }
      if (!info || !info.existe || !info.enlace) {
        // Todavía no estaba archivado (se guardó sin señal): se archiva ahora
        const r = await this.archivar(modulo, uuid);
        if (r && r.status === 'OK') {
          this.olvidarPendiente(modulo, uuid);
          try { info = await DataService.reportInfo(modulo, uuid, { compartir: true }); } catch (e) { info = null; }
        }
      }
      if (info && info.enlace) {
        PWA_SKILLS.abrirWhatsApp('', this._mensaje(encabezado, info.enlace));
        return true;
      }

      throw new Error('Este dispositivo no puede adjuntar archivos y el informe aún no está en el servidor. ' +
                      'Conéctate, espera a que se sincronice y vuelve a intentarlo.');
    } catch (e) {
      if (typeof PWA_SKILLS !== 'undefined') PWA_SKILLS.toast(e.message, 'error', 6000);
      return false;
    } finally { fin(); }
  },

  /** Texto que acompaña al documento en WhatsApp. */
  _mensaje: function(encabezado, enlace) {
    const u = (typeof AppState !== 'undefined' && AppState.User) || {};
    const pila = ['📄 *' + encabezado + '*', ''];
    pila.push('Informe del sistema de Seguridad y Salud en el Trabajo' +
              (u.EmpresaNombre ? ' de *' + u.EmpresaNombre + '*' : '') + '.');
    if (enlace) {
      pila.push('', '🔗 Documento:', enlace, '',
                '⚠️ El enlace abre el documento a cualquiera que lo reciba: no lo reenvíes fuera de la empresa.');
    }
    if (u.Nombre) pila.push('', 'Enviado por ' + u.Nombre + (u.DNI ? ' (DNI ' + u.DNI + ')' : '') + '.');
    return pila.join('\n');
  },

  /** Registro de ejemplo para la vista previa del editor */
  registroEjemplo: function(modulo) {
    const campos = this.camposDe(modulo);
    const ej = {};
    campos.texto.forEach(c => {
      // Valores realistas: el admin necesita ver cómo queda el formato de verdad
      if (c.tipo === 'Date')       ej[c.clave] = new Date().toISOString().slice(0, 10);
      else if (c.valores && c.valores.length) ej[c.clave] = c.valores[0];
      else                          ej[c.clave] = 'Ejemplo de ' + c.etiqueta.toLowerCase();
    });
    campos.media.forEach(c => { ej[c.clave] = ''; });
    const hijoEj = {};
    campos.hijos.forEach(c => { hijoEj[c.clave] = 'Dato ' + c.etiqueta.toLowerCase(); });
    return { registro: ej, hijos: campos.hijos.length ? [hijoEj, hijoEj] : [] };
  }
};
</script>
