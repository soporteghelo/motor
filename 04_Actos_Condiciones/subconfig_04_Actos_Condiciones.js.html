<script>
/**
 * =========================================================================
 * SUBCONFIGURACIÓN MAESTRA DEL MÓDULO: "04_Actos_Condiciones"
 * =========================================================================
 * DESCRIPCIÓN: Registro y moderación de Actos y Condiciones Sub-Estándar.
 * Los reportes ingresan desde Google Forms (personal en campo) o desde
 * la app móvil. Los supervisores/admins los moderan aquí.
 *
 * FLUJO:
 *   1. Trabajador reporta vía Google Forms o App Móvil → Estado: Pendiente
 *   2. Supervisor revisa → Estado: En Revisión
 *   3. Supervisor aprueba/rechaza + registra acción correctiva → Cerrado/Aprobado
 * =========================================================================
 */

var SUBCONFIG_04_ACTOS_CONDICIONES = {

  Config_Modular: {
    NombreInterno:          "04_Actos_Condiciones",
    // Miniatura de la tarjeta móvil: columna con la imagen (vacío = solo icono) e icono por defecto
    Card_Image:             "Evidencia_Foto",
    Card_Icon:              "report_problem",
    Titulo:                 "Actos y Condiciones Sub-Estándar",
    DRIVE_FOLDER_NAME:      "04_Actos_Condiciones_DB",
    GOOGLE_DOC_TEMPLATE_ID: "",
    EMAIL_TEMPLATE_ID:      "",
    PARENT_TABLE:           "MAIN",
    CHILD_TABLE:            "",
    RELATIONAL_KEY:         "UUID",
    Relational_Fields:      [],
    // Matriz de permisos por rol. El SuperAdmin (proveedor) no figura:
    // PERMISOS.matriz() le concede todo por jerarquía.
    // alcance: todos | responsable | propios  →  qué registros ve el rol
    AdminRole:       { canCreate: true , canRead: true , canUpdate: true , canDelete: true , alcance: "todos" },
    SupervisorRole:  { canCreate: true , canRead: true , canUpdate: true , canDelete: false, alcance: "responsable" },
    TrabajadorRole:  { canCreate: true , canRead: true , canUpdate: false, canDelete: false, alcance: "propios" }
  },

  Variables: {
    "UUID":               { type: "Hidden_UUID", required: true,  isFilter: false },
    "Fecha_Reporte":      { type: "Date",        required: true,  isFilter: true,  label: "Fecha Reporte"    },
    "Fecha_Incidente":    { type: "Date",        required: true,  isFilter: true,  label: "Fecha Incidente"  },
    "Reportado_Por":      { type: "Text",        required: true,  isFilter: true,  label: "DNI Reportante"   },
    "Nombre_Reportante":  { type: "Text",        required: true,  isFilter: true,  label: "Nombre Reportante"},
    "Area": {
      type: "Enum", required: true, isFilter: true, label: "Área",
      acceptedValues: ["Mina", "Planta", "Talleres", "Logística", "Administración", "Almacén"],
      allowOtherValues: true
    },
    "Tipo_Reporte": {
      type: "Enum", required: true, isFilter: true, label: "Tipo",
      acceptedValues: ["Acto Subestándar", "Condición Subestándar"],
      allowOtherValues: false
    },
    "Categoria": {
      type: "Enum", required: true, isFilter: true, label: "Categoría",
      acceptedValues: ["EPP", "Herramientas", "Equipos", "Procedimientos", "Orden y Limpieza", "Ergonomía", "Ambiental"],
      allowOtherValues: true
    },
    "Nivel_Riesgo": {
      type: "Enum", required: true, isFilter: true, label: "Nivel Riesgo",
      acceptedValues: ["Bajo (Verde)", "Medio (Amarillo)", "Alto (Rojo)", "Crítico (Negro)"],
      allowOtherValues: false
    },
    "Descripcion":        { type: "Text",    required: true,  isFilter: false, label: "Descripción"      },
    "Evidencia_Foto":     { type: "Image",   required: false, isFilter: false, label: "Evidencia Foto"   },
    "Evidencia_Foto_ID":  { type: "Hidden",  required: false },
    "Evidencia_Foto_Path":{ type: "Hidden",  required: false },
    "Estado": {
      type: "Enum", required: true, isFilter: true, label: "Estado",
      acceptedValues: ["Pendiente", "En Revisión", "Aprobado", "Rechazado", "Cerrado"],
      defaultValue: "Pendiente"
    },
    "Moderado_Por":       { type: "Text",    required: false, isFilter: false, label: "Moderado Por (DNI)"  },
    "Fecha_Moderacion":   { type: "Date",    required: false, isFilter: false, label: "Fecha Moderación"    },
    "Accion_Correctiva":  { type: "Text",    required: false, isFilter: false, label: "Acción Correctiva"   },
    "Observaciones_Mod":  { type: "Text",    required: false, isFilter: false, label: "Observaciones"       },
    "Fuente": {
      type: "Enum", required: false, isFilter: true, label: "Fuente",
      acceptedValues: ["App Móvil", "Google Forms", "Manual"],
      defaultValue: "App Móvil"
    },
    "Fecha_Registro":     { type: "Hidden",  required: false }
  },

  Vistas: {
    Subtitulo: "Reportes sub-estándar y su cierre",
    Resumen: {
      etiquetaCrear: "Reportar", ordenPor: "Fecha_Reporte",
      columnas: [
        { campo: "Fecha_Reporte", etiqueta: "Fecha" },
        { campo: "Nombre_Reportante", sub: "Area", etiqueta: "Reportante / Área" },
        { campo: "Tipo_Reporte", etiqueta: "Tipo", tipo: "badge" },
        { campo: "Categoria", etiqueta: "Categoría" },
        { campo: "Nivel_Riesgo", etiqueta: "Riesgo", tipo: "badge" },
        { campo: "Estado", tipo: "badge" }
      ],
      vacio: { icono: "report_problem", titulo: "Sin reportes registrados",
               mensaje: "Reportar un acto o condición sub-estándar es la forma más barata de evitar un accidente.",
               accion: "Reportar" }
    },
    Edicion: {
      tituloNuevo: "Reportar Acto o Condición", tituloEditar: "Editar Reporte",
      secciones: [
        { titulo: "Quién reporta", icono: "person",
          campos: ["Fecha_Reporte", "Fecha_Incidente", "Reportado_Por", "Nombre_Reportante", "Area"] },
        { titulo: "Qué ocurrió", icono: "report_problem",
          campos: ["Tipo_Reporte", "Categoria", "Nivel_Riesgo", "Descripcion"] },
        { titulo: "Gestión", icono: "task_alt",
          campos: ["Estado", "Moderado_Por", "Fecha_Moderacion", "Accion_Correctiva", "Observaciones_Mod", "Fuente"] },
        { titulo: "Evidencia", icono: "photo_camera", campos: ["Evidencia_Foto"] }
      ]
    },
    Detalle: {
      titulo: "Categoria", subtitulo: ["Area", "Fecha_Reporte"],
      secciones: [
        { titulo: "Datos del reporte",
          campos: ["Fecha_Reporte", "Fecha_Incidente", "Nombre_Reportante", "Area", "Tipo_Reporte", "Categoria", "Nivel_Riesgo", "Fuente"] },
        { titulo: "Descripción", campos: ["Descripcion"] },
        { titulo: "Gestión", campos: ["Estado", "Moderado_Por", "Fecha_Moderacion", "Accion_Correctiva", "Observaciones_Mod"] }
      ]
    },
    Badges: {
      Nivel_Riesgo: { "Bajo (Verde)": { tono: "ok", icono: "check_circle" },
                      "Medio (Amarillo)": { tono: "warn", icono: "warning" },
                      "Alto (Rojo)": { tono: "bad", icono: "priority_high" },
                      "Crítico (Negro)": { tono: "crit", icono: "dangerous" } },
      Estado: { "Pendiente":   { tono: "warn", icono: "schedule" },
                "En Revisión": { tono: "info", icono: "search" },
                "Aprobado":    { tono: "ok",   icono: "check_circle" },
                "Rechazado":   { tono: "bad",  icono: "cancel" },
                "Cerrado":     { tono: "mute", icono: "task_alt" } },
      Tipo_Reporte: { "Acto Subestándar":      { tono: "info", icono: "person_alert" },
                      "Condición Subestándar": { tono: "mute", icono: "foundation" } }
    }
  },
};

console.log("✅ Subconfig 04_Actos_Condiciones cargado.");

window.MOTOR_HOOKS = window.MOTOR_HOOKS || {};

MOTOR_HOOKS["04_Actos_Condiciones"] = {
  resumen: function () {
    MOTOR_RENDER.kpis("04_Actos_Condiciones", [
      { tono: "mute", etiqueta: "Total",       cond: {} },
      { tono: "warn", etiqueta: "Pendientes",  cond: { Estado: { eq: "Pendiente" } } },
      { tono: "info", etiqueta: "En revisión", cond: { Estado: { eq: "En Revisión" } } },
      // Los valores van completos, como los declara acceptedValues: la
      // condicion se evalua en Postgres y alli no hay expresiones regulares.
      { tono: "bad",  etiqueta: "Riesgo alto abierto",
        cond: { Nivel_Riesgo: { in: ["Alto (Rojo)", "Crítico (Negro)"] }, Estado: { neq: "Cerrado" } } }
    ]);
  },
  /** Quien reporta queda identificado sin tener que escribirlo */
  edicion: function (ctx) {
    if (!ctx.nuevo) return;
    const u = AppState.User || {};
    const nombre = ctx.root.querySelector("#m04-actos-condiciones-f-Nombre_Reportante");
    if (nombre && !nombre.value) nombre.value = u.Nombre || "";
    const dni = ctx.root.querySelector("#m04-actos-condiciones-f-Reportado_Por");
    if (dni && !dni.value) dni.value = u.DNI || "";
    const fuente = ctx.root.querySelector("#m04-actos-condiciones-f-Fuente");
    if (fuente && !fuente.value) fuente.value = "App Móvil";
    const estado = ctx.root.querySelector("#m04-actos-condiciones-f-Estado");
    if (estado && !estado.value) estado.value = "Pendiente";
  }
};
</script>
