}
function actStatusBadge(estado) {
  const m = { 'Pendiente':'bg-amber-100 text-amber-800', 'En Revisión':'bg-blue-100 text-blue-800', 'Aprobado':'bg-emerald-100 text-emerald-800', 'Rechazado':'bg-red-100 text-red-800', 'Cerrado':'bg-slate-100 text-slate-600' };
  return `<span class="inline-flex px-2 py-0.5 rounded-full text-[9px] font-black ${m[estado]||'bg-surface-variant text-secondary'}">${estado||'—'}</span>`;
}
function actTipoBadge(tipo) {
  if (tipo==='Acto Subestándar')     return `<span class="inline-flex px-2 py-0.5 rounded-full text-[9px] font-bold bg-orange-100 text-orange-800 whitespace-nowrap">Acto</span>`;
  if (tipo==='Condición Subestándar') return `<span class="inline-flex px-2 py-0.5 rounded-full text-[9px] font-bold bg-rose-100 text-rose-800 whitespace-nowrap">Condición</span>`;
  return `<span class="inline-flex px-2 py-0.5 rounded-full text-[9px] font-bold bg-surface-variant text-secondary">${tipo||'—'}</span>`;
}
function actFuenteBadge(fuente) {
  const m = { 'Google Forms':'bg-indigo-100 text-indigo-700', 'App Móvil':'bg-teal-100 text-teal-700', 'Manual':'bg-surface-variant text-secondary' };
  const ico = { 'Google Forms':'wysiwyg', 'App Móvil':'smartphone', 'Manual':'edit_note' };
  return `<span class="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded-full text-[9px] font-bold ${m[fuente]||'bg-surface-variant text-secondary'}"><span class="material-symbols-outlined text-[10px]">${ico[fuente]||'edit'}</span>${fuente||'—'}</span>`;
}

// ── Render table ───────────────────────────────────────────────────────────
function renderActosTable(data) {
  const tbody = document.getElementById('actos-table-body');
  const empty = document.getElementById('actos-empty');
  if (!tbody) return;

  const total      = data.length;
  const pendientes = data.filter(r => r.Estado === 'Pendiente').length;
  const revision   = data.filter(r => r.Estado === 'En Revisión').length;
  const criticos   = data.filter(r => r.Nivel_Riesgo === 'Crítico (Negro)').length;
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('act-kpi-total', total);
  set('act-kpi-pendientes', pendientes);
  set('act-kpi-revision', revision);
  set('act-kpi-criticos', criticos);

  if (empty) empty.style.display = (total === 0) ? 'block' : 'none';
  if (total === 0) { tbody.innerHTML = ''; return; }

  tbody.innerHTML = data.map(r => `
    <tr class="hover:bg-surface-container-low/50 transition-colors cursor-pointer"
        data-filter-value="${[r.UUID,r.Nombre_Reportante,r.Area,r.Tipo_Reporte,r.Categoria,r.Nivel_Riesgo,r.Estado,r.Fuente,r.Descripcion].join(' ').toLowerCase()}"
        onclick="changeInternalView('04_Actos_Condiciones','Detalle','${r.UUID}')">
      <td class="px-3 py-2">
        <div class="font-bold text-[11px] text-primary">${r.UUID}</div>
        <div class="text-[10px] text-secondary">${r.Fecha_Incidente||r.Fecha_Reporte}</div>
      </td>
      <td class="px-3 py-2">
        <div class="text-[11px] font-semibold text-on-surface max-w-[130px] truncate">${r.Nombre_Reportante||'—'}</div>
        <div class="text-[10px] text-secondary">${r.Area||'—'}</div>
      </td>
      <td class="px-3 py-2">${actTipoBadge(r.Tipo_Reporte)}</td>
      <td class="px-3 py-2 text-[10px] text-on-surface-variant">${r.Categoria||'—'}</td>
      <td class="px-3 py-2">${actRiskBadge(r.Nivel_Riesgo)}</td>
      <td class="px-3 py-2">${actStatusBadge(r.Estado)}</td>
      <td class="px-3 py-2">${actFuenteBadge(r.Fuente)}</td>
      <td class="px-3 py-2 text-center" onclick="event.stopPropagation()">
        <div class="flex items-center justify-center gap-1">
          <button onclick="changeInternalView('04_Actos_Condiciones','Detalle','${r.UUID}')" title="Ver detalle"
            class="w-7 h-7 flex items-center justify-center rounded-lg text-primary hover:bg-primary/10 transition-colors">
            <span class="material-symbols-outlined text-[15px]">visibility</span>
          </button>
          <button onclick="changeInternalView('04_Actos_Condiciones','Edicion','${r.UUID}')" title="Editar / Moderar"
            class="w-7 h-7 flex items-center justify-center rounded-lg text-secondary hover:bg-surface-variant transition-colors">
            <span class="material-symbols-outlined text-[15px]">edit</span>
          </button>
        </div>
      </td>
    </tr>`).join('');

  if (typeof PWA_SKILLS !== 'undefined') {
    if (typeof PWA_SKILLS.initSortableTable === 'function') PWA_SKILLS.initSortableTable('actos-table-body');
    if (typeof PWA_SKILLS.updateResultCount  === 'function') PWA_SKILLS.updateResultCount('actos-table-body', 'act-result-count');
  }
  const countEl = document.getElementById('act-result-count');
  if (countEl) countEl.classList.remove('hidden');
}

// ── Filtros rápidos por KPI ────────────────────────────────────────────────
function actFilterByEstado(estado) {
  renderActosTable((window._actData||window._actDemoData).filter(r => r.Estado === estado));
}
function actFilterByRiesgo(nivel) {
  renderActosTable((window._actData||window._actDemoData).filter(r => r.Nivel_Riesgo === nivel));
}

// ── Carga principal ────────────────────────────────────────────────────────
function loadResumen_04_Actos_Condiciones() {
  window._actData = window._actData || window._actDemoData;
  renderActosTable(window._actData);

  if (typeof refreshDrawerStats === 'function') setTimeout(refreshDrawerStats, 80);

  if (!window._actExportListener) {
    window._actExportListener = true;
    document.addEventListener('click', function(e) {
      const wrap = document.getElementById('act-export-wrap');
      if (wrap && !wrap.contains(e.target)) {
        const menu = document.getElementById('act-export-menu');
        if (menu) menu.classList.add('hidden');
      }
    });
  }

  // Intentar cargar desde el proveedor activo (Sheets o Supabase)
  DataService.read('04_Actos_Condiciones')
    .then(function(parsed) {
      if (parsed.status === 'OK' && Array.isArray(parsed.payload) && parsed.payload.length > 0) {
        // Alcance por rol antes de pintar (la restricción real la aplica RLS)
        window._actData = (typeof PERMISOS !== 'undefined')
          ? PERMISOS.filtrarDatos('04_Actos_Condiciones', parsed.payload) : parsed.payload;
        renderActosTable(window._actData);
        localStorage.setItem('refdata_04_Actos_Condiciones', JSON.stringify(window._actData));
      }
    })
    .catch(function() { /* usa datos demo */ });
}
</script>
