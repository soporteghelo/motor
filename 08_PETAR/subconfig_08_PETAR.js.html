<script>
/**
 * =========================================================================
 * SUBCONFIG — 08_PETAR
 * =========================================================================
 * Permiso Escrito de Trabajo de Alto Riesgo.
 *
 * POR QUÉ ESTE MÓDULO
 * Es el documento que autoriza —o detiene— un trabajo peligroso hoy, en el
 * turno concreto. A diferencia del IPERC, que evalúa el riesgo en general,
 * el PETAR verifica que las condiciones estén dadas AHORA: equipo probado,
 * área señalizada, personal capacitado, rescate disponible.
 *
 * TRES REGLAS QUE HACEN QUE SIRVA
 * 1. Vigencia horaria: un permiso vale para una ventana de tiempo, no para
 *    siempre. Fuera de ella el trabajo no está autorizado.
 * 2. Verificación completa: no se aprueba con ítems en "No". El sistema lo
 *    impide, que es justo lo que un papel no puede hacer.
 * 3. Trazabilidad con el IPERC: el permiso apunta a la matriz que evaluó
 *    esos peligros, para que los controles no se inventen en campo.
 * =========================================================================
 */
