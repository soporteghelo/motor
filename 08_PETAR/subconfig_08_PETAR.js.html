<script>
/**
 * =========================================================================
 * SUBCONFIG — 08_PETAR
 * =========================================================================
 * Permiso Escrito de Trabajo de Alto Riesgo.
 *
 * POR QUÉ ESTE MÓDULO
 * Es el documento que autoriza —o detiene— un trabajo peligroso hoy, en el
 * turno concreto. A diferencia del IPERC, que evalúa el riesgo en general,
 * el PETAR verifica que las condiciones estén dadas AHORA: equipo probado,
 * área señalizada, personal capacitado, rescate disponible.
 *
 * TRES REGLAS QUE HACEN QUE SIRVA
 * 1. Vigencia horaria: un permiso vale para una ventana de tiempo, no para
 *    siempre. Fuera de ella el trabajo no está autorizado.
 * 2. Verificación completa: no se aprueba con ítems en "No". El sistema lo
 *    impide, que es justo lo que un papel no puede hacer.
 * 3. Trazabilidad con el IPERC: el permiso apunta a la matriz que evaluó
 *    esos peligros, para que los controles no se inventen en campo.
 * =========================================================================
 */

var SUBCONFIG_08_PETAR = {

  Config_Modular: {
    NombreInterno:          "08_PETAR",
    // Miniatura de la tarjeta móvil: columna con la imagen (vacío = solo icono) e icono por defecto
    Card_Image:             "",
    Card_Icon:              "assignment_turned_in",
    Titulo:                 "Permisos de Alto Riesgo",
    DRIVE_FOLDER_NAME:      "08_PETAR_DB",
    GOOGLE_DOC_TEMPLATE_ID: "",              // se vincula desde Configuración → PDF
    EMAIL_TEMPLATE_ID:      "",
    PARENT_TABLE:           "MAIN",
    CHILD_TABLE:            "VERIFICACIONES",
    RELATIONAL_KEY:         "PARENT_UUID",

    // Cada fila es un control que debe verificarse ANTES de iniciar
    Relational_Fields: [
      { name: "Item",        label: "Control a verificar", type: "text", fullWidth: true, colSpan: "md:col-span-7" },
      { name: "Cumple",      label: "¿Cumple?",            type: "select", colSpan: "md:col-span-2",
        options: ["Sí", "No", "N/A"] },
      { name: "Observacion", label: "Observación",         type: "text", fullWidth: true, colSpan: "md:col-span-2" }
    ],

    // Matriz de permisos por rol. El SuperAdmin (proveedor) no figura:
    // PERMISOS.matriz() le concede todo por jerarquía.
    // alcance: todos | responsable | propios  →  qué registros ve el rol
    AdminRole:       { canCreate: true , canRead: true , canUpdate: true , canDelete: true , alcance: "todos" },
    SupervisorRole:  { canCreate: true , canRead: true , canUpdate: true , canDelete: false, alcance: "responsable" },
    TrabajadorRole:  { canCreate: true , canRead: true , canUpdate: false, canDelete: false, alcance: "propios" }
  },

  Variables: {
    "UUID":               { type: "Hidden_UUID", required: true, isFilter: false },

    // ── Qué trabajo se autoriza ──
    "Tipo_Trabajo":       { type: "Enum", required: true, isFilter: true, label: "Tipo de trabajo",
                            acceptedValues: [
                              "Trabajo en altura",
                              "Espacio confinado",
                              "Trabajo en caliente",
                              "Izaje crítico",
                              "Excavación / zanja",
                              "Trabajo eléctrico",
                              "Bloqueo y etiquetado (LOTO)",
                              "Manipulación de sustancias químicas"
                            ], allowOtherValues: false },
    "Descripcion":        { type: "Text", required: true, isFilter: false, label: "Descripción del trabajo" },
    "Area":               { type: "Enum", required: true, isFilter: true, label: "Área",
                            acceptedValues: [
                              "Operaciones", "Mantenimiento", "Almacén", "Logística",
                              "Producción", "Administración", "Obra / Campo", "Laboratorio"
                            ], allowOtherValues: true },
    "Lugar_Especifico":   { type: "Text", required: false, isFilter: false, label: "Lugar específico" },

    // ── Ventana de vigencia: el permiso NO vale fuera de ella ──
    "Fecha":              { type: "Date", required: true,  isFilter: true,  label: "Fecha" },
    "Hora_Inicio":        { type: "Text", required: true,  isFilter: false, label: "Hora de inicio" },
    "Hora_Fin":           { type: "Text", required: true,  isFilter: false, label: "Hora de término" },

    // ── Quiénes ──
    "Empresa":            { type: "Text", required: false, isFilter: true,  label: "Empresa ejecutora" },
    "Ejecutante_DNI":     { type: "REF",  required: false, isFilter: false, label: "Responsable de la ejecución",
                            relationalDataOrigin: "01_Usuarios" },
    "Num_Trabajadores":   { type: "Text", required: false, isFilter: false, label: "N.º de trabajadores",
                         control: "number", min: 1, max: 999, step: 1 },
    "Supervisor_DNI":     { type: "REF",  required: false, isFilter: false, label: "Supervisor a cargo",
                            relationalDataOrigin: "01_Usuarios",
                            slice: { column: "Rol", value: "Supervisor" } },

    // ── Enlace con la matriz de riesgos ──
    "IPERC_Referencia":   { type: "REF",  required: false, isFilter: false, label: "IPERC de referencia",
                            relationalDataOrigin: "07_IPERC" },

    // ── Autorización y cierre ──
    "Estado":             { type: "Enum", required: true, isFilter: true, label: "Estado",
                            acceptedValues: ["Solicitado", "Aprobado", "En ejecución", "Cerrado", "Rechazado", "Anulado"],
                            allowOtherValues: false },
    "Aprobado_Por":       { type: "REF",  required: false, isFilter: false, label: "Aprobado por",
                            relationalDataOrigin: "01_Usuarios",
                            slice: { column: "Rol", value: "Supervisor" } },
    "Fecha_Aprobacion":   { type: "Date", required: false, isFilter: false, label: "Fecha de aprobación" },
    "Hora_Cierre":        { type: "Text", required: false, isFilter: false, label: "Hora de cierre real" },
    "Observaciones":      { type: "Text", required: false, isFilter: false, label: "Observaciones de cierre" },

    // Se guarda calculado: permite filtrar sin recorrer la tabla hija
    "Controles_No_Cumple":{ type: "Text", required: false, isFilter: false, label: "Controles incumplidos" },
    "Total_Controles":    { type: "Text", required: false, isFilter: false, label: "Controles verificados" },

    // ── Firmas (Skill 11: cada archivo lleva su _ID y _Path) ──
    "Firma_Solicitante":      { type: "Signature", required: false, isFilter: false, label: "Firma del solicitante" },
    "Firma_Solicitante_ID":   { type: "Hidden", required: false },
    "Firma_Solicitante_Path": { type: "Hidden", required: false },

    "Firma_Aprobador":        { type: "Signature", required: false, isFilter: false, label: "Firma del aprobador" },
    "Firma_Aprobador_ID":     { type: "Hidden", required: false },
    "Firma_Aprobador_Path":   { type: "Hidden", required: false },

    "Registrado_Por":     { type: "Text",   required: false, isFilter: false, label: "Registrado por" },
    "Fecha_Registro":     { type: "Hidden", required: false }
  },

  Vistas: {
    Subtitulo: "Permisos de trabajo de alto riesgo",
    Resumen: {
      etiquetaCrear: "Solicitar", ordenPor: "Fecha",
      columnas: [
        { campo: "Tipo_Trabajo", sub: "Descripcion", etiqueta: "Tipo de trabajo" },
        { campo: "Fecha", etiqueta: "Fecha", render: "ventana" },
        { campo: "Estado", etiqueta: "Vigencia", render: "vigencia" },
        { campo: "Estado", tipo: "badge" },
        { campo: "Area", etiqueta: "Área" }
      ],
      vacio: { icono: "assignment_turned_in", titulo: "Sin permisos registrados",
               mensaje: "Ningún trabajo de alto riesgo debería empezar sin su PETAR aprobado.",
               accion: "Solicitar permiso" }
    },
    Edicion: {
      tituloNuevo: "Solicitar PETAR", tituloEditar: "Editar PETAR",
      secciones: [
        { titulo: "Trabajo solicitado", icono: "assignment_turned_in",
          campos: ["Tipo_Trabajo", "Descripcion", "Area", "Lugar_Especifico"] },
        { titulo: "Ventana autorizada", icono: "schedule",
          campos: ["Fecha", "Hora_Inicio", "Hora_Fin"] },
        { titulo: "Quiénes intervienen", icono: "groups",
          campos: ["Empresa", "Ejecutante_DNI", "Num_Trabajadores", "Supervisor_DNI", "IPERC_Referencia"] },
        { titulo: "Aprobación y cierre", icono: "verified",
          campos: ["Estado", "Aprobado_Por", "Fecha_Aprobacion", "Hora_Cierre", "Observaciones"] },
        { titulo: "Firmas", icono: "draw",
          campos: ["Firma_Solicitante", "Firma_Aprobador"] }
      ]
    },
    Detalle: {
      titulo: "Tipo_Trabajo", subtitulo: ["Area", "Fecha"],
      secciones: [
        { titulo: "Trabajo autorizado",
          campos: ["Tipo_Trabajo", "Area", "Lugar_Especifico", "Fecha", "Hora_Inicio", "Hora_Fin", "Estado"] },
        { titulo: "Descripción", campos: ["Descripcion"] },
        { titulo: "Quiénes intervienen",
          campos: ["Empresa", "Ejecutante_DNI", "Num_Trabajadores", "Supervisor_DNI", "IPERC_Referencia"] },
        { titulo: "Aprobación y cierre",
          campos: ["Aprobado_Por", "Fecha_Aprobacion", "Hora_Cierre", "Total_Controles", "Controles_No_Cumple", "Observaciones"] }
      ]
    },
    Hijos: { titulo: "Verificaciones previas", icono: "checklist",
             vacio: "Carga los controles estándar del tipo de trabajo o agrégalos uno a uno.",
             vacioDetalle: "Este permiso no registró verificaciones." },
    Badges: {
      Estado: { "Solicitado":   { tono: "warn", icono: "pending" },
                "Aprobado":     { tono: "ok",   icono: "verified" },
                "En ejecución": { tono: "info", icono: "play_circle" },
                "Cerrado":      { tono: "mute", icono: "task_alt" },
                "Rechazado":    { tono: "bad",  icono: "cancel" },
                "Anulado":      { tono: "mute", icono: "block" } }
    }
  },

  /**
   * Controles estándar por tipo de trabajo.
   * Al elegir el tipo, el formulario carga esta lista: el ejecutante no parte
   * de una hoja en blanco ni se le olvida un control crítico. Editar esta
   * sección adapta el sistema a los procedimientos de cada empresa sin tocar
   * ninguna vista.
   */
  Checklists: {
    "Trabajo en altura": [
      "Arnés de cuerpo completo inspeccionado y con certificación vigente",
      "Punto de anclaje verificado (resistencia mínima 2268 kg)",
      "Línea de vida instalada y probada",
      "Escaleras/andamios inspeccionados y asegurados",
      "Área inferior delimitada y señalizada",
      "Personal con capacitación vigente en trabajo en altura",
      "Condiciones climáticas aptas (viento, lluvia, visibilidad)"
    ],
    "Espacio confinado": [
      "Medición de atmósfera: oxígeno entre 19.5% y 23.5%",
      "Medición de gases inflamables y tóxicos dentro de límites",
      "Ventilación forzada instalada y operativa",
      "Vigía permanente asignado en el exterior",
      "Equipo de rescate disponible en el punto",
      "Bloqueo y etiquetado de energías aplicado",
      "Comunicación permanente verificada"
    ],
    "Trabajo en caliente": [
      "Extintor operativo a menos de 3 metros",
      "Material combustible retirado en radio de 11 metros",
      "Mantas ignífugas colocadas donde corresponda",
      "Vigía de fuego asignado durante y 30 min después",
      "Equipo de soldadura/corte inspeccionado",
      "Ventilación adecuada del área",
      "Detección de incendios notificada o inhibida con control"
    ],
    "Izaje crítico": [
      "Plan de izaje elaborado y aprobado",
      "Grúa con certificación e inspección vigente",
      "Operador y rigger certificados",
      "Accesorios de izaje inspeccionados (eslingas, grilletes)",
      "Carga y radio dentro de la tabla de capacidad",
      "Área de maniobra delimitada y sin personal bajo carga",
      "Condiciones de viento dentro del límite del fabricante"
    ],
    "Excavación / zanja": [
      "Verificación de servicios enterrados (energía, agua, gas)",
      "Talud o entibado según profundidad y tipo de suelo",
      "Acceso y salida cada 7.5 metros como máximo",
      "Material excavado a más de 60 cm del borde",
      "Perímetro señalizado y con barreras",
      "Inspección diaria del talud antes de ingresar"
    ],
    "Trabajo eléctrico": [
      "Desenergización verificada con instrumento",
      "Bloqueo y etiquetado aplicado por cada ejecutante",
      "Prueba de ausencia de tensión realizada",
      "Puesta a tierra temporal instalada",
      "EPP dieléctrico según nivel de tensión",
      "Distancias mínimas de seguridad respetadas",
      "Personal calificado y autorizado"
    ],
    "Bloqueo y etiquetado (LOTO)": [
      "Todas las fuentes de energía identificadas",
      "Dispositivos de bloqueo instalados en cada fuente",
      "Energía residual liberada y verificada",
      "Tarjetas con nombre y fecha colocadas",
      "Prueba de arranque fallido realizada",
      "Candado personal de cada ejecutante instalado"
    ],
    "Manipulación de sustancias químicas": [
      "Hoja de seguridad (MSDS) disponible y revisada",
      "EPP específico según la sustancia",
      "Ventilación o extracción localizada operativa",
      "Kit antiderrame disponible en el punto",
      "Ducha de emergencia y lavaojos operativos",
      "Envases rotulados correctamente",
      "Incompatibilidades químicas verificadas"
    ]
  }
};

window.MOTOR_HOOKS = window.MOTOR_HOOKS || {};

MOTOR_HOOKS["08_PETAR"] = {
  /** La pregunta operativa no es el estado guardado sino "¿puedo trabajar ahora?" */
  vigencia: function (r) {
    if (r.Estado === "Cerrado") return { tono: "mute", texto: "Cerrado" };
    if (r.Estado === "Rechazado" || r.Estado === "Anulado") return { tono: "mute", texto: r.Estado };
    if (!r.Fecha || !r.Hora_Inicio || !r.Hora_Fin) return { tono: "mute", texto: "Sin horario" };
    const ini = new Date(r.Fecha + "T" + r.Hora_Inicio), fin = new Date(r.Fecha + "T" + r.Hora_Fin);
    if (isNaN(ini) || isNaN(fin)) return { tono: "mute", texto: "Sin horario" };
    const ahora = new Date();
    if (ahora < ini) return { tono: "info", texto: "Programado" };
    if (ahora > fin) return { tono: "bad",  texto: "Vencido sin cerrar" };
    const restan = Math.round((fin - ahora) / 60000);
    return { tono: "ok", texto: restan > 60 ? "Vigente · " + Math.floor(restan / 60) + " h" : "Vigente · " + restan + " min" };
  },
  columnas: {
    ventana: function (r) {
      return '<div class="text-[11px] font-semibold text-on-surface tabular-nums">' + esc(r.Fecha || "—") + "</div>" +
             '<div class="text-[10px] text-secondary tabular-nums">' +
             esc((r.Hora_Inicio || "--") + " a " + (r.Hora_Fin || "--")) + "</div>";
    },
    vigencia: function (r) {
      const v = this.vigencia(r);
      return '<span class="mr-badge" style="background:var(--st-' + v.tono + "-bg);color:var(--st-" + v.tono +
             "-fg);border-color:var(--st-" + v.tono + '-bd)">' + esc(v.texto) + "</span>";
    }
  },
  // Estados en los que un permiso sigue "vivo": los que vigencia() no descarta
  // de entrada. Cerrado, Rechazado y Anulado ya no vencen.
  ESTADOS_VIVOS: ["Solicitado", "Aprobado", "En ejecución"],

  resumen: function () {
    const vivos = this.ESTADOS_VIVOS;
    MOTOR_RENDER.kpis("08_PETAR", [
      // La ventana del permiso es fecha + hora, asi que se compara con la hora
      // de Peru: un permiso de hoy que ya acabo no esta vigente.
      { tono: "ok", etiqueta: "Vigentes ahora",
        cond: { Estado: { in: vivos }, Fecha: { eq: "@hoy" },
                Hora_Inicio: { lte: "@hora" }, Hora_Fin: { gte: "@hora" } } },
      { tono: "warn", etiqueta: "Por aprobar", cond: { Estado: { eq: "Solicitado" } } },
      // Vencido = de un dia anterior, O de hoy con la hora de fin ya pasada.
      // Esas dos alternativas son el motivo de que el lenguaje admita "$o":
      // con una sola condicion habria que elegir cual de los dos casos contar.
      { tono: "bad", etiqueta: "Vencidos sin cerrar",
        cond: { Estado: { in: vivos },
                $o: [ { Fecha: { lt: "@hoy" } },
                      { Fecha: { eq: "@hoy" }, Hora_Fin: { lt: "@hora" } } ] } },
      { tono: "mute", etiqueta: "Cerrados", cond: { Estado: { eq: "Cerrado" } } }
    ]);
  },
  /** Los controles estándar del tipo de trabajo se cargan de un toque */
  edicion: function (ctx) {
    const raiz = ctx.root;
    const tipo = raiz.querySelector("#m08-petar-f-Tipo_Trabajo");
    if (tipo && !raiz.querySelector("#ptr-cargar-checklist")) {
      const b = document.createElement("button");
      b.type = "button";
      b.id = "ptr-cargar-checklist";
      b.className = "mt-2 h-9 px-3 rounded-lg border border-outline-variant text-[11px] font-bold text-primary " +
                    "hover:bg-primary/5 transition-all inline-flex items-center gap-1.5";
      b.innerHTML = '<span class="material-symbols-outlined text-[15px]" aria-hidden="true">checklist</span>' +
                    "Cargar controles estándar";
      b.addEventListener("click", () => this.cargarChecklist(raiz));
      tipo.parentNode.appendChild(b);
    }
    if (ctx.nuevo) {
      const e = raiz.querySelector("#m08-petar-f-Estado");
      if (e && !e.value) e.value = "Solicitado";
    }
  },
  cargarChecklist: function (raiz) {
    const tipo = raiz.querySelector("#m08-petar-f-Tipo_Trabajo");
    if (!tipo || !tipo.value) { PWA_SKILLS.toast("Elige primero el tipo de trabajo.", "warning", 3000); return; }
    const items = (SUBCONFIG_08_PETAR.Checklists || {})[tipo.value] || [];
    if (!items.length) { PWA_SKILLS.toast("No hay controles estándar para este tipo de trabajo.", "info", 3000); return; }
    const cont = raiz.querySelector("#m08-petar-hijos");
    const yaHay = cont ? cont.querySelectorAll('[id^="row-"]').length : 0;
    if (yaHay && !confirm("Ya hay " + yaHay + ' control(es). ¿Reemplazarlos por los estándar de "' + tipo.value + '"?')) return;
    if (cont) cont.innerHTML = "";
    items.forEach(t => MOTOR_RENDER.agregarFila("08_PETAR", { Item: t, Cumple: "" }));
    MOTOR_RENDER.contarHijos("08_PETAR");
    PWA_SKILLS.toast(items.length + ' controles cargados para "' + tipo.value + '".', "success", 3000);
  },
  /** Segregación: nadie aprueba el permiso que él mismo solicitó (RLS lo repite) */
  antesDeGuardar: function (ctx) {
    const d = ctx.datos;
    d.Total_Controles = String(ctx.hijos.length);
    d.Controles_No_Cumple = String(ctx.hijos.filter(h => String(h.Cumple || "").toLowerCase() === "no").length);
    if (d.Estado === "Aprobado" && d.Aprobado_Por && d.Aprobado_Por === (AppState.User || {}).DNI &&
        !confirm("Vas a aprobar un permiso que tú mismo solicitaste. El servidor lo rechazará. ¿Continuar igual?")) {
      return false;
    }
    if (parseInt(d.Controles_No_Cumple, 10) > 0 && d.Estado === "Aprobado" &&
        !confirm("Hay " + d.Controles_No_Cumple + " control(es) que no cumplen. ¿Aprobar de todas formas?")) {
      return false;
    }
    return true;
  }
};
</script>
