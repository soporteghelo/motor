<!-- =========================================================================
     VISTA: DETALLE — MÓDULO 08_PETAR
     ========================================================================= -->
<div id="module-08_petar-detalle" class="module-view" style="display:none;">

  <header class="flex justify-between items-start w-full mb-6 gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <button onclick="changeInternalView('08_PETAR','Resumen')" aria-label="Volver al listado"
        class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white transition-colors text-secondary border border-outline-variant shrink-0">
        <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
      </button>
      <div class="min-w-0">
        <h1 id="ptr-det-titulo" class="text-lg font-black text-on-surface tracking-tight">Cargando…</h1>
        <div class="flex items-center gap-2 mt-1 flex-wrap" id="ptr-det-badges"></div>
      </div>
    </div>
    <div class="flex flex-col gap-1.5 items-end shrink-0">
      <button onclick="changeInternalView('08_PETAR','Edicion', window._ptrDetalleUUID)"
        class="h-7 px-3 rounded-lg bg-primary text-on-primary text-[9px] font-bold shadow-sm hover:opacity-90 transition-all flex items-center justify-center gap-1.5 whitespace-nowrap">
        <span class="material-symbols-outlined text-[14px]" aria-hidden="true">edit</span>Editar
      </button>
      <button onclick="PDF_TEMPLATE.exportarRegistro('08_PETAR', window._ptrDetalleUUID, 'PETAR ' + window._ptrDetalleUUID)"
        class="h-7 px-3 rounded-lg border border-outline-variant bg-white text-[9px] font-bold text-on-surface hover:bg-slate-50 transition-all flex items-center justify-center gap-1.5 whitespace-nowrap">
        <span class="material-symbols-outlined text-[14px]" aria-hidden="true">picture_as_pdf</span>PDF
      </button>
    </div>
  </header>

  <div class="max-w-4xl mx-auto space-y-5">

    <!-- ¿Autoriza el trabajo ahora mismo? Es lo primero que se consulta -->
    <div id="ptr-det-vigencia" class="rounded-2xl border p-4"></div>

    <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-sm">
      <h2 class="text-[11px] font-black text-secondary uppercase tracking-widest mb-4 border-b border-outline-variant pb-2">Trabajo autorizado</h2>
      <div class="grid grid-cols-2 gap-x-4 gap-y-4" id="ptr-det-datos"></div>
      <div class="mt-4 pt-4 border-t border-outline-variant/50">
        <p class="text-[10px] font-black text-secondary uppercase tracking-widest mb-1.5">Descripción</p>
        <p class="text-[13px] text-on-surface leading-relaxed" id="ptr-det-desc">—</p>
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-sm">
      <div class="flex items-center justify-between mb-4 border-b border-outline-variant pb-2 gap-2">
        <h2 class="text-[11px] font-black text-secondary uppercase tracking-widest">Verificación previa</h2>
        <span class="text-[10px] font-bold text-on-surface-variant" id="ptr-det-conteo"></span>
      </div>
      <div id="ptr-det-controles"></div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-sm">
        <h2 class="text-[11px] font-black text-secondary uppercase tracking-widest mb-4 border-b border-outline-variant pb-2">Firma del solicitante</h2>
        <div id="ptr-det-firma-sol" class="min-h-[6rem] bg-surface-container-low rounded-xl border border-dashed border-outline-variant flex items-center justify-center overflow-hidden"></div>
      </div>
      <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-sm">
        <h2 class="text-[11px] font-black text-secondary uppercase tracking-widest mb-4 border-b border-outline-variant pb-2">Firma del aprobador</h2>
        <div id="ptr-det-firma-apr" class="min-h-[6rem] bg-surface-container-low rounded-xl border border-dashed border-outline-variant flex items-center justify-center overflow-hidden"></div>
      </div>
    </div>

  </div>
</div>

<script>
function ptrDetCampo(etiqueta, valor, ancho) {
  return '<div class="' + (ancho || '') + '">' +
    '<p class="text-[10px] font-black text-secondary uppercase tracking-widest mb-1">' + etiqueta + '</p>' +
    '<p class="text-[13px] font-semibold text-on-surface">' + (valor || '—') + '</p></div>';
}

async function loadDetail_08_PETAR(uuid) {
  window._ptrDetalleUUID = uuid;
  const tit = document.querySelector('#main-container #ptr-det-titulo');
  if (tit) tit.textContent = 'Cargando…';

  let datos = window._ptrData || [];
  if (!datos.length) {
    try { datos = JSON.parse(localStorage.getItem('refdata_08_PETAR')) || []; } catch (e) {}
  }
  let r = datos.find(x => String(x.UUID) === String(uuid));

  if (!r) {
    try {
      const res = await DataService.read('08_PETAR');
      if (res && res.status === 'OK' && Array.isArray(res.payload)) {
        window._ptrData = res.payload;
        r = res.payload.find(x => String(x.UUID) === String(uuid));
      }
    } catch (e) { /* se resuelve abajo */ }
  }

  if (!r) {
    if (tit) tit.textContent = 'Permiso no encontrado';
    PWA_SKILLS.toast('No se pudo cargar el permiso ' + uuid + '.', 'error', 4000);
    return;
  }

  if (tit) tit.textContent = (r.Tipo_Trabajo || 'Permiso') + ' · ' + (r.UUID || '');

  const badges = document.querySelector('#main-container #ptr-det-badges');
  if (badges) {
    badges.innerHTML =
      (typeof ptrEstadoBadge === 'function' ? ptrEstadoBadge(r.Estado) : '') +
      '<span class="text-[10px] text-secondary font-semibold">' + (r.Area || '') +
      (r.Empresa ? ' · ' + r.Empresa : '') + '</span>';
  }

  // Panel de vigencia: la pregunta operativa es "¿puedo trabajar ahora?"
  const v = (typeof ptrVigencia === 'function') ? ptrVigencia(r) : { clave:'sin-horario', texto:'—' };
  const panel = document.querySelector('#main-container #ptr-det-vigencia');
  if (panel) {
    const conf = {
      'vigente':     { b:'border-emerald-200 bg-emerald-50', t:'text-emerald-800', i:'play_circle', tit:'Permiso vigente', sub:'El trabajo está autorizado en este momento.' },
      'programado':  { b:'border-blue-200 bg-blue-50',       t:'text-blue-800',    i:'schedule',    tit:'Permiso programado', sub:'Aún no inicia la ventana autorizada.' },
      'vencido':     { b:'border-red-200 bg-red-50',         t:'text-red-800',     i:'timer_off',   tit:'Vencido sin cerrar', sub:'La ventana terminó y el permiso no fue cerrado.' },
      'cerrado':     { b:'border-outline-variant bg-surface-container-low', t:'text-on-surface', i:'task_alt', tit:'Permiso cerrado', sub:'El trabajo concluyó y el permiso fue cerrado.' },
      'anulado':     { b:'border-outline-variant bg-surface-container-low', t:'text-on-surface', i:'block',    tit:'Permiso ' + (r.Estado || '').toLowerCase(), sub:'Este permiso no autoriza ningún trabajo.' },
      'sin-horario': { b:'border-outline-variant bg-surface-container-low', t:'text-on-surface', i:'help',     tit:'Sin ventana definida', sub:'Falta fecha u horario para determinar la vigencia.' }
    }[v.clave];

    panel.className = 'rounded-2xl border p-4 ' + conf.b;
    panel.innerHTML =
      '<div class="flex items-center gap-3">' +
      '<span class="material-symbols-outlined text-[26px] shrink-0 ' + conf.t + '" aria-hidden="true">' + conf.i + '</span>' +
      '<div class="min-w-0"><p class="text-[13px] font-black ' + conf.t + '">' + conf.tit + '</p>' +
      '<p class="text-[11px] mt-0.5 ' + conf.t + ' opacity-90">' + conf.sub +
      (r.Fecha ? ' · ' + r.Fecha + ' de ' + (r.Hora_Inicio || '--') + ' a ' + (r.Hora_Fin || '--') : '') +
      '</p></div></div>';
  }

  const cont = document.querySelector('#main-container #ptr-det-datos');
  if (cont) cont.innerHTML =
    ptrDetCampo('Tipo de trabajo', r.Tipo_Trabajo) +
    ptrDetCampo('Lugar específico', r.Lugar_Especifico) +
    ptrDetCampo('Responsable de ejecución', r.Ejecutante_DNI) +
    ptrDetCampo('Supervisor a cargo', r.Supervisor_DNI) +
    ptrDetCampo('N.º de trabajadores', r.Num_Trabajadores) +
    ptrDetCampo('IPERC de referencia', r.IPERC_Referencia) +
    ptrDetCampo('Aprobado por', r.Aprobado_Por) +
    ptrDetCampo('Hora de cierre real', r.Hora_Cierre) +
    ptrDetCampo('Observaciones de cierre', r.Observaciones, 'col-span-2');

  const desc = document.querySelector('#main-container #ptr-det-desc');
  if (desc) desc.textContent = r.Descripcion || '—';

  // Controles verificados: los incumplidos se muestran primero
  const lista  = document.querySelector('#main-container #ptr-det-controles');
  const conteo = document.querySelector('#main-container #ptr-det-conteo');
  const controles = r._controles || [];
  if (conteo) conteo.textContent = controles.length ? controles.length + ' control(es)' : '';

  if (lista) {
    if (!controles.length) {
      lista.innerHTML = '<div class="ds-empty" role="status">' +
        '<span class="material-symbols-outlined ds-empty-icon" aria-hidden="true">checklist</span>' +
        '<h4>Sin verificación registrada</h4>' +
        '<p>Un permiso sin controles verificados no debería haberse autorizado.</p>' +
        '<button type="button" class="ds-empty-action" onclick="changeInternalView(\'08_PETAR\',\'Edicion\',\'' + r.UUID + '\')">' +
        '<span class="material-symbols-outlined text-[16px]" aria-hidden="true">add</span>Verificar controles</button></div>';
    } else {
      const peso = { 'No':0, '':1, 'N/A':2, 'Sí':3 };
      const orden = controles.slice().sort((a, b) =>
        (peso[a.Cumple] != null ? peso[a.Cumple] : 1) - (peso[b.Cumple] != null ? peso[b.Cumple] : 1));

      lista.innerHTML = '<div class="space-y-2">' + orden.map(c => {
        const est = {
          'Sí':  { cls:'bg-emerald-100 text-emerald-800', ico:'check_circle' },
          'No':  { cls:'bg-red-100 text-red-800',         ico:'cancel' },
          'N/A': { cls:'bg-surface-variant text-secondary',ico:'remove' }
        }[c.Cumple] || { cls:'bg-amber-100 text-amber-800', ico:'pending' };
        return '<div class="flex items-start gap-3 p-2.5 rounded-xl border ' +
          (c.Cumple === 'No' ? 'border-red-300 bg-red-50' : 'border-outline-variant bg-surface-container-low') + '">' +
          '<span class="material-symbols-outlined text-[17px] shrink-0 ' +
          (c.Cumple === 'No' ? 'text-red-700' : c.Cumple === 'Sí' ? 'text-emerald-700' : 'text-secondary') +
          '" aria-hidden="true">' + est.ico + '</span>' +
          '<div class="min-w-0 flex-1">' +
          '<p class="text-[12px] font-semibold text-on-surface">' + (c.Item || '—') + '</p>' +
          (c.Observacion ? '<p class="text-[10px] text-secondary mt-0.5">' + c.Observacion + '</p>' : '') +
          '</div>' +
          '<span class="text-[9px] font-black px-2 py-0.5 rounded-full shrink-0 ' + est.cls + '">' +
          (c.Cumple || 'Pendiente') + '</span></div>';
      }).join('') + '</div>';
    }
  }

  PWA_SKILLS.renderDriveMedia(r.Firma_Solicitante || '', 'Firma_Solicitante', 'ptr-det-firma-sol');
  PWA_SKILLS.renderDriveMedia(r.Firma_Aprobador  || '', 'Firma_Aprobador',  'ptr-det-firma-apr');
}
</script>
