<script>
function exportRecordToPDF(moduleID) {
  // La plantilla la diseña el administrador en Configuración → PDF.
  const idEl = document.getElementById('insp-detail-id');
  const uuid = idEl ? idEl.innerText.replace('INSP-', '').trim() : '';
  PDF_TEMPLATE.exportarRegistro(moduleID, uuid, 'Inspección ' + uuid);
}

async function loadDetail_03_Inspecciones(uuid) {
  console.log(`Cargando Inspección: ${uuid}`);
  const idEl = document.getElementById('insp-detail-id');
  if (idEl) idEl.innerText = 'Cargando...';

  try {
    const cacheKey = 'refdata_03_Inspecciones';
    let allInsp = null;
    const cached = localStorage.getItem(cacheKey);
    if (cached) { try { allInsp = JSON.parse(cached); } catch(e) {} }

    if (!allInsp) {
      try {
        const parsed = await DataService.read('03_Inspecciones');
        if (parsed.status === 'OK') { allInsp = parsed.payload; localStorage.setItem(cacheKey, JSON.stringify(allInsp)); }
      } catch (e) { /* se resuelve abajo con "no encontrado" */ }
    }

    const insp = allInsp ? allInsp.find(i => String(i.UUID) === String(uuid)) : null;
    if (!insp) { if (idEl) idEl.innerText = 'Inspección no encontrada'; return; }

    if (idEl) idEl.innerText = `INSP-${String(uuid).substring(0, 8).toUpperCase()}`;

    const dateEl = document.getElementById('insp-detail-date');
    if (dateEl) dateEl.innerText = insp.Timestamp ? insp.Timestamp.split('T')[0] : '--';

    const areaEl = document.getElementById('insp-detail-area');
    if (areaEl) areaEl.innerText = insp.Area_Inspeccion || '--';

    const tipoEl = document.getElementById('insp-detail-tipo');
    if (tipoEl) tipoEl.innerText = insp.Tipo_Hallazgo || '--';

    const descEl = document.getElementById('insp-detail-desc');
    if (descEl) descEl.innerText = insp.Descripcion || '--';

    const badge = document.getElementById('insp-detail-badge');
    if (badge) {
      badge.innerText = insp.Estado_Actual || 'Pendiente';
      const colorMap = { 'Pendiente': 'bg-amber-100 text-amber-800', 'En Proceso': 'bg-blue-100 text-blue-800', 'Cerrado': 'bg-emerald-100 text-emerald-800' };
      badge.className = `inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold ${colorMap[insp.Estado_Actual] || 'bg-slate-100 text-slate-800'}`;
    }

    const respEl = document.getElementById('insp-detail-responsable');
    if (respEl) respEl.innerText = insp.Responsable || '--';

    const plazoEl = document.getElementById('insp-detail-plazo');
    if (plazoEl) plazoEl.innerText = insp.Plazo || '--';

    PWA_SKILLS.renderDriveMedia(insp.Evidencia_Fotos || '', 'Evidencia_Fotos', 'insp-detail-gallery');
    PWA_SKILLS.renderDriveMedia(insp.Firma_Digital || '', 'Firma_Digital', 'insp-detail-sig-container');

  } catch (err) {
    console.error('Error en detalle de inspección:', err);
    if (idEl) idEl.innerText = 'Error al cargar';
  }
}
</script>
