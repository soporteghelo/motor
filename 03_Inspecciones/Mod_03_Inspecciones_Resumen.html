<!-- =========================================================================
     VISTA: RESUMEN (DATAGRID)
     MODULO: 03_Inspecciones
     ========================================================================= -->
<div id="module-03_inspecciones-resumen" class="module-view">

  <!-- Page Header & Actions -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
    <div class="flex items-center gap-3">
      <button onclick="showView('Menu')" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors text-secondary border border-outline-variant shrink-0">
        <span class="material-symbols-outlined text-[20px]">arrow_back</span>
      </button>
      <div>
        <h2 class="font-h2 text-h2 text-on-surface leading-tight">Inspecciones Técnicas</h2>
        <p class="text-[11px] text-on-surface-variant">Gestión y control de hallazgos en campo</p>
      </div>
    </div>
    <div class="flex items-center gap-2 w-full sm:w-auto">
      <!-- Result count chip -->
      <span id="ui-result-count" class="text-[10px] font-bold text-on-surface-variant mr-auto sm:mr-1 hidden"></span>
      <!-- Export dropdown -->
      <div class="relative" id="insp-export-wrap">
        <button onclick="document.getElementById('insp-export-menu').classList.toggle('hidden')"
          class="flex items-center gap-1.5 px-3 h-9 border border-outline-variant text-[12px] font-bold text-primary rounded-lg hover:bg-surface-container transition-colors shadow-sm whitespace-nowrap">
          <span class="material-symbols-outlined text-[16px]">download</span>Exportar
          <span class="material-symbols-outlined text-[13px] opacity-60">expand_more</span>
        </button>
        <div id="insp-export-menu" class="hidden absolute right-0 top-full mt-1.5 w-44 bg-white rounded-xl border border-outline-variant shadow-xl z-50 overflow-hidden">
          <button onclick="PWA_SKILLS.exportFilteredToExcel(); document.getElementById('insp-export-menu').classList.add('hidden')"
            class="w-full flex items-center gap-2.5 px-4 py-3 text-[12px] font-semibold text-on-surface hover:bg-surface-container-low transition-colors">
            <span class="material-symbols-outlined text-[17px] text-green-600">grid_on</span>Excel (.xlsx)
          </button>
          <button onclick="PWA_SKILLS.exportVisibleToCSV('Inspecciones'); document.getElementById('insp-export-menu').classList.add('hidden')"
            class="w-full flex items-center gap-2.5 px-4 py-3 text-[12px] font-semibold text-on-surface hover:bg-surface-container-low transition-colors border-t border-outline-variant/30">
            <span class="material-symbols-outlined text-[17px] text-blue-600">text_snippet</span>CSV (.csv)
          </button>
        </div>
      </div>
      <button onclick="changeInternalView('03_Inspecciones', 'Edicion')"
        class="flex items-center gap-1.5 px-3 h-9 bg-primary text-on-primary rounded-lg text-[12px] font-bold hover:opacity-90 transition-all shadow-sm whitespace-nowrap">
        <span class="material-symbols-outlined text-[16px]">add</span>Nuevo
      </button>
    </div>
  </div>

  <!-- Search & Filter Bar (auto-injected by App_Routing) -->
  <div id="ui-search-bar-slot"></div>

  <!-- DataGrid -->
  <div class="bg-white rounded-2xl border border-outline-variant shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse" id="inspecciones-table">
        <thead>
          <tr class="bg-surface-container-low text-on-surface-variant text-[11px] font-black uppercase tracking-wider">
            <th class="px-3 py-2.5">ID / Fecha</th>
            <th class="px-3 py-2.5">Área</th>
            <th class="px-3 py-2.5">Hallazgo</th>
            <th class="px-3 py-2.5">Estado</th>
            <th class="px-3 py-2.5">Responsable</th>
            <th class="px-3 py-2.5">Plazo</th>
            <th class="px-3 py-2.5 text-center" data-nosort>Acciones</th>
          </tr>
        </thead>
        <tbody id="inspecciones-table-body" class="divide-y divide-outline-variant/40">
          <!-- Filas Inspecciones Mock -->
        </tbody>
      </table>
    </div>
    <div id="inspecciones-empty" style="display:none;" class="p-16 text-center">
      <span class="material-symbols-outlined text-5xl text-outline-variant mb-3 block">inventory_2</span>
      <p class="text-secondary font-medium text-sm">No se encontraron inspecciones.</p>
    </div>
  </div>

</div>
<script>
const INSP_AREA_CLS = {
  'Mina':      'bg-orange-50 text-orange-700 border-orange-200',
  'Planta':    'bg-blue-50 text-blue-700 border-blue-200',
  'Talleres':  'bg-purple-50 text-purple-700 border-purple-200',
  'Logística': 'bg-teal-50 text-teal-700 border-teal-200'
};
const INSP_ESTADO_CONF = {
  'Pendiente':  { cls:'bg-amber-50 text-amber-700 border-amber-200',      icon:'schedule' },
  'En Proceso': { cls:'bg-blue-50 text-blue-700 border-blue-200',         icon:'autorenew' },
  'Cerrado':    { cls:'bg-emerald-50 text-emerald-700 border-emerald-200', icon:'check_circle' }
};

function inspRenderTabla(data) {
  const tbody = document.querySelector('#main-container #inspecciones-table-body');
  if (!tbody) return;

  if (!data.length) {
    PWA_SKILLS.showEmptyState('inspecciones-table-body', {
      icon: 'inventory_2',
      title: 'Sin inspecciones',
      message: 'Todavía no hay inspecciones registradas.',
      actionLabel: 'Crear la primera', actionIcon: 'add',
      onAction: "changeInternalView('03_Inspecciones','Edicion')"
    });
    const c = document.querySelector('#main-container #ui-result-count');
    if (c) { c.textContent = '0 registros'; c.classList.remove('hidden'); }
    return;
  }

  PWA_SKILLS.finishLoading('inspecciones-table-body');
  tbody.innerHTML = data.map(r => {
    const ac = INSP_AREA_CLS[r.Area_Inspeccion] || 'bg-surface-variant text-secondary border-outline-variant';
    const ec = INSP_ESTADO_CONF[r.Estado_Actual] || { cls:'bg-surface-variant text-secondary border-outline-variant', icon:'help' };
    return `
    <tr class="hover:bg-surface-container-low/50 transition-colors cursor-pointer group"
        onclick="changeInternalView('03_Inspecciones','Detalle','${r.UUID}')">
      <td class="px-3 py-2.5">
        <p class="text-[10px] font-black text-primary font-mono">#${r.UUID}</p>
        <p class="text-[10px] text-secondary mt-0.5">${r.Fecha_Peru || '—'}</p>
      </td>
      <td class="px-3 py-2.5">
        <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold border ${ac}">${r.Area_Inspeccion || '—'}</span>
      </td>
      <td class="px-3 py-2.5">
        <p class="text-[11px] font-semibold text-on-surface">${r.Tipo_Hallazgo || '—'}: ${r.Descripcion_Tecnica || ''}</p>
        <p class="text-[10px] text-secondary">Auditor ${r.Auditor_DNI || '—'}</p>
      </td>
      <td class="px-3 py-2.5">
        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold border ${ec.cls}">
          <span class="material-symbols-outlined text-[11px]" style="font-variation-settings:'FILL' 1" aria-hidden="true">${ec.icon}</span>${r.Estado_Actual || '—'}
        </span>
      </td>
      <td class="px-3 py-2.5">
        <div class="flex items-center gap-1.5">
          <span class="material-symbols-outlined text-[13px] text-secondary" aria-hidden="true">person</span>
          <span class="text-[11px] font-semibold text-on-surface">${r.Responsable || '—'}</span>
        </div>
      </td>
      <td class="px-3 py-2.5">
        <span class="text-[10px] text-on-surface-variant">${r.Plazo || '—'}</span>
      </td>
      <td class="px-3 py-2.5 text-center">
        <button onclick="event.stopPropagation(); changeInternalView('03_Inspecciones','Detalle','${r.UUID}')" aria-label="Ver inspección ${r.UUID}"
          class="w-8 h-8 rounded-full hover:bg-primary/10 text-secondary hover:text-primary transition-all flex items-center justify-center mx-auto opacity-0 group-hover:opacity-100">
          <span class="material-symbols-outlined text-[18px]" aria-hidden="true">chevron_right</span>
        </button>
      </td>
    </tr>`;
  }).join('');

  PWA_SKILLS.initSortableTable('inspecciones-table-body');
  PWA_SKILLS.enhanceTable('inspecciones-table-body');
  PWA_SKILLS.updateResultCount('inspecciones-table-body', 'ui-result-count');
  const c = document.querySelector('#main-container #ui-result-count');
  if (c) c.classList.remove('hidden');
}

function loadResumen_03_Inspecciones() {
  PWA_SKILLS.renderSkeleton('inspecciones-table-body', 6);

  if (!window._inspExportListener) {
    window._inspExportListener = true;
    document.addEventListener('click', function(e) {
      const wrap = document.getElementById('insp-export-wrap');
      if (wrap && !wrap.contains(e.target)) {
        const menu = document.getElementById('insp-export-menu');
        if (menu) menu.classList.add('hidden');
      }
    });
  }

  DataService.read('03_Inspecciones')
    .then(res => {
      const filas = (res && res.status === 'OK' && Array.isArray(res.payload)) ? res.payload : [];
      const visibles = (typeof PERMISOS !== 'undefined')
        ? PERMISOS.filtrarDatos('03_Inspecciones', filas) : filas;
      window._inspData = visibles;
      localStorage.setItem('refdata_03_Inspecciones', JSON.stringify(visibles));
      inspRenderTabla(visibles);
      if (typeof refreshDrawerStats === 'function') setTimeout(refreshDrawerStats, 80);
    })
    .catch(() => {
      let cache = [];
      try { cache = JSON.parse(localStorage.getItem('refdata_03_Inspecciones')) || []; } catch (e) {}
      window._inspData = cache;
      if (cache.length) {
        inspRenderTabla(cache);
        PWA_SKILLS.toast('Sin conexión: mostrando los últimos datos sincronizados.', 'warning', 4000);
      } else {
        PWA_SKILLS.showEmptyState('inspecciones-table-body', {
          icon: 'cloud_off',
          title: 'Sin conexión',
          message: 'No se pudieron cargar las inspecciones y no hay copia local disponible.',
          actionLabel: 'Reintentar', actionIcon: 'refresh',
          onAction: "loadResumen_03_Inspecciones()"
        });
      }
    });
}
</script>
