console.log("✅ Subconfig 03_Inspecciones (Estandarizada) cargada.");

window.MOTOR_HOOKS = window.MOTOR_HOOKS || {};

MOTOR_HOOKS["03_Inspecciones"] = {
  columnas: {
    /** El plazo solo informa si dice cuánto falta — o cuánto lleva vencido */
    plazo: function (r) {
      if (!r.Plazo) return '<span class="text-[11px] text-secondary">—</span>';
      if (r.Estado_Actual === "Cerrado") {
        return '<span class="text-[11px] text-secondary tabular-nums">' + esc(r.Plazo) + "</span>";
      }
      const hoy = new Date(PWA_SKILLS.getPeruTime(false));
      const lim = new Date(r.Plazo);
      if (isNaN(lim)) return '<span class="text-[11px] text-secondary">' + esc(r.Plazo) + "</span>";
      const dias = Math.round((lim - hoy) / 86400000);
      const tono = dias < 0 ? "bad" : dias <= 3 ? "warn" : "ok";
      const texto = dias < 0 ? "Vencido " + Math.abs(dias) + " d" : dias === 0 ? "Vence hoy" : "Faltan " + dias + " d";
      return '<div class="text-[11px] font-semibold tabular-nums" style="color:var(--st-' + tono + '-fg)">' +
             esc(texto) + '</div><div class="text-[10px] text-secondary tabular-nums">' + esc(r.Plazo) + "</div>";
    }
  },
  // Los numeros los cuenta la base de datos sobre TODAS las inspecciones, no
  // sobre las que esten cargadas en pantalla: una con el plazo vencido hace
  // ocho meses esta miles de filas atras y tiene que seguir apareciendo aqui.
  resumen: function () {
    MOTOR_RENDER.kpis("03_Inspecciones", [
      { tono: "mute", etiqueta: "Inspecciones",  cond: {} },
      { tono: "warn", etiqueta: "Abiertas",      cond: { Estado_Actual: { neq: "Cerrado" } } },
      { tono: "bad",  etiqueta: "Plazo vencido", cond: { Estado_Actual: { neq: "Cerrado" }, Plazo: { lt: "@hoy" } } },
      { tono: "ok",   etiqueta: "Cerradas",      cond: { Estado_Actual: { eq: "Cerrado" } } }
    ]);
  }
};
