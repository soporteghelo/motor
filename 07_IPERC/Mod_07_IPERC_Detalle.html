<!-- =========================================================================
     VISTA: DETALLE — MÓDULO 07_IPERC
     ========================================================================= -->
<div id="module-07_iperc-detalle" class="module-view" style="display:none;">

  <header class="flex justify-between items-start w-full mb-6 gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <button onclick="changeInternalView('07_IPERC','Resumen')" aria-label="Volver al listado"
        class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white transition-colors text-secondary border border-outline-variant shrink-0">
        <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
      </button>
      <div class="min-w-0">
        <h1 id="ipc-det-titulo" class="text-lg font-black text-on-surface tracking-tight">Cargando…</h1>
        <div class="flex items-center gap-2 mt-1 flex-wrap" id="ipc-det-badges"></div>
      </div>
    </div>
    <div class="flex flex-col gap-1.5 items-end shrink-0">
      <button onclick="changeInternalView('07_IPERC','Edicion', window._ipcDetalleUUID)"
        class="h-7 px-3 rounded-lg bg-primary text-on-primary text-[9px] font-bold shadow-sm hover:opacity-90 transition-all flex items-center justify-center gap-1.5 whitespace-nowrap">
        <span class="material-symbols-outlined text-[14px]" aria-hidden="true">edit</span>Editar
      </button>
      <button onclick="PDF_TEMPLATE.exportarRegistro('07_IPERC', window._ipcDetalleUUID, 'IPERC ' + window._ipcDetalleUUID)"
        class="h-7 px-3 rounded-lg border border-outline-variant bg-white text-[9px] font-bold text-on-surface hover:bg-slate-50 transition-all flex items-center justify-center gap-1.5 whitespace-nowrap">
        <span class="material-symbols-outlined text-[14px]" aria-hidden="true">picture_as_pdf</span>PDF
      </button>
    </div>
  </header>

  <div class="max-w-5xl mx-auto space-y-5">

    <!-- Riesgo máximo: es la conclusión de la matriz -->
    <div id="ipc-det-riesgo" class="rounded-2xl border p-4"></div>

    <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-sm">
      <h2 class="text-[11px] font-black text-secondary uppercase tracking-widest mb-4 border-b border-outline-variant pb-2">Alcance</h2>
      <div class="grid grid-cols-2 gap-x-4 gap-y-4" id="ipc-det-datos"></div>
    </div>

    <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-sm">
      <div class="flex items-center justify-between mb-4 border-b border-outline-variant pb-2 gap-2">
        <h2 class="text-[11px] font-black text-secondary uppercase tracking-widest">Peligros evaluados</h2>
        <span class="text-[10px] font-bold text-on-surface-variant" id="ipc-det-conteo"></span>
      </div>
      <div id="ipc-det-peligros"></div>
    </div>

    <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-sm">
      <h2 class="text-[11px] font-black text-secondary uppercase tracking-widest mb-4 border-b border-outline-variant pb-2">Firma del responsable</h2>
      <div id="ipc-det-firma" class="min-h-[7rem] bg-surface-container-low rounded-xl border border-dashed border-outline-variant flex items-center justify-center overflow-hidden"></div>
    </div>

  </div>
</div>

<script>
function ipcDetCampo(etiqueta, valor, ancho) {
  return '<div class="' + (ancho || '') + '">' +
    '<p class="text-[10px] font-black text-secondary uppercase tracking-widest mb-1">' + etiqueta + '</p>' +
    '<p class="text-[13px] font-semibold text-on-surface">' + (valor || '—') + '</p></div>';
}

async function loadDetail_07_IPERC(uuid) {
  window._ipcDetalleUUID = uuid;
  const tit = document.querySelector('#main-container #ipc-det-titulo');
  if (tit) tit.textContent = 'Cargando…';

  let datos = window._ipcData || [];
  if (!datos.length) {
    try { datos = JSON.parse(localStorage.getItem('refdata_07_IPERC')) || []; } catch (e) {}
  }
  let r = datos.find(x => String(x.UUID) === String(uuid));

  if (!r) {
    try {
      const res = await DataService.read('07_IPERC');
      if (res && res.status === 'OK' && Array.isArray(res.payload)) {
        window._ipcData = res.payload;
        r = res.payload.find(x => String(x.UUID) === String(uuid));
      }
    } catch (e) { /* se resuelve abajo */ }
  }

  if (!r) {
    if (tit) tit.textContent = 'Matriz no encontrada';
    PWA_SKILLS.toast('No se pudo cargar la matriz ' + uuid + '.', 'error', 4000);
    return;
  }

  if (tit) tit.textContent = r.Proceso || 'Matriz IPERC';

  const badges = document.querySelector('#main-container #ipc-det-badges');
  if (badges) {
    badges.innerHTML =
      (typeof ipcEstadoBadge === 'function' ? ipcEstadoBadge(r.Estado) : '') +
      '<span class="text-[10px] text-secondary font-semibold">' + (r.Tipo_IPERC || '') +
      (r.Area ? ' · ' + r.Area : '') + '</span>';
  }

  // Panel de conclusión: el nivel máximo define si el trabajo puede ejecutarse
  const panel = document.querySelector('#main-container #ipc-det-riesgo');
  if (panel) {
    const nivel = r.Riesgo_Maximo;
    const info = (SUBCONFIG_07_IPERC.Matriz.niveles.find(n => n.clave === nivel) || {}).accion ||
                 'Sin peligros valorados en esta matriz.';
    const c = (typeof IPC_COLORES !== 'undefined' && IPC_COLORES[nivel])
      ? IPC_COLORES[nivel] : { bg:'#f5f2fb', fg:'#454652', bd:'#c6c5d4' };
    panel.className = 'rounded-2xl border p-4';
    panel.style.cssText = 'background:' + c.bg + ';border-color:' + c.bd;
    panel.innerHTML =
      '<div class="flex items-center gap-3">' +
      '<span class="material-symbols-outlined text-[26px] shrink-0" style="color:' + c.fg + '" aria-hidden="true">' +
      (nivel === 'Intolerable' ? 'dangerous' : nivel === 'Importante' ? 'warning' : nivel ? 'shield' : 'help') + '</span>' +
      '<div class="min-w-0"><p class="text-[13px] font-black" style="color:' + c.fg + '">' +
      'Riesgo residual máximo: ' + (nivel || 'sin valorar') + '</p>' +
      '<p class="text-[11px] mt-0.5" style="color:' + c.fg + ';opacity:.9">' + info + '</p></div></div>';
  }

  const cont = document.querySelector('#main-container #ipc-det-datos');
  if (cont) cont.innerHTML =
    ipcDetCampo('Tipo de IPERC', r.Tipo_IPERC) +
    ipcDetCampo('Área', r.Area) +
    ipcDetCampo('Puesto o tarea', r.Puesto_Tarea, 'col-span-2') +
    ipcDetCampo('Fecha de elaboración', r.Fecha_Elaboracion) +
    ipcDetCampo('Próxima revisión', r.Fecha_Revision) +
    ipcDetCampo('Elaborado por', r.Elaborado_Por) +
    ipcDetCampo('Revisado por', r.Revisado_Por) +
    ipcDetCampo('Participantes', r.Participantes, 'col-span-2') +
    ipcDetCampo('Observaciones', r.Observaciones, 'col-span-2');

  // Lista de peligros con su valoración
  const lista  = document.querySelector('#main-container #ipc-det-peligros');
  const conteo = document.querySelector('#main-container #ipc-det-conteo');
  const peligros = r._peligros || [];
  if (conteo) conteo.textContent = peligros.length ? peligros.length + ' peligro(s)' : '';

  if (lista) {
    if (!peligros.length) {
      lista.innerHTML = '<div class="ds-empty" role="status">' +
        '<span class="material-symbols-outlined ds-empty-icon" aria-hidden="true">warning_off</span>' +
        '<h4>Sin peligros registrados</h4>' +
        '<p>Una matriz sin peligros no evalúa nada y no sirve como base para permisos ni capacitaciones.</p>' +
        '<button type="button" class="ds-empty-action" onclick="changeInternalView(\'07_IPERC\',\'Edicion\',\'' + r.UUID + '\')">' +
        '<span class="material-symbols-outlined text-[16px]" aria-hidden="true">add</span>Agregar peligros</button></div>';
    } else {
      const pesos = { 'Intolerable':0, 'Importante':1, 'Moderado':2, 'Tolerable':3, 'Trivial':4 };
      const orden = peligros.slice().sort((a, b) =>
        (pesos[a.Nivel_Riesgo] != null ? pesos[a.Nivel_Riesgo] : 9) -
        (pesos[b.Nivel_Riesgo] != null ? pesos[b.Nivel_Riesgo] : 9));

      lista.innerHTML = '<div class="space-y-2">' + orden.map(p => {
        const c = (typeof IPC_COLORES !== 'undefined' && IPC_COLORES[p.Nivel_Riesgo])
          ? IPC_COLORES[p.Nivel_Riesgo] : { bg:'#f5f2fb', fg:'#454652', bd:'#c6c5d4' };
        return '<div class="rounded-xl border border-outline-variant bg-surface-container-low p-3">' +
          '<div class="flex items-start gap-3">' +
          '<span class="shrink-0 px-2 py-1 rounded-lg text-[10px] font-black text-center leading-tight" ' +
          'style="background:' + c.bg + ';color:' + c.fg + ';border:1px solid ' + c.bd + '">' +
          (p.Valor_Riesgo ? p.Valor_Riesgo + '<br>' : '') + (p.Nivel_Riesgo || '—') + '</span>' +
          '<div class="min-w-0 flex-1">' +
          '<p class="text-[12px] font-bold text-on-surface">' + (p.Peligro || '—') + '</p>' +
          '<p class="text-[11px] text-secondary mt-0.5">Riesgo: ' + (p.Riesgo || '—') + '</p>' +
          (p.Controles ? '<p class="text-[11px] text-on-surface mt-1.5"><span class="font-bold">Controles:</span> ' + p.Controles + '</p>' : '') +
          (p.Jerarquia ? '<span class="inline-flex mt-1.5 px-2 py-0.5 rounded-full text-[9px] font-black bg-primary-fixed text-on-primary-fixed">' + p.Jerarquia + '</span>' : '') +
          '</div></div></div>';
      }).join('') + '</div>';
    }
  }

  PWA_SKILLS.renderDriveMedia(r.Firma_Responsable || '', 'Firma_Responsable', 'ipc-det-firma');
}
</script>
