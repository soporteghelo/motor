<script>
/**
 * =========================================================================
 * SUBCONFIG — 07_IPERC
 * =========================================================================
 * Identificación de Peligros, Evaluación de Riesgos y Controles.
 *
 * POR QUÉ ESTE MÓDULO
 * Es la columna vertebral del sistema: de aquí salen los controles que
 * justifican todo lo demás (permisos, capacitaciones, EPP). Un IPERC en
 * papel se desactualiza y nadie lo consulta; aquí cada peligro se evalúa
 * con la matriz y el nivel de riesgo se calcula solo, de modo que no
 * dependa del criterio de quien llena la fila.
 *
 * MATRIZ DE VALORACIÓN (5×5, estándar en SSO)
 *   Nivel = Probabilidad (1-5) × Severidad (1-5)
 *     1-4   Trivial       aceptable sin acción
 *     5-8   Tolerable     mantener controles
 *     9-12  Moderado      requiere acción planificada
 *    15-16  Importante    no iniciar hasta reducirlo
 *    20-25  Intolerable   trabajo prohibido
 *
 * La evaluación se hace DOS veces por peligro: riesgo inicial (sin
 * controles) y riesgo residual (con ellos). La diferencia demuestra que
 * los controles sirven — eso es lo que revisa una auditoría.
 * =========================================================================
 */

var SUBCONFIG_07_IPERC = {

  Config_Modular: {
    NombreInterno:          "07_IPERC",
    // Miniatura de la tarjeta móvil: columna con la imagen (vacío = solo icono) e icono por defecto
    Card_Image:             "",
    Card_Icon:              "grid_view",
    Titulo:                 "Matriz IPERC",
    DRIVE_FOLDER_NAME:      "07_IPERC_DB",
    GOOGLE_DOC_TEMPLATE_ID: "",              // se vincula desde Configuración → PDF
    EMAIL_TEMPLATE_ID:      "",
    PARENT_TABLE:           "MAIN",
    CHILD_TABLE:            "PELIGROS",
    RELATIONAL_KEY:         "PARENT_UUID",

    // Cada fila es un peligro evaluado. El nivel de riesgo es de tipo
    // 'display': lo calcula el formulario, no se escribe a mano.
    Relational_Fields: [
      { name: "Peligro",     label: "Peligro",   type: "text", fullWidth: true, colSpan: "md:col-span-3",
        placeholder: "Ej: superficie a 3 m sin barandas" },
      { name: "Riesgo",      label: "Riesgo",    type: "text", fullWidth: true, colSpan: "md:col-span-3",
        placeholder: "Ej: caída a distinto nivel" },
      { name: "Probabilidad",label: "Prob.",     type: "select", colSpan: "md:col-span-1",
        options: [
          { value: "1", label: "1 · Muy baja" }, { value: "2", label: "2 · Baja" },
          { value: "3", label: "3 · Media" },    { value: "4", label: "4 · Alta" },
          { value: "5", label: "5 · Muy alta" }
        ] },
      { name: "Severidad",   label: "Sev.",      type: "select", colSpan: "md:col-span-1",
        options: [
          { value: "1", label: "1 · Insignificante" }, { value: "2", label: "2 · Menor" },
          { value: "3", label: "3 · Moderada" },       { value: "4", label: "4 · Mayor" },
          { value: "5", label: "5 · Catastrófica" }
        ] },
      { name: "Nivel_Riesgo",label: "Nivel",     type: "display", colSpan: "md:col-span-2" },
      { name: "Jerarquia",   label: "Control",   type: "select", fullWidth: true, colSpan: "md:col-span-2",
        options: ["Eliminación", "Sustitución", "Control de ingeniería", "Control administrativo", "EPP"] },
      { name: "Controles",   label: "Controles a aplicar", type: "text", fullWidth: true, colSpan: "md:col-span-11",
        placeholder: "Medidas concretas, no genéricas" }
    ],

    // Matriz de permisos por rol. El SuperAdmin (proveedor) no figura:
    // PERMISOS.matriz() le concede todo por jerarquía.
    // alcance: todos | responsable | propios  →  qué registros ve el rol
    AdminRole:       { canCreate: true , canRead: true , canUpdate: true , canDelete: true , alcance: "todos" },
    SupervisorRole:  { canCreate: true , canRead: true , canUpdate: true , canDelete: false, alcance: "responsable" },
    TrabajadorRole:  { canCreate: false, canRead: true , canUpdate: false, canDelete: false, alcance: "propios" }
  },

  Variables: {
    "UUID":              { type: "Hidden_UUID", required: true, isFilter: false },

    // ── Alcance de la matriz ──
    "Proceso":           { type: "Text", required: true, isFilter: true, label: "Proceso o actividad" },
    "Tipo_IPERC":        { type: "Enum", required: true, isFilter: true, label: "Tipo de IPERC",
                           acceptedValues: ["Línea base", "Continuo", "Específico"], allowOtherValues: false },
    "Area":              { type: "Enum", required: true, isFilter: true, label: "Área",
                           acceptedValues: [
                             "Operaciones", "Mantenimiento", "Almacén", "Logística",
                             "Producción", "Administración", "Obra / Campo", "Laboratorio"
                           ], allowOtherValues: true },
    "Puesto_Tarea":      { type: "Text", required: false, isFilter: false, label: "Puesto o tarea evaluada" },

    // ── Vigencia y responsables ──
    "Fecha_Elaboracion": { type: "Date", required: true,  isFilter: true,  label: "Fecha de elaboración" },
    "Fecha_Revision":    { type: "Date", required: false, isFilter: true,  label: "Próxima revisión" },
    "Elaborado_Por":     { type: "REF",  required: false, isFilter: false, label: "Elaborado por",
                           relationalDataOrigin: "01_Usuarios" },
    "Revisado_Por":      { type: "REF",  required: false, isFilter: false, label: "Revisado por",
                           relationalDataOrigin: "01_Usuarios",
                           slice: { column: "Rol", value: "Supervisor" } },
    "Participantes":     { type: "Text", required: false, isFilter: false, label: "Participantes de la evaluación" },

    "Estado":            { type: "Enum", required: true, isFilter: true, label: "Estado",
                           acceptedValues: ["Borrador", "En revisión", "Aprobado", "Requiere actualización"],
                           allowOtherValues: false },

    // Se guarda calculado desde los peligros: permite filtrar y ordenar sin
    // tener que leer la tabla hija completa.
    "Riesgo_Maximo":     { type: "Enum", required: false, isFilter: true, label: "Riesgo residual máximo",
                           acceptedValues: ["Trivial", "Tolerable", "Moderado", "Importante", "Intolerable"],
                           allowOtherValues: false },
    "Total_Peligros":    { type: "Text", required: false, isFilter: false, label: "Peligros identificados" },
    "Observaciones":     { type: "Text", required: false, isFilter: false, label: "Observaciones" },

    // ── Evidencia (Skill 11: cada archivo lleva su _ID y _Path) ──
    "Firma_Responsable":      { type: "Signature", required: false, isFilter: false, label: "Firma del responsable" },
    "Firma_Responsable_ID":   { type: "Hidden", required: false },
    "Firma_Responsable_Path": { type: "Hidden", required: false },

    "Registrado_Por":    { type: "Text",   required: false, isFilter: false, label: "Registrado por" },
    "Fecha_Registro":    { type: "Hidden", required: false }
  },

  Vistas: {
    Subtitulo: "Peligros, riesgos y controles",
    Resumen: {
      etiquetaCrear: "Nueva matriz", ordenPor: "Fecha_Elaboracion",
      columnas: [
        { campo: "Proceso", sub: "Area", etiqueta: "Proceso / Área" },
        { campo: "Tipo_IPERC", etiqueta: "Tipo" },
        { campo: "Riesgo_Maximo", etiqueta: "Riesgo máximo", tipo: "badge" },
        { campo: "Total_Peligros", etiqueta: "Peligros", numero: true },
        { campo: "Estado", tipo: "badge" },
        { campo: "Fecha_Revision", etiqueta: "Próxima revisión", render: "revision" }
      ],
      vacio: { icono: "grid_view", titulo: "Sin matrices IPERC",
               mensaje: "La matriz IPERC es la base de todo el sistema: sin ella, los controles no tienen origen.",
               accion: "Nueva matriz" }
    },
    Edicion: {
      tituloNuevo: "Nueva Matriz IPERC", tituloEditar: "Editar Matriz IPERC",
      secciones: [
        { titulo: "Alcance de la matriz", icono: "grid_view",
          campos: ["Proceso", "Tipo_IPERC", "Area", "Puesto_Tarea"] },
        { titulo: "Elaboración y revisión", icono: "event",
          campos: ["Fecha_Elaboracion", "Fecha_Revision", "Elaborado_Por", "Revisado_Por", "Participantes", "Estado"] },
        { titulo: "Observaciones y firma", icono: "draw",
          campos: ["Observaciones", "Firma_Responsable"] }
      ]
    },
    Detalle: {
      titulo: "Proceso", subtitulo: ["Area", "Fecha_Elaboracion"],
      secciones: [
        { titulo: "Alcance",
          campos: ["Proceso", "Tipo_IPERC", "Area", "Puesto_Tarea", "Riesgo_Maximo", "Total_Peligros", "Estado"] },
        { titulo: "Elaboración y revisión",
          campos: ["Fecha_Elaboracion", "Fecha_Revision", "Elaborado_Por", "Revisado_Por", "Participantes"] },
        { titulo: "Observaciones", campos: ["Observaciones"] }
      ]
    },
    Hijos: { titulo: "Peligros identificados", icono: "warning",
             vacio: "Una matriz sin peligros identificados no controla nada.",
             vacioDetalle: "Esta matriz todavía no identifica peligros." },
    Badges: {
      Riesgo_Maximo: { "Trivial":     { tono: "ok",   icono: "check_circle" },
                       "Tolerable":   { tono: "lime", icono: "check" },
                       "Moderado":    { tono: "warn", icono: "warning" },
                       "Importante":  { tono: "bad",  icono: "priority_high" },
                       "Intolerable": { tono: "crit", icono: "dangerous" } },
      Estado: { "Borrador":              { tono: "mute", icono: "edit_note" },
                "En revisión":           { tono: "info", icono: "search" },
                "Aprobado":              { tono: "ok",   icono: "verified" },
                "Requiere actualización":{ tono: "warn", icono: "update" } }
    }
  },

  /**
   * Valoración compartida por el formulario, el listado y el detalle.
   * Vive en el subconfig para que cambiar la matriz de la empresa sea
   * editar un solo archivo, sin tocar ninguna vista.
   */
  Matriz: {
    niveles: [
      { max: 4,  clave: "Trivial",     accion: "Aceptable. Mantener control." },
      { max: 8,  clave: "Tolerable",   accion: "Mantener controles y verificar periódicamente." },
      { max: 12, clave: "Moderado",    accion: "Requiere acción planificada con plazo." },
      { max: 16, clave: "Importante",  accion: "No iniciar el trabajo hasta reducir el riesgo." },
      { max: 25, clave: "Intolerable", accion: "Trabajo prohibido. Detener hasta control efectivo." }
    ],
    evaluar: function(p, s) {
      const prob = parseInt(p, 10), sev = parseInt(s, 10);
      if (!prob || !sev) return null;
      const valor = prob * sev;
      const nivel = this.niveles.find(n => valor <= n.max) || this.niveles[this.niveles.length - 1];
      return { valor: valor, clave: nivel.clave, accion: nivel.accion };
    }
  }
};

window.MOTOR_HOOKS = window.MOTOR_HOOKS || {};

MOTOR_HOOKS["07_IPERC"] = {
  // Peso por nivel: define cuál es el riesgo máximo de toda la matriz
  PESOS: { "Trivial": 0, "Tolerable": 1, "Moderado": 2, "Importante": 3, "Intolerable": 4 },
  TONOS: { "Trivial": "ok", "Tolerable": "lime", "Moderado": "warn", "Importante": "bad", "Intolerable": "crit" },

  columnas: {
    revision: function (r) {
      if (!r.Fecha_Revision) return '<span class="text-[11px] text-secondary">—</span>';
      const f = new Date(r.Fecha_Revision);
      if (isNaN(f)) return '<span class="text-[11px] text-secondary">' + esc(r.Fecha_Revision) + "</span>";
      const dias = Math.round((f - new Date(PWA_SKILLS.getPeruTime(false))) / 86400000);
      const tono = dias < 0 ? "bad" : dias <= 30 ? "warn" : "ok";
      const texto = dias < 0 ? "Vencida" : dias <= 30 ? "En " + dias + " d" : "Vigente";
      return '<div class="text-[11px] font-semibold" style="color:var(--st-' + tono + '-fg)">' + esc(texto) + "</div>" +
             '<div class="text-[10px] text-secondary tabular-nums">' + esc(r.Fecha_Revision) + "</div>";
    }
  },

  resumen: function () {
    MOTOR_RENDER.kpis("07_IPERC", [
      { tono: "crit", etiqueta: "Intolerable", cond: { Riesgo_Maximo: { eq: "Intolerable" } } },
      { tono: "bad",  etiqueta: "Importante",  cond: { Riesgo_Maximo: { eq: "Importante" } } },
      { tono: "warn", etiqueta: "Revisión vencida", cond: { Fecha_Revision: { lt: "@hoy" } } },
      { tono: "mute", etiqueta: "Peligros", metrica: "sum", campo: "Total_Peligros",
        formato: n => n == null ? "—" : String(Math.round(parseFloat(n) || 0)) }
    ]);
  },

  /**
   * El corazón del módulo: cada peligro se valora con probabilidad ×
   * severidad y la matriz entera hereda el peor nivel. Se recalcula al
   * escribir, no al guardar, porque el valor guía la decisión.
   */
  edicion: function (ctx) {
    const raiz = ctx.root;
    if (!raiz.dataset.ipcCalc) {
      raiz.addEventListener("change", e => {
        if (e.target && /^(Probabilidad|Severidad)$/.test(e.target.name || "")) this.recalcular(raiz);
      });
      raiz.dataset.ipcCalc = "1";
    }
    setTimeout(() => this.recalcular(raiz), 120);
  },

  recalcular: function (raiz) {
    const cont = raiz.querySelector("#m07-iperc-hijos");
    if (!cont || !SUBCONFIG_07_IPERC.Matriz) return;
    let peor = null, peso = -1;
    cont.querySelectorAll('[id^="row-"]').forEach(fila => {
      const p = fila.querySelector('[name="Probabilidad"]');
      const s = fila.querySelector('[name="Severidad"]');
      const out = fila.querySelector('[data-display="Nivel_Riesgo"]');
      if (!out) return;
      const ev = SUBCONFIG_07_IPERC.Matriz.evaluar(p ? p.value : "", s ? s.value : "");
      if (!ev) {
        out.textContent = "—"; out.style.cssText = ""; out.title = "";
        out.className = "w-full h-10 px-3 rounded-lg border border-dashed border-outline-variant bg-surface-container-low text-xs font-bold flex items-center justify-center text-secondary";
        return;
      }
      const tono = this.TONOS[ev.clave] || "mute";
      out.textContent = ev.valor + " · " + ev.clave;
      out.title = ev.accion;
      out.className = "w-full h-10 px-2 rounded-lg border text-xs font-black flex items-center justify-center text-center leading-tight";
      out.style.cssText = "background:var(--st-" + tono + "-bg);color:var(--st-" + tono + "-fg);border-color:var(--st-" + tono + "-bd)";
      if ((this.PESOS[ev.clave] || 0) > peso) { peso = this.PESOS[ev.clave]; peor = ev; }
    });

    let aviso = raiz.querySelector("#ipc-resumen-riesgo");
    if (!aviso) {
      const ancla = raiz.querySelector("#m07-iperc-hijos");
      if (!ancla) return;
      aviso = document.createElement("div");
      aviso.id = "ipc-resumen-riesgo";
      ancla.parentNode.appendChild(aviso);
    }
    if (!peor) { aviso.className = "hidden"; aviso.innerHTML = ""; return; }
    const t = this.TONOS[peor.clave] || "mute";
    aviso.className = "mt-4 rounded-xl border p-3";
    aviso.style.cssText = "background:var(--st-" + t + "-bg);border-color:var(--st-" + t + "-bd)";
    aviso.innerHTML =
      '<div class="flex items-start gap-2.5">' +
      '<span class="material-symbols-outlined text-[19px] shrink-0" style="color:var(--st-' + t + '-fg)" aria-hidden="true">' +
      (peor.clave === "Intolerable" ? "dangerous" : peor.clave === "Importante" ? "warning" : "info") + "</span>" +
      '<div class="min-w-0"><p class="text-[12px] font-black" style="color:var(--st-' + t + '-fg)">Riesgo máximo de la matriz: ' +
      esc(peor.clave) + "</p>" +
      '<p class="text-[11px] mt-0.5" style="color:var(--st-' + t + '-fg);opacity:.9">' + esc(peor.accion) + "</p></div></div>";
    raiz.dataset.ipcPeor = peor.clave;
  },

  /** Lo que se guarda en el padre es el resumen de sus peligros */
  antesDeGuardar: function (ctx) {
    ctx.datos.Total_Peligros = String(ctx.hijos.length);
    let peor = "", peso = -1;
    ctx.hijos.forEach(h => {
      const n = String(h.Nivel_Riesgo || "").split("·").pop().trim();
      if ((this.PESOS[n] != null) && this.PESOS[n] > peso) { peso = this.PESOS[n]; peor = n; }
    });
    if (peor) ctx.datos.Riesgo_Maximo = peor;
    return true;
  }
};
</script>
