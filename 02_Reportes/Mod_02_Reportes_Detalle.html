<!-- =========================================================================
     VISTA: DETALLE (VISUALIZACIÓN DE EVENTO)
     MODULO: 02_Reportes

<div id="module-02_reportes-detalle" class="module-view" style="display:none;">
    
    <header class="flex justify-between items-center w-full mb-8">
      <div class="flex items-center gap-4">
        <button onclick="changeInternalView('02_Reportes', 'Summary')" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white transition-colors text-secondary border border-outline-variant">
           <span class="material-symbols-outlined">arrow_back</span>
        </button>
        <div>
           <div class="flex items-center gap-2">
              <h1 id="rep-det-id" class="text-2xl font-black text-on-surface tracking-tight">Reporte #773</h1>
              <span id="rep-det-date" class="text-[10px] text-secondary font-bold uppercase border-l border-outline-variant pl-2">25 Abr 2026</span>
           </div>
           <p class="text-[11px] text-emerald-600 font-black tracking-widest uppercase">Sincronización Drive OK</p>
        </div>
      </div>
      
      <div class="flex flex-col gap-1.5 items-end">
         <button onclick="changeInternalView('02_Reportes', 'Edicion', 'CURRENT')" class="h-7 px-3 rounded-lg bg-primary text-on-primary text-[9px] font-bold shadow-sm hover:opacity-90 transition-all flex items-center justify-center gap-1.5 whitespace-nowrap">
            <span class="material-symbols-outlined text-[14px]">edit</span>
            Editar
         </button>
         <button onclick="exportToPDF('02_Reportes')" class="h-7 px-3 rounded-lg border border-outline-variant bg-white text-[9px] font-bold text-on-surface hover:bg-slate-50 transition-all flex items-center justify-center gap-1.5 whitespace-nowrap">
            <span class="material-symbols-outlined text-[14px]">picture_as_pdf</span>
            Reporte PDF
         </button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
       
       <div class="lg:col-span-2 space-y-6">
          <!-- Data Principal -->
          <div class="bg-white rounded-2xl border border-outline-variant p-8 shadow-sm">
             <h2 class="text-[10px] font-black text-secondary uppercase tracking-[0.2em] mb-8 border-b border-outline-variant pb-2">Clasificación Técnica</h2>
             <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div>
                   <label class="block text-[9px] font-black text-secondary uppercase mb-1">Categoría</label>
                   <p id="rep-det-cat" class="text-sm font-bold text-on-surface">Auditoría Interna</p>
                </div>
                <div>
                   <label class="block text-[9px] font-black text-secondary uppercase mb-1">Nivel de Riesgo</label>
                   <span class="px-2 py-0.5 rounded-lg bg-amber-100 text-amber-800 text-[10px] font-bold">Medio (Amarillo)</span>
                </div>
             </div>
          </div>

          <!-- Tabla Hija (Registros Vinculados) -->
          <div class="bg-white rounded-2xl border border-outline-variant shadow-sm overflow-hidden">
             <div class="bg-surface-container-low px-6 py-3 border-b border-outline-variant">
                <h3 class="text-[10px] font-black text-primary uppercase">Hallazgos Vinculados</h3>
             </div>
             <table class="w-full text-left">
                <thead>
                   <tr class="text-[9px] font-black text-secondary uppercase border-b border-outline-variant">
                      <th class="px-6 py-3">#</th>
                      <th class="px-6 py-3">Descripción de la Nota</th>
                   </tr>
                </thead>
                <tbody id="rep-det-child-rows" class="divide-y divide-outline-variant">
                   <tr class="text-xs">
                      <td class="px-6 py-4 font-bold text-secondary">01</td>
                      <td class="px-6 py-4 text-on-surface">Inspección de luminarias en el nivel 200 completada sin novedades críticas.</td>
                   </tr>
                </tbody>
             </table>
          </div>
       </div>

       <div class="space-y-6">
          <div class="bg-white rounded-2xl border border-outline-variant p-2 shadow-sm">
             <div id="rep-det-photo-container" class="aspect-video bg-slate-100 rounded-xl overflow-hidden">
                <!-- Inyectado por PWA_SKILLS.renderDriveMedia -->
             </div>
          </div>

          <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-sm">
             <h3 class="text-[10px] font-black text-on-surface uppercase mb-4 flex items-center gap-2">
                <span class="material-symbols-outlined text-sm">verified</span>
                Firma Autorizada
             </h3>
             <div id="rep-det-sig-container" class="h-32 bg-surface-container-lowest rounded-xl border border-dashed border-outline-variant flex items-center justify-center overflow-hidden">
                <!-- Inyectado por PWA_SKILLS.renderDriveMedia -->
             </div>
          </div>
       </div>

    </div>

</div>

<script>
function exportToPDF(moduleID) {
  // La plantilla la diseña el administrador en Configuración → PDF.
  const idEl = document.getElementById('rep-det-id');
  const uuid = idEl ? idEl.innerText.replace('Reporte #', '').trim() : '';
  PDF_TEMPLATE.exportarRegistro(moduleID, uuid, 'Reporte ' + uuid);
}

async function loadDetail_02_Reportes(uuid) {
  console.log(`Cargando Reporte: ${uuid}`);
  document.getElementById('rep-det-id').innerText = 'Cargando...';

  try {
    const cacheKey = 'refdata_02_Reportes';
    let allReports = null;
    const cached = localStorage.getItem(cacheKey);
    if (cached) { try { allReports = JSON.parse(cached); } catch(e) {} }

    if (!allReports) {
      try {
        const parsed = await DataService.read('02_Reportes');
        if (parsed.status === 'OK') { allReports = parsed.payload; localStorage.setItem(cacheKey, JSON.stringify(allReports)); }
      } catch (e) { /* se resuelve abajo con "no encontrado" */ }
    }

    const report = allReports ? allReports.find(r => String(r.UUID) === String(uuid)) : null;
    if (!report) { document.getElementById('rep-det-id').innerText = 'Reporte no encontrado'; return; }

    document.getElementById('rep-det-id').innerText = `Reporte #${String(uuid).substring(0, 8).toUpperCase()}`;
    document.getElementById('rep-det-date').innerText = report.Timestamp ? report.Timestamp.split('T')[0] : '--';
    document.getElementById('rep-det-cat').innerText = report.Categoria_Reporte || '--';

    const severityEl = document.querySelector('#rep-det-cat').closest('.grid').querySelector('span[class*="px-2"]');
    if (severityEl) severityEl.innerText = report.Nivel_Severidad || '--';

    PWA_SKILLS.renderDriveMedia(report.Evidencia_Fotografica || '', 'Evidencia_Fotografica', 'rep-det-photo-container');
    PWA_SKILLS.renderDriveMedia(report.Firma_Operario || '', 'Firma_Operario', 'rep-det-sig-container');

  } catch (err) {
    console.error('Error en detalle de reporte:', err);
    document.getElementById('rep-det-id').innerText = 'Error al cargar';
  }
}
</script>
