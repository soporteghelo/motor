<!-- =========================================================================
     VISTA: EDICIÓN (RECOLECCIÓN DE DATOS)
     MODULO: 02_Reportes
     ========================================================================= -->
<div id="module-02_reportes-edicion" class="module-view" style="display:none;">
    
    <section class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 border-b border-outline-variant pb-6">
      <div class="flex items-center gap-4">
         <button onclick="changeInternalView('02_Reportes', 'Summary')" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors text-secondary">
           <span class="material-symbols-outlined">arrow_back</span>
         </button>
         <div>
           <h1 class="text-xl font-bold text-on-surface">Generar Nuevo Reporte</h1>
           <p class="text-[11px] text-secondary font-medium tracking-tight">Soporte Offline con Auto-compresión de imágenes</p>
         </div>
      </div>
      
      <div class="flex gap-2">
         <button onclick="changeInternalView('02_Reportes', 'Summary')" class="h-10 px-4 rounded-xl border border-outline text-xs font-semibold text-secondary hover:bg-slate-50 transition-colors uppercase tracking-widest">
            Descartar
         </button>
         <button onclick="submitModuleReport('02_Reportes')" class="h-10 px-6 rounded-xl bg-primary text-on-primary text-xs font-bold shadow-lg hover:opacity-90 transition-all flex items-center gap-2 uppercase tracking-widest">
            <span class="material-symbols-outlined text-[18px]">send</span>
            Subir Reporte
         </button>
      </div>
    </section>

    <div class="max-w-4xl mx-auto space-y-6">
       <input type="hidden" id="form-02-uuid" name="UUID" value="">
       <!-- Clasificación -->
       <div class="bg-white rounded-2xl border border-outline-variant p-8 shadow-sm">
          <h2 class="text-xs font-black text-primary uppercase tracking-widest mb-6 flex items-center gap-2">
             <span class="material-symbols-outlined text-lg">segment</span>
             Clasificación del Evento
          </h2>
          <div class="grid grid-cols-2 gap-x-3 gap-y-4 md:gap-x-5 md:gap-y-5">
             <div>
                <label class="block text-[11px] font-black text-secondary uppercase mb-2">Categoría Técnica *</label>
                <select id="select-categoria-reporte" name="Categoria_Reporte" onchange="PWA_SKILLS.initEnumWithOther('select-categoria-reporte','input-categoria-otro')" class="w-full h-12 px-4 rounded-xl border border-outline-variant bg-surface-container-low text-sm font-bold focus:ring-0">
                   <option>Preventivo</option>
                   <option>Auditoría Interna</option>
                   <option>Acto Subestándar</option>
                   <option>Condición Crítica</option>
                   <option value="__OTHER__">Otro...</option>
                </select>
                <input type="text" id="input-categoria-otro" placeholder="Especifique la categoría..." style="display:none;" class="mt-2 w-full h-10 px-3 rounded-xl border border-outline-variant bg-surface-container-low text-sm focus:ring-0">
             </div>
             <div>
                <label class="block text-[11px] font-black text-secondary uppercase mb-2">Nivel de Severidad *</label>
                <select name="Nivel_Severidad" class="w-full h-12 px-4 rounded-xl border border-outline-variant bg-surface-container-low text-sm font-bold focus:ring-0">
                   <option>Bajo (Verde)</option>
                   <option>Medio (Amarillo)</option>
                   <option>Alto (Rojo)</option>
                   <option>Crítico (Negro)</option>
                </select>
             </div>
          </div>
       </div>

       <!-- Detalle Dinámico (Tabla Hija) -->
       <div class="bg-white rounded-2xl border border-outline-variant p-8 shadow-sm">
          <div class="flex justify-between items-center mb-6">
             <h2 class="text-xs font-black text-secondary uppercase tracking-widest flex items-center gap-2">
                <span class="material-symbols-outlined text-lg">edit_note</span>
                Observaciones Detalladas
             </h2>
             <button onclick="PWA_SKILLS.addDynamicRow('report-dynamic-rows', SUBCONFIG_02_REPORTES.Config_Modular.Relational_Fields)" class="h-8 px-3 rounded-lg border border-primary text-primary text-[10px] font-bold hover:bg-primary/10 transition-all flex items-center gap-1 uppercase">
                <span class="material-symbols-outlined text-sm">add</span>
                Nueva Nota
             </button>
          </div>
          <div id="report-dynamic-rows" class="space-y-4">
             <p class="text-center py-6 border border-dashed border-outline-variant rounded-xl text-secondary text-[10px] italic">Presione "+ Nueva Nota" para añadir hallazgos específicos vinculados.</p>
          </div>
       </div>

       <!-- Multimedia y Firma -->
       <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-sm">
             <h3 class="text-[10px] font-black text-secondary uppercase mb-4">Evidencia Visual</h3>
             <div onclick="document.getElementById('rep-foto-input').click()" class="w-full aspect-video rounded-xl border-2 border-dashed border-outline-variant bg-surface-container-lowest flex flex-col items-center justify-center cursor-pointer hover:bg-surface-container transition-colors">
                <span class="material-symbols-outlined text-4xl text-outline-variant">add_a_photo</span>
                <span class="text-[9px] font-black text-secondary mt-2 uppercase">Capturar Foto</span>
             </div>
             <input type="file" id="rep-foto-input" accept="image/*" class="hidden">
          </div>
          
          <div class="bg-white rounded-2xl border border-outline-variant p-6 shadow-sm">
             <h3 class="text-[10px] font-black text-secondary uppercase mb-4">Firma Digital</h3>
             <canvas id="rep-sign-pad" class="w-full h-32 bg-slate-50 rounded-xl border border-outline-variant cursor-crosshair"></canvas>
             <button onclick="PWA_SKILLS.clearSignature('rep-sign-pad')" class="mt-2 text-[9px] font-bold text-error uppercase tracking-widest">Limpiar</button>
          </div>
       </div>

    </div>

</div>

<script>
  (function initReportesEdicion() {
    const uuidField = document.getElementById('form-02-uuid');
    if (uuidField && !uuidField.value) {
      uuidField.value = (typeof pseudoGenerateUUID === 'function') ? pseudoGenerateUUID() : crypto.randomUUID();
    }
  })();

  async function submitModuleReport(moduleID) {
    const uuidField = document.getElementById('form-02-uuid');
    if (!uuidField || !uuidField.value) {
      uuidField.value = (typeof pseudoGenerateUUID === 'function') ? pseudoGenerateUUID() : crypto.randomUUID();
    }

    const categoria = document.getElementById('select-categoria-reporte');
    const severidad = document.querySelector('[name="Nivel_Severidad"]');
    const categoriaVal = PWA_SKILLS.getEnumValue('select-categoria-reporte', 'input-categoria-otro');

    if (!categoriaVal) { alert('Seleccione o especifique una categoría.'); return; }

    const reportData = {
      UUID: uuidField.value,
      Categoria_Reporte: categoriaVal,
      Nivel_Severidad: severidad ? severidad.value : '',
      Timestamp: PWA_SKILLS.getPeruTime()
    };

    // Foto de evidencia si existe
    const fotoInput = document.getElementById('rep-foto-input');
    if (fotoInput && fotoInput.files[0]) {
      reportData.Evidencia_Fotografica = await PWA_SKILLS.compressImage(fotoInput.files[0], 'Medio');
    }

    // Firma digital
    const sigCanvas = document.getElementById('rep-sign-pad');
    if (sigCanvas) {
      const blank = document.createElement('canvas');
      blank.width = sigCanvas.width; blank.height = sigCanvas.height;
      if (sigCanvas.toDataURL() !== blank.toDataURL()) {
        reportData.Firma_Operario = sigCanvas.toDataURL('image/png');
      }
    }

    // Filas dinámicas (tabla hija)
    const childRows = [];
    document.querySelectorAll('#report-dynamic-rows [id^="row-"]').forEach(row => {
      const rowData = { PARENT_UUID: reportData.UUID };
      row.querySelectorAll('input[name], select[name], textarea[name]').forEach(el => {
        rowData[el.name] = el.value;
      });
      childRows.push(rowData);
    });

    try {
      await pushToQueue(moduleID, 'SYNC_OFFLINE_QUEUE', reportData, childRows);
      // Resetear formulario
      categoria.selectedIndex = 0; severidad.selectedIndex = 0;
      if (sigCanvas) PWA_SKILLS.clearSignature('rep-sign-pad');
      document.getElementById('report-dynamic-rows').innerHTML = '<p class="text-center py-6 border border-dashed border-outline-variant rounded-xl text-secondary text-[10px] italic">Presione &quot;+ Nueva Nota&quot; para añadir hallazgos específicos.</p>';
      uuidField.value = (typeof pseudoGenerateUUID === 'function') ? pseudoGenerateUUID() : crypto.randomUUID();
      alert('Reporte guardado. Se sincronizará cuando haya conexión.');
      changeInternalView(moduleID, 'Resumen');
    } catch (err) {
      console.error('Error al guardar reporte:', err);
      alert('Error al guardar. Revise la consola.');
    }
  }

  async function loadEdicion_02_Reportes(uuid) {
    const uuidField = document.getElementById('form-02-uuid');
    const categoria = document.getElementById('select-categoria-reporte');
    const otro      = document.getElementById('input-categoria-otro');
    const severidad = document.querySelector('#main-container [name="Nivel_Severidad"]');
    const cont      = document.getElementById('report-dynamic-rows');

    if (uuid && uuid !== 'CURRENT') {
      const r = (window._repData || []).find(x => String(x.UUID) === String(uuid));
      if (r) {
        uuidField.value = r.UUID;

        if (categoria) {
          const existe = Array.from(categoria.options).some(o => o.value === r.Categoria_Reporte);
          if (existe) {
            categoria.value = r.Categoria_Reporte;
            if (otro) otro.style.display = 'none';
          } else {
            categoria.value = '__OTHER__';
            if (otro) { otro.style.display = ''; otro.value = r.Categoria_Reporte || ''; }
          }
        }
        if (severidad) severidad.value = r.Nivel_Severidad || severidad.value;

        // Las observaciones no vienen en el listado (READ_DB solo trae el
        // padre): sin pedirlas aparte, guardar sin querer las borraba.
        if (cont) cont.innerHTML = '';
        const hijos = await DataService.readChildren('02_Reportes', r.UUID);
        hijos.forEach(h => PWA_SKILLS.addDynamicRow('report-dynamic-rows', SUBCONFIG_02_REPORTES.Config_Modular.Relational_Fields, h));
        if (!hijos.length && cont) {
          cont.innerHTML = '<p class="text-center py-6 border border-dashed border-outline-variant rounded-xl text-secondary text-[10px] italic">Presione "+ Nueva Nota" para añadir hallazgos específicos vinculados.</p>';
        }
        return;
      }
    }

    uuidField.value = (typeof pseudoGenerateUUID === 'function') ? pseudoGenerateUUID() : crypto.randomUUID();
    if (categoria) { categoria.selectedIndex = 0; if (otro) { otro.style.display = 'none'; otro.value = ''; } }
    if (severidad) severidad.selectedIndex = 0;
    if (cont) cont.innerHTML = '<p class="text-center py-6 border border-dashed border-outline-variant rounded-xl text-secondary text-[10px] italic">Presione "+ Nueva Nota" para añadir hallazgos específicos vinculados.</p>';
  }
</script>
