<!-- =========================================================================
     VISTA: RESUMEN (DIRECTORIO DE PERSONAL)
     MODULO: 01_Usuarios
     ========================================================================= -->
<div id="module-01_usuarios-resumen" class="module-view">

  <!-- Page Header & Actions -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
    <div class="flex items-center gap-3">
      <button onclick="showView('Menu')" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors text-secondary border border-outline-variant shrink-0">
        <span class="material-symbols-outlined text-[20px]">arrow_back</span>
      </button>
      <div>
        <h2 class="font-h2 text-h2 text-on-surface leading-tight">Gestión de Personal</h2>
        <p class="text-[11px] text-on-surface-variant">Control de accesos y estatus corporativo</p>
      </div>
    </div>
    <div class="flex items-center gap-2 w-full sm:w-auto">
      <span id="ui-result-count" class="text-[10px] font-bold text-on-surface-variant mr-auto sm:mr-1 hidden"></span>
      <!-- Export dropdown -->
      <div class="relative" id="usr-export-wrap">
        <button onclick="document.getElementById('usr-export-menu').classList.toggle('hidden')"
          class="flex items-center gap-1.5 px-3 h-9 border border-outline-variant text-[12px] font-bold text-primary rounded-lg hover:bg-surface-container transition-colors shadow-sm whitespace-nowrap">
          <span class="material-symbols-outlined text-[16px]">download</span>Exportar
          <span class="material-symbols-outlined text-[13px] opacity-60">expand_more</span>
        </button>
        <div id="usr-export-menu" class="hidden absolute right-0 top-full mt-1.5 w-44 bg-white rounded-xl border border-outline-variant shadow-xl z-50 overflow-hidden">
          <button onclick="PWA_SKILLS.exportFilteredToExcel(); document.getElementById('usr-export-menu').classList.add('hidden')"
            class="w-full flex items-center gap-2.5 px-4 py-3 text-[12px] font-semibold text-on-surface hover:bg-surface-container-low transition-colors">
            <span class="material-symbols-outlined text-[17px] text-green-600">grid_on</span>Excel (.xlsx)
          </button>
          <button onclick="PWA_SKILLS.exportVisibleToCSV('Usuarios'); document.getElementById('usr-export-menu').classList.add('hidden')"
            class="w-full flex items-center gap-2.5 px-4 py-3 text-[12px] font-semibold text-on-surface hover:bg-surface-container-low transition-colors border-t border-outline-variant/30">
            <span class="material-symbols-outlined text-[17px] text-blue-600">text_snippet</span>CSV (.csv)
          </button>
        </div>
      </div>
      <button onclick="changeInternalView('01_Usuarios', 'Edicion')"
        class="flex items-center gap-1.5 px-3 h-9 bg-primary text-on-primary rounded-lg text-[12px] font-bold hover:opacity-90 transition-all shadow-sm whitespace-nowrap">
        <span class="material-symbols-outlined text-[16px]">person_add</span>Nuevo
      </button>
    </div>
  </div>

  <!-- Search & Filter Bar -->
  <div id="ui-search-bar-slot"></div>

  <!-- DataGrid -->
  <div class="bg-white rounded-2xl border border-outline-variant shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse" id="usuarios-table">
        <thead>
          <tr class="bg-surface-container-low text-on-surface-variant text-[11px] font-black uppercase tracking-wider">
            <th class="px-3 py-2.5">Usuario (DNI)</th>
            <th class="px-3 py-2.5">Colaborador</th>
            <th class="px-3 py-2.5">Rol / Permisos</th>
            <th class="px-3 py-2.5">Estado</th>
            <th class="px-3 py-2.5 text-center" data-nosort>Gestión</th>
          </tr>
        </thead>
        <tbody id="usuarios-table-body" class="divide-y divide-outline-variant/40">
          <!-- Filas Mock Inyectadas -->
        </tbody>
      </table>
    </div>
    <div id="usuarios-empty" style="display:none;" class="p-16 text-center">
      <span class="material-symbols-outlined text-5xl text-outline-variant mb-3 block">group_off</span>
      <p class="text-secondary font-medium text-sm">No se encontraron usuarios.</p>
    </div>
  </div>

</div>
<script>
const USR_AVATAR_GRADS = [
  'from-indigo-500 to-violet-500','from-rose-500 to-pink-500',
  'from-emerald-500 to-teal-500','from-amber-500 to-orange-500','from-blue-500 to-cyan-500'
];
const USR_ROL_CONF = {
  'SuperAdmin': { cls:'bg-gray-900 text-white border-gray-700',           icon:'admin_panel_settings' },
  'Admin':      { cls:'bg-indigo-50 text-indigo-700 border-indigo-200',  icon:'shield' },
  'Supervisor': { cls:'bg-amber-50 text-amber-700 border-amber-200',     icon:'manage_accounts' },
  'Trabajador': { cls:'bg-slate-50 text-slate-600 border-slate-200',     icon:'person' }
};

function usrRenderTabla(data) {
  const tbody = document.querySelector('#main-container #usuarios-table-body');
  if (!tbody) return;

  if (!data.length) {
    PWA_SKILLS.showEmptyState('usuarios-table-body', {
      icon: 'group_off',
      title: 'Sin usuarios',
      message: 'Todavía no hay personal registrado.',
      actionLabel: 'Agregar usuario', actionIcon: 'person_add',
      onAction: "changeInternalView('01_Usuarios','Edicion')"
    });
    const c = document.querySelector('#main-container #ui-result-count');
    if (c) { c.textContent = '0 registros'; c.classList.remove('hidden'); }
    return;
  }

  PWA_SKILLS.finishLoading('usuarios-table-body');
  tbody.innerHTML = data.map((u, i) => {
    const rc = USR_ROL_CONF[u.Rol] || USR_ROL_CONF['Trabajador'];
    const grad = USR_AVATAR_GRADS[i % USR_AVATAR_GRADS.length];
    const inicial = (u.Nombre_Completo || u.DNI || '?').trim().charAt(0).toUpperCase();
    const cesado = u.Status === 'Cesado' || u.Status === 'Inactivo';
    return `
    <tr class="hover:bg-surface-container-low/50 transition-colors cursor-pointer group"
        onclick="changeInternalView('01_Usuarios','Detalle','${u.DNI}')">
      <td class="px-3 py-2.5">
        <p class="text-[12px] font-black text-on-surface tabular-nums">${u.DNI}</p>
        <span class="inline-flex items-center gap-1 mt-0.5">
          <span class="w-1.5 h-1.5 rounded-full ${cesado ? 'bg-red-500' : 'bg-emerald-500'} inline-block"></span>
          <span class="text-[9px] ${cesado ? 'text-red-700' : 'text-emerald-700'} font-bold uppercase tracking-widest">${u.Status || 'Activo'}</span>
        </span>
      </td>
      <td class="px-3 py-2.5">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br ${grad} flex items-center justify-center text-white text-[13px] font-black shadow-sm shrink-0">${inicial}</div>
          <div>
            <p class="text-[12px] font-bold text-on-surface leading-snug">${u.Nombre_Completo || '—'}</p>
            <p class="text-[10px] text-secondary">${u.Email || ''}</p>
          </div>
        </div>
      </td>
      <td class="px-3 py-2.5">
        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold border ${rc.cls}">
          <span class="material-symbols-outlined text-[11px]" style="font-variation-settings:'FILL' 1" aria-hidden="true">${rc.icon}</span>${u.Rol || '—'}
        </span>
      </td>
      <td class="px-3 py-2.5">
        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold ${cesado ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}">
          <span class="material-symbols-outlined text-[11px]" style="font-variation-settings:'FILL' 1" aria-hidden="true">${cesado ? 'block' : 'check_circle'}</span>${u.Status || 'Activo'}
        </span>
      </td>
      <td class="px-3 py-2.5 text-center">
        <button onclick="event.stopPropagation(); changeInternalView('01_Usuarios','Edicion','${u.DNI}')" aria-label="Editar a ${u.Nombre_Completo || u.DNI}"
          class="w-8 h-8 rounded-full hover:bg-primary/10 text-secondary hover:text-primary transition-all flex items-center justify-center mx-auto opacity-0 group-hover:opacity-100">
          <span class="material-symbols-outlined text-[18px]" aria-hidden="true">edit</span>
        </button>
      </td>
    </tr>`;
  }).join('');

  PWA_SKILLS.initSortableTable('usuarios-table-body');
  PWA_SKILLS.enhanceTable('usuarios-table-body');
  PWA_SKILLS.updateResultCount('usuarios-table-body', 'ui-result-count');
  const c = document.querySelector('#main-container #ui-result-count');
  if (c) c.classList.remove('hidden');
}

function loadResumen_01_Usuarios() {
  PWA_SKILLS.renderSkeleton('usuarios-table-body', 6);

  if (!window._usrExportListener) {
    window._usrExportListener = true;
    document.addEventListener('click', function(e) {
      const wrap = document.getElementById('usr-export-wrap');
      if (wrap && !wrap.contains(e.target)) {
        const menu = document.getElementById('usr-export-menu');
        if (menu) menu.classList.add('hidden');
      }
    });
  }

  DataService.read('01_Usuarios')
    .then(res => {
      const filas = (res && res.status === 'OK' && Array.isArray(res.payload)) ? res.payload : [];
      const visibles = (typeof PERMISOS !== 'undefined')
        ? PERMISOS.filtrarDatos('01_Usuarios', filas) : filas;
      window._usrData = visibles;
      localStorage.setItem('refdata_01_Usuarios', JSON.stringify(visibles));
      usrRenderTabla(visibles);
      if (typeof refreshDrawerStats === 'function') setTimeout(refreshDrawerStats, 80);
    })
    .catch(() => {
      let cache = [];
      try { cache = JSON.parse(localStorage.getItem('refdata_01_Usuarios')) || []; } catch (e) {}
      window._usrData = cache;
      if (cache.length) {
        usrRenderTabla(cache);
        PWA_SKILLS.toast('Sin conexión: mostrando los últimos datos sincronizados.', 'warning', 4000);
      } else {
        PWA_SKILLS.showEmptyState('usuarios-table-body', {
          icon: 'cloud_off',
          title: 'Sin conexión',
          message: 'No se pudo cargar el personal y no hay copia local disponible.',
          actionLabel: 'Reintentar', actionIcon: 'refresh',
          onAction: "loadResumen_01_Usuarios()"
        });
      }
    });
}
</script>
